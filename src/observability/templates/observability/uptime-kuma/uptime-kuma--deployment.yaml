{{- if .Values.uptimeKuma.enabled }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.uptimeKuma.label .Values.k8s.names.pods.suffix }}
{{- $appVolume := "app-volume" }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.uptimeKuma.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.uptimeKuma.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.uptimeKuma.image }}
        resources:
          {{- toYaml .Values.uptimeKuma.resources | nindent 10 }}
        ports:
        - name: {{ .Values.uptimeKuma.ports.http.name }}
          containerPort: {{ .Values.uptimeKuma.ports.http.targetPort }}
        volumeMounts:
        - mountPath: /app/data
          name: {{ $appVolume }}
          subPath: uptime-kuma
      volumes:
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.uptimeKuma.pvc . }}
{{- end }}
