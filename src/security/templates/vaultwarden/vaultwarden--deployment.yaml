{{- if .Values.vaultwarden.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.vaultwarden.label .Values.k8s.names.pods.suffix }}
{{- $appVolume := "app-volume" }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}
  annotations:
    checksum/config: {{ .Values.vaultwarden.credentials.adminToken | sha256sum }}

spec:
  replicas: {{ .Values.vaultwarden.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      # Must tolerate the primary-node taint: this workload is pinned there by
      # the local config volume and has nowhere else to run. Without the
      # toleration it is evicted with no valid node and sits Pending.
      tolerations:
      - key: platypod.io/reserved
        operator: Equal
        value: primary
        effect: NoSchedule
      {{- if and .Values.vaultwarden.oidc.clientId .Values.traefik.loadBalancerIP }}
      # OIDC discovery back-channel: resolve the public Authelia host to the
      # Traefik LB in-cluster (same trick as Grafana/Komga/RomM).
      hostAliases:
      - ip: {{ .Values.traefik.loadBalancerIP }}
        hostnames:
        - {{ tpl .Values.authelia.host . }}
      {{- end }}
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.vaultwarden.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.vaultwarden.image }}
        resources:
          {{- toYaml .Values.vaultwarden.resources | nindent 10 }}
        ports:
        - name: {{ .Values.vaultwarden.ports.http.name }}
          containerPort: {{ .Values.vaultwarden.ports.http.targetPort }}
        - name: {{ .Values.vaultwarden.ports.websocket.name }}
          containerPort: {{ .Values.vaultwarden.ports.websocket.targetPort }}
        env:
        - name: DOMAIN
          value: "https://{{ tpl .Values.vaultwarden.host . }}"
        - name: ADMIN_TOKEN
          value: "{{ .Values.vaultwarden.credentials.adminToken }}"
        {{- if .Values.vaultwarden.oidc.clientId }}
        # SSO via Authelia OIDC (vaultwarden wiki + authelia client guide).
        # NOTE BY DESIGN: SSO replaces the login identity only — the vault
        # master password remains and is never controlled by the IdP.
        - name: SSO_ENABLED
          value: "true"
        - name: SSO_AUTHORITY
          value: "https://{{ tpl .Values.authelia.host . }}"
        - name: SSO_CLIENT_ID
          value: "{{ .Values.vaultwarden.oidc.clientId }}"
        - name: SSO_CLIENT_SECRET
          value: "{{ .Values.vaultwarden.oidc.clientSecret.plain }}"
        - name: SSO_SCOPES
          value: "email profile offline_access"
        - name: SSO_PKCE
          value: "true"
        {{- end }}
        - name: WEBSOCKET_ENABLED
          value: "true"
        - name: SIGNUPS_ALLOWED
          value: "{{ .Values.vaultwarden.signupsAllowed }}"
        - name: INVITATIONS_ALLOWED
          value: "{{ .Values.vaultwarden.invitationsAllowed }}"
        - name: LOG_LEVEL
          value: "{{ .Values.vaultwarden.logLevel }}"
        - name: DATA_FOLDER
          value: /data
        volumeMounts:
        - mountPath: /data
          name: {{ $appVolume }}
          subPath: vaultwarden
      volumes:
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.vaultwarden.pvc . }}
{{- end }}
