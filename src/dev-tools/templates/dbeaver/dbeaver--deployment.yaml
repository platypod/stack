{{- if .Values.dbeaver.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.dbeaver.label .Values.k8s.names.pods.suffix }}
{{- $appVolume := "app-volume" }}
{{- $configMap := "config-map" }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.dbeaver.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.dbeaver.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.dbeaver.image }}
        resources:
          {{- toYaml .Values.dbeaver.resources | nindent 10 }}
        ports:
        - name: {{ .Values.dbeaver.ports.http.name }}
          containerPort: {{ .Values.dbeaver.ports.http.targetPort }}
        # CloudBeaver uses its built-in embedded database for management metadata
        # (users, connections, settings), stored under the workspace dir which is
        # persisted on the apps PVC. We deliberately do NOT point it at the shared
        # PostgreSQL: the external-Postgres init path in CloudBeaver self-conflicts
        # on a fresh schema (programmatic CB_SCHEMA_INFO vs. cb_schema_update_2.sql
        # both creating it → "relation already exists" crashloop). Embedded storage
        # is deterministic, dependency-free, and survives restarts via the PVC.
        env:
        - name: CB_ADMIN_NAME
          value: "{{ .Values.dbeaver.credentials.username }}"
        - name: CB_ADMIN_PASSWORD
          value: "{{ .Values.dbeaver.credentials.password }}"
        # NOTE: we intentionally do NOT mount initial-data.conf. Its teams/permission
        # structure is incompatible with this CloudBeaver version and throws a
        # NullPointerException during schema init — which, because embedded H2 does
        # not roll back the half-applied DDL, poisons the workspace and turns every
        # subsequent boot into a "duplicate column"/"already exists" crashloop on a
        # cold (empty-workspace) start. The admin user is provisioned via the
        # CB_ADMIN_NAME/CB_ADMIN_PASSWORD env vars above, so this file is redundant.
        volumeMounts:
        - mountPath: /opt/cloudbeaver/workspace
          name: {{ $appVolume }}
          subPath: dbeaver
      volumes:
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.dbeaver.pvc . }}
{{- end }}
