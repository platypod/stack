# Mirrors clusters/local/secrets.yaml — separate GitRepository (private,
# its own read-only deploy key) decrypting clusters/prd/secrets.enc.yaml
# via the in-cluster sops-age Secret. See stack/docs/flux-migration.md
# Phase 7 (and the two-repo SOPS design for why this is a second source).
#
# ref: semver, in lockstep with clusters/prd/flux-system/gotk-sync.yaml's
# stack GitRepository — both repos tag vX.Y.Z together for a prod
# promotion (see the "lockstep tags" decision in the migration doc).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platypod-sops
  namespace: flux-system
spec:
  interval: 5m0s
  ref:
    semver: ">=1.0.0"
  secretRef:
    name: platypod-sops-deploy-key
  url: ssh://git@github.com/platypod/platypod-sops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/prd
  prune: true
  sourceRef:
    kind: GitRepository
    name: platypod-sops
  decryption:
    provider: sops
    secretRef:
      name: sops-age
