{{- if .Values.observability.metrics.enable }}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.metrics.label }}{{ .Values.k8s.names.configMaps.suffix }}

data:
  mimir.yaml: |
    # Monolithic single-binary Mimir. All state on the PVC (filesystem backend);
    # replication factor 1 everywhere — this is a single-replica homelab TSDB,
    # not an HA cluster.
    #
    # Multi-tenant by *theme*, not by user (that's still label isolation via
    # `owner` + prom-label-proxy, unchanged — see dashboard-multitenancy.md).
    # Everything that predates this flip, plus anything with no client-claimed
    # tenant (all scrape-based receivers), keeps landing in the implicit
    # "anonymous" tenant — existing dashboards/history don't move. Only
    # prompt-meter's OTLP push claims a tenant ("ai"), via the gateway's
    # headers_setter/metrics extension. This buys a real, storage-level blast
    # radius: the "ai" tenant's blocks can be wiped and rebuilt from the local
    # Claude transcripts (the actual source of truth) without touching a single
    # byte of cluster/infra metrics history.
    multitenancy_enabled: true

    server:
      http_listen_port: {{ .Values.observability.metrics.ports.http.targetPort }}
      log_level: {{ .Values.observability.metrics.logging.level }}
      log_format: {{ .Values.observability.metrics.logging.format }}

    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /storage

    blocks_storage:
      storage_prefix: blocks
      tsdb:
        dir: /storage/tsdb
      bucket_store:
        # Store-gateway path (anything older than query_store_after, i.e. most of
        # this dashboard's range) reads via the bucket index. Default rejects a
        # >1h-stale index with HTTP 500 — which empties every historical panel
        # whenever the compactor's index refresh lags. Sync often and tolerate a
        # long staleness so a slow refresh degrades gracefully instead of erroring.
        sync_interval: 5m
        bucket_index:
          max_stale_period: 24h

    compactor:
      data_dir: /storage/compactor
      # Refresh the bucket index frequently (default 15m) so newly-compacted
      # blocks become queryable quickly and the index never drifts stale.
      cleanup_interval: 5m
      sharding_ring:
        kvstore:
          store: memberlist

    ingester:
      ring:
        replication_factor: 1
        kvstore:
          store: memberlist

    store_gateway:
      sharding_ring:
        replication_factor: 1
        kvstore:
          store: memberlist

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /storage/ruler

    limits:
      compactor_blocks_retention_period: {{ .Values.observability.metrics.retention }}
      # Accept back-dated samples. The transcript shipper backfills metrics at each
      # message's historical event time; Mimir is a near-real-time TSDB and rejects
      # samples older than the head's max time as "sample-timestamp-too-old" once the
      # head has advanced to now. A wide out-of-order window lets the full transcript
      # history land (and re-land idempotently on re-export). Matches retention.
      out_of_order_time_window: {{ .Values.observability.metrics.retention }}
      # Backfilled (out-of-order) samples live in the ingester's in-memory OOO head
      # until compacted to blocks. The querier otherwise only consults ingesters for
      # recent data (~13h), so historical backfill is invisible until it lands in
      # blocks + the bucket index. Widen so the OOO head is queried for old ranges
      # too (store-gateway still serves blocks; results merge/dedupe). This is a
      # per-tenant limit (model.Duration → "1y" form is accepted here).
      query_ingesters_within: {{ .Values.observability.metrics.retention }}
      # Single-tenant homelab: defaults (20k) are too tight once kubeletstats,
      # k8s_cluster, traefik etc. all flow in.
      max_global_series_per_user: 300000
      # Headroom for the transcript backfill burst: re-exporting the full history
      # pushes ~170k samples in a few seconds, which blew past the old 50k/s limit
      # (samples dropped as rate_limited). Generous for a single-tenant homelab.
      ingestion_rate: 250000
      ingestion_burst_size: 500000

    usage_stats:
      enabled: false
{{- end }}
