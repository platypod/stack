{{- if and .Values.komga.enable .Values.komga.credentials.email .Values.komga.credentials.password }}
{{- /*
  Komga setup Job (post-install/upgrade). The script lives in _setup.tpl and is
  shared with the daily komga-reconcile CronJob.

  Komga has no login/token endpoint — every API call is authenticated with
  HTTP Basic (email:password) or an API key. So unlike Kavita/Suwayomi this
  Job needs the REAL admin credentials up front:
    - If the server has never been claimed, it claims it with these
      credentials (POST /api/v1/claim, admin = first claim).
    - If it was already claimed by hand (e.g. before this Job existed),
      .Values.komga.credentials must match that existing admin, or every
      Basic-Auth call below 401s. That's a config problem for a human to
      fix (or re-claim isn't possible once claimed) — not something to
      crash-loop on, so an auth failure is logged and the Job exits 0.

  Flow (idempotent — safe on every run):
    1. Wait for the (unauthenticated) claim-status endpoint.
    2. Claim the server if unclaimed. No-op if already claimed.
    3. GET libraries (Basic Auth). 401 here means the credentials don't
       match the real admin — warn and stop (exit 0, release still succeeds).
    4. Create any library in .Values.komga.libraries whose name doesn't
       already exist. Never touches/updates existing libraries — manual
       tweaks made from the admin UI afterward are left alone.
    5. Users, from LIVE LLDAP group membership (not the seed: users created by
       hand in LLDAP count too). Komga's OIDC auto-provisioning is disabled
       (see komga--deployment.yaml), so per LLDAP user, matched by email:
         - in a komga.access.groups group: create the Komga account if
           missing, then pin its shared libraries to the union of those
           groups' libraries (sharedAllLibraries=false);
         - in LLDAP `admins`: add the full admin roles (never removes roles);
         - an account whose email is not in LLDAP is never touched, and nothing
           is ever deleted or disabled.
       A failure reaching LLDAP skips this step (warn, exit 0).
    6. If OIDC is configured, hide the local login form and auto-redirect
       into it. These are NOT server settings (checked /api/v1/settings —
       nothing there) — they're free-form "global client settings"
       (webui.oauth2.hide_login / webui.oauth2.auto_login, boolean strings),
       a separate key-value store the webui itself reads
       (komga-webui/src/views/LoginView.vue). Both need allowUnauthorized:true
       since the (unauthenticated) login page is what reads them.
*/ -}}
apiVersion: batch/v1
kind: Job

metadata:
  name: komga-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      {{- include "komga.setupContainer" . | nindent 6 }}
{{- end }}
