{{- if or .Values.traefik.tls.selfSigned .Values.traefik.tls.wildcard }}
apiVersion: traefik.io/v1alpha1
kind: TLSStore

metadata:
  name: default
  namespace: {{ .Values.k8s.namespace }}

spec:
{{- if .Values.traefik.tls.wildcard }}
  # One wildcard cert for the whole zone, issued via the ACME resolver (DNS-01).
  # Avoids per-host issuance (and the CNAME-to-apex breakage) entirely.
  defaultGeneratedCert:
    resolver: {{ .Values.traefik.resolverName }}
    domain:
      main: "*.{{ .Values.traefik.domain }}"
      sans:
      - "{{ .Values.traefik.domain }}"
{{- else }}
  defaultCertificate:
    secretName: {{ .Values.traefik.tls.secretName }}
{{- end }}
{{- end }}
