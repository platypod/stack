authelia:
  label: authelia
  database:
    type: postgres
    host: ${k8s.names.urls.prefix}${authelia.database.label}${k8s.names.urls.suffix}.${traefik.domain}
    name: ${authelia.label}
    logQueries: false
    credentials:
      username: ${authelia.label}User
      password: ${authelia.label}Password
    image: postgres:17
    label: ${authelia.label}-db
    ports:
      http:
        name: pgsql
        targetPort: 5432
    replicasNb: 1
  host: ${k8s.names.urls.prefix}${authelia.label}${k8s.names.urls.suffix}.${traefik.domain}
  image: authelia/authelia:4
  log:
    level: info
    format: text
  ports:
    http:
      name: authelia
      targetPort: 9091
    metrics:
      name: auth-metrics
      targetPort: 9959
  replicasNb: 1
  rules:
    - subject:
      - group:media
      policy: one_factor
      domain:
      - ${bazarr.host}
      - ${flaresolverr.host}
      - ${radarr.host}
      - ${prowlarr.host}
      - ${readarr.host}
      - ${sonarr.host}

    - subject:
      - group:download
      policy: one_factor
      domain:
      - ${deluge.host}
      - ${qbittorrent.host}
      - ${transmission.host}

    - subject:
      - group:dev
      policy: one_factor
      domain:
      - ${authelia.database.host}
      - ${bookstack.database.host}
      - ${bookstack.host}
      - ${dbeaver.host}
      - ${database.host}
      - ${whoami.host}

    - policy: bypass
      domain:
      - ${authelia.host}
      - ${homepage.host}
      - ${jellyfin.host}
      - ${jellyseerr.host}
      - ${traefik.host}
  secrets:
    encryptionKey: verySecretMuchSecureNeverGonnaBeGuessedWoah
    jwt: verySecretMuchSecureNeverGonnaBeGuessedWoooow
    session: verySecretMuchSecureNeverGonnaBeGuessedWoowee
  storage:
    pvc: ${storage.defaultVolumes.apps}

  users:
    admin:
      displayname: platypodAdmin
      password: $argon2id$v=19$m=65536,t=3,p=4$J68VFWtr+FIvEAAnNIQ5UQ$uOiTdWOk6Yqb3DEfxjmdE8touRoY9fYn+DJZwtG2z34  #platypod-password
      email: pl@ty.pod
      groups:
        - admins
        - media
    guest:
      displayname: platypodGuest
      password: $argon2id$v=19$m=65536,t=3,p=4$UvLUwVCQPhcDCMrT++Htpg$6eZG6L2rwpunVuFEdlLe8Mc+r6b9Q//Np5mGoTw61aQ  # guest-password
      email: gues@ty.pod
      groups: []
