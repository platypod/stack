# Implementation tier — media module. Registry fields (enable/label/host,
# where present) live in apps/base/values/registry.yaml instead. `media.system`
# (module-wide paths, not a per-service key) stays here in full.

media:
  system:
    userId: 501
    groupId: 20
    umask: 002
    data:
      path: /data
    downloads:
      ongoing: "{{ .Values.media.system.data.path }}/ongoing"
      finished: "{{ .Values.media.system.data.path }}/finished"
      torrents: "{{ .Values.media.system.data.path }}/torrents"
database:
  # Superuser — used only by the init job; never shared with services.
  credentials:
    username: postgresMedia
    password: postgresPassword
  # Per-service credentials — each service gets its own DB user.
  serviceCredentials:
    jellyseerr:
      username: jellyseerrUser
      password: jellyseerrPassword
    mediarvester:
      username: mediarvesterUser
      password: mediarvesterPassword
  image: postgres:17
  ports:
    http:
      name: pgsql
      targetPort: 5432
  schemas:
    jellyseerr:
      main: jellyseerr
    mediarvester:
      main: mediarvester
    bazarr:
      main: bazarrMain
      logs: bazarrLogs
    prowlarr:
      main: prowlarrMain
      logs: prowlarrLogs
    radarr:
      main: radarrMain
      logs: radarrLogs
    readarr:
      cache: readarrCache
      main: readarrMain
      logs: readarrLogs
    sonarr:
      main: sonarrMain
      logs: sonarrLogs
  replicasNb: 1
  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
bazarr:
  apiKey: "55555555555555555555555555555555"
  image: linuxserver/bazarr:v1.6.0-ls356
  ports:
    http:
      name: bazarr-http
      targetPort: 6767
  pvc:
    # config/SQLite → dedicated local volume (NFS can't host SQLite WAL).
    app: "{{ .Values.storage.defaultVolumes.config }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    # Bazarr is memory-hungry (subtitle providers + SignalR feeds to Sonarr/
    # Radarr); 512Mi OOMKilled it in a restart loop, then 1Gi did too
    # (26 restarts/17d in prod). Bumped to 1.5Gi.
    limits:
      memory: 1536Mi
