adguard:
  enable: true
  # Address AdGuard answers on from the LAN (see traefik.externalIP for the
  # mechanism and why it is not hostNetwork). LAN clients point their resolver
  # here. Ports 53/tcp+udp are served on this address.
  #
  # NOTE: ports.http.targetPort must not collide with another Service claiming
  # the same externalIP — the default 80 clashes with Traefik's http entrypoint,
  # so prod moves AdGuard's web UI to 8080 (the ConfigMap bind_port, Service and
  # IngressRoute all derive from that one value).
  externalIP: ""
  loadBalancerIP: ""  # MetalLB path only (e.g. dev: 192.168.122.201).
  # Pin to the node that owns externalIP.
  nodeSelector: {}
  adminHost: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.adguard.label }}-admin{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  credentials:
    username: admin
    password: password
    passwordHash: "$2y$10$XEjNfXLsHj7CBrnT1fdMaeqVv.tA.cfpWfulEAKBupXFUUgunxgRS"
  image: adguard/adguardhome:latest
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.adguard.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  label: adguard
  ports:
    dnsUdp:
      name: dns-udp
      nodePort: 32049
      targetPort: 53
    dnsTcp:
      name: dns-tcp
      nodePort: 30154
      targetPort: 53
    http:
      name: http
      nodePort: 30155
      targetPort: 80
    admin:
      name: admin
      nodePort: 30156
      targetPort: 3000
  # Extra DNS rewrites, appended after the automatic "*.<traefik.domain>" one.
  # LAN-only names live here (e.g. the Kubernetes API endpoint) so laptops and
  # hosts resolve them without a public DNS record.
  #
  # NOTE: Talos nodes do NOT use AdGuard — their machine config pins
  # nameservers to 1.1.1.1/8.8.8.8, and AdGuard runs *inside* the cluster, so it
  # can never resolve the cluster's own API endpoint for them. Node-side
  # resolution is handled by machine.network.extraHostEntries in infra/.
  rewrites: []
    # - domain: k8s.platypod.lan
    #   answer: 192.168.1.156

  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
