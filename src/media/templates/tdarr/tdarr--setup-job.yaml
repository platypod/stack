{{- if and .Values.tdarr.enable .Values.tdarr.setup.enable }}
{{- /*
  Tdarr setup Job.

  Idempotently upserts:
    1) one flow: Input File -> tdarr.setup.flow.plugins (an arbitrary linear
       chain of flow plugins, declared in values) -> next plugin's output 1
    2) one library pointing to a subfolder and bound to that flow

  This makes Tdarr configuration reproducible from values instead of UI clicks.
  The plugin chain is generic on purpose: it's driven entirely by
  tdarr.setup.flow.plugins (list of {id, pluginName, version, inputs}), so
  swapping encode targets (classic plugin vs. FFmpeg Command Builder vs.
  hardware transcode) is a values change, not a script rewrite.
*/ -}}
{{- $svc := print .Values.k8s.names.services.prefix .Values.tdarr.label .Values.k8s.names.services.suffix }}
apiVersion: batch/v1
kind: Job

metadata:
  name: tdarr-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "35"
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: tdarr-setup
        image: python:3-alpine
        env:
        - name: TDARR_URL
          value: "http://{{ $svc }}:{{ .Values.tdarr.ports.ui.targetPort }}"
        - name: FLOW_ID
          value: "{{ .Values.tdarr.setup.flow.id }}"
        - name: FLOW_NAME
          value: "{{ .Values.tdarr.setup.flow.name }}"
        - name: FLOW_PLUGINS_JSON
          # toJson serializes plugin input strings as-is, including any literal
          # template expressions inside them (e.g. outputDirectory below
          # cross-referencing .Values.media.system.data.path) — toJson alone
          # does NOT render those. Piping through tpl afterward does: it scans
          # for template delimiters wherever they are, JSON syntax or not, and
          # substitutes them against the current context.
          value: {{ tpl (.Values.tdarr.setup.flow.plugins | toJson) . | quote }}
        - name: LIBRARY_ID
          value: "{{ .Values.tdarr.setup.library.id }}"
        - name: LIBRARY_NAME
          value: "{{ .Values.tdarr.setup.library.name }}"
        - name: LIBRARY_FOLDER
          value: "{{ tpl .Values.tdarr.setup.library.folder . }}"
        - name: LIBRARY_CACHE
          value: "{{ tpl .Values.tdarr.setup.library.cache . }}"
        - name: LIBRARY_OUTPUT
          value: "{{ .Values.tdarr.setup.library.output }}"
        - name: LIBRARY_CONTAINER_FILTER
          value: "{{ .Values.tdarr.setup.library.containerFilter }}"
        - name: LIBRARY_CONTAINER
          value: "{{ .Values.tdarr.setup.library.container }}"
        - name: LIBRARY_FOLDER_WATCHING
          value: "{{ .Values.tdarr.setup.library.folderWatching }}"
        - name: LIBRARY_USE_FS_EVENTS
          value: "{{ .Values.tdarr.setup.library.useFsEvents }}"
        - name: SCAN_AFTER_SETUP
          value: "{{ .Values.tdarr.setup.scanAfterSetup }}"
        - name: UPDATE_EXISTING_FLOW
          value: "{{ .Values.tdarr.setup.updateExistingFlow }}"
        command:
        - python3
        - -c
        - |
          import json, os, time, urllib.request, urllib.error

          BASE = os.environ["TDARR_URL"]

          def as_bool(value: str) -> bool:
              return str(value).strip().lower() == "true"

          def call(method, path, body=None):
              payload = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data=payload,
                  method=method,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode()
                      if not raw:
                          return r.status, None
                      # Not every Tdarr endpoint answers with JSON on success —
                      # /api/v2/toggle-folder-watch returns a bare string. Parsing
                      # unconditionally raised JSONDecodeError *before* the caller
                      # could check the status, killing the whole job. Mirror the
                      # tolerance the HTTPError branch below already has.
                      try:
                          return r.status, json.loads(raw)
                      except ValueError:
                          return r.status, raw
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  try:
                      data = json.loads(raw)
                  except Exception:
                      data = raw
                  return e.code, data

          def crud(collection, mode, doc_id=None, obj=None, filters=None):
              data = {"collection": collection, "mode": mode}
              if doc_id is not None:
                  data["docID"] = doc_id
              if obj is not None:
                  data["obj"] = obj
              if filters is not None:
                  data["filters"] = filters
              status, body = call("POST", "/api/v2/cruddb", {"data": data})
              if status != 200:
                  raise RuntimeError(f"cruddb {collection}/{mode} failed [{status}]: {body}")
              return body

          def upsert_flow(flow_id: str, flow_doc: dict, update_existing: bool):
              existing = crud("FlowsJSONDB", "getById", doc_id=flow_id)
              if existing:
                  if update_existing:
                      merged = dict(existing)
                      merged.update(flow_doc)
                      crud("FlowsJSONDB", "update", doc_id=flow_id, obj=merged)
                      print(f"Updated Tdarr flow '{flow_id}'.")
                  else:
                      print(f"Tdarr flow '{flow_id}' already exists; keeping it.")
              else:
                  crud("FlowsJSONDB", "insert", doc_id=flow_id, obj=flow_doc)
                  print(f"Created Tdarr flow '{flow_id}'.")

          def upsert_library(lib_id: str, lib_doc: dict):
              existing = crud("LibrarySettingsJSONDB", "getById", doc_id=lib_id)
              if existing:
                  merged = dict(existing)
                  merged.update(lib_doc)
                  crud("LibrarySettingsJSONDB", "update", doc_id=lib_id, obj=merged)
                  print(f"Updated Tdarr library '{lib_id}'.")
              else:
                  crud("LibrarySettingsJSONDB", "insert", doc_id=lib_id, obj=lib_doc)
                  print(f"Created Tdarr library '{lib_id}'.")

          # 1) wait for Tdarr API readiness
          for i in range(60):
              status, body = call("GET", "/api/v2/status")
              if status == 200 and isinstance(body, dict) and body.get("status") == "good":
                  print(f"  [{i}] Tdarr is up.")
                  break
              time.sleep(5)
          else:
              raise SystemExit("Tdarr never became ready")

          flow_id = os.environ["FLOW_ID"]
          plugin_specs = json.loads(os.environ["FLOW_PLUGINS_JSON"])

          # Input File always leads the chain; each subsequent node comes from
          # values, in order, wired output-1 -> next node's input.
          chain = [{"id": "input", "pluginName": "inputFile", "version": "1.0.0", "name": "Input File"}]
          for spec in plugin_specs:
              chain.append({
                  "id": spec["id"],
                  "pluginName": spec["pluginName"],
                  "version": spec.get("version", "1.0.0"),
                  "name": spec.get("name", spec["pluginName"]),
                  "inputs": spec.get("inputs", {}),
              })

          flow_plugins = []
          flow_edges = []
          y = 50
          prev_id = None
          for node in chain:
              entry = {
                  "name": node["name"],
                  "sourceRepo": "Community",
                  "pluginName": node["pluginName"],
                  "version": node["version"],
                  "id": node["id"],
                  "position": {"x": 500, "y": y},
              }
              if node.get("inputs"):
                  entry["inputsDB"] = node["inputs"]
              flow_plugins.append(entry)
              if prev_id is not None:
                  flow_edges.append({
                      "source": prev_id,
                      "sourceHandle": "1",
                      "target": node["id"],
                      "targetHandle": None,
                      "id": f"e-{prev_id}-{node['id']}",
                  })
              prev_id = node["id"]
              y += 130

          flow_doc = {
              "_id": flow_id,
              "name": os.environ["FLOW_NAME"],
              "description": "Managed by Helm tdarr-setup Job",
              "flowPlugins": flow_plugins,
              "flowEdges": flow_edges,
          }
          upsert_flow(flow_id, flow_doc, update_existing=as_bool(os.environ["UPDATE_EXISTING_FLOW"]))

          lib_id = os.environ["LIBRARY_ID"]
          lib_doc = {
              "_id": lib_id,
              "name": os.environ["LIBRARY_NAME"],
              "folder": os.environ["LIBRARY_FOLDER"],
              "cache": os.environ["LIBRARY_CACHE"],
              "output": os.environ["LIBRARY_OUTPUT"],
              "container": os.environ["LIBRARY_CONTAINER"],
              "folderWatching": as_bool(os.environ["LIBRARY_FOLDER_WATCHING"]),
              "useFsEvents": as_bool(os.environ["LIBRARY_USE_FS_EVENTS"]),
              "processLibrary": True,
              "scanOnStart": True,
              "scheduledScanFindNew": True,
              "folderWatchScanInterval": 30,
              "scannerThreadCount": 2,
              "pluginCommunity": True,
              "pluginIDs": [],
              "schedule": [],
              "priority": 0,
              "foldersToIgnore": "",
              "containerFilter": os.environ["LIBRARY_CONTAINER_FILTER"],
              "folderToFolderConversion": False,
              "copyIfConditionsMet": False,
              "handbrake": False,
              "ffmpeg": True,
              "handbrakescan": False,
              "ffmpegscan": True,
              "exifToolScan": False,
              "mediaInfoScan": True,
              "closedCaptionScan": False,
              "expanded": True,
              "scanButtons": False,
              "scanFound": "Files found:0",
              "verboseLogs": False,
              "decisionMaker": {
                  "settingsPlugin": False,
                  "settingsFlows": True,
                  "settingsVideo": False,
                  "settingsAudio": False,
              },
              "processTranscodes": True,
              "processHealthChecks": False,
              "holdNewFiles": False,
              "pluginStackOverview": True,
              "processPluginsSequentially": True,
              "flowId": flow_id,
          }
          upsert_library(lib_id, lib_doc)

          # Ensure folder watch is aligned with values.
          status, body = call(
              "POST",
              "/api/v2/toggle-folder-watch",
              {
                  "data": {
                      "auto": False,
                      "folder": os.environ["LIBRARY_FOLDER"],
                      "dbID": lib_id,
                      "status": as_bool(os.environ["LIBRARY_FOLDER_WATCHING"]),
                  }
              },
          )
          if status != 200:
              print(f"WARN: toggle-folder-watch failed [{status}]: {body}")

          if as_bool(os.environ["SCAN_AFTER_SETUP"]):
              status, body = call(
                  "POST",
                  "/api/v2/scan-files",
                  {
                      "data": {
                          "scanConfig": {
                              "dbID": lib_id,
                              "mode": "scanFindNew",
                              "arrayOrPath": os.environ["LIBRARY_FOLDER"],
                          }
                      }
                  },
              )
              if status != 200:
                  print(f"WARN: scan-files failed [{status}]: {body}")
              else:
                  print(f"Triggered scanFindNew for '{lib_id}'.")

          print("tdarr-setup complete.")
{{- end }}
