observability:
  logs:
    label: loki
    # Loki tenant for logs that don't set X-Scope-OrgID (native Claude telemetry,
    # future k8s pod logs). Admins federate it (scopeShim.sharedTenants).
    defaultTenant: "_shared"
    image: grafana/loki:3.7.2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        # Bumped 512Mi -> 768Mi (auth_enabled + multi-tenancy overhead) ->
        # 1536Mi: still OOMKilling every ~8min after a full prompt-meter
        # --reset backfill (33k+ redacted transcript lines, ~90 days of daily
        # index tables to load/compact) pushed real content volume well past
        # what 768Mi could hold. Request stays 256Mi — only raising the burst
        # ceiling, not what's reserved at scheduling time.
        memory: 1536Mi
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.logs.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
    ports:
      grpc:
        name: grpc
        targetPort: 9096
      http:
        name: http
        targetPort: 3100
    logging:
      level: info
