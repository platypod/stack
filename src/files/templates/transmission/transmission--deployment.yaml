{{- if .Values.transmission.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.transmission.label .Values.k8s.names.pods.suffix }}
{{- $configMap := "config-map" }}
{{- $appVolume := "app-volume" }}
{{- $mediaVolume := "media-volume" }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.transmission.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      initContainers:
      - name: seed-config
        image: busybox:1
        command:
        - sh
        - -c
        - |
          echo "Writing Transmission settings.json from ConfigMap..."
          cp /seed/settings.json /config/settings.json
        volumeMounts:
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: transmission/config
        - mountPath: /seed
          name: {{ $configMap }}
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.transmission.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.transmission.image }}
        resources:
          {{- toYaml .Values.transmission.resources | nindent 10 }}
        ports:
        - name: {{ .Values.transmission.ports.http.name }}
          containerPort: {{ .Values.transmission.ports.http.targetPort }}
        - name: {{ .Values.transmission.ports.peer.name }}
          containerPort: {{ .Values.transmission.ports.peer.targetPort }}
        - name: {{ .Values.transmission.ports.peer.nameUdp }}
          containerPort: {{ .Values.transmission.ports.peer.targetPort }}
          protocol: UDP
        env:
        - name: PUID
          value: "{{ .Values.media.system.userId }}"
        - name: PGID
          value: "{{ .Values.media.system.groupId }}"
        - name: UMASK
          value: "{{ .Values.media.system.umask }}"
        - name: PEERPORT
          value: "{{ .Values.transmission.ports.peer.targetPort }}"
        - name: USER
          value: "{{ .Values.transmission.credentials.username }}"
        - name: PASS
          value: "{{ .Values.transmission.credentials.password }}"
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                # The linuxserver init script hardcodes rpc-whitelist (IP) and
                # rpc-host-whitelist (Host header) to localhost-only, which blocks
                # Homepage and Traefik. Patch them out via the RPC from localhost
                # (which always bypasses the IP whitelist).
                RPC=http://127.0.0.1:{{ .Values.transmission.ports.http.targetPort }}/transmission/rpc
                for i in $(seq 1 30); do
                  TOKEN=$(curl -si "$RPC" 2>/dev/null | grep -i "X-Transmission-Session-Id:" | tr -d '\r' | awk '{print $2}')
                  [ -n "$TOKEN" ] && break
                  sleep 2
                done
                [ -z "$TOKEN" ] && exit 0
                curl -sf -X POST "$RPC" \
                  -u "${USER}:${PASS}" \
                  -H "X-Transmission-Session-Id: $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{"method":"session-set","arguments":{"rpc-whitelist-enabled":false,"rpc-host-whitelist-enabled":false}}' \
                  || true
        volumeMounts:
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: transmission/config
        - mountPath: {{ .Values.media.system.data.path }}
          name: {{ $mediaVolume }}
          subPath: downloads/transmission
      volumes:
      - name: {{ $mediaVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.transmission.pvc.media . }}
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.transmission.pvc.app . }}
      - name: {{ $configMap }}
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.transmission.label }}{{ .Values.k8s.names.configMaps.suffix }}
{{- end }}
