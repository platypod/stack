{{- if .Values.observability.dashboard.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.observability.dashboard.label .Values.k8s.names.pods.suffix }}
{{- $appVolume := "app-volume" }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $pod }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/observability/grafana/config-map.yaml") . | sha256sum }}
        checksum/dashboards: {{ include (print $.Template.BasePath "/observability/grafana/dashboards-config-map.yaml") . | sha256sum }}
        checksum/dashboards-claude: {{ include (print $.Template.BasePath "/observability/grafana/dashboards-claude-config-map.yaml") . | sha256sum }}
    spec:
      priorityClassName: platypod-bulk
      # Prefer the bulk node (memory-rich, CPU-poor) but never require it: that
      # class of node may not exist yet, and a hard requirement would leave
      # these Pending instead of falling back. Also steer away from the primary
      # node, whose spare memory is the gaming reserve.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: platypod.io/node-class
                operator: In
                values: ["bulk"]
          - weight: 50
            preference:
              matchExpressions:
              - key: platypod.io/node-class
                operator: NotIn
                values: ["primary"]
      {{- if .Values.traefik.loadBalancerIP }}
      # Resolve the Authelia hostname to the Traefik LoadBalancer internally so
      # Grafana's OIDC back-channel (token/userinfo) routes through Traefik,
      # which injects the X-Forwarded-* headers Authelia needs to build the
      # correct issuer. Without this, the external domain is NXDOMAIN in-cluster.
      hostAliases:
      - ip: {{ .Values.traefik.loadBalancerIP }}
        hostnames:
        - {{ tpl .Values.authelia.host . }}
      {{- end }}
      initContainers:
      - name: init-permissions
        image: busybox:1.37.0
        command: ['sh', '-c', 'mkdir -p /data/grafana/data /data/grafana/plugins /data/grafana/provisioning && chown -R 472:472 /data/grafana']
        volumeMounts:
        - name: {{ $appVolume }}
          mountPath: /data
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.observability.dashboard.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.observability.dashboard.image }}
        ports:
        - containerPort: {{ .Values.observability.dashboard.ports.http.targetPort }}
        volumeMounts:
        - name: conf
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: conf
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
        - name: conf
          mountPath: /etc/grafana/provisioning/dashboards/media.yaml
          subPath: dashboards-providers.yaml
        - name: conf
          mountPath: /var/lib/grafana/dashboards/media/jellyfin.json
          subPath: jellyfin.json
        - name: conf
          mountPath: /var/lib/grafana/dashboards/media/transmission.json
          subPath: transmission.json
        - name: dashboard-mediarvester
          mountPath: /var/lib/grafana/dashboards/media/mediarvester.json
          subPath: mediarvester.json
        # Whole-directory mount: every JSON in the dashboards ConfigMap
        # (chart files/dashboards/, incl. the Synology NAS dashboard) lands in
        # the Platform folder, except mediarvester.json -- it's excluded via
        # `items` below and mounted into the Media folder instead (see
        # dashboard-mediarvester above).
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards/platform
        - name: dashboards-claude
          mountPath: /var/lib/grafana/dashboards/claude
        - mountPath: /var/lib/grafana
          name: {{ $appVolume }}
          subPath: grafana/data
        - mountPath: /var/lib/grafana/plugins
          name: {{ $appVolume }}
          subPath: grafana/plugins
        - mountPath: /etc/grafana/provisioning
          name: {{ $appVolume }}
          subPath: grafana/provisioning
#        readinessProbe:
#          failureThreshold: 3
#          httpGet:
#            path: /robots.txt
#            port: 3000
#            scheme: HTTP
#          initialDelaySeconds: 10
#          periodSeconds: 30
#          successThreshold: 1
#          timeoutSeconds: 2
#        livenessProbe:
#          failureThreshold: 3
#          initialDelaySeconds: 30
#          periodSeconds: 10
#          successThreshold: 1
#          tcpSocket:
#            port: 3000
#          timeoutSeconds: 1
        resources:
          {{- toYaml .Values.observability.dashboard.resources | nindent 10 }}
      volumes:
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.observability.pvc . }}
      - name: conf
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.dashboard.label }}{{ .Values.k8s.names.configMaps.suffix }}
      - name: dashboards
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.dashboard.label }}-dashboards{{ .Values.k8s.names.configMaps.suffix }}
          # Project every glob'd dashboard except mediarvester.json, which
          # ships into the Media folder instead (see the dashboard-mediarvester
          # volume below) -- one explicit exclusion, so any *other* new file
          # dropped into files/dashboards/ still ships to Platform automatically.
          items:
          {{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
          {{- $name := base $path }}
          {{- if ne $name "mediarvester.json" }}
          - key: {{ $name }}
            path: {{ $name }}
          {{- end }}
          {{- end }}
      - name: dashboard-mediarvester
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.dashboard.label }}-dashboards{{ .Values.k8s.names.configMaps.suffix }}
          items:
          - key: mediarvester.json
            path: mediarvester.json
      - name: dashboards-claude
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.dashboard.label }}-dashboards-claude{{ .Values.k8s.names.configMaps.suffix }}
{{- end }}
