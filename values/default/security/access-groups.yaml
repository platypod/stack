# Single source of truth for the LDAP group / Authelia rule redesign
# (per-tool + per-category groups, replacing the flat media/download/dev groups).
# See stack/docs/authentication.md for the write-up once wired in.
#
# This file is NOT yet consumed by any template — it's the draft table for
# review before the LLDAP seed / Authelia rule generation is built on top of it.
#
# Field reference:
#   valuesPath      Dotted path under .Values to the tool's own values block
#                    (only set when it differs from the map key itself, e.g.
#                    the observability.* services). The rule generator reads
#                    `<valuesPath-or-key>.host` from it — every tool already
#                    defines its own `host:` template string, so this is just
#                    "where to find it", not a full domain to rebuild.
#   host            Raw Authelia-rule-domain template string, used INSTEAD of
#                    valuesPath/`.host` for the handful of tools whose gated
#                    hostname isn't their own `.host` (e.g. a "-db" admin-UI
#                    hostname built from a different tool's label). Same
#                    `{{ }}`-templated-string convention as every `host:` value
#                    elsewhere in this repo — resolved with `tpl` at render time.
#   extraHosts      Additional raw host template strings gated by the exact
#                    same rule as the main one (e.g. AdGuard's "-admin" hostname).
#   roles           Which per-tool groups to create: [] | [user] | [admin, user]
#                    | [writer]. Only tools with a REAL in-app role split get
#                    more than one entry — see the "Role granularity" decision.
#                    Produces groups named "<toolKey>_<role>".
#   categories      Which composite groups (<category>_user / <category>_admin)
#                    this tool's access should also be grantable through.
#                    LLDAP has no nested groups — composites are flat sibling
#                    groups, referenced alongside the granular ones wherever
#                    access is checked (Authelia subject list, LDAP filters).
#   authelia        Whether an Authelia access_control rule should be generated
#                    for this tool's domain at all. false = the tool's ingress
#                    is fully bypass / own-auth (e.g. Jellyfin) — LDAP groups
#                    still exist for it, but Authelia never checks them.
#   roleEnforcement "authelia" (default, omitted) = the generated Authelia rule
#                    itself lists the per-tool role groups, so reaching the
#                    tool at all differs by role.
#                    "app" = Authelia only gates by category (any dev/media/etc
#                    member reaches the login), and the role split is enforced
#                    *inside* the app via its own group lookup — see `evidence`
#                    below for how each one currently does it (or would need to).
#   evidence        Where the admin/user split was confirmed for THIS repo, or
#                    a note that it's the upstream app's general capability
#                    and not yet verified against what's actually deployed here.
#   verified        true = confirmed by reading this repo's code/docs (see
#                    `evidence`). false = plausible from general knowledge of
#                    the upstream app, but nothing in this repo proves the
#                    pinned version/config here actually has it wired up —
#                    treat as "worth checking before relying on", not settled.
#                    Omitted where the question doesn't apply (roles: [user]).
#
# `admins` is NOT listed here — it's the existing global superuser composite,
# implicitly appended to every generated Authelia rule and to any app-side
# role check, on top of whatever's declared below.
#
# Composite groups: `categories` (below) is the map that actually gets built —
# every category always gets a `<category>_user` composite, but `<category>_admin`
# is ONLY generated when `admin: true`, i.e. when at least one tool in that
# category has a real, currently-usable admin mechanism (see that tool's
# `evidence`). An admin composite for a category where nothing can consume it
# would just be a duplicate of the `_user` one — same rule as per-tool groups.

security:
  categories:
    media:    { admin: true }    # jellyfin_admin, mediarvester_admin both consume it
    download: { admin: false }   # no tool here has any admin tier
    dev:      { admin: true }    # grafana_admin, bookstack_admin both consume it

  accessGroups:
    # --- media ---
    jellyfin:
      roles: [admin, user]
      categories: [media]
      authelia: false          # bypass ingress, own auth
      roleEnforcement: app
      verified: true
      evidence: "LDAP-Auth plugin's adminGroup/userGroup filters — stack/docs/media/jellyfin-ldap.md"

    mediarvester:
      roles: [admin, user]
      categories: [media]
      roleEnforcement: app
      verified: true
      evidence: "mediarvester/src/api/deps.py:is_admin() reads Authelia's forwarded Remote-Groups header, checks overlap with ADMIN_GROUPS (env, comma-separated set). Wired: the Mediarvester Deployment sets ADMIN_GROUPS via media.mediarvesterAdminGroups (src/media/templates/_helpers.tpl) → 'mediarvester_admin,media_admin,admins'."

    jellyseerr:
      roles: [user]
      categories: [media]
      authelia: false           # bypass ingress today (own auth) — see authentication.md
      # Has a real admin bit in its own DB, but jellyseerr-setup-job writes it by
      # hardcoded username, not by reading any LDAP group — no mechanism exists
      # today for a jellyseerr_admin group to grant anything. Deferred: would need
      # the setup job taught to look up group membership before it's worth creating.
      evidence: "jellyseerr-setup-job writes the ADMIN bit directly into its DB (stack/docs/media/jellyseerr.md) — not group-driven, so no admin group would do anything yet"

    kavita:
      roles: [user]
      categories: [media]
      # First OIDC-registered user becomes admin — a provisioning-order fluke,
      # not a group check. No mechanism for a kavita_admin group to plug into yet.
      evidence: "first OIDC-registered user becomes admin (stack/docs/media/kavita-setup-job.md) — not group-driven, deferred until it is"

    audiobookshelf:
      roles: [user]
      categories: [media]
      # Root user is fixed at first-init; app supports more roles upstream but
      # nothing here reads a group to grant them. Deferred, same as Kavita.
      evidence: "root user fixed at first-init via POST /init (stack/docs/media/audiobookshelf-setup-job.md); Root/Admin/User/Guest tiers exist upstream, not group-driven here"

    bazarr:        { roles: [user], categories: [media] }
    flaresolverr:  { roles: [user], categories: [media] }
    radarr:        { roles: [user], categories: [media] }
    prowlarr:      { roles: [user], categories: [media] }
    readarr:       { roles: [user], categories: [media] }
    sonarr:        { roles: [user], categories: [media] }
    reclaimerr:    { roles: [user], categories: [media] }
    suwayomi:      { roles: [user], categories: [media] }   # AUTH_MODE=none, no user system at all
    tdarr:         { roles: [user], categories: [media] }

    rommapp:
      roles: [user]
      categories: [media]
      # RomM has a real upstream viewer/editor/admin role system, but nothing in
      # this repo confirms it's configured — no role-seed job like BookStack's.
      # Left single-tier until that's actually verified against the pinned version.
      verified: false
      evidence: "unverified — upstream RomM has roles, not confirmed wired here"

    # --- download (no RBAC in any of these — single shared credential, confirmed
    #     by how each is described in stack/docs/files/*.md) ---
    transmission:  { roles: [user], categories: [download] }
    qbittorrent:   { roles: [user], categories: [download] }
    deluge:        { roles: [user], categories: [download] }
    sabnzbd:       { roles: [user], categories: [download] }

    # --- dev ---
    grafana:
      valuesPath: observability.dashboard
      roles: [admin, user]
      categories: [dev]
      roleEnforcement: app
      verified: true
      evidence: "dashboard scope-shim — stack/docs/observability/dashboard-multitenancy.md. Wired: ADMIN_GROUPS is generated via observability.grafanaAdminGroups (src/observability/templates/_helpers.tpl) → 'grafana_admin,dev_admin,admins'."

    bookstack:
      roles: [admin, user]
      categories: [dev]
      roleEnforcement: app
      verified: true
      evidence: "bookstack-role-seed-job maps the admins group's display name to BookStack's built-in admin role — stack/docs/dev-tools/bookstack-role-seed-job.md. Already group-driven, just not per-tool (bookstack_admin) yet."

    wikijs:
      roles: [user]
      categories: [dev]
      # Wiki.js has a real upstream Admin/group RBAC system, but this repo only
      # wires an OIDC login strategy (wikijs-oidc-seed-job), no role sync.
      verified: false
      evidence: "unverified — upstream Wiki.js has groups/roles, not confirmed wired here"

    outline:
      roles: [user]
      categories: [dev]
      # Outline has real upstream Admin/Member/Viewer/Guest roles and even
      # supports SSO-group role sync, but nothing in this repo configures it.
      verified: false
      evidence: "unverified — upstream Outline has team roles, not confirmed wired here"

    dbeaver:
      roles: [user]
      categories: [dev]
      # CloudBeaver has a real upstream admin flag per user, but nothing in
      # this repo wires LDAP/OIDC groups to it.
      verified: false
      evidence: "unverified — upstream CloudBeaver has an admin flag, not confirmed wired here"

    loki:
      valuesPath: observability.logs
      roles: [user]
      categories: [dev]
    mimir:
      valuesPath: observability.metrics
      roles: [user]
      categories: [dev]
    tempo:
      valuesPath: observability.traces
      roles: [user]
      categories: [dev]
    pyroscope:
      valuesPath: observability.profiles
      roles: [user]
      categories: [dev]
    adguard:
      roles: [user]
      categories: [dev]
      # single admin account only; same rule also gates the "-admin" hostname
      extraHosts:
        - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.adguard.label }}-admin{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"

    bookstack-db:
      roles: [user]
      categories: [dev]
      # Not bookstack's own host — a separate DB-admin-UI hostname built from
      # bookstack's label, same construction as the original hand-written rule.
      host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.bookstack.label }}-db{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"

    wikijs-db:
      roles: [user]
      categories: [dev]
      host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.wikijs.label }}-db{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"

    database:      { roles: [user], categories: [dev] }

    authelia-db:
      roles: [user]
      categories: [dev]
      host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.authelia.label }}-db{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
    whoami:        { roles: [user], categories: [dev] }
    uptimeKuma:    { roles: [user], categories: [dev] }   # 1.x: single admin account only, confirmed by stack/docs/observability/uptime-kuma.md

    # --- standalone (no category composite) ---
    otel:
      roles: [writer]          # produces otel_writer, replacing otel-writers
      categories: []
      valuesPath: observability.otelCollector
      # Gated by its own hand-written Basic-auth rule (grpcHost, not host, and
      # 1FA over Authorization: Basic rather than a browser login) — excluded
      # from the generated per-tool rules.
      authelia: false
