# Vendored CRDs (Traefik) — see infrastructure/crds/kustomization.yaml for why
# they're vendored rather than fetched remotely, and stack/docs/flux-migration.md
# gotcha 1. No app modules/HelmReleases wired up yet — that's Phase 4.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crds
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
