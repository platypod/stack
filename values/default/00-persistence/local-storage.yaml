localStorage:
  persistentVolumes:
  - name: ${media.storage.pv}
    claim: ${media.storage.pvc}
    path: ${media.storage.path}
    capacityStorage: ${media.storage.capacityStorage}
    labels:
      pv: ${media.storage.pv}
      pvc: ${media.storage.pvc}
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - ${media.storage.node}
  - name: ${bookstack.storage.pv}
    claim: ${bookstack.storage.pvc}
    path: ${bookstack.storage.path}
    capacityStorage: ${bookstack.storage.capacityStorage}
    labels:
      pv: ${bookstack.storage.pv}
      pvc: ${bookstack.storage.pvc}
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - ${bookstack.storage.node}
  - name: ${authelia.storage.pv}
    claim: ${authelia.storage.pvc}
    path: ${authelia.storage.path}
    capacityStorage: ${authelia.storage.capacityStorage}
    labels:
      pv: ${authelia.storage.pv}
      pvc: ${authelia.storage.pvc}
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - ${authelia.storage.node}
  - name: ${traefik.storage.pv}
    claim: ${traefik.storage.pvc}
    path: ${traefik.storage.path}
    capacityStorage: ${traefik.storage.capacityStorage}
    labels:
      pv: ${traefik.storage.pv}
      pvc: ${traefik.storage.pvc}
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - ${traefik.storage.node}
