apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.logs.label }}{{ .Values.k8s.names.configMaps.suffix }}
data:
  local-config.yaml: |
    # Multi-tenant: per-user transcript tenants (claude-<user>) + a default tenant
    # for untagged logs. The gateway sets X-Scope-OrgID per push; reads come via
    # the logs scope shim. See docs/observability/dashboard-multitenancy.md.
    auth_enabled: true

    server:
      http_listen_port: {{ .Values.observability.logs.ports.http.targetPort }}
      grpc_listen_port: {{ .Values.observability.logs.ports.grpc.targetPort }}
      log_level: {{ .Values.observability.logs.logging.level }}
      grpc_server_max_concurrent_streams: 1000

    common:
      # No instance_addr override: it's the address ring/gRPC components dial to
      # reach *this* instance (query-scheduler <-> querier <-> frontend, even
      # within one monolithic pod), not a bind address. "0.0.0.0" used to be set
      # here, which isn't dialable — ring health checks failed ("could only find
      # 0 - unhealthy instances: 0.0.0.0:9096"), which stalled/timed out queries
      # and eventually writes too. Let Loki auto-detect the pod's real IP
      # (default interface list already includes eth0).
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    limits_config:
      metric_aggregation_enabled: true
      # Accept back-dated samples so historical Claude Code transcripts (weeks/
      # months old, shipped by stack/bin/ship-transcripts) ingest instead of being
      # dropped by the default 1-week reject_old_samples_max_age. Personal,
      # single-tenant cluster — the usual out-of-order/replay concerns don't apply.
      reject_old_samples: false
      # Allow querying the full transcript history (default caps range at ~30d).
      max_query_length: 0
      # Promote a couple of low-cardinality transcript attributes to indexed
      # labels so Grafana `label_values()` can drive named dropdowns (session
      # picker, project filter). Everything else stays structured metadata.
      otlp_config:
        log_attributes:
        - action: index_label
          attributes:
            - session_title
            - project
            - tool_name
      # Enable the delete API (used to drop and repopulate the transcript stream).
      # retention_period is large so nothing is auto-purged by age — only explicit
      # delete requests act.
      deletion_mode: filter-and-delete
      retention_period: 8760h

    # Compactor processes delete requests (retention must be enabled for it to run).
    compactor:
      working_directory: /tmp/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
      compaction_interval: 5m
      delete_request_cancel_period: 10m

    schema_config:
      configs:
      # Never edit an existing period's `from` once data exists under it — this
      # one still holds real data (Claude transcripts since ~2026-05-28), so it
      # stays as-is. Its `from` (2020-10-24, unmodified boilerplate from Loki's
      # own getting-started example) meant the local shipper cache walked the
      # *entire* schema-declared range on every startup: ~1675 daily
      # directories with zero data in them (verified directly on the PVC),
      # costing ~28 of a ~30min cold start on NFS-backed storage. Cleaned up
      # the empty ones once (2026-07-01) — this new period below just stops
      # that range from growing further, so a future from-scratch rebuild
      # can't regenerate the same multi-year backlog.
      - from: 2020-10-24
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
      - from: 2026-07-02
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

    pattern_ingester:
      enabled: true
      metric_aggregation:
        loki_address: localhost:{{ .Values.observability.logs.ports.http.targetPort }}

    ruler:
      alertmanager_url: http://localhost:9093

    frontend:
      encoding: protobuf

    analytics:
      reporting_enabled: false
