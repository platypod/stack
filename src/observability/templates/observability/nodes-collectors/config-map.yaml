{{- if .Values.observability.otelCollector.collectors.enable }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ tpl .Values.observability.otelCollector.collectors.label . }}{{ .Values.k8s.names.configMaps.suffix }}
  namespace: {{ tpl .Values.observability.otelCollector.collectors.namespace . }}
data:
  collector.yaml: |
    receivers:
      filelog:
        # Talos uses containerd, not Docker. Kubernetes container logs live at
        # /var/log/pods/<ns>_<pod>_<uid>/<container>/<n>.log (the Docker path
        # /var/lib/docker/containers does not exist on Talos).
        include:
        - /hostfs/var/log/pods/*/*/*.log
        start_at: beginning
        include_file_path: true
        include_file_name: false
        #- type: container
        #  id: container-parser
      hostmetrics:
        root_path: /hostfs
        collection_interval: 10s
        scrapers:
          cpu:
          load:
          memory:
          disk:
          filesystem:
          network:
      # Per-pod / per-container resource usage straight from this node's kubelet
      # (CPU, memory working set, network, filesystem). This is what powers the
      # workloads dashboards; hostmetrics above only sees the node as a whole.
      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        # Dial the node IP, not the node name: Talos node names are not
        # resolvable from cluster DNS.
        endpoint: https://${env:K8S_NODE_IP}:10250
        # Talos kubelet serving certs are not signed for the IP we dial.
        insecure_skip_verify: true
        metric_groups: [node, pod, container]
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 2048
      k8sattributes:
        extract:
          metadata:
          - k8s.pod.name
          - k8s.namespace.name
          - k8s.node.name
      memory_limiter:
        check_interval: 1s
        limit_mib: 4000
        spike_limit_mib: 800
      attributes/filelog:
        actions:
        - key: node-collector-receiver
          value: filelog
          action: insert
      attributes/hostmetrics:
        actions:
        - key: node-collector-receiver
          value: hostmetrics
          action: insert
        # Mimir's OTLP ingestion only keeps datapoint attributes as labels
        # (resource attributes land in target_info). Without this, series from
        # different nodes collide into one indistinguishable timeline.
        - key: node
          value: ${env:K8S_NODE_NAME}
          action: insert
      attributes/kubeletstats:
        actions:
        - key: node-collector-receiver
          value: kubeletstats
          action: insert
        - key: node
          value: ${env:K8S_NODE_NAME}
          action: insert
      # Same Mimir constraint as above: kubeletstats carries pod /
      # namespace / container identity as resource attributes, which would land
      # in target_info on ingestion. Copy them onto each datapoint so they survive as
      # labels (the only thing that makes per-pod metrics queryable).
      transform/kubeletstats:
        metric_statements:
        - context: datapoint
          statements:
          - set(attributes["namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil
          - set(attributes["pod"], resource.attributes["k8s.pod.name"]) where resource.attributes["k8s.pod.name"] != nil
          - set(attributes["container"], resource.attributes["k8s.container.name"]) where resource.attributes["k8s.container.name"] != nil
      attributes/otlp:
        actions:
        - key: node-collector-receiver
          value: otlp
          action: insert

    exporters:
      debug/verbose:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200
      debug/noop:
        verbosity: normal
        sampling_initial: 0
        sampling_thereafter: 0
      otlp:
        endpoint: "{{ .Values.k8s.names.services.prefix }}{{ tpl .Values.observability.otelCollector.gateway.label . }}{{ .Values.k8s.names.services.suffix }}.{{ .Values.k8s.namespace }}.svc.cluster.local:{{ .Values.observability.otelCollector.gateway.ports.grpc.targetPort }}"
        tls:
          insecure: true

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [attributes/filelog, batch, memory_limiter, k8sattributes]
          exporters: [otlp]
        metrics/hostmetrics:
          receivers: [hostmetrics]
          processors: [attributes/hostmetrics, batch, memory_limiter, k8sattributes]
          exporters: [otlp]
        metrics/kubeletstats:
          receivers: [kubeletstats]
          processors: [transform/kubeletstats, attributes/kubeletstats, batch, memory_limiter]
          exporters: [otlp]
        metrics/otlp:
          receivers: [otlp]
          processors: [attributes/otlp, batch, memory_limiter, k8sattributes]
          exporters: [otlp]
        traces:
          receivers: [otlp]
          processors: [attributes/otlp, batch, memory_limiter, k8sattributes]
          exporters: [otlp]

      telemetry:
        logs:
          level: {{ .Values.observability.otelCollector.logging.level }}
          encoding: {{ .Values.observability.otelCollector.logging.format }}
{{- end }}
