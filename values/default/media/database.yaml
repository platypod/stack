database:
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.database.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  # Superuser — used only by the init job; never shared with services.
  credentials:
    username: postgresMedia
    password: postgresPassword
  # Per-service credentials — each service gets its own DB user.
  serviceCredentials:
    jellyseerr:
      username: jellyseerrUser
      password: jellyseerrPassword
    mediarvester:
      username: mediarvesterUser
      password: mediarvesterPassword
    cloudBeaver:
      username: cloudBeaverUser
      password: cloudBeaverPassword
  image: postgres:17
  label: transverse-db
  ports:
    http:
      name: pgsql
      targetPort: 5432
  schemas:
    cloudBeaver:
      main: cloudBeaver
    jellyseerr:
      main: jellyseerr
    mediarvester:
      main: mediarvester
    bazarr:
      main: bazarrMain
      logs: bazarrLogs
    prowlarr:
      main: prowlarrMain
      logs: prowlarrLogs
    radarr:
      main: radarrMain
      logs: radarrLogs
    readarr:
      cache: readarrCache
      main: readarrMain
      logs: readarrLogs
    sonarr:
      main: sonarrMain
      logs: sonarrLogs
  replicasNb: 1
  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
