{{- if and .Values.finance.enable .Values.finance.pipelines.payslips.enable }}
{{- $src := .Values.finance.pipelines.payslips.source }}
{{- $secret := print .Values.k8s.names.services.prefix .Values.finance.label .Values.k8s.names.services.suffix "-pipeline-env" }}
apiVersion: batch/v1
kind: CronJob

metadata:
  name: {{ .Values.finance.label }}-payslips

spec:
  schedule: {{ .Values.finance.pipelines.payslips.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
          - name: payslips
            image: {{ .Values.finance.image }}
            args: ["run", "payslips"]
            envFrom:
            - secretRef:
                name: {{ $secret }}
            env:
            - name: OTEL_SERVICE_NAME
              value: finance-payslips
            - name: PAYSLIPS_DIR
              value: /data/payslips
            # Re-parse files stored by an older parser version (a no-op when versions match): a
            # parser fix in a new image corrects the already-ingested history on its next run.
            - name: PAYSLIPS_REPARSE
              value: "1"
            resources:
              {{- toYaml .Values.finance.pipelines.resources | nindent 14 }}
            volumeMounts:
            - name: payslips
              mountPath: /data/payslips
              readOnly: true
              {{- if eq $src.type "apps" }}
              subPath: {{ $src.subPath }}
              {{- end }}
          volumes:
          - name: payslips
            persistentVolumeClaim:
              {{- if eq $src.type "apps" }}
              claimName: {{ tpl .Values.storage.defaultVolumes.apps . }}
              {{- else }}
              claimName: {{ .Values.finance.label }}-payslips
              {{- end }}
              readOnly: true
{{- end }}
