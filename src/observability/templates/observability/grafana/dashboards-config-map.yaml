{{- if .Values.observability.dashboard.enable }}
# Platform dashboards (cluster, workloads, services) live as plain JSON files
# under the chart's files/dashboards/ and are bundled here via .Files.Glob —
# mounted as a whole directory, unlike the legacy per-file subPath mounts in
# the main grafana ConfigMap. Add a JSON file there and it ships automatically.
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.dashboard.label }}-dashboards{{ .Values.k8s.names.configMaps.suffix }}

data:
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
