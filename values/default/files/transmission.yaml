transmission:
  enable: true
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.transmission.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: lscr.io/linuxserver/transmission:latest
  label: transmission
  credentials:
    username: admin
    password: password
  download:
    torrents: "{{ .Values.media.system.data.path }}/torrents"
    ongoing: "{{ .Values.media.system.data.path }}/ongoing"
    finished: "{{ .Values.media.system.data.path }}/finished"
  exporter:
    label: "{{ .Values.transmission.label }}-exporter"
    image: ghcr.io/platypod/transmission-exporter:0.3.0
    ports:
      http:
        name: http
        nodePort: 31416
        targetPort: 9092
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  ports:
    http:
      name: webui
      nodePort: 31415
      targetPort: 9091
    peer:
      name: peer-listening
      nameUdp: peer-udp
      nodePort: 31413
      nodePortUdp: 31414
      targetPort: 51413
  pvc:
    app: "{{ .Values.storage.defaultVolumes.apps }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      # Wanted 512Mi (usage regularly hits ~2x the old 256Mi request), but
      # mini4-w1 was ~7Mi short of that on 2026-07-15 — capped at 480Mi to
      # fit. Revisit once the node has more headroom.
      memory: 480Mi
    limits:
      # 256Mi OOMKilled the daemon once the torrent list grew (resume/verification
      # state is held in memory). Raised to give headroom for a large/active set.
      memory: 768Mi
