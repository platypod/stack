observability:
  dashboard:
    label: grafana
    image: grafana/grafana-oss:13.0.2
    resources:
      requests:
        cpu: 100m
        # Grafana 13 OSS builds an in-memory bleve search index over all
        # provisioned dashboards at startup; 384Mi got OOMKilled (exit 137).
        # limit (below) already carries that fix — request bumped separately
        # since observed steady-state usage runs well above the old 256Mi.
        memory: 448Mi
      limits:
        memory: 768Mi
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.dashboard.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
    oidc:
      clientId: kyqP5Y1daxOz8lMlmYOyOWuq7rbmyUQO34NUp1k3FKZxh55v3tP05pVVZRIwSTnC
      clientSecret:
        plain: B9YxVjgrhwekgnE8sv1S3eW1l2f1NALIOOVeGEvre4cEzG-XwWY0soryKC1geV0DE2a_AT4Q
        hashed: $pbkdf2-sha512$310000$EBnY.k1tDa4lDB0P5cCLXw$MauDGOsp5dNN6YFn1cnYUe8TSdNzf6aReO8Tvo3ABC0VxzjR75qcS0BtkN5dm8jnpPd0snA7nSTOlR.YQyq3Ig
    ports:
      http:
        name: http
        targetPort: 3000
    logging:
      level: info
      format: json
