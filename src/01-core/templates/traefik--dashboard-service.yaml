apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.traefik.names.services.dashboard }}

spec:
  ports:
    - protocol: TCP
      port: {{ .Values.traefik.ports.dashboard.port }}
      targetPort: {{ .Values.traefik.ports.dashboard.targetPort }}
      name: {{ .Values.traefik.ports.dashboard.name }}
  selector:
    app: {{ .Values.traefik.names.pod }}
