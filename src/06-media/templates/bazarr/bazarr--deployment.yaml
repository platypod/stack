{{- $appVolume := "app-volume" }}
{{- $mediaVolume := "media-volume" }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.bazarr.label .Values.k8s.names.pods.suffix }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.bazarr.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.bazarr.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.bazarr.image }}
        ports:
        - name: {{ .Values.bazarr.ports.http.name }}
          containerPort: {{ .Values.bazarr.ports.http.targetPort }}
        env:
        - name: PUID
          value: "{{ .Values.media.system.userId }}"
        - name: PGID
          value: "{{ .Values.media.system.groupId }}"
        - name: UMASK
          value: "{{ .Values.media.system.umask }}"
        volumeMounts:
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: bazarr/config
        - mountPath: /movies
          name: {{ $mediaVolume }}
          subPath: movies
        - mountPath: /tv
          name: {{ $mediaVolume }}
          subPath: series
      volumes:
      - name: {{ $mediaVolume }}
        persistentVolumeClaim:
          claimName: {{ .Values.bazarr.pvc.media }}
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ .Values.bazarr.pvc.app }}
