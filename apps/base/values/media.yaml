prowlarr:
  apiKey: "11111111111111111111111111111111"
  image: linuxserver/prowlarr:2.5.2.5491-ls155
  ports:
    http:
      name: prowlarr-http
      targetPort: 9696
  # Newznab indexers auto-wired by the sabnzbd-setup Job. apiKey empty = skip
  # (real key comes from the user's althub.co.za profile → Integrations tab,
  # set only in platypod-sops' clusters/<env>/secrets.enc.yaml, never committed here).
  indexers:
    althub:
      baseUrl: "https://www.althub.co.za"
      apiKey: ""
      # althub's own published policy (help.althub.co.za/using-althub/
      # abusing-the-api) asks clients to self-limit to roughly one request
      # per 10 minutes or risk an IP ban. Prowlarr has no per-request
      # spacing throttle, only a per-period count cap (baseSettings.
      # queryLimit/limitsUnit — set to Hour here, see sabnzbd--setup-job.yaml),
      # so 6/hour is the closest real enforcement of that policy available.
      # Found the hard way 2026-09-02/03: enough rapid manual testing while
