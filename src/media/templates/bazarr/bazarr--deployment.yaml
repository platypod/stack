{{- if .Values.bazarr.enable }}
{{- $appVolume := "app-volume" }}
{{- $mediaVolume := "media-volume" }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.bazarr.label .Values.k8s.names.pods.suffix }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.bazarr.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      initContainers:
      # Seed config.yaml from ConfigMap on first start so Bazarr uses the
      # predefined API key from values instead of generating a random one.
      - name: seed-config
        image: busybox:1
        command:
        - sh
        - -c
        - |
          DEST=/config/config/config.yaml
          mkdir -p /config/config
          if [ ! -f "$DEST" ]; then
            echo "Seeding Bazarr config.yaml from ConfigMap..."
            cp /seed/config.yaml "$DEST"
          else
            echo "config.yaml already exists, skipping seed."
          fi
        volumeMounts:
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: bazarr/config
        - mountPath: /seed
          name: config-seed
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.bazarr.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.bazarr.image }}
        resources:
          {{- toYaml .Values.bazarr.resources | nindent 10 }}
        ports:
        - name: {{ .Values.bazarr.ports.http.name }}
          containerPort: {{ .Values.bazarr.ports.http.targetPort }}
        env:
        - name: PUID
          value: "{{ .Values.media.system.userId }}"
        - name: PGID
          value: "{{ .Values.media.system.groupId }}"
        - name: UMASK
          value: "{{ .Values.media.system.umask }}"
        volumeMounts:
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: bazarr/config
        - mountPath: /movies
          name: {{ $mediaVolume }}
          subPath: movies
        - mountPath: /tv
          name: {{ $mediaVolume }}
          subPath: series
      volumes:
      - name: {{ $mediaVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.bazarr.pvc.media . }}
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.bazarr.pvc.app . }}
      - name: config-seed
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.bazarr.label }}{{ .Values.k8s.names.configMaps.suffix }}
{{- end }}
