# Implementation tier — dev-tools module. Registry fields (enable/label/host)
# for these services live in values/default/registry.yaml instead.

bookstack:
  appKey: base64:gJJbTsv2CTPeHrCOmu0crY65zypAC747jgMHvYEUlto=
  appDebug: true
  image: lscr.io/linuxserver/bookstack:v26.05.3-ls277
  database:
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.bookstack.label }}-db{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
    name: "{{ .Values.bookstack.label }}"
    credentials:
      username: admin
      password: password
      rootPassword: passwordRoot
    image: mysql:9
    # MySQL 9's baseline RSS is heavy (~400Mi even idle); 256Mi OOMKills on init.
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 512Mi
    label: "{{ .Values.bookstack.label }}-db"
    ports:
      http:
        name: mysql
        targetPort: 3306
    replicasNb: 1
  oidc:
    clientId: dpxqruPll6Oo3BU9JTiWOzCQvzrFRwmAhY4ctWhffH2QwiYoeBRF39cn2hh6whvU
    clientSecret:
      plain: B13X~Y2tnTtMFH.6-6yrlEO-cuDvalMfOTgFKoXVcHUna7vDovGS65-c5FNItw_0bA2aUS5M
      hashed: $pbkdf2-sha512$310000$JmnaFFo.wEgnSJRuPLVFCA$AVbGYIlK1/fauOGd4QtgIa1gwzgf.y4HQuWZjUgqedL9DZ9ji60qazYYxBtzBe6YxYFY9KlFarV/qW9/B5PoYQ
  ports:
    http:
      name: http
      targetPort: 80
  replicasNb: 1
  storage:
    pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  system:
    userId: 501
    groupId: 20
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

cyberChef:
  image: ghcr.io/platypod/cyber-chef:v11.0.0 # {"$imagepolicy": "flux-system:cyber-chef"}
  ports:
    http:
      name: http
      targetPort: 80
  replicasNb: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

dbeaver:
  # CloudBeaver uses its embedded management database (persisted on the apps PVC);
  # it is intentionally NOT backed by the shared PostgreSQL — see the deployment
  # template for why (CloudBeaver's external-Postgres migration path self-conflicts).
  credentials:
    username: admin
    password: password
  # Pinned (NOT :latest). CloudBeaver 26.1.0 ships a broken schema migration that
  # recreates an existing table on first boot ("Error updating CB_CE schema version"
  # / "relation already exists") — reproduced on both PostgreSQL and embedded H2.
  # 25.3.x is the last stable line that initializes cleanly.
  image: dbeaver/cloudbeaver:24.3.5
  ports:
    http:
      name: dbeaver-http
      targetPort: 8978
  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi

headroom:
  # https://github.com/headroomlabs-ai/headroom — LLM context-compression proxy.
  # Runs in "proxy mode" only (headroom proxy --host 0.0.0.0 --port 8787, the
  # image's default entrypoint/CMD). No qdrant/neo4j — those back the
  # cross-agent memory feature, not requested here. No persistent volume for
  # ~/.headroom either, so proxy_savings/memory.db reset on pod restart —
  # acceptable for a dev-only deploy; revisit if the dashboard/memory features
  # get used for real.
  image: ghcr.io/chopratejas/headroom:v0.27.0
  ports:
    http:
      name: http
      targetPort: 8787
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

itTools:
  image: corentinth/it-tools:2024.10.22-7ca5933
  ports:
    http:
      name: http
      targetPort: 80
  replicasNb: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

outline:
  image: outlinewiki/outline:1.9.2
  secretKey: 60aa61ff577303bd4ec1043e3d684337c520cd9894553a22c507f0f308f699e2
  utilsSecret: fb7285f1066b5c20bf39738cd3900f6dc468f75e06ae1747485ac9a7861f19e5
  database:
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.outline.label }}-db{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
    name: "{{ .Values.outline.label }}"
    # Distinct from outline.storage.pvc (used by the app's own file storage)
    # so the two can be repointed independently.
    pvc: "{{ .Values.storage.defaultVolumes.apps }}"
    credentials:
      username: admin
      password: password
    image: postgres:17
    label: "{{ .Values.outline.label }}-db"
    ports:
      http:
        name: pgsql
        targetPort: 5432
    replicasNb: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
  redis:
    image: redis:7-alpine
    label: "{{ .Values.outline.label }}-redis"
    ports:
      http:
        name: redis
        targetPort: 6379
    replicasNb: 1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  oidc:
    clientId: e86ca919127d25888251274807628b7a4efa79345fec380fd78e4ef3e4493dec
    clientSecret:
      plain: 5b384522d84b06b25416238f9d79ae6989ac10c81e00217e07c5153c34c1812c
      hashed: "$argon2id$v=19$m=65536,t=3,p=4$ZpeRbwdDPPMXHoqmLYQiyg$jqRM6FQI481hJMb4uL/VUoEpu0X/B2bGoE8mOX5OJVQ"
    displayName: Authelia
  sync:
    enable: true
    # No-op until apiToken is set per env (created by an admin in Outline:
    # Settings -> API -> New token). The CronJob template gates on it.
    apiToken: ""
    schedule: "23 4 * * *"
    gitImage: alpine/git:1e6b3f5
    image: python:3.12-alpine
    # SSH private key paired with the read-only deploy key on
    # platypod/infra-as-code (repos marked `private` clone over SSH with
    # it). Per-env override, like apiToken; empty = private repos skipped.
    deployKey: ""
    repos:
    - name: platypod
      url: https://github.com/platypod/platypod.git
      branch: main
      collection: "git: platypod"
      paths:
      - README.md
    - name: infra
      url: git@github.com:platypod/infra-as-code.git
      branch: main
      collection: "git: infra"
      private: true
      paths:
      - README.md
      - docs
    - name: stack
      url: https://github.com/platypod/stack.git
      # `main` = what is actually deployed to prod, matching every other repo
      # here. This said `dev` until 2026-09-01, left over from the retired dev
      # *cluster* branch; when that branch was deleted (2026-08-24, the
      # dev -> local rename) this clone started failing, and because the init
      # container clones all repos sequentially and aborts on the first
      # failure, it took the whole Outline sync down with it -- all 9 repos,
      # for 9 days, with nothing surfacing it. Note `dev` exists again since
      # 2026-09-01, but it now means local's deploy branch (docs/branching.md)
      # -- pointing the wiki at it would publish docs for changes not yet
      # promoted to prod.
      branch: main
      collection: "git: stack"
      paths:
      - README.md
      - docs
      - src
    - name: unbegotten
      url: https://github.com/platypod/unbegotten.git
      branch: main
      collection: "git: unbegotten"
      paths:
      - README.md
      - docs
    - name: cyber-chef
      url: https://github.com/platypod/cyber-chef.git
      branch: main
      collection: "git: images"
      rooted: true
      paths:
      - README.md
    - name: mediarvester
      url: https://github.com/platypod/mediarvester.git
      branch: main
      collection: "git: images"
      rooted: true
      paths:
      - README.md
    - name: pokeclicker
      url: https://github.com/platypod/pokeclicker.git
      branch: main
      collection: "git: images"
      rooted: true
      paths:
      - README.md
    - name: prompt-meter
      url: https://github.com/platypod/prompt-meter.git
      branch: main
      collection: "git: images"
      rooted: true
      paths:
      - README.md
    - name: transmission-exporter
      url: https://github.com/platypod/transmission-exporter.git
      branch: main
      collection: "git: images"
      rooted: true
      paths:
      - README.md
  ports:
    http:
      name: http
      targetPort: 3000
  storage:
    pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 448Mi
    limits:
      memory: 768Mi

whoami:
  image: traefik/whoami:v1.12.0
  ports:
    http:
      name: whoami-http
      targetPort: 80
  replicasNb: 2
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi

wikijs:
  image: ghcr.io/requarks/wiki:2.5.314
  database:
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.wikijs.label }}-db{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
    name: "{{ .Values.wikijs.label }}"
    credentials:
      username: admin
      password: password
    image: postgres:17
    label: "{{ .Values.wikijs.label }}-db"
    ports:
      http:
        name: pgsql
        targetPort: 5432
    replicasNb: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
  # Wiki.js v2 configures auth strategies in its admin UI / DB, NOT via env.
  # These OIDC credentials are pre-provisioned in Authelia; paste them into
  # Wiki.js > Administration > Authentication > add "Generic OpenID Connect".
  oidc:
    clientId: 5fc8d860b8ed729d50be5904a6ef171a6bae31ee584703577ac4d0fdf8f5d840
    clientSecret:
      plain: 318c61c011d3c6e12949167a4c9c81b2acf6dbc5d74654bbccc11e5af8e04c27
      hashed: $argon2id$v=19$m=65536,t=3,p=4$XQL1zU2YSQzNSDCf5rLCeA$OkgBXbLISt8tQLKa6lQNAA905GKKSnpZaTSa6kdX7B8
    # The wikijs-oidc-seed hook Job seeds the OIDC strategy with key='authelia',
    # and Wiki.js derives the callback as $${host}/login/$${key}/callback — so this
    # redirect URI is deterministic.
    redirectUri: "https://{{ tpl .Values.wikijs.host . }}{{ .Values.k8s.names.urls.port }}/login/authelia/callback"
  ports:
    http:
      name: http
      targetPort: 3000
  storage:
    pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  # Post-install/upgrade hook Job that seeds the OIDC strategy then rolls Wiki.js
  # so it reloads strategies. kubectlImage is the official k8s-published image.
  seed:
    kubectlImage: registry.k8s.io/kubectl:v1.34.0
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
