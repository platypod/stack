jellyswarrm:
  enable: false
  label: jellyswarrm
  # Own dedicated hostname — does NOT take over jellyfin.<domain> anymore.
  # It used to (hardcoded to reuse the "jellyfin" segment) so real users would
  # see no URL change; reverted after it broke real-user sessions in
  # production (a jellyswarrm-side bug: session/mapping race when the same
  # physical user logs in from multiple clients under different username
  # casing — see stack/docs/media/jellyswarrm.md). Not in the path of real
  # traffic until that's actually fixed/worked around; reachable here only for
  # the benchmark comparison itself.
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.jellyswarrm.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: ghcr.io/llukas22/jellyswarrm:latest
  credentials:
    username: admin
    password: password
  ports:
    http:
      name: jellyswarrm
      targetPort: 3000
  # Local (non-NFS) volume for its sqlite db (jellyswarrm.db) — same reasoning
  # as every other SQLite app config dir in this stack (see stack/CLAUDE.md).
  pvc: "{{ .Values.storage.defaultVolumes.config }}"
  # Redirect = client streams directly from whichever backend is chosen
  # (isolates each backend's own direct-play performance — the comparison this
  # deployment exists for). Proxy = stream bytes also flow through jellyswarrm,
  # adding it to the measured path. The upstream default (when omitted) is
  # actually Proxy, despite docs/config.md claiming Redirect — see config.rs's
  # default_media_streaming_mode(); set explicitly here either way.
  streamingMode: Redirect
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 192Mi
