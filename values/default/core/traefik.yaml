traefik:
  domain: example.com
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.traefik.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image:
    registry: docker.io/
    namespace: ""
    repository: traefik
    tag: v3.7.5
  label: traefik
  dashboardLabel: traefik-dashboard
  logging:
    format: json
    level: ERROR
  ports:
    dashboard:
      # name has to be traefik, see https://doc.traefik.io/traefik/operations/api/#insecure
      name: traefik
      port: 9999
      targetPort: 9999
    http:
      name: http
      port: 80
      targetPort: 80
      nodePort: 30680
    https:
      name: https
      port: 443
      targetPort: 443
      nodePort: 30679
  replicasNb: 1
  # Bind the entrypoints on the node itself (hostNetwork) instead of taking a
  # LoadBalancer VIP. Use this when the cluster has no load balancer to hand and
  # the node is already on the LAN — the router then forwards to the node IP.
  #
  # It is also the only workable option when the LAN-facing node is a control
  # plane: Kubernetes labels those node.kubernetes.io/exclude-from-external-load-balancers,
  # MetalLB honours it and refuses to announce, and Talos re-applies the label
  # from a NodeLabelSpec after every reboot. See infra/docs/baremetal-cp-migration.md.
  #
  # When true, loadBalancerIP is ignored and the Service becomes ClusterIP.
  hostNetwork: false
  loadBalancerIP: ""   # set per env. Ignored when hostNetwork is true.
  # The address Traefik answers on from the LAN, used for AdGuard's
  # "*.<domain>" rewrite so internal clients don't hairpin through the router.
  # Under hostNetwork set this to the node IP; otherwise leave empty and the
  # rewrite falls back to loadBalancerIP.
  lanAddress: ""
  # Pin the pod to specific node(s).
  # With hostNetwork: required, because the entrypoints only exist on the node
  # the pod lands on — that must be the node the router forwards to.
  # With a LoadBalancer: also required in prod, because the Service is
  # externalTrafficPolicy=Local, so MetalLB announces the VIP from whichever node
  # runs this pod, and the VIP must be L2-adjacent to it.
  # Empty = no constraint (dev, single node).
  nodeSelector: {}
  resolverName: letsencrypt
  tls:
    selfSigned: false
    wildcard: false
    secretName: ""
  storage:
    pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  # CPU: request only (no limit) — avoids throttling. Memory: request≈limit.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
