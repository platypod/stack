{{- if .Values.observability.scopeShim.enable }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.scopeShim.scriptConfigMap }}{{ .Values.k8s.names.configMaps.suffix }}
data:
  # Traefik ForwardAuth policy decision point. Maps an authenticated Grafana user
  # to the datasource scope headers, deriving admin-ness live from LLDAP. Pure
  # stdlib (no pip). See docs/observability/dashboard-multitenancy.md.
  shim.py: |
    import json, os, re, sys, threading, time, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    LLDAP    = os.environ["LLDAP_URL"]
    USER     = os.environ["LLDAP_USER"]
    PASS     = os.environ["LLDAP_PASS"]
    UPSTREAM = os.environ["UPSTREAM"].rstrip("/")
    # "logs" or "metrics" — see deployment.yaml. Only the logs instance owns
    # X-Scope-OrgID (Loki tenant). Metrics tenancy is a coarse, static
    # theme-split (ai/anonymous) set on the datasource itself and passed
    # through prom-label-proxy untouched — this shim only does per-user
    # `owner` label isolation for metrics, not per-user tenants.
    INSTANCE = os.environ.get("INSTANCE_NAME", "")
    # Comma-separated -- any one of these forwarded/looked-up groups grants
    # admin scope. Lets the stack point this at grafana_admin/dev_admin/admins
    # (see security.accessGroups in apps/base/values/security.yaml) without this script
    # knowing those names are related; it just checks for overlap.
    ADMIN_GROUPS = {g.strip() for g in os.environ.get("ADMIN_GROUPS", "admins").split(",") if g.strip()}
    HEADER  = os.environ.get("USER_HEADER", "X-Grafana-User").lower()
    PREFIX  = os.environ.get("TENANT_PREFIX", "claude-")
    SHARED_OWNER = os.environ.get("SHARED_OWNER", "_shared")
    # Shared secret Grafana attaches as a custom datasource header. The shim only
    # trusts X-Grafana-User on requests carrying it — so a rogue in-cluster pod
    # can't forge an identity even where NetworkPolicy isn't enforced (flannel).
    SECRET  = os.environ.get("SHIM_SECRET", "")
    SECRET_HEADER = os.environ.get("SHIM_SECRET_HEADER", "X-Shim-Auth")
    SHARED  = [t for t in os.environ.get("SHARED_TENANTS", "").split("|") if t]
    TTL     = int(os.environ.get("CACHE_TTL", "30"))
    PORT    = int(os.environ.get("PORT", "8080"))

    class UserNotFound(Exception):
        pass

    _lock  = threading.Lock()
    _token = {"v": None}
    _gcache = {}   # user -> (groups, expires)
    _ucache = {"v": None, "exp": 0}

    def _http(method, path, data=None, token=None):
        body = json.dumps(data).encode() if data is not None else None
        h = {"Content-Type": "application/json"}
        if token:
            h["Authorization"] = "Bearer " + token
        req = urllib.request.Request(LLDAP + path, data=body, headers=h, method=method)
        with urllib.request.urlopen(req, timeout=5) as resp:
            return json.loads(resp.read())

    def _login():
        return _http("POST", "/auth/simple/login", {"username": USER, "password": PASS})["token"]

    def _gql(query):
        # Re-login once on auth failure (token valid ~1 day; refresh transparently).
        for attempt in (1, 2):
            tok = _token["v"]
            if tok is None:
                tok = _token["v"] = _login()
            try:
                r = _http("POST", "/api/graphql", {"query": query}, tok)
                if "errors" in r:
                    raise RuntimeError(r["errors"])
                return r["data"]
            except urllib.error.HTTPError as e:
                if e.code in (401, 403) and attempt == 1:
                    _token["v"] = None
                    continue
                raise

    def groups_of(user):
        now = time.time()
        with _lock:
            hit = _gcache.get(user)
            if hit and hit[1] > now:
                return hit[0]
        q = '{ user(userId: %s) { groups { displayName } } }' % json.dumps(user)
        try:
            data = _gql(q)
        except RuntimeError as e:
            # LLDAP returns 200 + {errors:[{message:"Entity not found"}]} for an
            # unknown user. An OIDC-authenticated user always exists, so this is
            # anomalous → deny (fail closed), don't invent a scope.
            if "not found" in str(e).lower():
                raise UserNotFound(user)
            raise
        grps = [g["displayName"] for g in (data.get("user") or {}).get("groups", [])]
        with _lock:
            _gcache[user] = (grps, now + TTL)
        return grps

    def all_users():
        now = time.time()
        with _lock:
            if _ucache["v"] is not None and _ucache["exp"] > now:
                return _ucache["v"]
        ids = [u["id"] for u in _gql("{ users { id } }")["users"]]
        with _lock:
            _ucache["v"] = ids
            _ucache["exp"] = now + TTL
        return ids

    def tenant_id(user):
        slug = re.sub(r"[^a-z0-9-]+", "-", user.lower()).strip("-")
        return PREFIX + slug

    def scope_for(user):
        is_admin = not ADMIN_GROUPS.isdisjoint(groups_of(user))
        if is_admin:
            # See everything. owner ".+" matches any non-empty owner (every series
            # carries one — personal=username, shared infra=SHARED_OWNER); Loki
            # reads every tenant. prom-label-proxy rejects empty-matching regexes,
            # which is why we never use ".*"/"^$".
            tenants = SHARED + [tenant_id(u) for u in all_users()]
            return ".+", "|".join(dict.fromkeys(tenants))
        # See own series + shared infra (SHARED_OWNER); own Loki tenant only.
        # Case-insensitive: owner values that come from a source with its own
        # identity casing (e.g. Jellyfin profile names) won't always match the
        # authenticated (LLDAP-cased) username byte-for-byte — a Jellyfin
        # profile "Reivi" vs Authelia login "reivi" made her own data invisible
        # to everyone, herself included, until this was added. prom-label-proxy
        # forwards (?i) to Go's RE2, which supports it as an inline flag.
        owner = "(?i)^(" + re.escape(user) + "|" + re.escape(SHARED_OWNER) + ")$"
        return owner, tenant_id(user)

    # Hop-by-hop headers (+ ones we recompute) not forwarded verbatim.
    HOP = {"connection", "keep-alive", "proxy-authenticate", "proxy-authorization",
           "te", "trailers", "transfer-encoding", "upgrade", "content-length", "host"}

    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _send(self, code, body=b""):
            self.send_response(code)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            if body and self.command != "HEAD":
                self.wfile.write(body)

        # Scoping reverse-proxy: decide scope from the authenticated user, inject
        # X-Owner / X-Scope-OrgID (overwriting any client value), forward upstream.
        def handle_req(self):
            if self.path == "/healthz":
                return self._send(200, b"ok")
            if SECRET and self.headers.get(SECRET_HEADER) != SECRET:
                return self._send(403, b"forbidden")
            user = self.headers.get(HEADER)
            if not user:
                return self._send(403, b"no user")
            try:
                owner, tenant = scope_for(user)
            except UserNotFound:
                return self._send(403, b"unknown user")
            except Exception as e:
                sys.stderr.write("scope error for %r: %r\n" % (user, e))
                return self._send(502, b"lldap error")

            length = int(self.headers.get("Content-Length") or 0)
            body = self.rfile.read(length) if length else None
            req = urllib.request.Request(UPSTREAM + self.path, data=body, method=self.command)
            for k, v in self.headers.items():
                if k.lower() not in HOP:
                    req.add_header(k, v)
            req.add_header("X-Owner", owner)          # consumed by prom-label-proxy
            if INSTANCE == "logs":
                req.add_header("X-Scope-OrgID", tenant)   # consumed by Loki
            # else: leave whatever X-Scope-OrgID the datasource itself set
            # (the static "ai" or "anonymous" theme tenant) — pass through as-is.
            try:
                resp = urllib.request.urlopen(req, timeout=60)
                status, rheaders, data = resp.getcode(), resp.getheaders(), resp.read()
            except urllib.error.HTTPError as e:
                status, rheaders, data = e.code, list(e.headers.items()), e.read()
            except Exception as e:
                sys.stderr.write("upstream error: %r\n" % (e,))
                return self._send(502, b"upstream error")
            self.send_response(status)
            for k, v in rheaders:
                if k.lower() not in HOP:
                    self.send_header(k, v)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            if self.command != "HEAD":
                self.wfile.write(data)

        do_GET = do_POST = do_HEAD = do_PUT = do_DELETE = handle_req

        def log_message(self, *a):
            pass

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", PORT), H).serve_forever()
{{- end }}
