# Implementation tier — observability module. Registry fields for the
# sub-services with a `host` (dashboard/logs/metrics/traces/profiles) plus
# the module's own `enable` gate live in values/default/registry.yaml
# instead — see the comment there for which sub-services don't (no host of
# their own, stay here in full).

observability:
  mounts:
    containers: /var/lib/docker/containers
  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  retention: 8736h

  dashboard:
    image: grafana/grafana-oss:13.0.2
    resources:
      requests:
        cpu: 100m
        # Grafana 13 OSS builds an in-memory bleve search index over all
        # provisioned dashboards at startup; 384Mi got OOMKilled (exit 137).
        # limit (below) already carries that fix — request bumped separately
        # since observed steady-state usage runs well above the old 256Mi.
        memory: 448Mi
      limits:
        memory: 768Mi
    oidc:
      clientId: kyqP5Y1daxOz8lMlmYOyOWuq7rbmyUQO34NUp1k3FKZxh55v3tP05pVVZRIwSTnC
      clientSecret:
        plain: B9YxVjgrhwekgnE8sv1S3eW1l2f1NALIOOVeGEvre4cEzG-XwWY0soryKC1geV0DE2a_AT4Q
        hashed: $pbkdf2-sha512$310000$EBnY.k1tDa4lDB0P5cCLXw$MauDGOsp5dNN6YFn1cnYUe8TSdNzf6aReO8Tvo3ABC0VxzjR75qcS0BtkN5dm8jnpPd0snA7nSTOlR.YQyq3Ig
    ports:
      http:
        name: http
        targetPort: 3000
    logging:
      level: info
      format: json

  logs:
    # Loki tenant for logs that don't set X-Scope-OrgID (native Claude telemetry,
    # future k8s pod logs). Admins federate it (scopeShim.sharedTenants).
    defaultTenant: "_shared"
    image: grafana/loki:3.7.2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        # Bumped 512Mi -> 768Mi (auth_enabled + multi-tenancy overhead) ->
        # 1536Mi: still OOMKilling every ~8min after a full prompt-meter
        # --reset backfill (33k+ redacted transcript lines, ~90 days of daily
        # index tables to load/compact) pushed real content volume well past
        # what 768Mi could hold. Request stays 256Mi — only raising the burst
        # ceiling, not what's reserved at scheduling time.
        memory: 1536Mi
    ports:
      grpc:
        name: grpc
        targetPort: 9096
      http:
        name: http
        targetPort: 3100
    logging:
      level: info

  metrics:
    # Grafana Mimir, monolithic mode (-target=all), filesystem storage on the
    # apps PVC. Replaced VictoriaMetrics 2026-06: Mimir ingests OTLP natively
    # and normalizes OTel metric names (dots -> underscores), so dashboards
    # query e.g. system_cpu_time, not {__name__="system.cpu.time"}.
    image: grafana/mimir:3.1.0
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    ports:
      http:
        name: http
        targetPort: 8080
    logging:
      format: json
      level: info
    retention: 1y

  otelCollector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    label: opentelemetry-collector
    logging:
      # Was left on debug from earlier troubleshooting — every collector,
      # gateway included, dumps a full datapoint/transform trace per metric at
      # this level. Under a large backfill it's enough log I/O to make the
      # gateway miss its own export deadlines back to clients. Every other
      # observability component here already defaults to info.
      level: info
      format: json
    gateway:
      host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.otelCollector.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      # Dedicated host for the OTLP/gRPC ingress (h2c → port 4317), guarded by the
      # Basic-auth Authelia endpoint. Used by non-interactive clients (e.g. Claude
      # Code telemetry) that send Authorization: Basic, not a session cookie.
      grpcHost: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.otelCollector.label }}-grpc{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      label: "{{ .Values.observability.otelCollector.label }}-gateway"
      # Bumped from 256Mi/512Mi: the gateway was OOMKilling repeatedly (~5x/24h)
      # under normal load (jellyfin/k8s_cluster/traefik/authelia/fx scrapes +
      # AI metrics/logs/traces all funnel through this one pod), losing
      # in-flight metric exports while already-flushed logs survived. See
      # memory_limiter sizing in gateway/config-map.yaml — its thresholds must
      # stay comfortably under these.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      ports:
        grpc:
          name: otel-grpc
          targetPort: 4317
        http:
          name: otel-http
          targetPort: 4318
    collectors:
      label: "{{ .Values.observability.otelCollector.label }}-collector"
      # Node-level collectors mount the host root (hostPath /) and run as root to
      # read host metrics, which requires `privileged` PodSecurity. To avoid
      # relaxing PodSecurity for the whole platypod namespace (which runs many
      # internet-facing apps that process untrusted content), they live in their
      # own dedicated namespace labelled enforce=privileged. See the Namespace
      # manifest in templates/observability/nodes-collectors/namespace.yaml.
      namespace: "{{ .Values.k8s.namespace }}--privileged"
      resources:
        requests:
          cpu: 200m
          memory: 400Mi
        limits:
          cpu: 1
          memory: 1Gi
      ports:
        grpc:
          name: otel-grpc
          targetPort: 4317
        http:
          name: otel-http
          targetPort: 4318
    receivers:
      jellyfinCustom:
        enable: true
        logLevel: info
      jellyfinNative:
        enable: false
      synologySnmp:
        enable: false
        url: udp://XXX.XXX.XXX.XXX:161
        credentials:
          username: <username>
          password: <password>
        logLevel: info

  prometheusJsonExporter:
    label: prometheus-json-exporter
    image: quay.io/prometheuscommunity/json-exporter:v0.7.0
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    ports:
      http:
        name: http
        targetPort: 9115

  prometheusSnmpExporter:
    label: prometheus-snmp-exporter
    image: prom/snmp-exporter:v0.29.0
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    ports:
      http:
        name: http
        targetPort: 9116

  profiles:
    # Continuous-profiling backend for mediarvester's pyroscope-io client (see
    # mediarvester/src/services/telemetry.py) -- not OTLP, a deliberate
    # stopgap: OTel's own profiling signal is still alpha with no usable
    # Python SDK. Single-binary mode (`target: all`), local filesystem
    # storage on the shared apps PVC (same pattern as tempo.yaml) -- this is
    # supplementary, high-churn telemetry data, not worth NFS/replication.
    image: grafana/pyroscope:2.2.1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    ports:
      http:
        name: http
        targetPort: 4040

  # ForwardAuth policy decision point for per-user dashboard data isolation.
  # Reads X-Grafana-User, looks the user's groups up in LLDAP, and returns the
  # scope headers Traefik copies onto the datasource request:
  #   X-Owner       → prom-label-proxy matcher for Mimir (label isolation)
  #   X-Scope-OrgID → Loki tenant (tenant isolation)
  # See docs/observability/dashboard-multitenancy.md.
  scopeShim:
    # One shim Deployment per backend (same script, different upstream): metrics
    # → prom-label-proxy, logs → Loki. Each is a ClusterIP reverse-proxy.
    instances:
      - name: metrics
        label: grafana-scope-shim
        upstreamLabel: prom-label-proxy
        upstreamPort: 8081
      - name: logs
        label: grafana-scope-shim-logs
        upstreamLabel: loki
        upstreamPort: 3100
    # Route the Grafana METRICS datasource through the shim (per-user `owner`
    # scoping). Set false to query Mimir directly — e.g. on a cluster where all
    # Grafana users are admins, or to keep pre-`owner` history visible. Logs are
    # tenant-isolated either way.
    scopeMetrics: true
    # Shared script ConfigMap name (both instances mount the same shim.py).
    scriptConfigMap: grafana-scope-shim
    # Pure-stdlib Python: the logic is ConfigMap-mounted, no custom image build.
    image: python:3-alpine
    lldap:
      # Must match the grafana-authz seed account in security/lldap.yaml
      # (member of lldap_strict_readonly: read-all, no write).
      user: grafana-authz
      # Placeholder — must match the grafana-authz seed user's password in
      # values/default/security/lldap.yaml. Real value comes from
      # values/<env>/values.yaml (gitignored).
      password: verySecretMuchSecureNeverGonnaBeGuessedGrafanaAuthzPassword
    # Shared secret Grafana sends as a custom datasource header; the shim rejects
    # requests without it. CNI-independent lockdown (flannel doesn't enforce
    # NetworkPolicy). Override per-env if desired.
    secret: "scope-shim-shared-secret"
    secretHeader: "X-Shim-Auth"
    # Admin-granting groups are generated (observability.grafanaAdminGroups in
    # src/observability/templates/_helpers.tpl) off
    # values/default/security/access-groups.yaml — no adminGroup value needed here.
    # Header Grafana sends when [dataproxy] send_user_header = true.
    userHeader: X-Grafana-User
    # Owner label value stamped on all non-personal (shared/infra) metrics, so
    # every series carries an `owner` and prom-label-proxy never needs an
    # empty-matching regex (which it rejects). Non-admins match own + this.
    sharedOwner: "_shared"
    # Loki tenant naming: per-user transcripts live in "<prefix><user>".
    tenantPrefix: "claude-"
    # Non-per-user Loki tenants admins should also see (pipe-joined into the
    # federated read alongside every claude-<user>). Pipe-separated if several.
    # "_shared" is the gateway's default tenant for untagged logs (native Claude
    # telemetry, future k8s pod logs).
    sharedTenants: "_shared"
    # Cache TTL (seconds) for per-user group lookups and the user list.
    cacheTtlSeconds: 30
    ports:
      http:
        name: http
        targetPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

  # Ingest-side ForwardAuth: enforces that an authenticated writer may only claim
  # its own Loki tenant (x-scope-orgid == claude-<slug(Remote-User)>). Chained
  # after authelia-basic on the OTLP/gRPC ingress. See dashboard-multitenancy.md.
  tenantGuard:
    label: tenant-guard
    image: python:3-alpine
    tenantPrefix: "claude-"   # must match the shipper's tenant + scopeShim
    # Fixed Mimir theme-tenants any authenticated writer may claim (not a
    # per-user privacy boundary — see mimir/config-map.yaml). Pipe-separated.
    staticTenants: "ai"
    ports:
      http:
        name: http
        targetPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

  # prom-label-proxy: rewrites every PromQL/label query to inject the `owner`
  # matcher supplied (as a regex) by the scope shim via the X-Owner header.
  # Fronts Mimir so the Grafana metrics datasource is per-user scoped.
  labelProxy:
    label: prom-label-proxy
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.13.0
    enforceLabel: owner
    headerName: X-Owner
    ports:
      http:
        name: http
        targetPort: 8081
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

  traces:
    # Pinned to the 2.x line: Tempo 3.0 is an architectural rework (compactor/
    # ingester blocks removed, Kafka-backed metrics-generator) requiring a real
    # config migration — not a drop-in bump. Revisit deliberately.
    image: grafana/tempo:2.10.6
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        # Was 256Mi, then 512Mi -- both OOMKilled once OTLP trace ingestion
        # actually started working (2026-08-21 receiver fix) and real trace
        # volume from mediarvester hit it, 531 restarts/47h. Same pattern as
        # the OTel gateway's 512Mi->1Gi bump (otel-collectors.yaml). Paired
        # with dropping the local-blocks metrics-generator processor -- see
        # docs/observability/tempo.md.
        memory: 1Gi
    ports:
      grpc:
        name: grpc
        targetPort: 9095
      http:
        name: http
        targetPort: 80
      # Dedicated OTLP/HTTP ingest port. Tempo's own `server.http_listen_port`
      # (the `http` port above) only serves the query-frontend/API -- it does
      # NOT double as an OTLP receiver unless `distributor.receivers` is
      # explicitly configured, which it wasn't until 2026-08-21 (discovered
      # during the mediarvester telemetry rollout: the gateway collector's
      # otlphttp/tempo exporter had been 404ing against port 80/v1/traces since
      # this module's original deployment -- traces were never actually
      # reaching Tempo).
      otlpHttp:
        name: otlp-http
        targetPort: 4318
    logging:
      level: info

uptimeKuma:
  # Pinned to the 1.23.x stable line. 2.x is a beta that dropped the Socket.io
  # API the seed Job (uptime-kuma-api) relies on — see docs/services.md.
  image: louislam/uptime-kuma:1.23.17
  ports:
    http:
      name: uk-http
      targetPort: 3001
  # SQLite DB → dedicated local volume (NFS can't host SQLite WAL).
  pvc: "{{ .Values.storage.defaultVolumes.config }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # First-boot admin, created by the seed Job. Override per env if desired.
  credentials:
    username: admin
    password: password
  # Monitors seeded by the post-install/upgrade Job. Each is an in-cluster HTTP
  # check against the service's ClusterIP (bypasses Authelia, so we see the real
  # app health, not a 302 to the login page). Idempotent: matched by name.
  # `url` is tpl'd. Disabled services should be removed/commented here.
  # `enable` (tpl'd by the setup Job) gates a monitor on its service's enable flag:
  # disabled services are pruned, not monitored. Always-on infra omits `enable`.
  monitors:
    - { name: "Homepage",     url: "http://homepage:3000" }
    - { name: "Traefik",      url: "http://traefik-dashboard:9999" }
    - { name: "Authelia",     url: "http://authelia:9091" }
    - { name: "LLDAP",        url: "http://lldap:17170" }
    - { name: "Grafana",      url: "http://grafana:3000" }
    - { name: "Mimir",        url: "http://mimir:8080/ready" }
    - { name: "Loki",         url: "http://loki:3100/ready" }
    - { name: "Tempo",        url: "http://tempo:80/ready" }
    - { name: "Pyroscope",    url: "http://pyroscope:4040/ready" }
    - { name: "AdGuard",      url: "http://adguard:80",          enable: "{{ .Values.adguard.enable }}" }
    - { name: "BookStack",    url: "http://bookstack:80",        enable: "{{ .Values.bookstack.enable }}" }
    - { name: "Wiki.js",      url: "http://wikijs:3000",         enable: "{{ .Values.wikijs.enable }}" }
    - { name: "Outline",      url: "http://outline:3000",        enable: "{{ .Values.outline.enable }}" }
    - { name: "Vaultwarden",  url: "http://vaultwarden:80/alive", enable: "{{ .Values.vaultwarden.enable }}" }
    - { name: "IT-Tools",     url: "http://it-tools:80",         enable: "{{ .Values.itTools.enable }}" }
    - { name: "CyberChef",    url: "http://cyber-chef:80",       enable: "{{ .Values.cyberChef.enable }}" }
    - { name: "whoami",       url: "http://whoami:80",           enable: "{{ .Values.whoami.enable }}" }
    - { name: "Jellyfin",     url: "http://jellyfin:8096/health", enable: "{{ .Values.jellyfin.enable }}" }
    - { name: "Jellyseerr",   url: "http://jellyseerr:5055",     enable: "{{ .Values.jellyseerr.enable }}" }
    - { name: "Radarr",       url: "http://radarr:7878",         enable: "{{ .Values.radarr.enable }}" }
    - { name: "Sonarr",       url: "http://sonarr:8989",         enable: "{{ .Values.sonarr.enable }}" }
    - { name: "Readarr",      url: "http://readarr:8787",        enable: "{{ .Values.readarr.enable }}" }
    - { name: "Prowlarr",     url: "http://prowlarr:9696",       enable: "{{ .Values.prowlarr.enable }}" }
    - { name: "Bazarr",       url: "http://bazarr:6767",         enable: "{{ .Values.bazarr.enable }}" }
    - { name: "Mediarvester", url: "http://mediarvester:8080",   enable: "{{ .Values.mediarvester.enable }}" }
    - { name: "Reclaimerr",   url: "http://reclaimerr:8000",     enable: "{{ .Values.reclaimerr.enable }}" }
    - { name: "Komga",        url: "http://komga:25600",         enable: "{{ .Values.komga.enable }}" }
    - { name: "Kavita",       url: "http://kavita:5000",         enable: "{{ .Values.kavita.enable }}" }
    - { name: "Suwayomi",     url: "http://suwayomi:4567",       enable: "{{ .Values.suwayomi.enable }}" }
    - { name: "Flaresolverr", url: "http://flaresolverr:8191",   enable: "{{ .Values.flaresolverr.enable }}" }
    - { name: "Transmission", url: "http://transmission:9091",   enable: "{{ .Values.transmission.enable }}" }
    - { name: "RomM",         url: "http://rommapp:8080",        enable: "{{ .Values.rommapp.enable }}" }
    - { name: "PokeClicker",  url: "http://pokeclicker:3000",    enable: "{{ .Values.pokeclicker.enable }}" }
    - { name: "Unbegotten",   url: "http://unbegotten:80",       enable: "{{ .Values.unbegotten.enable }}" }
