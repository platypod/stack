{{- /*
  SSH deploy key for outline-sync's private-repo clones (read-only key on
  platypod/infra-as-code). Only rendered when a per-env key is provided;
  without it, private repos are simply skipped by the sync.
*/ -}}
{{- if and .Values.outline.enable .Values.outline.sync.enable .Values.outline.sync.deployKey }}
apiVersion: v1
kind: Secret

metadata:
  name: outline-sync-ssh

stringData:
  key: |
    {{- .Values.outline.sync.deployKey | nindent 4 }}
{{- end }}
