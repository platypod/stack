{{- if .Values.observability.otelCollector.collectors.enable }}
{{- /*
  Node collectors run in their own privileged namespace, so they need their own
  ServiceAccount there. The shared ClusterRole (k8sattributes → read pods/nodes)
  is bound to this SA via an extra subject in the cluster-role-binding.
*/ -}}
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ .Values.k8s.names.serviceAccounts.prefix }}{{ tpl .Values.observability.otelCollector.collectors.label . }}{{ .Values.k8s.names.serviceAccounts.suffix }}
  namespace: {{ tpl .Values.observability.otelCollector.collectors.namespace . }}
{{- end }}
