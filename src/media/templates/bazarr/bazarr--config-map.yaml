{{- if .Values.bazarr.enabled }}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.bazarr.label }}{{ .Values.k8s.names.configMaps.suffix }}

data:
  # Minimal seed — Bazarr merges this with its defaults on first start.
  # Only auth.apikey needs to be pre-set for a stable, known key.
  config.yaml: |
    ---
    auth:
      apikey: {{ .Values.bazarr.apiKey }}
      password: ''
      type: null
      username: ''
{{- end }}
