lldap:
  label: lldap
  image: lldap/lldap:v0.6.3-alpine
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.lldap.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  # Internal LDAP base DN — environment-independent, not tied to the public domain.
  baseDn: dc=platypod,dc=home
  # LLDAP always exposes its bind user as uid=admin,ou=people,<baseDn>.
  adminUser: admin
  # Placeholder — real value comes from values/<env>/values.yaml (gitignored)
  # or the SOPS-encrypted secrets repo. Guarded at render time in
  # src/security/templates/lldap/lldap--deployment.yaml.
  adminPassword: verySecretMuchSecureNeverGonnaBeGuessedAdminPassword
  # Placeholder — real value comes from values/<env>/values.yaml (gitignored)
  # or the SOPS-encrypted secrets repo. Guarded at render time in
  # src/security/templates/lldap/lldap--deployment.yaml.
  jwtSecret: verySecretMuchSecureNeverGonnaBeGuessedJwtSecret
  database:
    image: postgres:17
    name: "{{ .Values.lldap.label }}"
    label: "{{ .Values.lldap.label }}-db"
    credentials:
      username: admin
      # Internal-only Postgres sidecar, not network-exposed — placeholder,
      # real value comes from values/<env>/values.yaml (gitignored).
      password: verySecretMuchSecureNeverGonnaBeGuessedLldapDbPassword
    ports:
      http:
        name: pgsql
        targetPort: 5432
    replicasNb: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
  ports:
    http:
      name: http
      targetPort: 17170
    ldap:
      name: ldap
      targetPort: 3890
  # LDAPS for clients outside the cluster (e.g. prod's host-native Jellyfin —
  # see docs/media/jellyfin-ldap.md). Routed through Traefik's "ldaps" TCP
  # entrypoint (see traefik.yaml), which terminates TLS with the same trusted
  # cert as everything else and forwards PLAINTEXT to this Service internally
  # — same edge-TLS/plaintext-inside pattern as every HTTPS-fronted app here.
  # LLDAP itself needs no TLS config; Traefik does all of it.
  ldaps:
    enable: false
  storage:
    pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  # Post-install/upgrade hook that pre-creates groups and users via the LLDAP
  # REST/GraphQL API. Idempotent: skips already-existing groups/users.
  # Passwords are only set on user creation — existing users keep theirs.
  # The built-in LLDAP 'admin' user is always skipped (its password comes from
  # the LLDAP_LDAP_USER_PASS env var, not this job).
  seed:
    image: python:3-alpine
    # Group list itself is generated (see security.allGroupNames in
    # stack/src/security/templates/_helpers.tpl) off the single source of
    # truth at values/default/security/access-groups.yaml — not hand-listed
    # here. Only per-user group MEMBERSHIP is declared below.
    users:
      - id: admin
        email: pl@ty.pod
        displayName: admini
        password: "{{ .Values.lldap.adminPassword }}"
        groups:
          - admins
      - id: dave
        email: dave.thedev@gmail.com
        displayName: dave
        # Placeholder — dev/local fixture user, real value per env if used.
        password: verySecretMuchSecureNeverGonnaBeGuessedDavePassword
        groups:
          - dev_user
          - otel_writer   # may ship his own telemetry (tenant claude-dave)
      - id: guest
        email: gues@ty.pod
        displayName: guesto
        # Placeholder — dev/local fixture user, real value per env if used.
        password: verySecretMuchSecureNeverGonnaBeGuessedGuestPassword
        groups: []
      # Non-interactive service account for OTLP/gRPC telemetry ingestion
      # (native Claude Code telemetry / non-human shippers). Member of
      # otel_writer so it keeps working through the ingest rule. It writes no
      # per-user tenant (no x-scope-orgid → lands in _shared), so the
      # tenant-guard lets it through. Remove once every shipper is a real per-user
      # account; until then it's the shared/CI path. See docs/observability/
      # dashboard-multitenancy.md.
      - id: otel-telemetry
        email: otel-telemetry@platypod.local
        displayName: OTEL Telemetry
        # Placeholder — real value comes from values/<env>/values.yaml (gitignored).
        password: verySecretMuchSecureNeverGonnaBeGuessedOtelTelemetryPassword
        groups:
          - otel_writer
      # Read-only service account for the Grafana datasource scope shim: looks up
      # any user's group membership (admins-or-not) to scope dashboard queries.
      # Member of lldap_strict_readonly → can read all users/groups, no write.
      # See docs/observability/dashboard-multitenancy.md.
      - id: grafana-authz
        email: grafana-authz@platypod.local
        displayName: Grafana Authz
        # Placeholder — must match values/default/observability/scope-shim.yaml
        # lldap.password. Real value comes from values/<env>/values.yaml.
        password: verySecretMuchSecureNeverGonnaBeGuessedGrafanaAuthzPassword
        groups:
          - lldap_strict_readonly
      # Read-only bind account for the Jellyfin LDAP-Auth plugin. Same
      # rationale as grafana-authz: a scoped bind, not the LLDAP admin.
      # See stack/docs/media/jellyfin-ldap.md.
      - id: jellyfin-ldap
        email: jellyfin-ldap@platypod.local
        displayName: Jellyfin LDAP
        # Placeholder — must match values/default/media/jellyfin.yaml
        # ldap.bindPassword. Real value comes from values/<env>/values.yaml.
        password: verySecretMuchSecureNeverGonnaBeGuessedJellyfinLdapPassword
        groups:
          - lldap_strict_readonly
  replicasNb: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
