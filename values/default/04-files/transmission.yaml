transmission:
  host: ${k8s.names.urls.prefix}${transmission.label}${k8s.names.urls.suffix}.${traefik.domain}
  image: lscr.io/linuxserver/transmission:latest
  label: transmission
  credentials:
    username: transmission
    password: transmission
  download:
    torrents: ${media.system.downloads.torrents}/${transmission.label}
    ongoing: ${media.system.downloads.ongoing}/${transmission.label}
    finished: ${media.system.downloads.finished}
  names:
    configMap: ${k8s.names.volumes.configMaps.prefix}${transmission.label}${k8s.names.volumes.configMaps.suffix}
    container: ${k8s.names.containers.prefix}${transmission.label}${k8s.names.containers.suffix}
    ingress: ${k8s.names.ingresses.prefix}${transmission.label}${k8s.names.ingresses.suffix}
    pod: ${k8s.names.pods.prefix}${transmission.label}${k8s.names.pods.suffix}
    service: ${k8s.names.services.prefix}${transmission.label}${k8s.names.services.suffix}
  ports:
    http:
      name: webui
      targetPort: 9091
    tcp:
      name: incoming-tcp
      port: 51413
      targetPort: 51413
      protocol: TCP
    udp:
      name: incoming-udp
      port: 51413
      targetPort: 51413
      protocol: UDP
  replicasNb: 1
