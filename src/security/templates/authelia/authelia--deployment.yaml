{{- $pod := print .Values.k8s.names.pods.prefix .Values.authelia.label .Values.k8s.names.pods.suffix }}
{{- $configMap := "config-map" }}
{{- $appVolume := "app-volume" }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.authelia.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/authelia/authelia--config-map.yaml") . | sha256sum }}
    spec:
      # Must tolerate the primary-node taint: this workload is pinned there
      # (local config volume / externalIP nodeSelector / auth co-location) and
      # has nowhere else to run. Without the toleration it is evicted with no
      # valid node and sits Pending.
      tolerations:
      - key: platypod.io/reserved
        operator: Equal
        value: primary
        effect: NoSchedule
      priorityClassName: platypod-critical
      # Prefer the primary node, where Traefik is pinned by its externalIP
      # nodeSelector. Traefik calls Authelia on EVERY authenticated request via
      # forwardAuth, so splitting them puts the hottest path in the stack across
      # a node boundary — LAN to vmnet — for no benefit. Preferred, not
      # required: if primary is full these must still schedule somewhere.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: platypod.io/node-class
                operator: In
                values: ["primary"]
      enableServiceLinks: false
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.authelia.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.authelia.image }}
        resources:
          {{- toYaml .Values.authelia.resources | nindent 10 }}
        ports:
        - name: {{ .Values.authelia.ports.http.name }}
          containerPort: {{ .Values.authelia.ports.http.targetPort }}
        - name: {{ .Values.authelia.ports.metrics.name }}
          containerPort: {{ .Values.authelia.ports.metrics.targetPort }}
        volumeMounts:
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: authelia/config
      initContainers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.authelia.label }}-init{{ .Values.k8s.names.containers.suffix }}
        image: busybox:1.37.0
        command: ['sh', '-c', '/setup.sh']
        volumeMounts:
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: authelia/config
        - mountPath: /setup.sh
          name: {{ $configMap }}
          subPath: setup.sh
        - mountPath: /configuration.yml
          name: {{ $configMap }}
          subPath: configuration.yml
      volumes:
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.authelia.storage.pvc . }}
      - name: {{ $configMap }}
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.authelia.label }}{{ .Values.k8s.names.configMaps.suffix }}
          defaultMode: 0500
