{{- $pod := print .Values.k8s.names.pods.prefix .Values.flaresolverr.label .Values.k8s.names.pods.suffix }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.flaresolverr.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.flaresolverr.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.flaresolverr.image }}
        resources:
          {{- toYaml .Values.flaresolverr.resources | nindent 10 }}
        ports:
        - name: {{ .Values.flaresolverr.ports.http.name }}
          containerPort: {{ .Values.flaresolverr.ports.http.targetPort }}
        env:
        - name: CAPTCHA_SOLVER
          value: {{ .Values.flaresolverr.captchaSolver }}
        - name: LOG_LEVEL
          value: {{ .Values.flaresolverr.log.level }}
        - name: LOG_HTML
          value: "{{ .Values.flaresolverr.log.html }}"
        - name: PROMETHEUS_ENABLED
          value: "{{ .Values.flaresolverr.prometheus.enabled }}"
        - name: PROMETHEUS_PORT
          value: "{{ .Values.flaresolverr.prometheus.port }}"
