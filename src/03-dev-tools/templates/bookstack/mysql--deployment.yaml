apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.bookstack.database.names.pod }}
  labels:
    app: {{ .Values.bookstack.database.names.pod }}

spec:
  replicas: {{ .Values.bookstack.database.replicasNb }}
  selector:
    matchLabels:
      app: {{ .Values.bookstack.database.names.pod }}
  template:
    metadata:
      labels:
        app: {{ .Values.bookstack.database.names.pod }}
    spec:
      containers:
      - name: {{ .Values.bookstack.database.names.container }}
        image: {{ .Values.bookstack.database.image }}
        ports:
        - name: {{ .Values.bookstack.database.ports.http.name }}
          containerPort: {{ .Values.bookstack.database.ports.http.targetPort }}
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "{{ .Values.bookstack.database.credentials.rootPassword }}"
        - name: MYSQL_USER
          value: "{{ .Values.bookstack.database.credentials.username }}"
        - name: MYSQL_PASSWORD
          value: "{{ .Values.bookstack.database.credentials.password }}"
        - name: MYSQL_DATABASE
          value: "{{ .Values.bookstack.database.name }}"
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: {{ .Values.bookstack.storage.pv }}
          subPath: apps/bookstack/db
      volumes:
      - name: {{ .Values.bookstack.storage.pv }}
        persistentVolumeClaim:
          claimName: {{ .Values.bookstack.storage.pvc }}
