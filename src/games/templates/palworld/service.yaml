{{- if .Values.palworld.enable }}
{{- $extIP := .Values.palworld.externalIP }}
apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.k8s.names.services.prefix }}{{ .Values.palworld.label }}{{ .Values.k8s.names.services.suffix }}

spec:
  {{- if not $extIP }}
  externalTrafficPolicy: Local
  {{- end }}
  ports:
  - protocol: UDP
    name: {{ .Values.palworld.ports.game.name }}
    port: {{ .Values.palworld.ports.game.port }}
    targetPort: {{ .Values.palworld.ports.game.targetPort }}
  - protocol: UDP
    name: {{ .Values.palworld.ports.query.name }}
    port: {{ .Values.palworld.ports.query.port }}
    targetPort: {{ .Values.palworld.ports.query.targetPort }}
  selector:
    app: {{ .Values.k8s.names.pods.prefix }}{{ .Values.palworld.label }}{{ .Values.k8s.names.pods.suffix }}
  {{- if $extIP }}
  # No MetalLB in prod: same externalIPs mechanism as traefik/adguard (see
  # traefik--service.yaml). kube-proxy DNATs traffic for $extIP on these ports
  # to the pod, so no LoadBalancer is needed.
  type: ClusterIP
  externalIPs:
    - {{ $extIP }}
  {{- else }}
  type: LoadBalancer
  {{- if .Values.palworld.loadBalancerIP }}
  loadBalancerIP: {{ .Values.palworld.loadBalancerIP }}
  {{- end }}
  {{- end }}
{{- end }}
