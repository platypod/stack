itTools:
  enable: true
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.itTools.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: corentinth/it-tools:latest
  label: it-tools
  ports:
    http:
      name: http
      targetPort: 80
  replicasNb: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi
