localStorage:
  persistentVolumes:
  - name: ${media.storage.pv}
    claim: ${media.storage.pvc}
    path: ${media.storage.path}
    capacityStorage: ${media.storage.capacityStorage}
    labels:
      pv: ${media.storage.pv}
      pvc: ${media.storage.pvc}
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - ${media.storage.node}
