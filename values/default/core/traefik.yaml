traefik:
  domain: example.com
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.traefik.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image:
    registry: docker.io/
    namespace: ""
    repository: traefik
    tag: v3.7.5
  label: traefik
  dashboardLabel: traefik-dashboard
  logging:
    format: common
    level: ERROR
  ports:
    dashboard:
      # name has to be traefik, see https://doc.traefik.io/traefik/operations/api/#insecure
      name: traefik
      port: 9999
      targetPort: 9999
    http:
      name: http
      port: 80
      targetPort: 80
      nodePort: 30680
    https:
      name: https
      port: 443
      targetPort: 443
      nodePort: 30679
  replicasNb: 1
  loadBalancerIP: ""   # set per env; used by Adguard DNS rewrite
  resolverName: letsencrypt
  tls:
    selfSigned: false
    wildcard: false
    secretName: ""
  storage:
    pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  # CPU: request only (no limit) — avoids throttling. Memory: request≈limit.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
