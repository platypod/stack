apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: {{ .Values.k8s.namespace }}--{{ .Values.k8s.names.roles.prefix }}{{ .Values.traefik.label }}{{ .Values.k8s.names.roles.suffix }}

rules:
  - apiGroups:
      - ""
    resources:
      - services
      - secrets
      - nodes
      # Traefik >= 3.2 watches ConfigMaps (kubernetesCRD provider); without
      # this the watch is forbidden and the provider loads ZERO IngressRoutes.
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
      - watch
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - update
  - apiGroups:
      - traefik.io
    resources:
      - middlewares
      - middlewaretcps
      - ingressroutes
      - traefikservices
      - ingressroutetcps
      - ingressrouteudps
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
    verbs:
      - get
      - list
      - watch
