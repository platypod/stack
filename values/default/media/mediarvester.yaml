mediarvester:
  enable: true
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.mediarvester.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: ghcr.io/platypod/mediarvester:v1.7.11
  label: mediarvester
  ports:
    http:
      name: http
      targetPort: 8080
  database:
    # SQLAlchemy async connection string to the shared media PostgreSQL.
    url: "postgresql+asyncpg://{{ .Values.database.serviceCredentials.mediarvester.username }}:{{ .Values.database.serviceCredentials.mediarvester.password }}@{{ .Values.k8s.names.services.prefix }}{{ .Values.database.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.database.ports.http.targetPort }}/{{ .Values.database.schemas.mediarvester.main }}"
  auth:
    # Authelia forwards the authenticated user via this header (see authResponseHeaders).
    header: Remote-User
    defaultUser: anonymous
  downloadConcurrency: 2
  logLevel: INFO
  # 000, not media.system.umask (002): the replays share is historically
  # world-writable (2777 dirs, 666 files) — it's touched by the mac client over
  # NFS, Synology's own indexer, and this pod, none of which share a common
  # uid/gid. Group-write alone (002) would only help clients whose gid matches
  # ours; world-write sidesteps the mismatch entirely.
  umask: "000"
  storage:
    mediaPvc: "{{ .Values.storage.defaultVolumes.media }}"
    mediaSubPath: replays
    appsPvc: "{{ .Values.storage.defaultVolumes.apps }}"
    cookiesSubPath: mediarvester/cookies
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      # Was 1Gi; the pod was OOMKilling every ~1-3h under normal poller +
      # download load (confirmed via Mimir: RSS climbs steadily and pins at
      # the limit before each kill, even between active downloads). 2Gi
      # buys headroom while MALLOC_ARENA_MAX=2 (mediarvester--deployment.yaml)
      # addresses the likely root cause -- see mediarvester's
      # docs/incidents/2026-08-20-youtube-403-and-oom.md.
      memory: 2Gi
  potProvider:
    # Sidecar for yt-dlp's PO Token requirement -- see bgutil-ytdlp-pot-provider
    # in requirements.txt for why. The plugin auto-discovers it at the default
    # http://127.0.0.1:4416 (shared network namespace, same pod) with zero
    # extractor-args config needed. Node flavor: no runtime writes, so it needs
    # nothing mounted -- only the container-level securityContext override,
    # since the image's own baked-in `node` user (uid/gid 1000) doesn't match
    # mediarvester's pod-level runAsUser (needed for its own NFS access).
    # 1.3.2 (2026-08-21) mints WebPO tokens from the homepage challenge + ytcfg,
    # fixing the 403s YouTube's "bind GVS PO Token to video ID" A/B test caused
    # on adaptive/DASH formats under 1.3.1 -- confirmed empirically. See
    # ../../../mediarvester/docs/incidents/2026-08-20-youtube-403-and-oom.md.
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2-node
    port: 4416
    userId: 1000
    groupId: 1000
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
