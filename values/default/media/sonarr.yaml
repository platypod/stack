sonarr:
  apiKey: 1b229188fe9e4488a2333c2135b1a055
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.sonarr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: linuxserver/sonarr:latest
  label: sonarr
  ports:
    http:
      name: sonarr-http
      targetPort: 8989
  pvc:
    app: "{{ .Values.storage.defaultVolumes.apps }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
