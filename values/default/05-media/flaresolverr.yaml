flaresolverr:
  captchaSolver: none
  host: ${k8s.names.urls.prefix}${flaresolverr.label}${k8s.names.urls.suffix}.${traefik.domain}
  image: flaresolverr/flaresolverr:latest
  label: flaresolverr
  log:
    level: info
    html: false
  ports:
    http:
      name: flaresolvr-http
      targetPort: 8191
  prometheus:
    enabled: false
    path: /metrics
    port: 8192
  replicasNb: 1
