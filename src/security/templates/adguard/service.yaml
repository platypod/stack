{{- if .Values.adguard.enable }}
apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.k8s.names.services.prefix }}{{ .Values.adguard.label }}{{ .Values.k8s.names.services.suffix }}

spec:
  {{- if not .Values.adguard.externalIP }}
  externalTrafficPolicy: Local
  {{- end }}
  ports:
  - protocol: TCP
    name: {{ .Values.adguard.ports.dnsTcp.name }}
    port: 53
    targetPort: {{ .Values.adguard.ports.dnsTcp.targetPort }}
  - protocol: UDP
    name: {{ .Values.adguard.ports.dnsUdp.name }}
    port: 53
    targetPort: {{ .Values.adguard.ports.dnsUdp.targetPort }}
  - protocol: TCP
    name: {{ .Values.adguard.ports.http.name }}
    port: {{ .Values.adguard.ports.http.targetPort }}
    targetPort: {{ .Values.adguard.ports.http.targetPort }}
  - protocol: TCP
    name: {{ .Values.adguard.ports.admin.name }}
    port: {{ .Values.adguard.ports.admin.targetPort }}
    targetPort: {{ .Values.adguard.ports.admin.targetPort }}
  selector:
    app: {{ .Values.k8s.names.pods.prefix }}{{ .Values.adguard.label }}{{ .Values.k8s.names.pods.suffix }}
  {{- if .Values.adguard.externalIP }}
  # externalIPs, not hostNetwork: PodSecurity "baseline" forbids host namespaces
  # and host ports, and prd-platypod stays at baseline. kube-proxy accepts :53
  # on this address and DNATs to the pod, so LAN clients resolve against it.
  type: ClusterIP
  externalIPs:
    - {{ .Values.adguard.externalIP }}
  {{- else }}
  type: LoadBalancer
  {{- if .Values.adguard.loadBalancerIP }}
  loadBalancerIP: {{ .Values.adguard.loadBalancerIP }}
  {{- end }}
  {{- end }}
{{- end }}
