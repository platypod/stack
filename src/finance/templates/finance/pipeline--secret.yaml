{{- if .Values.finance.enable }}
{{- $db := .Values.finance.database }}
apiVersion: v1
kind: Secret

metadata:
  name: {{ .Values.k8s.names.services.prefix }}{{ .Values.finance.label }}{{ .Values.k8s.names.services.suffix }}-pipeline-env

# Everything `pp` reads from the environment (see finance-pipelines/src/platypod_pipeline/config.py).
stringData:
  FINANCE_PG_HOST: "{{ .Values.k8s.names.services.prefix }}{{ tpl $db.label . }}{{ .Values.k8s.names.services.suffix }}"
  FINANCE_PG_PORT: "{{ $db.ports.http.targetPort }}"
  FINANCE_PG_DATABASE: "{{ $db.name }}"
  # Least privilege per step. The wrapper's own ops writes use the generic
  # FINANCE_PG_USER (ingest: INSERT/UPDATE on ops.*).
  FINANCE_PG_USER: "{{ $db.credentials.ingest.username }}"
  FINANCE_PG_PASSWORD: "{{ $db.credentials.ingest.password }}"
  FINANCE_PG_ADMIN_USER: "{{ $db.credentials.owner.username }}"
  FINANCE_PG_ADMIN_PASSWORD: "{{ $db.credentials.owner.password }}"
  FINANCE_PG_INGEST_USER: "{{ $db.credentials.ingest.username }}"
  FINANCE_PG_INGEST_PASSWORD: "{{ $db.credentials.ingest.password }}"
  FINANCE_PG_TRANSFORM_USER: "{{ $db.credentials.transform.username }}"
  FINANCE_PG_TRANSFORM_PASSWORD: "{{ $db.credentials.transform.password }}"
  {{- $gw := .Values.observability.otelCollector.gateway }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .Values.finance.telemetry.otlpEndpoint | default (printf "http://%s%s%s:%v" .Values.k8s.names.services.prefix (tpl $gw.label .) .Values.k8s.names.services.suffix $gw.ports.http.targetPort) }}"
  {{- if .Values.finance.publish.enable }}
  {{- if not .Values.finance.publish.owner }}
  {{- fail "finance.publish.enable is true but finance.publish.owner is empty - it must be the Grafana/Authelia login of the person whose payslips these are (platypod-sops)" }}
  {{- end }}
  # Enables the pipelines' publish step: every published series carries owner=<this>.
  FINANCE_OWNER: "{{ .Values.finance.publish.owner }}"
  {{- end }}
  OPENLINEAGE_NAMESPACE: "{{ .Values.finance.openlineage.namespace }}"
  OPENLINEAGE_URL: "{{ .Values.finance.openlineage.url }}"
{{- end }}
