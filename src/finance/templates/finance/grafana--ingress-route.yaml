{{- if and .Values.finance.enable .Values.finance.grafana.enable }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: {{ .Values.k8s.names.ingresses.prefix }}{{ tpl .Values.finance.grafana.label . }}{{ .Values.k8s.names.ingresses.suffix }}
  labels:
    chartVersion: {{ .Chart.Version | replace "+" "_" }}
    env: {{ .Values.project.env }}

spec:
  entryPoints:
  - {{ .Values.traefik.ports.https.name }}

  routes:
  - kind: Rule
    match: Host(`{{ tpl .Values.finance.grafana.host . }}`)
    # Authelia forward-auth: the generated access_control rule for this host lists only
    # `finance_user` and `admins` (security.accessGroups.finance).
    middlewares:
    - name: {{ .Values.k8s.names.middlewares.prefix }}{{ .Values.authelia.label }}{{ .Values.k8s.names.middlewares.suffix }}
      namespace: {{ .Values.k8s.namespace }}
    services:
    - kind: Service
      name: {{ .Values.k8s.names.services.prefix }}{{ tpl .Values.finance.grafana.label . }}{{ .Values.k8s.names.services.suffix }}
      port: {{ .Values.finance.grafana.ports.http.targetPort }}

  {{- if or .Values.traefik.tls.selfSigned .Values.traefik.tls.wildcard }}
  tls:
    store:
      name: default
  {{- else }}
  tls:
    certResolver: {{ .Values.traefik.resolverName }}
  {{- end }}
{{- end }}
