apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ .Values.k8s.names.ingresses.prefix }}{{ .Values.whoami.name }}{{ .Values.k8s.names.ingresses.suffix }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.traefik.ports.https.name }}
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: {{ .Values.traefik.tlsResolverName }}
    pulumi.com/skipAwait: "true"
  labels:
    chartVersion: {{ .Chart.Version }}
    env: {{ .Values.project.env }}

spec:
  rules:
  - host: {{ .Values.k8s.names.urls.prefix }}{{ .Values.whoami.name }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.k8s.names.services.prefix }}{{ .Values.whoami.name }}{{ .Values.k8s.names.services.suffix }}
            port:
              number: {{ .Values.whoami.ports.http.targetPort }}
