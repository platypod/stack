apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.k8s.names.services.prefix }}{{ .Values.traefik.dashboardLabel }}{{ .Values.k8s.names.services.suffix }}

spec:
  ports:
    - protocol: TCP
      port: {{ .Values.traefik.ports.dashboard.port }}
      targetPort: {{ .Values.traefik.ports.dashboard.targetPort }}
      name: {{ .Values.k8s.names.services.prefix }}{{ .Values.traefik.dashboardLabel }}{{ .Values.k8s.names.services.suffix }}
  selector:
    app: {{ .Values.k8s.names.pods.prefix }}{{ .Values.traefik.label }}{{ .Values.k8s.names.pods.suffix }}
