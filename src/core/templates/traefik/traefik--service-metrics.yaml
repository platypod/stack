# Internal-only Service for Traefik's metrics/dashboard port. Deliberately a
# separate ClusterIP service: the main Traefik Service is a LoadBalancer, and
# the dashboard entrypoint (api.insecure) must never be reachable from the LB IP.
apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.k8s.names.services.prefix }}{{ .Values.traefik.label }}-metrics{{ .Values.k8s.names.services.suffix }}

spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: {{ .Values.traefik.ports.dashboard.targetPort }}
      targetPort: {{ .Values.traefik.ports.dashboard.targetPort }}
      name: {{ .Values.traefik.ports.dashboard.name }}
  selector:
    app: {{ .Values.k8s.names.pods.prefix }}{{ .Values.traefik.label }}{{ .Values.k8s.names.pods.suffix }}
