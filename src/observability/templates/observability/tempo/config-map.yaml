apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.traces.label }}{{ .Values.k8s.names.configMaps.suffix }}
data:
  tempo.yaml: |
    stream_over_http_enabled: true

    server:
      grpc_listen_port: {{ .Values.observability.traces.ports.grpc.targetPort }}
      http_listen_port: {{ .Values.observability.traces.ports.http.targetPort }}
      log_level: {{ .Values.observability.traces.logging.level }}

    query_frontend:
      search:
        duration_slo: 5s
        throughput_bytes_slo: 1.073741824e+09
        metadata_slo:
            duration_slo: 5s
            throughput_bytes_slo: 1.073741824e+09
      trace_by_id:
        duration_slo: 5s

    compactor:
      compaction:
        block_retention: {{ .Values.observability.retention }}

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: k8s
      storage:
        path: /var/tempo/generator/wal
        remote_write:
        - url: http://{{ .Values.k8s.names.services.prefix }}{{ .Values.observability.metrics.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.metrics.ports.http.targetPort }}/api/v1/write
          send_exemplars: true
      traces_storage:
        path: /var/tempo/generator/traces

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics, local-blocks]
          generate_native_histograms: both
