readarr:
  enable: true
  apiKey: "44444444444444444444444444444444"
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.readarr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: ghcr.io/pennydreadful/bookshelf:hardcover-v0.4.20.129
  label: readarr
  ports:
    http:
      name: readarr-http
      targetPort: 8787
  pvc:
    app: "{{ .Values.storage.defaultVolumes.apps }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
