prowlarr:
  enable: true
  apiKey: "11111111111111111111111111111111"
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.prowlarr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: linuxserver/prowlarr:latest
  label: prowlarr
  ports:
    http:
      name: prowlarr-http
      targetPort: 9696
  # Newznab indexers auto-wired by the sabnzbd-setup Job. apiKey empty = skip
  # (real key comes from the user's althub.co.za profile → Integrations tab,
  # set only in values/dev or values/prd, never committed here).
  indexers:
    althub:
      baseUrl: "https://www.althub.co.za"
      apiKey: ""
  replicasNb: 1
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 512Mi
