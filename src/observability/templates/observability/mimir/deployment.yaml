{{- $pod := print .Values.k8s.names.pods.prefix .Values.observability.metrics.label .Values.k8s.names.pods.suffix }}
{{- $appVolume := "app-volume" }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $pod }}
spec:
  replicas: 1
  # Single replica with filesystem storage: never run two ingesters against the
  # same TSDB dir.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/observability/mimir/config-map.yaml") . | sha256sum }}
    spec:
      priorityClassName: platypod-bulk
      # Prefer the bulk node (memory-rich, CPU-poor) but never require it: that
      # class of node may not exist yet, and a hard requirement would leave
      # these Pending instead of falling back. Also steer away from the primary
      # node, whose spare memory is the gaming reserve.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: platypod.io/node-class
                operator: In
                values: ["bulk"]
          - weight: 50
            preference:
              matchExpressions:
              - key: platypod.io/node-class
                operator: NotIn
                values: ["primary"]
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.observability.metrics.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.observability.metrics.image }}
        resources:
          {{- toYaml .Values.observability.metrics.resources | nindent 10 }}
        args:
        - "-config.file=/etc/mimir/mimir.yaml"
        - "-target=all"
        ports:
        - containerPort: {{ .Values.observability.metrics.ports.http.targetPort }}
        volumeMounts:
        - mountPath: /etc/mimir/mimir.yaml
          name: conf
          subPath: mimir.yaml
        - mountPath: /storage
          name: {{ $appVolume }}
          subPath: mimir
      volumes:
      - name: conf
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.metrics.label }}{{ .Values.k8s.names.configMaps.suffix }}
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.observability.pvc . }}
