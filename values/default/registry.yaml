  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.dbeaver.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  label: dbeaver

headroom:
  # Disabled for now: only the terminal `claude` CLI can be pointed at a
  # custom ANTHROPIC_BASE_URL (via ~/.claude/settings.json, see
  # bin/set-claude-proxy.sh). Claude Desktop hardcodes ANTHROPIC_BASE_URL to
  # api.anthropic.com for every embedded `claude` process it spawns — verified
  # by process tree (ps showed both a resumed and a brand-new Desktop session
  # launched *after* the env var was set session-wide via `launchctl setenv`,
  # neither picked it up, and Headroom's own /stats request counter never
  # moved for either). Neither settings.json nor launchctl session env
  # reaches it. Re-enable once there's an actual client (CLI-only workflows,
  # or a future Desktop release that respects a custom endpoint).
  enable: false
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.headroom.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  label: headroom

itTools:
