jellyseerr:
  apiKey: MTczNjUwNTY0MTMwNmRmY2EzNWZhLWNjNzYtNDA1ZC05MDE4LTVkYTc1NWNjN2E0Yg==
  host: ${k8s.names.urls.prefix}${jellyseerr.label}${k8s.names.urls.suffix}.${traefik.domain}
  image: fallenbagel/jellyseerr:latest
  label: jellyseerr
  logLevel: DEBUG
  database:
    type: postgres
    host: ${k8s.names.services.prefix}${database.label}${k8s.names.services.suffix}
    port: ${database.ports.http.targetPort}
    username: ${database.credentials.username}
    password: ${database.credentials.password}
    name: ${database.schemas.jellyseerr.main}
    logQueries: false
  ports:
    http:
      name: jellyseerr
      targetPort: 5055
  pvc: ${storage.defaultVolumes.apps}
  replicasNb: 1
