apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.k8s.names.clusterRoles.prefix }}{{ .Values.observability.otelCollector.label }}{{ .Values.k8s.names.clusterRoles.suffix }}
rules:
- apiGroups:
  - ''
  resources:
  - endpoints
  - events
  - namespaces
  - namespaces/status
  - nodes
  - nodes/metrics
  - nodes/proxy
  - nodes/spec
  - nodes/stats
  - pods
  - pods/status
  - replicationcontrollers
  - replicationcontrollers/status
  - resourcequotas
  - services
  verbs:
  - get
  - watch
  - list

- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch

- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch

- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch

- apiGroups:
  - extensions
  resources:
  - replicasets
  - daemonsets
  - deployments
  verbs:
  - get
  - list
  - watch

- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
  - watch
