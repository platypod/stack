{{- if .Values.jellyswarrm.enable }}

apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.k8s.names.services.prefix }}{{ .Values.jellyswarrm.label }}{{ .Values.k8s.names.services.suffix }}

spec:
  selector:
    app: {{ .Values.k8s.names.pods.prefix }}{{ .Values.jellyswarrm.label }}{{ .Values.k8s.names.pods.suffix }}
  ports:
  - protocol: TCP
    name: {{ .Values.jellyswarrm.ports.http.name }}
    port: {{ .Values.jellyswarrm.ports.http.targetPort }}

{{- end }}
