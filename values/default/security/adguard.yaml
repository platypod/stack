adguard:
  enable: true
  # Bind :53 (tcp+udp) on the node itself instead of taking a LoadBalancer VIP.
  # LAN clients then point their resolver at the node IP. Required when the
  # LAN-facing node is a control plane — see the note in core/traefik.yaml.
  #
  # ⚠ With hostNetwork, ports.http.targetPort binds on the HOST. The default 80
  # collides with Traefik's http entrypoint if both run on the same node; move
  # AdGuard's web UI to 8080 (the ConfigMap, Service and IngressRoute all derive
  # from this one value, so changing it is enough).
  hostNetwork: false
  # Pin to the node the LAN resolves to. Required with hostNetwork.
  nodeSelector: {}
  loadBalancerIP: ""  # override per-env (e.g. dev: 192.168.122.201). Ignored when hostNetwork.
  adminHost: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.adguard.label }}-admin{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  credentials:
    username: admin
    password: password
    passwordHash: "$2y$10$XEjNfXLsHj7CBrnT1fdMaeqVv.tA.cfpWfulEAKBupXFUUgunxgRS"
  image: adguard/adguardhome:latest
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.adguard.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  label: adguard
  ports:
    dnsUdp:
      name: dns-udp
      nodePort: 32049
      targetPort: 53
    dnsTcp:
      name: dns-tcp
      nodePort: 30154
      targetPort: 53
    http:
      name: http
      nodePort: 30155
      targetPort: 80
    admin:
      name: admin
      nodePort: 30156
      targetPort: 3000
  # Extra DNS rewrites, appended after the automatic "*.<traefik.domain>" one.
  # LAN-only names live here (e.g. the Kubernetes API endpoint) so laptops and
  # hosts resolve them without a public DNS record.
  #
  # NOTE: Talos nodes do NOT use AdGuard — their machine config pins
  # nameservers to 1.1.1.1/8.8.8.8, and AdGuard runs *inside* the cluster, so it
  # can never resolve the cluster's own API endpoint for them. Node-side
  # resolution is handled by machine.network.extraHostEntries in infra/.
  rewrites: []
    # - domain: k8s.platypod.lan
    #   answer: 192.168.1.156

  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
