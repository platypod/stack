jellyfinK8s:
  enable: false        # in-cluster benchmark instance, compared against jellyfin(-proxy) via jellyswarrm
  label: jellyfin-k8s
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.jellyfinK8s.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: jellyfin/jellyfin:latest
  credentials:
    username: admin
    password: password
  ports:
    http:
      name: jellyfin-k8s
      targetPort: 8096
  # Local (non-NFS) config PVC — Jellyfin's library DB is SQLite, which breaks
  # over NFS WAL (see stack/CLAUDE.md). Media stays read-only NFS below.
  pvc:
    config: "{{ .Values.storage.defaultVolumes.config }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
