apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability
spec:
  interval: 10m0s
  releaseName: ${env}--platypod--observability
  targetNamespace: ${env}-platypod
  dependsOn:
    - name: core
    - name: security
  # otel-collector's DaemonSet runs a second replica on the control-plane
  # node (to collect its metrics too) — that node has too little free
  # memory for it, so it sits Pending permanently on local's undersized
  # 2-node cluster. Unlike persistence's disableWait (an inherent, expected
  # steady state), this is local-only, capacity-driven, and this HelmRelease
  # doesn't exist for prod yet (still Helmfile there, Phase 7) — safe to
  # disable --wait here without masking anything on a real deploy.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: ./src/observability
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  # Carries ALL 7 per-module ConfigMaps, not just its own — matching
  # Helmfile's actual behavior. See stack/docs/flux-migration.md gotcha 2.
  valuesFrom:
    - kind: ConfigMap
      name: platypod-substrate
      valuesKey: substrate.yaml
    - kind: ConfigMap
      name: platypod-registry
      valuesKey: registry.yaml
    - kind: ConfigMap
      name: platypod-core
      valuesKey: core.yaml
    - kind: ConfigMap
      name: platypod-dev-tools
      valuesKey: dev-tools.yaml
    - kind: ConfigMap
      name: platypod-files
      valuesKey: files.yaml
    - kind: ConfigMap
      name: platypod-games
      valuesKey: games.yaml
    - kind: ConfigMap
      name: platypod-media
      valuesKey: media.yaml
    - kind: ConfigMap
      name: platypod-observability
      valuesKey: observability.yaml
    - kind: ConfigMap
      name: platypod-security
      valuesKey: security.yaml
    - kind: Secret
      name: platypod-secrets
      valuesKey: platypod-secrets.yaml
