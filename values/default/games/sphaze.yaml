sphaze:
  enable: true
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.sphaze.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: ghcr.io/platypod/sphaze:v0.12.0
  label: sphaze
  ports:
    http:
      name: http
      targetPort: 80
  replicasNb: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
