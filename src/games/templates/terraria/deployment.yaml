{{- if .Values.terraria.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.terraria.label .Values.k8s.names.pods.suffix }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      # Must tolerate the primary-node taint: when pinned there via
      # externalIP/nodeSelector (prod, no MetalLB) it has nowhere else to run.
      # Harmless on dev, where there is no taint to match.
      tolerations:
      - key: platypod.io/reserved
        operator: Equal
        value: primary
        effect: NoSchedule
      priorityClassName: platypod-gaming
      {{- with .Values.terraria.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.terraria.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.terraria.image }}
        resources:
          {{- toYaml .Values.terraria.resources | nindent 10 }}
        env:
        - name: TERRARIA_PORT
          value: {{ .Values.terraria.port | quote }}
        - name: TERRARIA_WORLD
          value: {{ .Values.terraria.server.worldName | quote }}
        - name: TERRARIA_AUTOCREATE
          value: {{ .Values.terraria.server.autocreate | quote }}
        - name: TERRARIA_PASSWORD
          value: {{ .Values.terraria.server.password | quote }}
        - name: TERRARIA_MAXPLAYERS
          value: {{ .Values.terraria.server.maxPlayers | quote }}
        - name: TERRARIA_MOTD
          value: {{ .Values.terraria.server.motd | quote }}
        {{- range $key, $value := .Values.terraria.server.extraEnv }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        ports:
        - name: game-udp
          containerPort: {{ .Values.terraria.port }}
          protocol: UDP
        - name: game-tcp
          containerPort: {{ .Values.terraria.port }}
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /worlds
          subPath: terraria/worlds
        - name: data
          mountPath: /configs
          subPath: terraria/configs
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ tpl .Values.terraria.pvc . }}
{{- end }}
