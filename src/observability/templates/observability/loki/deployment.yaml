{{- $pod := print .Values.k8s.names.pods.prefix .Values.observability.logs.label .Values.k8s.names.pods.suffix }}
{{- $appVolume := "app-volume" }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $pod }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
      annotations:
        # Restart Loki when its config changes (otherwise config-map edits are
        # silently ignored until the pod happens to restart). See stack CLAUDE.md.
        checksum/config: {{ include (print $.Template.BasePath "/observability/loki/config-map.yaml") . | sha256sum }}
    spec:
      priorityClassName: platypod-bulk
      # Prefer the bulk node (memory-rich, CPU-poor) but never require it: that
      # class of node may not exist yet, and a hard requirement would leave
      # these Pending instead of falling back. Also steer away from the primary
      # node, whose spare memory is the gaming reserve.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: platypod.io/node-class
                operator: In
                values: ["bulk"]
          - weight: 50
            preference:
              matchExpressions:
              - key: platypod.io/node-class
                operator: NotIn
                values: ["primary"]
      initContainers:
      - name: init-permissions
        image: busybox:1.37.0
        command: ['sh', '-c', 'mkdir -p /data/loki/tmp /data/loki/etc && chown -R 10001:10001 /data/loki']
        volumeMounts:
        - name: {{ $appVolume }}
          mountPath: /data
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.observability.logs.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.observability.logs.image }}
        # Allow admins' federated reads: X-Scope-OrgID may list several tenants
        # (claude-<user>|_shared) so they can see everyone. See dashboard-multitenancy.md.
        args:
        - '-config.file=/etc/loki/local-config.yaml'
        - '-querier.multi-tenant-queries-enabled=true'
        resources:
          {{- toYaml .Values.observability.logs.resources | nindent 10 }}
        ports:
        - containerPort: {{ .Values.observability.logs.ports.http.targetPort }}
        - containerPort: {{ .Values.observability.logs.ports.grpc.targetPort }}
        volumeMounts:
        - name: conf
          mountPath: /etc/loki/local-config.yaml
          subPath: local-config.yaml
        - mountPath: /tmp/loki
          name: {{ $appVolume }}
          subPath: loki/tmp
        - mountPath: /etc/loki
          name: {{ $appVolume }}
          subPath: loki/etc
      volumes:
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.observability.pvc . }}
      - name: conf
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.logs.label }}{{ .Values.k8s.names.configMaps.suffix }}
