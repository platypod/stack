# Registry tier — per-service identity (enable/label/host), collected here
# so a Flux HelmRelease can pull the whole registry as one valuesFrom entry
# instead of one per service. Implementation detail (image/resources/ports/
# service config) lives in each module's own values/default/<module>.yaml.
# See stack/docs/flux-migration.md for the tier design.

homepage:
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.homepage.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  label: homepage

bookstack:
  enable: true
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.bookstack.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  label: bookstack

