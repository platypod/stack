apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.k8s.names.configMaps.prefix }}{{ tpl .Values.observability.otelCollector.gateway.label . }}{{ .Values.k8s.names.configMaps.suffix }}"
data:
  collector.yaml: |
    extensions:
      # Forward the per-request x-scope-orgid (set by the shipper) as the Loki
      # tenant header. Logs without it (e.g. native Claude telemetry, future pod
      # logs) fall back to the default tenant. See
      # docs/observability/dashboard-multitenancy.md.
      headers_setter/logs:
        headers:
          - action: upsert
            key: X-Scope-OrgID
            from_context: x-scope-orgid
            default_value: {{ .Values.observability.logs.defaultTenant | default "_shared" | quote }}
      # Same mechanism, applied to Mimir: prompt-meter is the only OTLP-pushed
      # metrics source and is the only one that claims a tenant (x-scope-orgid:
      # ai), so it's the only thing that lands in the "ai" tenant. Everything
      # else (k8s_cluster, kubeletstats, jellyfin/snmp scrapes, …) has no client
      # context to read from and falls back to "anonymous" — the tenant this
      # whole cluster's metrics already lived in before multi-tenancy existed,
      # so existing dashboards/history don't move. See
      # docs/observability/dashboard-multitenancy.md (metrics theme-tenant split).
      headers_setter/metrics:
        headers:
          - action: upsert
            key: X-Scope-OrgID
            from_context: x-scope-orgid
            default_value: "anonymous"

    receivers:

      # Cluster-state metrics from the K8s API: pod phases, container restarts,
      # deployment desired vs available, node conditions, resource quotas.
      # Runs here (single replica) rather than on the DaemonSet because it
      # watches the whole cluster — one instance must own it or counts double.
      # Per-node/per-pod *usage* comes from kubeletstats on the node collectors.
      k8s_cluster:
        collection_interval: 30s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure]
        allocatable_types_to_report: [cpu, memory]

      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.observability.otelCollector.gateway.ports.grpc.targetPort }}
            # Expose request metadata (e.g. the shipper's x-scope-orgid) so the
            # headers_setter extension can forward it as the Loki tenant.
            include_metadata: true
          http:
            endpoint: 0.0.0.0:{{ .Values.observability.otelCollector.gateway.ports.http.targetPort }}
            include_metadata: true
      {{- if .Values.observability.otelCollector.receivers.jellyfinCustom.enable }}
      prometheus/jellyfinCustom:
        config:
          scrape_configs:
          - job_name: jellyfin-api
            scrape_interval: 30s
            metrics_path: /probe
            params:
              module: [jellyfin]
            static_configs:
            - targets:
              {{- if .Values.jellyfin.proxy.enable }}
              - http://{{ .Values.jellyfin.proxy.host }}:{{ .Values.jellyfin.proxy.port }}/Sessions
              {{- end }}
              {{- if .Values.jellyfin.inCluster }}
              - https://{{ tpl .Values.jellyfin.host . }}/Sessions
              {{- end }}
            relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: {{ .Values.k8s.names.services.prefix }}{{ .Values.observability.prometheusJsonExporter.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.prometheusJsonExporter.ports.http.targetPort }}
      {{- end }}
      {{- if .Values.observability.otelCollector.receivers.jellyfinNative.enable }}
      prometheus/jellyfinNative:
        config:
          scrape_configs:
          - job_name: 'jellyfin-metrics'
            scrape_interval: 30s
            static_configs:
            - targets:
              {{- if .Values.jellyfin.inCluster }}
              - {{ tpl .Values.jellyfin.host . }}
              {{- end }}
              {{- if .Values.jellyfin.proxy.enable }}
              - {{ .Values.jellyfin.proxy.host }}:{{ .Values.jellyfin.proxy.port }}
              {{- end }}
      {{- end }}
      {{- if .Values.observability.otelCollector.receivers.synologySnmp.enable }}
      prometheus/synologySnmp:
        config:
          scrape_configs:
          - job_name: 'synology-disk-station'
            metrics_path: /snmp
            params:
              module: [if_mib, synology]
              auth: [synology_v3]
            scrape_interval: 30s
            scrape_timeout: 30s
            static_configs:
            - targets:
              - {{ .Values.observability.otelCollector.receivers.synologySnmp.url }}
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: {{ .Values.k8s.names.services.prefix }}{{ .Values.observability.prometheusSnmpExporter.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.prometheusSnmpExporter.ports.http.targetPort }}
      {{- end }}
      # USD->currency FX rates (ECB daily, via the json-exporter `fx` module).
      # Feeds usd_fx_rate{currency=...} to Mimir for the Claude Code cost
      # dashboard's currency conversion. ECB updates ~daily, but the Prometheus
      # scrape manager jitters the FIRST scrape across the whole interval, so a
      # long interval leaves the metric (and the dashboard) empty for that long
      # after any collector restart. 5m keeps first-scrape latency low at
      # negligible cost (~288 req/day to a cached public API).
      prometheus/fx:
        config:
          scrape_configs:
          - job_name: 'fx-rates'
            scrape_interval: 5m
            scrape_timeout: 30s
            metrics_path: /probe
            params:
              module: [fx]
            static_configs:
            - targets:
              - 'https://api.frankfurter.dev/v1/latest?base=USD'
            relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: {{ .Values.k8s.names.services.prefix }}{{ .Values.observability.prometheusJsonExporter.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.prometheusJsonExporter.ports.http.targetPort }}
      prometheus/transmission:
        config:
          scrape_configs:
          - job_name: 'transmission-exporter'
            static_configs:
            - targets:
              - '{{ .Values.k8s.names.services.prefix }}{{ .Values.transmission.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.transmission.exporter.ports.http.targetPort }}'
      # Ingress-level service usage & availability: request rates, status codes,
      # latency histograms and open connections per router/service.
      prometheus/traefik:
        config:
          scrape_configs:
          - job_name: 'traefik'
            scrape_interval: 30s
            static_configs:
            - targets:
              - '{{ .Values.k8s.names.services.prefix }}{{ .Values.traefik.label }}-metrics{{ .Values.k8s.names.services.suffix }}:{{ .Values.traefik.ports.dashboard.targetPort }}'
      # Auth activity: who is authenticating, successes/failures, active session
      # workload — the "users connected" signal.
      prometheus/authelia:
        config:
          scrape_configs:
          - job_name: 'authelia'
            scrape_interval: 30s
            static_configs:
            - targets:
              - '{{ .Values.k8s.names.services.prefix }}{{ .Values.authelia.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.authelia.ports.metrics.targetPort }}'

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 2048
      # Logs batch separately per x-scope-orgid so one Loki push never mixes
      # tenants (the batcher otherwise drops per-request metadata).
      batch/logs:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 2048
        metadata_keys: [x-scope-orgid]
      # Same reason, for the one metrics pipeline (otlp/prompt-meter) that
      # carries a real client-declared tenant (x-scope-orgid: ai). The other
      # metrics pipelines (jellyfin, k8s_cluster, …) keep the shared plain
      # `batch` above — they never claim a tenant, so there's nothing to lose.
      batch/otlp_metrics:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 2048
        metadata_keys: [x-scope-orgid]
      # Thresholds must stay under the pod's real k8s memory limit (see
      # otel-collectors.yaml) with headroom — they used to be set at 4000/800
      # while the pod's actual limit was 512Mi, so this safety valve could
      # never trigger before the kernel OOM-killed the container outright.
      memory_limiter:
        check_interval: 1s
        limit_mib: 800
        spike_limit_mib: 200
      attributes/otlp:
        actions:
        - key: gateway-receiver
          value: otlp
          action: insert
      attributes/prometheus:
        actions:
        - key: gateway-receiver
          value: prometheus
          action: insert
      attributes/k8s_cluster:
        actions:
        - key: gateway-receiver
          value: k8s_cluster
          action: insert
      # Mimir's OTLP ingestion only keeps datapoint attributes as labels
      # (resource attributes land in target_info); k8s_cluster carries all object identity (pod, node, deployment…)
      # as resource attributes. Promote them or every series is anonymous.
      transform/k8s_cluster:
        metric_statements:
        - context: datapoint
          statements:
          - set(attributes["namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil
          - set(attributes["pod"], resource.attributes["k8s.pod.name"]) where resource.attributes["k8s.pod.name"] != nil
          - set(attributes["container"], resource.attributes["k8s.container.name"]) where resource.attributes["k8s.container.name"] != nil
          - set(attributes["node"], resource.attributes["k8s.node.name"]) where resource.attributes["k8s.node.name"] != nil
          - set(attributes["deployment"], resource.attributes["k8s.deployment.name"]) where resource.attributes["k8s.deployment.name"] != nil
          - set(attributes["daemonset"], resource.attributes["k8s.daemonset.name"]) where resource.attributes["k8s.daemonset.name"] != nil
          - set(attributes["statefulset"], resource.attributes["k8s.statefulset.name"]) where resource.attributes["k8s.statefulset.name"] != nil
      attributes/snmp:
        actions:
        - key: gateway-receiver
          value: snmp
          action: insert
      # NOTE: do not try to override job/instance via datapoint attributes —
      # Mimir derives those reserved labels from the OTel service.name /
      # service.instance.id (i.e. the scrape job), and ignores datapoint-level
      # overrides (VictoriaMetrics used to honor them). Dashboards filter on
      # job="synology-disk-station" (the scrape job name) instead.
      attributes/reivi:
        actions:
          - key: reivi_label
            action: insert
            value: reivi_value
      # Per-user dashboard isolation: every metric must carry an `owner` label so
      # prom-label-proxy (which rejects empty-matching regexes) can scope it.
      # Jellyfin's per-user `user_name` becomes the owner; everything else is
      # "_shared" (visible to all). Claude metrics keep any owner the shipper set.
      # See docs/observability/dashboard-multitenancy.md.
      transform/owner:
        metric_statements:
        - context: datapoint
          statements:
          - set(attributes["owner"], attributes["user_name"]) where attributes["owner"] == nil and attributes["user_name"] != nil
          - set(attributes["owner"], "_shared") where attributes["owner"] == nil

    exporters:
      debug/verbose:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200
      debug/noop:
        verbosity: normal
        sampling_initial: 0
        sampling_thereafter: 0
      otlphttp/mimir:
        compression: gzip
        encoding: proto
        # Mimir's native OTLP ingestion endpoint. Mimir normalizes incoming
        # OTel metric names to Prometheus style (dots -> underscores), e.g.
        # system.cpu.time becomes system_cpu_time. Dashboards must query the
        # normalized names.
        metrics_endpoint: http://{{ .Values.k8s.names.services.prefix }}{{ .Values.observability.metrics.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.metrics.ports.http.targetPort }}/otlp/v1/metrics
        # Per-tenant X-Scope-OrgID injected from request metadata (Mimir
        # multitenancy_enabled). See headers_setter/metrics above. Used by every
        # metrics pipeline EXCEPT metrics/otlp — see otlphttp/mimir_ai below for
        # why that one doesn't go through context extraction.
        auth:
          authenticator: headers_setter/metrics
        tls:
          insecure: true
      # Dedicated exporter for metrics/otlp (prompt-meter's ai_tx_* pipeline) with
      # a hardcoded tenant header instead of headers_setter/metrics' from_context
      # extraction. Found 2026-07-02: external (Traefik+Authelia+tenant-guard)
      # OTLP metric exports consistently landed in the "anonymous" tenant instead
      # of "ai" — reproduced identically via a direct-to-gateway export (bypassing
      # Traefik) succeeding while the same client's external export didn't, so the
      # collector's own from_context propagation for this pipeline is the
      # suspect, not the client or the external auth chain. "ai" is a fixed,
      # compile-time-known value for this one pipeline (unlike the other metric
      # pipelines below, which genuinely have no client to derive a tenant from,
      # or the per-user Loki tenant, which is dynamic) — there was never a real
      # need to route it through dynamic context extraction. See
      # docs/observability/dashboard-multitenancy.md.
      otlphttp/mimir_ai:
        compression: gzip
        encoding: proto
        metrics_endpoint: http://{{ .Values.k8s.names.services.prefix }}{{ .Values.observability.metrics.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.metrics.ports.http.targetPort }}/otlp/v1/metrics
        headers:
          X-Scope-OrgID: "ai"
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://{{ .Values.k8s.names.services.prefix }}{{ .Values.observability.logs.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.logs.ports.http.targetPort }}/otlp
        # Per-tenant X-Scope-OrgID injected from request metadata (Loki auth_enabled).
        auth:
          authenticator: headers_setter/logs
        tls:
          insecure: true
      otlphttp/tempo:
        compression: gzip
        encoding: proto
        traces_endpoint: http://{{ .Values.k8s.names.services.prefix }}{{ .Values.observability.traces.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.traces.ports.http.targetPort }}/v1/traces
        tls:
          insecure: true

    service:
      extensions: [headers_setter/logs, headers_setter/metrics]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch/logs]
          exporters: [otlphttp/loki]

        metrics/otlp:
          receivers: [otlp]
          processors: [memory_limiter, attributes/otlp, transform/owner, batch/otlp_metrics]
          exporters: [otlphttp/mimir_ai]
        {{- if .Values.observability.otelCollector.receivers.jellyfinCustom.enable }}
        metrics/jellyfinCustom:
          receivers: [prometheus/jellyfinCustom]
          processors: [memory_limiter, attributes/prometheus, transform/owner, batch]
          exporters: [otlphttp/mimir]
        {{- end }}
        {{- if .Values.observability.otelCollector.receivers.jellyfinNative.enable }}
        metrics/jellyfinNative:
          receivers: [prometheus/jellyfinNative]
          processors: [memory_limiter, attributes/prometheus, transform/owner, batch]
          exporters: [otlphttp/mimir]
        {{- end }}
        {{- if .Values.observability.otelCollector.receivers.synologySnmp.enable }}
        metrics/synologySnmp:
          receivers: [prometheus/synologySnmp]
          processors: [memory_limiter, attributes/snmp, transform/owner, batch]
          exporters: [otlphttp/mimir]
        {{- end }}
        metrics/transmission:
          receivers: [prometheus/transmission]
          processors: [memory_limiter, attributes/prometheus, transform/owner, batch]
          exporters: [otlphttp/mimir]
        metrics/fx:
          receivers: [prometheus/fx]
          processors: [memory_limiter, attributes/prometheus, transform/owner, batch]
          exporters: [otlphttp/mimir]
        metrics/k8s_cluster:
          receivers: [k8s_cluster]
          processors: [memory_limiter, transform/k8s_cluster, attributes/k8s_cluster, transform/owner, batch]
          exporters: [otlphttp/mimir]
        metrics/traefik:
          receivers: [prometheus/traefik]
          processors: [memory_limiter, attributes/prometheus, transform/owner, batch]
          exporters: [otlphttp/mimir]
        metrics/authelia:
          receivers: [prometheus/authelia]
          processors: [memory_limiter, attributes/prometheus, transform/owner, batch]
          exporters: [otlphttp/mimir]

        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/tempo]

      telemetry:
        logs:
          level: {{ .Values.observability.otelCollector.logging.level }}
          encoding: {{ .Values.observability.otelCollector.logging.format }}
