apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.jellyseerr.names.pod }}
  labels:
    app: {{ .Values.jellyseerr.names.pod }}

spec:
  replicas: {{ .Values.jellyseerr.replicasNb }}
  selector:
    matchLabels:
      app: {{ .Values.jellyseerr.names.pod }}
  template:
    metadata:
      labels:
        app: {{ .Values.jellyseerr.names.pod }}
    spec:
      containers:
      - name: {{ .Values.jellyseerr.names.container }}
        image: {{ .Values.jellyseerr.image }}
        ports:
        - name: {{ .Values.jellyseerr.ports.http.name }}
          containerPort: {{ .Values.jellyseerr.ports.http.targetPort }}
        env:
        - name: API_KEY
          value: "{{ .Values.jellyseerr.apiKey }}"
        - name: LOG_LEVEL
          value: "{{ .Values.jellyseerr.logLevel }}"
        - name: DB_TYPE
          value: "{{ .Values.jellyseerr.database.type }}"
        - name: DB_HOST
          value: "{{ .Values.jellyseerr.database.host }}"
        - name: DB_PORT
          value: "{{ .Values.jellyseerr.database.port }}"
        - name: DB_USER
          value: "{{ .Values.jellyseerr.database.username }}"
        - name: DB_PASS
          value: "{{ .Values.jellyseerr.database.password }}"
        - name: DB_NAME
          value: "{{ .Values.jellyseerr.database.name }}"
        - name: DB_LOG_QUERIES
          value: "{{ .Values.jellyseerr.database.logQueries }}"
        - name: PORT
          value: "{{ .Values.jellyseerr.ports.http.targetPort }}"
        volumeMounts:
        - mountPath: /app/config
          name: {{ .Values.media.storage.pv }}
          subPath: apps/jellyseerr/config
      initContainers:
      - name: {{ .Values.jellyseerr.names.initContainer }}
        image: busybox:1.28
        command: ['sh', '-c', "cp /settings.json /app/config/settings.json"]
        volumeMounts:
        - mountPath: /app/config
          name: {{ .Values.media.storage.pv }}
          subPath: apps/jellyseerr/config
        - mountPath: /settings.json
          name: {{ .Values.jellyseerr.names.configMap }}
          subPath: settings.json
      volumes:
      - name: {{ .Values.media.storage.pv }}
        persistentVolumeClaim:
          claimName: {{ .Values.media.storage.pvc }}
      - name: {{ .Values.jellyseerr.names.configMap }}
        configMap:
          name: {{ .Values.jellyseerr.names.configMap }}
