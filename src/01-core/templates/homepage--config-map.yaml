apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.homepage.names.configMap }}

data:
  kubernetes.yaml: ""
  settings.yaml: ""
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
    - Social:
        - Reddit:
            - abbr: RE
              href: https://reddit.com/
    - Entertainment:
        - Invidious:
            - abbr: In
              href: https://api.invidious.io/
  services.yaml: |
    - Media:
      - Jellyfin:
          widget:
            type: jellyfin
            url: https://{{ .Values.jellyfin.host }}
            key: 6d65fa79175e41128fb097d3e2b3eec9
            enableBlocks: true # optional, defaults to false
            enableNowPlaying: true # optional, defaults to true
            enableUser: true # optional, defaults to false
            showEpisodeNumber: true # optional, defaults to false
            expandOneStreamToTwoRows: false # optional, defaults to true
    - Dev:
      - Who am I?:
          href: {{ .Values.whoami.host }}
          description: TODO
  widgets.yaml: |
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""