apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.authelia.database.names.service }}

spec:
  ports:
  - protocol: TCP
    name: {{ .Values.authelia.database.ports.http.name }}
    port: {{ .Values.authelia.database.ports.http.targetPort }}
  selector:
    app: {{ .Values.authelia.database.names.pod }}
