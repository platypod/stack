{{- if .Values.observability.otelCollector.collectors.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix (tpl .Values.observability.otelCollector.collectors.label $) .Values.k8s.names.pods.suffix }}

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $pod }}
  namespace: {{ tpl .Values.observability.otelCollector.collectors.namespace . }}
spec:
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/observability/nodes-collectors/config-map.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.k8s.names.serviceAccounts.prefix }}{{ tpl .Values.observability.otelCollector.collectors.label . }}{{ .Values.k8s.names.serviceAccounts.suffix }}
      # Tolerate EVERY taint. A node-level collector must run on every node or
      # that node silently becomes a metrics/logs blind spot — and a blind spot
      # is indistinguishable from a healthy node in a dashboard.
      #
      # This was previously a single toleration for the control-plane taint,
      # which was enough while that was the only taint in play. It is not: the
      # primary node carries platypod.io/reserved to keep the gaming reserve
      # clear, and any future taint would silently evict this DaemonSet too.
      # The kube-system DaemonSets (flannel, kube-proxy, csi-nfs-node) all take
      # the same blanket approach for the same reason.
      tolerations:
      - operator: Exists
      securityContext:
        runAsUser: 0
        fsGroup: 0
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ tpl .Values.observability.otelCollector.collectors.label . }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.observability.otelCollector.image }}
        resources:
          {{- toYaml .Values.observability.otelCollector.collectors.resources | nindent 10 }}
        env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        volumeMounts:
        - name: conf
          mountPath: /conf/collector.yaml
          subPath: collector.yaml
          mountPropagation: HostToContainer
        # mount /hostfs for host metrics
        - name: hostfs
          mountPath: /hostfs
          readOnly: true
        args: ["--config=/conf/collector.yaml"]
        ports:
        - containerPort: {{ .Values.observability.otelCollector.collectors.ports.grpc.targetPort }}
        - containerPort: {{ .Values.observability.otelCollector.collectors.ports.http.targetPort }}
      volumes:
      - name: hostfs
        hostPath:
          path: /
      - name: conf
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ tpl .Values.observability.otelCollector.collectors.label . }}{{ .Values.k8s.names.configMaps.suffix }}
{{- end }}
