{{- if .Values.mediarvester.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.mediarvester.label .Values.k8s.names.pods.suffix }}
{{- $mediaVolume := "media-volume" }}
{{- $appVolume := "app-volume" }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.mediarvester.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      # mediarvester is a bespoke FastAPI image, not a linuxserver.io/s6-overlay
      # one — no in-image PUID/PGID drop-privilege step — so run the whole pod
      # as the media user directly (same pattern as komga/kavita). Its own code
      # reads UMASK below and calls os.umask() at startup to match.
      # NEVER fsGroup on the NFS PVCs (recursive chown) — see CLAUDE.md.
      securityContext:
        runAsUser: {{ .Values.media.system.userId }}
        runAsGroup: {{ .Values.media.system.groupId }}
      initContainers:
      # The /app/cookies subPath dir is created root-owned; chown ONLY that dir
      # (same pattern as jellyseerr/komga — never the whole media volume).
      - name: init-permissions
        image: busybox:1.37.0
        securityContext:
          runAsUser: 0
        command: ['sh', '-c', 'mkdir -p /data/{{ .Values.mediarvester.storage.cookiesSubPath }} && chown -R {{ .Values.media.system.userId }}:{{ .Values.media.system.groupId }} /data/{{ .Values.mediarvester.storage.cookiesSubPath }}']
        volumeMounts:
        - name: {{ $appVolume }}
          mountPath: /data
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.mediarvester.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.mediarvester.image }}
        resources:
          {{- toYaml .Values.mediarvester.resources | nindent 10 }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: {{ .Values.mediarvester.ports.http.name }}
          containerPort: {{ .Values.mediarvester.ports.http.targetPort }}
        env:
        - name: DATABASE_URL
          value: {{ tpl .Values.mediarvester.database.url . | quote }}
        - name: MEDIA_ROOT
          value: /app/downloads
        - name: COOKIES_ROOT
          value: /app/cookies
        - name: AUTH_HEADER
          value: {{ .Values.mediarvester.auth.header | quote }}
        - name: DEFAULT_USER
          value: {{ .Values.mediarvester.auth.defaultUser | quote }}
        - name: ADMIN_GROUPS
          value: {{ include "media.mediarvesterAdminGroups" . | quote }}
        - name: DOWNLOAD_CONCURRENCY
          value: {{ .Values.mediarvester.downloadConcurrency | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.mediarvester.logLevel | quote }}
        - name: UMASK
          value: {{ .Values.mediarvester.umask | quote }}
        # glibc's default per-thread malloc arenas fragment badly under this
        # workload (ThreadPoolExecutor threads each repeatedly allocating/
        # freeing large yt-dlp JSON blobs + subprocess I/O buffers for the
        # Node.js JS-challenge solver) -- RSS climbs to the memory limit over
        # a few hours purely from unreturned-to-OS glibc arenas, not a real
        # Python-level leak. Capping arenas is the standard fix for this
        # pattern (see e.g. gunicorn/celery worker memory-growth advice).
        - name: MALLOC_ARENA_MAX
          value: "2"
        # Observability (see mediarvester/src/services/telemetry.py) -- plain
        # OTLP to the in-cluster collector's unauthenticated ClusterIP Service.
        # The external opentelemetry-collector-grpc.* hostname (see
        # gateway/grpc-ingress-route.yaml) is Authelia/tenant-guard gated and
        # meant for off-cluster clients -- an in-cluster pod talks to the
        # gateway Service directly instead, same as the node-collector
        # DaemonSet already does.
        - name: OTEL_SERVICE_NAME
          value: "mediarvester"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://{{ .Values.k8s.names.services.prefix }}{{ tpl .Values.observability.otelCollector.gateway.label . }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.otelCollector.gateway.ports.grpc.targetPort }}"
        # Mimir's OTLP ingest rejects delta-temporality payloads outright.
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: "cumulative"
        # Continuous profiling stopgap (not OTLP -- see telemetry.py's docstring).
        - name: PYROSCOPE_SERVER_ADDRESS
          value: "http://{{ .Values.k8s.names.services.prefix }}{{ .Values.observability.profiles.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.profiles.ports.http.targetPort }}"
        volumeMounts:
        - mountPath: /app/downloads
          subPath: {{ .Values.mediarvester.storage.mediaSubPath }}
          name: {{ $mediaVolume }}
        - mountPath: /app/cookies
          subPath: {{ .Values.mediarvester.storage.cookiesSubPath }}
          name: {{ $appVolume }}
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.mediarvester.label }}-pot-provider{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.mediarvester.potProvider.image }}
        resources:
          {{- toYaml .Values.mediarvester.potProvider.resources | nindent 10 }}
        imagePullPolicy: IfNotPresent
        # Overrides the pod-level runAsUser (media.system.userId) above -- this
        # sidecar mounts no volumes, so there's no NFS-permission reason to run
        # it as anything other than the image's own baked-in `node` user.
        securityContext:
          runAsUser: {{ .Values.mediarvester.potProvider.userId }}
          runAsGroup: {{ .Values.mediarvester.potProvider.groupId }}
        ports:
        - name: pot
          containerPort: {{ .Values.mediarvester.potProvider.port }}
      volumes:
      - name: {{ $mediaVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.mediarvester.storage.mediaPvc . }}
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.mediarvester.storage.appsPvc . }}
{{- end }}
