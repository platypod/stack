apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.traefik.names.pod }}
  labels:
    app: {{ .Values.traefik.names.pod }}

spec:
  replicas: {{ .Values.traefik.replicasNb }}
  selector:
    matchLabels:
      app: {{ .Values.traefik.names.pod }}
  template:
    metadata:
      labels:
        app: {{ .Values.traefik.names.pod }}
    spec:
      serviceAccountName: {{ .Values.traefik.names.serviceAccount }}
      containers:
      - name: {{ .Values.traefik.names.container }}
        image: {{ .Values.traefik.image.registry }}{{ .Values.traefik.image.namespace }}{{ .Values.traefik.image.repository }}:{{ .Values.traefik.image.tag }}
        args:
          # provider: file
          - --providers.file.directory=/file-providers
          # provider: kubernetes
          - --providers.kubernetesingress=true
          - --providers.kubernetesingress.allowEmptyServices=true
          - --providers.kubernetesingress.labelselector=chartVersion={{ .Chart.Version }},env={{ .Values.project.env }}
          - --providers.kubernetesingress.namespaces={{ .Values.k8s.namespace }}
          # dashboard
          - --api.insecure=true
          # logging
          - --log.level={{ .Values.traefik.logging.level }}
          - --log.format={{ .Values.traefik.logging.format }}
          - --accesslog
          # letsencrypt resolver
          - --certificatesresolvers.{{ .Values.traefik.tlsResolverName }}.acme.tlschallenge=true
          - --certificatesresolvers.{{ .Values.traefik.tlsResolverName }}.acme.email={{ .Values.acme.email }}
          - --certificatesresolvers.{{ .Values.traefik.tlsResolverName }}.acme.storage={{ .Values.acme.storage }}
          - --certificatesresolvers.{{ .Values.traefik.tlsResolverName }}.acme.caserver={{ .Values.acme.endpoint }}
          # entrypoints
          - --entryPoints.{{ .Values.traefik.ports.dashboard.name }}.address=:{{ .Values.traefik.ports.dashboard.targetPort }}
          - --entryPoints.{{ .Values.traefik.ports.https.name }}.address=:{{ .Values.traefik.ports.https.targetPort }}
        volumeMounts:
        - mountPath: /file-providers/jellyfin-local-proxy.yaml
          name: {{ .Values.traefik.names.configMap }}
          subPath: jellyfin-file-provider.yaml
      volumes:
      - name: {{ .Values.traefik.names.configMap }}
        configMap:
          name: {{ .Values.traefik.names.configMap }}
