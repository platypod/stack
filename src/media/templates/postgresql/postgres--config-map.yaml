apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.database.label }}{{ .Values.k8s.names.configMaps.suffix }}

data:
  init-db.sh: |
    #!/bin/bash
    set -e

    psql \
        -v ON_ERROR_STOP=1 \
        --username "$POSTGRES_USER" \
        --dbname "$POSTGRES_DB" \
    <<-EOSQL
      -- Superuser (used only for admin/init tasks)
      CREATE USER {{ $.Values.database.credentials.username }} PASSWORD '{{ $.Values.database.credentials.password }}';

      -- Per-service users (each service gets its own user with access to its own DBs only)
      {{- range $svc, $creds := .Values.database.serviceCredentials }}
      CREATE USER "{{ $creds.username }}" PASSWORD '{{ $creds.password }}';
      {{- end }}

      -- Databases: one per schema entry; grant to the matching service user when one exists
      {{- range $app, $map := .Values.database.schemas }}
      {{- $svcCreds := index $.Values.database.serviceCredentials $app }}
      {{- range $key, $dbName := $map }}
      CREATE DATABASE "{{ $dbName }}";
      GRANT ALL PRIVILEGES ON DATABASE "{{ $dbName }}" TO "{{ $.Values.database.credentials.username }}";
      {{- if $svcCreds }}
      GRANT ALL PRIVILEGES ON DATABASE "{{ $dbName }}" TO "{{ $svcCreds.username }}";
      {{- end }}
      {{- end }}
      {{- end }}

      -- PostgreSQL 15+ no longer grants CREATE on public schema by default.
      -- Connect to each service DB and grant schema-level privileges so services
      -- can run migrations without superuser.
      {{- range $app, $map := .Values.database.schemas }}
      {{- $svcCreds := index $.Values.database.serviceCredentials $app }}
      {{- range $key, $dbName := $map }}
      \connect "{{ $dbName }}"
      GRANT USAGE, CREATE ON SCHEMA public TO "{{ $.Values.database.credentials.username }}";
      {{- if $svcCreds }}
      GRANT USAGE, CREATE ON SCHEMA public TO "{{ $svcCreds.username }}";
      {{- end }}
      {{- end }}
      {{- end }}
    EOSQL
