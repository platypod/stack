# Builds apps/base/'s substrate/registry/per-module ConfigMaps and the 8
# HelmReleases. Depends on infra-crds so Traefik's CRDs exist before any
# chart that defines an IngressRoute tries to render one.
#
# apps/base/ is shared across clusters (Phase 7) — targetNamespace fills in
# every resource's metadata.namespace (ConfigMaps + HelmReleases alike),
# and postBuild.substitute resolves the ${env} tokens in each HelmRelease's
# releaseName/targetNamespace. See stack/docs/flux-migration.md Phase 7.
#
# path is ./apps/local-overlay, not ./apps/base directly — that overlay
# wraps apps/base and layers local's own mediarvester image override on top
# (see apps/local-overlay/kustomization.yaml). apps/base/values/media.yaml
# itself is prod-authoritative now; local always tracks ahead of it via the
# overlay. The overlay deliberately lives under apps/, not nested inside
# clusters/local/ — see apps/local-overlay/kustomization.yaml's own comment
# for why that would break this cluster's own top-level Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/local-overlay
  prune: true
  targetNamespace: local-platypod
  postBuild:
    substitute:
      env: local
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-crds
