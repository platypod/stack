apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.homepage.label }}{{ .Values.k8s.names.configMaps.suffix }}

data:
  kubernetes.yaml: ""
  settings.yaml: |
    title: Platypod
    maxGroupColumns: 3
    useEqualHeights: true
    layout:
      Media-User:
        style: row
        columns: 4
        icon: mdi-television-play
      Infrastructure:
        style: row
        columns: 3
        icon: mdi-server-network
      Dev Tools:
        style: row
        columns: 4
        icon: mdi-tools
      Games:
        style: row
        columns: 2
        icon: mdi-gamepad-variant
      Media-Maintainer:
        style: row
        columns: 4
        icon: mdi-movie-cog
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Dev:
      - Github:
        - icon: si-github
          href: https://github.com/
          description: Code versioning server.
    - Social:
      - Reddit:
        - icon: si-reddit
          href: https://reddit.com/
          description: Social network.
    - Entertainment:
      - Invidious:
        - icon: si-youtube
          href: https://api.invidious.io/
          description: YouTube without ads.
  services.yaml: |
{{- if or .Values.jellyfin.enable .Values.jellyseerr.enable .Values.mediarvester.enable .Values.komga.enable .Values.kavita.enable .Values.deluge.enable .Values.qbittorrent.enable }}
    - Media-User:
{{- if .Values.jellyfin.enable }}
      - Jellyfin:
          icon: jellyfin.png
          href: https://{{ tpl .Values.jellyfin.host . }}
          description: Media server with streaming capacities.
          widget:
            type: jellyfin
            url: http://{{ if .Values.jellyfin.proxy.enable }}{{ .Values.jellyfin.proxy.host }}:{{ .Values.jellyfin.proxy.port }}{{ else }}{{ .Values.jellyfin.label }}:{{ .Values.jellyfin.ports.http.targetPort }}{{ end }}{{ .Values.jellyfin.baseUrl }}
            key: "{{ if .Values.jellyfin.proxy.enable }}{{ .Values.jellyfin.apiKey }}{{ else }}{{`{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}`}}{{ end }}"
            enableBlocks: true
            enableNowPlaying: true
            enableUser: true
            showEpisodeNumber: true
            expandOneStreamToTwoRows: false
{{- end }}
{{- if .Values.jellyseerr.enable }}
      - JellySeerr:
          icon: jellyseerr.png
          href: https://{{ tpl .Values.jellyseerr.host . }}
          description: Media catalog to pick movies and series.
          widget:
            type: jellyseerr
            url: http://{{ .Values.jellyseerr.label }}:{{ .Values.jellyseerr.ports.http.targetPort }}
            key: "{{ .Values.jellyseerr.apiKey }}"
{{- end }}
{{- if .Values.mediarvester.enable }}
      - Mediarvester:
          icon: mdi-download-circle
          href: https://{{ tpl .Values.mediarvester.host . }}
          description: Multi-platform media downloader (YouTube, Instagram, X, …).
{{- end }}
{{- if .Values.komga.enable }}
      - Komga:
          icon: komga.png
          href: https://{{ tpl .Values.komga.host . }}
          description: Comics, manga and ebook library.
{{- end }}
{{- if .Values.kavita.enable }}
      - Kavita:
          icon: kavita.png
          href: https://{{ tpl .Values.kavita.host . }}
          description: Manga, comics and ebook reader.
{{- end }}
{{- if .Values.audiobookshelf.enable }}
      - Audiobookshelf:
          icon: audiobookshelf.png
          href: https://{{ tpl .Values.audiobookshelf.host . }}
          description: Audiobook and podcast server.
{{- end }}
{{- if .Values.deluge.enable }}
      - Deluge:
          icon: deluge.png
          href: https://{{ tpl .Values.deluge.host . }}
          description: Torrenting client.
          widget:
            type: deluge
            url: http://{{ .Values.deluge.label }}:{{ .Values.deluge.ports.http.targetPort }}
            password: "{{ .Values.deluge.credentials.password }}"
            enableLeechProgress: true
{{- end }}
{{- if .Values.qbittorrent.enable }}
      - QBitTorrent:
          icon: qbittorrent.png
          href: https://{{ tpl .Values.qbittorrent.host . }}
          description: Torrenting client.
          widget:
            type: qbittorrent
            url: http://{{ .Values.qbittorrent.label }}:{{ .Values.qbittorrent.ports.http.targetPort }}
            username: "{{ .Values.qbittorrent.credentials.username }}"
            password: "{{ .Values.qbittorrent.credentials.password }}"
            enableLeechProgress: true
{{- end }}
{{- end }}
    - Infrastructure:
      - Traefik:
          icon: traefik.png
          href: https://{{ tpl .Values.traefik.host . }}/dashboard/
          description: Reverse-proxy exposing this stack to the users.
          widget:
            type: traefik
            url: http://{{ .Values.traefik.dashboardLabel }}:{{ .Values.traefik.ports.dashboard.targetPort }}
{{- if .Values.adguard.enable }}
      - AdGuard:
          icon: adguard-home.png
          href: https://{{ tpl .Values.adguard.host . }}
          description: DNS-level ad & tracker blocker.
          widget:
            type: adguard
            url: http://{{ .Values.adguard.label }}:{{ .Values.adguard.ports.http.targetPort }}
            username: "{{ .Values.adguard.credentials.username }}"
            password: "{{ .Values.adguard.credentials.password }}"
{{- end }}
{{- if .Values.observability.enable }}
      - Grafana:
          icon: grafana.png
          href: https://{{ tpl .Values.observability.dashboard.host . }}
          description: Dashboards to monitor everything and know what's up.
{{- end }}
      - Authelia:
          icon: authelia.png
          href: https://{{ tpl .Values.authelia.host . }}
          description: SSO & 2FA gateway.
      - LLDAP:
          icon: lldap.png
          href: https://{{ tpl .Values.lldap.host . }}
          description: Lightweight LDAP user & group management.
{{- if .Values.uptimeKuma.enable }}
      - Uptime Kuma:
          icon: uptime-kuma.png
          href: https://{{ tpl .Values.uptimeKuma.host . }}
          description: Service uptime and status monitoring.
          widget:
            type: uptimekuma
            url: http://{{ .Values.uptimeKuma.label }}:{{ .Values.uptimeKuma.ports.http.targetPort }}
            slug: all
{{- end }}
{{- if or .Values.bookstack.enable .Values.wikijs.enable .Values.outline.enable .Values.itTools.enable .Values.cyberChef.enable .Values.dbeaver.enable .Values.whoami.enable .Values.vaultwarden.enable }}
    - Dev Tools:
{{- if .Values.bookstack.enable }}
      - Bookstack:
          icon: bookstack.png
          href: https://{{ tpl .Values.bookstack.host . }}
          description: Simple wiki and documentation platform.
{{- end }}
{{- if .Values.wikijs.enable }}
      - Wiki.js:
          icon: wikijs.png
          href: https://{{ tpl .Values.wikijs.host . }}
          description: Powerful wiki with modern editor and Git sync.
{{- end }}
{{- if .Values.outline.enable }}
      - Outline:
          icon: outline.png
          href: https://{{ tpl .Values.outline.host . }}
          description: Team wiki and knowledge base.
{{- end }}
{{- if .Values.itTools.enable }}
      - IT-Tools:
          icon: it-tools.png
          href: https://{{ tpl .Values.itTools.host . }}
          description: Useful tools for developers.
{{- end }}
{{- if .Values.cyberChef.enable }}
      - CyberChef:
          icon: cyberchef.png
          href: https://{{ tpl .Values.cyberChef.host . }}
          description: Cyber operations from a browser.
{{- end }}
{{- if .Values.dbeaver.enable }}
      - DBeaver:
          icon: mdi-database-search
          href: https://{{ tpl .Values.dbeaver.host . }}
          description: Database web interface.
{{- end }}
{{- if .Values.whoami.enable }}
      - Who am I?:
          icon: mdi-server-network
          href: https://{{ tpl .Values.whoami.host . }}
          description: Prints OS info and HTTP request details.
{{- end }}
{{- if .Values.vaultwarden.enable }}
      - Vaultwarden:
          icon: vaultwarden.png
          href: https://{{ tpl .Values.vaultwarden.host . }}
          description: Self-hosted Bitwarden-compatible password manager.
{{- end }}
{{- end }}
{{- if or .Values.rommapp.enable .Values.pokeclicker.enable .Values.unbegotten.enable }}
    - Games:
{{- if .Values.rommapp.enable }}
      - RommApp:
          icon: romm.png
          href: https://{{ tpl .Values.rommapp.host . }}
          description: Console ROM manager and emulator frontend.
{{- end }}
{{- if .Values.pokeclicker.enable }}
      - Pokeclicker:
          icon: mdi-pokeball
          href: https://{{ tpl .Values.pokeclicker.host . }}
          description: Pokémon idle clicker game.
{{- end }}
{{- if .Values.unbegotten.enable }}
      - Unbegotten:
          icon: mdi-earth
          href: https://{{ tpl .Values.unbegotten.host . }}
          description: 3D maze wrapped onto the inside of a sphere.
{{- end }}
{{- end }}
{{- if or .Values.prowlarr.enable .Values.transmission.enable .Values.suwayomi.enable .Values.radarr.enable .Values.sonarr.enable .Values.readarr.enable .Values.shelfmark.enable .Values.bazarr.enable .Values.flaresolverr.enable .Values.reclaimerr.enable .Values.sabnzbd.enable .Values.tdarr.enable }}
    - Media-Maintainer:
{{- if .Values.prowlarr.enable }}
      - Prowlarr:
          icon: prowlarr.png
          href: https://{{ tpl .Values.prowlarr.host . }}
          description: Indexer manager for torrent trackers and usenet indexers.
          widget:
            type: prowlarr
            url: http://{{ .Values.prowlarr.label }}:{{ .Values.prowlarr.ports.http.targetPort }}
            key: "{{ .Values.prowlarr.apiKey }}"
{{- end }}
{{- if .Values.transmission.enable }}
      - Transmission:
          icon: transmission.png
          href: https://{{ tpl .Values.transmission.host . }}
          description: Torrenting client.
          widget:
            type: transmission
            url: http://{{ .Values.transmission.label }}:{{ .Values.transmission.ports.http.targetPort }}
            username: "{{ .Values.transmission.credentials.username }}"
            password: "{{ .Values.transmission.credentials.password }}"
            rpcUrl: /transmission/
{{- end }}
{{- if .Values.sabnzbd.enable }}
      - SABnzbd:
          icon: sabnzbd.png
          href: https://{{ tpl .Values.sabnzbd.host . }}
          description: Usenet client.
          widget:
            type: sabnzbd
            url: http://{{ .Values.sabnzbd.label }}:{{ .Values.sabnzbd.ports.http.targetPort }}
            key: "{{ .Values.sabnzbd.apiKey }}"
{{- end }}
{{- if .Values.suwayomi.enable }}
      - Suwayomi:
          icon: suwayomi.png
          href: https://{{ tpl .Values.suwayomi.host . }}
          description: Manga downloader (feeds Kavita).
{{- end }}
{{- if .Values.radarr.enable }}
      - Radarr:
          icon: radarr.png
          href: https://{{ tpl .Values.radarr.host . }}
          description: Movie collection manager.
          widget:
            type: radarr
            url: http://{{ .Values.radarr.label }}:{{ .Values.radarr.ports.http.targetPort }}
            key: "{{ .Values.radarr.apiKey }}"
{{- end }}
{{- if .Values.sonarr.enable }}
      - Sonarr:
          icon: sonarr.png
          href: https://{{ tpl .Values.sonarr.host . }}
          description: Series collection manager.
          widget:
            type: sonarr
            url: http://{{ .Values.sonarr.label }}:{{ .Values.sonarr.ports.http.targetPort }}
            key: "{{ .Values.sonarr.apiKey }}"
{{- end }}
{{- if .Values.readarr.enable }}
      - Readarr:
          icon: readarr.png
          href: https://{{ tpl .Values.readarr.host . }}
          description: Books collection manager.
          widget:
            type: readarr
            url: http://{{ .Values.readarr.label }}:{{ .Values.readarr.ports.http.targetPort }}
            key: "{{ .Values.readarr.apiKey }}"
{{- end }}
{{- if .Values.shelfmark.enable }}
      - Shelfmark:
          icon: shelfmark.png
          href: https://{{ tpl .Values.shelfmark.host . }}
          description: Book/audiobook search and request tool (Readarr replacement).
{{- end }}
{{- if .Values.bazarr.enable }}
      - Bazarr:
          icon: bazarr.png
          href: https://{{ tpl .Values.bazarr.host . }}
          description: Subtitles manager for Radarr and Sonarr.
          widget:
            type: bazarr
            url: http://{{ .Values.bazarr.label }}:{{ .Values.bazarr.ports.http.targetPort }}
            key: "{{ .Values.bazarr.apiKey }}"
{{- end }}
{{- if .Values.flaresolverr.enable }}
      - FlareSolverr:
          icon: flaresolverr.png
          href: https://{{ tpl .Values.flaresolverr.host . }}
          description: CloudFlare bypass proxy.
{{- end }}
{{- if .Values.reclaimerr.enable }}
      - Reclaimerr:
          icon: mdi-delete-sweep
          href: https://{{ tpl .Values.reclaimerr.host . }}
          description: Automatically reclaims media disk space.
{{- end }}
{{- if .Values.tdarr.enable }}
      - Tdarr:
          icon: mdi-video-wireless
          href: https://{{ tpl .Values.tdarr.host . }}
          description: Media transcoding and normalization pipeline.
{{- end }}
{{- end }}
  widgets.yaml: |
    # https://gethomepage.dev/widgets/info/resources/
    - resources:
        backend: resources
        expanded: true
        units: metric
        cpu: true
        memory: true
        uptime: true
        network: default
    # https://gethomepage.dev/widgets/info/search/
    - search:
        provider: [google, duckduckgo, brave]
        focus: true
        showSearchSuggestions: true
        target: _blank
  docker.yaml: ""
