uptimeKuma:
  enable: true
  label: uptime-kuma
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.uptimeKuma.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  # Pinned to the 1.23.x stable line. 2.x is a beta that dropped the Socket.io
  # API the seed Job (uptime-kuma-api) relies on — see docs/services.md.
  image: louislam/uptime-kuma:1.23.17
  ports:
    http:
      name: uk-http
      targetPort: 3001
  # SQLite DB → dedicated local volume (NFS can't host SQLite WAL).
  pvc: "{{ .Values.storage.defaultVolumes.config }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # First-boot admin, created by the seed Job. Override per env if desired.
  credentials:
    username: admin
    password: uptime-kuma-admin
  # Monitors seeded by the post-install/upgrade Job. Each is an in-cluster HTTP
  # check against the service's ClusterIP (bypasses Authelia, so we see the real
  # app health, not a 302 to the login page). Idempotent: matched by name.
  # `url` is tpl'd. Disabled services should be removed/commented here.
  # `enable` (tpl'd by the setup Job) gates a monitor on its service's enable flag:
  # disabled services are pruned, not monitored. Always-on infra omits `enable`.
  monitors:
    - { name: "Homepage",     url: "http://homepage:3000" }
    - { name: "Traefik",      url: "http://traefik-dashboard:9999" }
    - { name: "Authelia",     url: "http://authelia:9091" }
    - { name: "LLDAP",        url: "http://lldap:17170" }
    - { name: "Grafana",      url: "http://grafana:3000" }
    - { name: "Mimir",        url: "http://mimir:8080/ready" }
    - { name: "Loki",         url: "http://loki:3100/ready" }
    - { name: "Tempo",        url: "http://tempo:80/ready" }
    - { name: "AdGuard",      url: "http://adguard:80",          enable: "{{ .Values.adguard.enable }}" }
    - { name: "BookStack",    url: "http://bookstack:80",        enable: "{{ .Values.bookstack.enable }}" }
    - { name: "Wiki.js",      url: "http://wikijs:3000",         enable: "{{ .Values.wikijs.enable }}" }
    - { name: "Outline",      url: "http://outline:3000",        enable: "{{ .Values.outline.enable }}" }
    - { name: "Vaultwarden",  url: "http://vaultwarden:80/alive", enable: "{{ .Values.vaultwarden.enable }}" }
    - { name: "IT-Tools",     url: "http://it-tools:80",         enable: "{{ .Values.itTools.enable }}" }
    - { name: "CyberChef",    url: "http://cyber-chef:80",       enable: "{{ .Values.cyberChef.enable }}" }
    - { name: "whoami",       url: "http://whoami:80",           enable: "{{ .Values.whoami.enable }}" }
    - { name: "Jellyfin",     url: "http://jellyfin:8096/health", enable: "{{ .Values.jellyfin.enable }}" }
    - { name: "Jellyseerr",   url: "http://jellyseerr:5055",     enable: "{{ .Values.jellyseerr.enable }}" }
    - { name: "Radarr",       url: "http://radarr:7878",         enable: "{{ .Values.radarr.enable }}" }
    - { name: "Sonarr",       url: "http://sonarr:8989",         enable: "{{ .Values.sonarr.enable }}" }
    - { name: "Readarr",      url: "http://readarr:8787",        enable: "{{ .Values.readarr.enable }}" }
    - { name: "Prowlarr",     url: "http://prowlarr:9696",       enable: "{{ .Values.prowlarr.enable }}" }
    - { name: "Bazarr",       url: "http://bazarr:6767",         enable: "{{ .Values.bazarr.enable }}" }
    - { name: "Mediarvester", url: "http://mediarvester:8080",   enable: "{{ .Values.mediarvester.enable }}" }
    - { name: "Reclaimerr",   url: "http://reclaimerr:8000",     enable: "{{ .Values.reclaimerr.enable }}" }
    - { name: "Komga",        url: "http://komga:25600",         enable: "{{ .Values.komga.enable }}" }
    - { name: "Kavita",       url: "http://kavita:5000",         enable: "{{ .Values.kavita.enable }}" }
    - { name: "Suwayomi",     url: "http://suwayomi:4567",       enable: "{{ .Values.suwayomi.enable }}" }
    - { name: "Flaresolverr", url: "http://flaresolverr:8191",   enable: "{{ .Values.flaresolverr.enable }}" }
    - { name: "Transmission", url: "http://transmission:9091",   enable: "{{ .Values.transmission.enable }}" }
    - { name: "RomM",         url: "http://rommapp:8080",        enable: "{{ .Values.rommapp.enable }}" }
    - { name: "PokeClicker",  url: "http://pokeclicker:3000",    enable: "{{ .Values.pokeclicker.enable }}" }
