apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.k8s.names.services.prefix }}{{ .Values.observability.prometheusSnmpExporter.label }}{{ .Values.k8s.names.services.suffix }}

spec:
  ports:
  - protocol: TCP
    name: {{ .Values.observability.prometheusSnmpExporter.ports.http.name }}
    port: {{ .Values.observability.prometheusSnmpExporter.ports.http.targetPort }}
    targetPort: {{ .Values.observability.prometheusSnmpExporter.ports.http.targetPort }}
  selector:
    app: {{ .Values.k8s.names.pods.prefix }}{{ .Values.observability.prometheusSnmpExporter.label }}{{ .Values.k8s.names.pods.suffix }}
