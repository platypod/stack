apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.k8s.names.services.prefix }}{{ tpl .Values.wikijs.database.label . }}{{ .Values.k8s.names.services.suffix }}

spec:
  ports:
  - protocol: TCP
    name: {{ .Values.wikijs.database.ports.http.name }}
    port: {{ .Values.wikijs.database.ports.http.targetPort }}
  selector:
    app: {{ .Values.k8s.names.pods.prefix }}{{ tpl .Values.wikijs.database.label . }}{{ .Values.k8s.names.pods.suffix }}
