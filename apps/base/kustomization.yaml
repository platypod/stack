# Substrate/registry/per-module ConfigMaps + the 8 HelmReleases. The Secrets
# tier (secretGenerator) is NOT here — it's sourced from the platypod-sops
# GitRepository, which needs its own Kustomization with a different
# sourceRef; see clusters/local/secrets.yaml. See stack/docs/flux-migration.md
# for the tier design and gotcha 2 (kustomizeconfig.yaml, below).
#
# Shared across every cluster (local/prd) — no `namespace:` transformer here
# on purpose. Namespace is filled in per cluster by that cluster's own Flux
# Kustomization (clusters/<env>/apps.yaml)'s spec.targetNamespace, and each
# HelmRelease's own releaseName/targetNamespace fields use `${env}` tokens
# resolved via that same Kustomization's spec.postBuild.substitute. See
# stack/docs/flux-migration.md Phase 7 design notes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

configMapGenerator:
  - name: platypod-substrate
    files:
      - substrate.yaml=values/substrate.yaml
  - name: platypod-registry
    files:
      - registry.yaml=values/registry.yaml
  - name: platypod-core
    files:
      - core.yaml=values/core.yaml
  - name: platypod-dev-tools
    files:
      - dev-tools.yaml=values/dev-tools.yaml
  - name: platypod-files
    files:
      - files.yaml=values/files.yaml
  - name: platypod-games
    files:
      - games.yaml=values/games.yaml
  - name: platypod-media
    files:
      - media.yaml=values/media.yaml
  - name: platypod-observability
    files:
      - observability.yaml=values/observability.yaml
  - name: platypod-security
    files:
      - security.yaml=values/security.yaml

generatorOptions:
  disableNameSuffixHash: false

resources:
  - helmrelease-persistence.yaml
  - helmrelease-core.yaml
  - helmrelease-security.yaml
  - helmrelease-observability.yaml
  - helmrelease-dev-tools.yaml
  - helmrelease-media.yaml
  - helmrelease-games.yaml
  - helmrelease-files.yaml
