transmission:
  host: ${k8s.names.urls.prefix}${transmission.label}${k8s.names.urls.suffix}.${traefik.domain}
  image: lscr.io/linuxserver/transmission:latest
  label: transmission
  credentials:
    username: transmission
    password: transmission
  download:
    torrents: ${media.system.downloads.torrents}
    ongoing: ${media.system.downloads.ongoing}
    finished: ${media.system.downloads.finished}
  exporter:
    label: ${transmission.label}-exporter
    image: transmission-exporter:arm64
    ports:
      http:
        name: http
        nodePort: 31416
        targetPort: 9092
  ports:
    http:
      name: webui
      nodePort: 31415
      targetPort: 9091
    peer:
      name: peer-listening
      nodePort: 31413
      targetPort: 51413
  pvc:
    app: ${storage.defaultVolumes.apps}
    media: ${storage.defaultVolumes.media}
  replicasNb: 1
