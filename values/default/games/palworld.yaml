palworld:
  enable: false
  # Address this Service answers on from the LAN when there's no MetalLB (see
  # traefik.externalIP for the mechanism). Ports 8211/27015 udp don't collide
  # with Traefik (80/443) or AdGuard (53), so it can share the same address.
  externalIP: ""
  loadBalancerIP: ""  # MetalLB path only (dev); ignored when externalIP is set.
  # Pin to the node that owns externalIP. Required in prod.
  nodeSelector: {}
  label: palworld
  image: thijsvanloef/palworld-server-docker:v2.7.1
  ports:
    game:
      name: game
      port: 8211
      targetPort: 8211
    query:
      name: query
      port: 27015
      targetPort: 27015
  server:
    name: "Platypod Palworld"
    description: ""
    password: ""
    adminPassword: changeme
    maxPlayers: 16
    community: false
    # ENABLE_PERF_THREADING_ARGS replaces the image's deprecated MULTITHREADING
    # toggle (optionally paired with a WORKER_THREADS_SERVER count via
    # extraEnv; unset uses the game's own default thread count).
    perfThreadingArgs: false
    # Passthrough for any other thijsvanloef/palworld-server-docker env var
    # (i.e. any PalWorldSettings.ini key in its documented table) without
    # needing a chart change per setting, e.g.:
    #   extraEnv:
    #     DEATH_PENALTY: "None"   # default is "Item"; drops nothing on death
    extraEnv: {}
  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      memory: 8Gi
