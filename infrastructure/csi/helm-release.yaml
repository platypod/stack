# Prod-only — local uses hostPath storage, not NFS (stack/docs/conventions.md).
# Version pinned to match the imperative `make install-csi` target
# (CSI_DRIVER_NFS_VERSION in Makefile) — keep both in sync until that
# target retires (Phase 8). Pre-authored per stack/docs/flux-migration.md
# Phase 5: inert until prod is bootstrapped onto Flux (Phase 7) — this
# HelmRelease isn't reconciled by anything yet, since clusters/prd/ has no
# flux-system/ (that's `flux bootstrap`-generated, not hand-written).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.2"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  targetNamespace: kube-system
