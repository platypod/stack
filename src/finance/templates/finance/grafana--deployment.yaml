{{- if and .Values.finance.enable .Values.finance.grafana.enable }}
{{- $g := .Values.finance.grafana }}
{{- $pod := print .Values.k8s.names.pods.prefix (tpl $g.label .) .Values.k8s.names.pods.suffix }}
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/finance/grafana--config-map.yaml") . | sha256sum }}
        checksum/dashboards: {{ include (print $.Template.BasePath "/finance/grafana--dashboards-config-map.yaml") . | sha256sum }}
        checksum/env: {{ include (print $.Template.BasePath "/finance/grafana--secret.yaml") . | sha256sum }}
    spec:
      {{- if .Values.traefik.loadBalancerIP }}
      # Same OIDC back-channel trick as the shared Grafana: resolve the Authelia public
      # host to Traefik so token/userinfo calls carry the X-Forwarded-* headers Authelia needs.
      hostAliases:
      - ip: {{ .Values.traefik.loadBalancerIP }}
        hostnames:
        - {{ tpl .Values.authelia.host . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ tpl $g.label . }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ tpl $g.image . }}
        ports:
        - containerPort: {{ $g.ports.http.targetPort }}
        envFrom:
        - secretRef:
            name: {{ .Values.k8s.names.services.prefix }}{{ tpl $g.label . }}{{ .Values.k8s.names.services.suffix }}-env
        readinessProbe:
          httpGet:
            path: /api/health
            port: {{ $g.ports.http.targetPort }}
          periodSeconds: 10
        resources:
          {{- toYaml $g.resources | nindent 10 }}
        volumeMounts:
        - name: conf
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: conf
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
        - name: conf
          mountPath: /etc/grafana/provisioning/dashboards/finance.yaml
          subPath: dashboards-providers.yaml
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards/finance
        # Grafana's own state (sessions, preferences) is disposable: everything that
        # matters is provisioned. emptyDir also keeps SQLite off NFS.
        - name: data
          mountPath: /var/lib/grafana
      volumes:
      - name: conf
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ tpl $g.label . }}{{ .Values.k8s.names.configMaps.suffix }}
      - name: dashboards
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ tpl $g.label . }}-dashboards{{ .Values.k8s.names.configMaps.suffix }}
      - name: data
        emptyDir: {}
{{- end }}
