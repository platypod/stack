{{- $jwks := genSelfSignedCert .Values.authelia.oidc.jwks.commonName nil (list .Values.authelia.oidc.jwks.commonName) 365 }}

apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.authelia.label }}{{ .Values.k8s.names.configMaps.suffix }}

data:
  setup.sh: |
    #!/bin/sh
    cp /configuration.yml /config/configuration.yml
  configuration.yml: |
    theme: dark

    identity_validation:
      reset_password:
        jwt_secret: {{ .Values.authelia.secrets.jwt }}

    identity_providers:
      oidc:
        cors:
          allowed_origins_from_client_redirect_uris: true
          endpoints:
          - 'authorization'
          - 'token'
          - 'revocation'
          - 'introspection'
        # Claims policy: inject `groups` (and friends) into the ID token.
        # By default Authelia (>=4.38) only exposes groups at the userinfo
        # endpoint, but Grafana evaluates role_attribute_path against the ID
        # token — so without this, group-based role mapping always falls through
        # to the default role. Attached to the Grafana client below.
        claims_policies:
          platypod:
            id_token:
            - 'groups'
            - 'email'
            - 'email_verified'
            - 'name'
            - 'preferred_username'
        ## See: https://www.authelia.com/c/oidc
        clients:
        {{- if .Values.rommapp.oidc.clientId }}
        - audience:
          - 'https://{{ tpl .Values.rommapp.host . }}'
          authorization_policy: 'one_factor'
          claims_policy: 'platypod'
          client_id: '{{ .Values.rommapp.oidc.clientId }}'
          client_name: 'RomM'
          client_secret: '{{ .Values.rommapp.oidc.clientSecret.hashed }}'
          public: false
          redirect_uris:
          - 'https://{{ tpl .Values.rommapp.host . }}/api/oauth/openid'
          scopes:
          - 'openid'
          - 'profile'
          - 'email'
          token_endpoint_auth_method: 'client_secret_basic'
          userinfo_signed_response_alg: 'none'
        {{- end }}
        {{- if .Values.reclaimerr.oidc.clientId }}
        - audience:
          - 'https://{{ tpl .Values.reclaimerr.host . }}'
          authorization_policy: 'one_factor'
          claims_policy: 'platypod'
          client_id: '{{ .Values.reclaimerr.oidc.clientId }}'
          client_name: 'Reclaimerr'
          client_secret: '{{ .Values.reclaimerr.oidc.clientSecret.hashed }}'
          public: false
          redirect_uris:
          - 'https://{{ tpl .Values.reclaimerr.host . }}/api/auth/oidc/callback'
          scopes:
          - 'openid'
          - 'profile'
          - 'email'
          token_endpoint_auth_method: 'client_secret_basic'
          userinfo_signed_response_alg: 'none'
        {{- end }}
        {{- if .Values.vaultwarden.oidc.clientId }}
        - audience:
          - 'https://{{ tpl .Values.vaultwarden.host . }}'
          authorization_policy: 'one_factor'
          claims_policy: 'platypod'
          client_id: '{{ .Values.vaultwarden.oidc.clientId }}'
          client_name: 'Vaultwarden'
          client_secret: '{{ .Values.vaultwarden.oidc.clientSecret.hashed }}'
          public: false
          redirect_uris:
          - 'https://{{ tpl .Values.vaultwarden.host . }}/identity/connect/oidc-signin'
          # explicit response_types so the offline_access scope (refresh tokens)
          # is valid — silences the Authelia deprecation warning that becomes an
          # error in future versions.
          response_types:
          - 'code'
          scopes:
          - 'openid'
          - 'profile'
          - 'email'
          # refresh tokens so the web vault can extend sessions
          - 'offline_access'
          grant_types:
          - 'authorization_code'
          - 'refresh_token'
          token_endpoint_auth_method: 'client_secret_basic'
          userinfo_signed_response_alg: 'none'
        {{- end }}
        {{- if .Values.kavita.oidc.clientId }}
        - audience:
          - 'https://{{ tpl .Values.kavita.host . }}'
          authorization_policy: 'one_factor'
          claims_policy: 'platypod'
          client_id: '{{ .Values.kavita.oidc.clientId }}'
          client_name: 'Kavita'
          client_secret: '{{ .Values.kavita.oidc.clientSecret.hashed }}'
          public: false
          redirect_uris:
          # ASP.NET Core OIDC default callback path.
          - 'https://{{ tpl .Values.kavita.host . }}/signin-oidc'
          response_types:
          - 'code'
          scopes:
          - 'openid'
          - 'profile'
          - 'email'
          # Kavita's ASP.NET Core OIDC handler requests a refresh token.
          - 'offline_access'
          grant_types:
          - 'authorization_code'
          - 'refresh_token'
          # Kavita's ASP.NET Core OIDC handler sends the secret in the token
          # request body (client_secret_post), not the Authorization header.
          token_endpoint_auth_method: 'client_secret_post'
          userinfo_signed_response_alg: 'none'
        {{- end }}
        {{- if .Values.audiobookshelf.oidc.clientId }}
        - audience:
          - 'https://{{ tpl .Values.audiobookshelf.host . }}'
          authorization_policy: 'one_factor'
          claims_policy: 'platypod'
          client_id: '{{ .Values.audiobookshelf.oidc.clientId }}'
          client_name: 'Audiobookshelf'
          client_secret: '{{ .Values.audiobookshelf.oidc.clientSecret.hashed }}'
          public: false
          # Audiobookshelf's OIDC client requires PKCE.
          require_pkce: true
          pkce_challenge_method: 'S256'
          redirect_uris:
          - 'https://{{ tpl .Values.audiobookshelf.host . }}/auth/openid/callback'
          - 'https://{{ tpl .Values.audiobookshelf.host . }}/auth/openid/mobile-redirect'
          - 'audiobookshelf://oauth'
          response_types:
          - 'code'
          scopes:
          - 'openid'
          - 'profile'
          - 'email'
          grant_types:
          - 'authorization_code'
          token_endpoint_auth_method: 'client_secret_basic'
          access_token_signed_response_alg: 'none'
          userinfo_signed_response_alg: 'none'
        {{- end }}
        {{- if and .Values.komga.enable .Values.komga.oidc.clientId }}
        - audience:
          - 'https://{{ tpl .Values.komga.host . }}'
          authorization_policy: 'one_factor'
          claims_policy: 'platypod'
          client_id: '{{ .Values.komga.oidc.clientId }}'
          client_name: 'Komga'
          client_secret: '{{ .Values.komga.oidc.clientSecret.hashed }}'
          public: false
          redirect_uris:
          # Spring Security's default OAuth2 callback path for the
          # "authelia" client registration (see the komga deployment).
          - 'https://{{ tpl .Values.komga.host . }}/login/oauth2/code/authelia'
          scopes:
          - 'openid'
          - 'profile'
          - 'email'
          token_endpoint_auth_method: 'client_secret_basic'
          userinfo_signed_response_alg: 'none'
        {{- end }}
        - audience:
          - 'https://{{ tpl .Values.bookstack.host . }}'
          authorization_policy: 'one_factor'
          claims_policy: 'platypod'
          client_id: '{{ .Values.bookstack.oidc.clientId }}'
          client_name: 'BookStack'
          client_secret: '{{ .Values.bookstack.oidc.clientSecret.hashed }}'
          public: false
          redirect_uris:
          - 'https://{{ tpl .Values.bookstack.host . }}/oidc/callback'
          scopes:
          - 'openid'
          - 'profile'
          - 'groups'
          - 'email'
          token_endpoint_auth_method: 'client_secret_basic'
          #token_endpoint_auth_method: 'client_secret_jwt'
          #token_endpoint_auth_method: 'private_key_jwt'
          # disable signing for userinfo
          userinfo_signed_response_alg: 'none'
        - audience:
          - 'https://{{ tpl .Values.observability.dashboard.host . }}'
          authorization_policy: 'one_factor'
          claims_policy: 'platypod'
          client_id: '{{ .Values.observability.dashboard.oidc.clientId }}'
          client_name: 'Grafana'
          client_secret: '{{ .Values.observability.dashboard.oidc.clientSecret.hashed }}'
          public: false
          redirect_uris:
          - 'https://{{ tpl .Values.observability.dashboard.host . }}/login/generic_oauth'
          scopes:
          - 'openid'
          - 'profile'
          - 'groups'
          - 'email'
          token_endpoint_auth_method: 'client_secret_basic'
          #token_endpoint_auth_method: 'client_secret_jwt'
          #token_endpoint_auth_method: 'private_key_jwt'
          # disable signing for userinfo
          userinfo_signed_response_alg: 'none'
        - audience:
          - 'https://{{ tpl .Values.wikijs.host . }}'
          authorization_policy: 'one_factor'
          claims_policy: 'platypod'
          client_id: '{{ .Values.wikijs.oidc.clientId }}'
          client_name: 'Wiki.js'
          client_secret: '{{ .Values.wikijs.oidc.clientSecret.hashed }}'
          public: false
          redirect_uris:
          - '{{ tpl .Values.wikijs.oidc.redirectUri . }}'
          scopes:
          - 'openid'
          - 'profile'
          - 'groups'
          - 'email'
          # Wiki.js's passport-openidconnect sends the client secret in the body
          # (client_secret_post), not the Authorization header (basic).
          token_endpoint_auth_method: 'client_secret_post'
          userinfo_signed_response_alg: 'none'
        - audience:
          - 'https://{{ tpl .Values.outline.host . }}'
          authorization_policy: 'one_factor'
          claims_policy: 'platypod'
          client_id: '{{ .Values.outline.oidc.clientId }}'
          client_name: 'Outline'
          client_secret: '{{ .Values.outline.oidc.clientSecret.hashed }}'
          consent_mode: implicit
          public: false
          redirect_uris:
          - 'https://{{ tpl .Values.outline.host . }}/auth/oidc.callback'
          scopes:
          - 'openid'
          - 'profile'
          - 'email'
          token_endpoint_auth_method: 'client_secret_post'
          userinfo_signed_response_alg: 'none'
        jwks:
        - key: {{ $jwks.Key | quote }}
          #certificate_chain: {{ $jwks.Cert | quote }}

    server:
      address: tcp://0.0.0.0:{{ .Values.authelia.ports.http.targetPort }}/
      endpoints:
        authz:
          # Default endpoint — cookie/session based, used by every browser-facing
          # service. Left untouched.
          forward-auth:
            implementation: 'ForwardAuth'
          # Dedicated endpoint for non-interactive clients: authenticates from an
          # Authorization: Basic header (validated against LLDAP) before falling
          # back to a session cookie. Only the OTLP/gRPC ingress uses it, so the
          # default endpoint's behaviour is unchanged for everything else.
          forward-auth-basic:
            implementation: 'ForwardAuth'
            authn_strategies:
              - name: 'HeaderAuthorization'
                schemes:
                  - 'Basic'
              - name: 'CookieSession'

    ntp:
      disable_failure: true

    log:
      level: {{ .Values.authelia.log.level }}
      format: {{ .Values.authelia.log.format }}
      file_path: "/config/authelia.log"
      keep_stdout: true

    totp:
      disable: false
      issuer: authelia.com
      algorithm: sha1
      digits: 6
      period: 30
      skew: 1
      secret_size: 32

    access_control:
      default_policy: deny
      rules:
        {{- range .Values.authelia.rules }}
        - policy: {{ .policy }}
          {{- if .subject }}
          subject:
            {{- toYaml .subject | nindent 12 }}
          {{- end }}
          {{- if .networks }}
          networks:
            {{- range .networks }}
            - {{ tpl . $ }}
            {{- end }}
          {{- end }}
          domain:
            {{- range .domain }}
            - {{ tpl . $ }}
            {{- end }}
          {{- if .resources }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- end }}
        {{- end }}

    telemetry:
      metrics:
        enabled: true
        address: "tcp://0.0.0.0:{{ .Values.authelia.ports.metrics.targetPort }}"
        buffers:
          read: 4096
          write: 4096
        timeouts:
          read: 6s
          write: 6s
          idle: 30s

    authentication_backend:
      ldap:
        # Authelia 4.38+ ships a built-in lldap preset — covers all filter/attribute defaults.
        implementation: lldap
        address: ldap://{{ .Values.k8s.names.services.prefix }}{{ .Values.lldap.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.lldap.ports.ldap.targetPort }}
        base_dn: {{ .Values.lldap.baseDn }}
        user: uid={{ .Values.lldap.adminUser }},ou=people,{{ .Values.lldap.baseDn }}
        password: {{ .Values.lldap.adminPassword }}

    session:
      name: authelia_session
      secret: {{ .Values.authelia.secrets.session }}
      expiration: 1h
      inactivity: 15m
      # remember_me extends the session lifetime when the user checks "Remember me" at login.
      # A long value (e.g. 30d) is recommended for personal clusters so that PWA share targets
      # (e.g. mediarvester installed on the home screen) can authenticate silently without
      # being interrupted by a login prompt mid-share. Set to -1 to disable the option entirely.
      remember_me: 30d
      # Redis-backed sessions: survive Authelia pod restarts (deploys, node
      # blips, lldap startup-check crashes). Without this the provider is
      # in-memory and every restart logs all users out, remember_me included.
      redis:
        host: '{{ .Values.k8s.names.services.prefix }}{{ tpl .Values.authelia.redis.label . }}{{ .Values.k8s.names.services.suffix }}'
        port: {{ .Values.authelia.redis.ports.http.targetPort }}
      cookies:
      - domain: {{ .Values.traefik.domain }}
        authelia_url: https://{{ tpl .Values.authelia.host . }}
        default_redirection_url: https://{{ tpl .Values.homepage.host . }}

    regulation:
      max_retries: 5
      find_time: 120
      ban_time: 300

    storage:
      encryption_key: {{ .Values.authelia.secrets.encryptionKey }}
      postgres:
        address: 'tcp://{{ .Values.k8s.names.services.prefix }}{{ tpl .Values.authelia.database.label . }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.authelia.database.ports.http.targetPort }}'
        database: '{{ tpl .Values.authelia.database.name . }}'
        schema: 'public'
        username: '{{ tpl .Values.authelia.database.credentials.username . }}'
        password: '{{ tpl .Values.authelia.database.credentials.password . }}'
        timeout: '5s'

    notifier:
      filesystem:
        filename: /config/notification.txt

    password_policy:
      standard:
        enabled: false
        min_length: 8
        max_length: 0
        require_uppercase: false
        require_lowercase: false
        require_number: false
        require_special: false
      zxcvbn:
        enabled: true
        min_score: 3
