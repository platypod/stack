vaultwarden:
  # OIDC login via Authelia. Empty clientId disables the integration entirely
  # (Authelia client block and app-side config are both gated on it).
  # Set real values per-env; hash: authelia crypto hash generate pbkdf2
  oidc:
    clientId: ""
    clientSecret:
      plain: ""
      hashed: ""
  enable: true
  label: vaultwarden
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.vaultwarden.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: vaultwarden/server:1.36.0
  ports:
    http:
      name: vw-http
      targetPort: 80
    websocket:
      name: vw-ws
      targetPort: 3012
  credentials:
    adminToken: vaultwardenAdminToken
  signupsAllowed: false
  invitationsAllowed: true
  logLevel: warn
  # SQLite DB → dedicated local volume (NFS can't host SQLite WAL). See the
  # persistence localConfig volume.
  pvc: "{{ .Values.storage.defaultVolumes.config }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
