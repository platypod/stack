{{- if .Values.dbeaver.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.dbeaver.label .Values.k8s.names.pods.suffix }}
{{- $appVolume := "app-volume" }}
{{- $configMap := "config-map" }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.dbeaver.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.dbeaver.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.dbeaver.image }}
        resources:
          {{- toYaml .Values.dbeaver.resources | nindent 10 }}
        ports:
        - name: {{ .Values.dbeaver.ports.http.name }}
          containerPort: {{ .Values.dbeaver.ports.http.targetPort }}
        env:
        - name: CLOUDBEAVER_DB_DRIVER
          value: "{{ .Values.dbeaver.database.driver }}"
        - name: CLOUDBEAVER_DB_URL
          value: "{{ tpl .Values.dbeaver.database.url . }}"
        - name: CLOUDBEAVER_DB_SCHEMA
          value: "{{ tpl .Values.dbeaver.database.schema . }}"
        - name: CLOUDBEAVER_DB_USER
          value: "{{ tpl .Values.dbeaver.database.credentials.username . }}"
        - name: CLOUDBEAVER_DB_PASSWORD
          value: "{{ tpl .Values.dbeaver.database.credentials.password . }}"
        - name: CB_ADMIN_NAME
          value: "{{ .Values.dbeaver.credentials.username }}"
        - name: CB_ADMIN_PASSWORD
          value: "{{ .Values.dbeaver.credentials.password }}"
        volumeMounts:
        - mountPath: /opt/cloudbeaver/workspace
          name: {{ $appVolume }}
          subPath: dbeaver
        - mountPath: /opt/cloudbeaver/conf/initial-data.conf
          name: {{ $configMap }}
          subPath: initial-data.conf
      volumes:
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.dbeaver.pvc . }}
      - name: {{ $configMap }}
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.dbeaver.label }}{{ .Values.k8s.names.configMaps.suffix }}
{{- end }}
