{{- $pod := print .Values.k8s.names.pods.prefix (tpl .Values.lldap.database.label $) .Values.k8s.names.pods.suffix }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.lldap.database.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ tpl .Values.lldap.database.label . }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.lldap.database.image }}
        resources:
          {{- toYaml .Values.lldap.database.resources | nindent 10 }}
        ports:
        - name: {{ .Values.lldap.database.ports.http.name }}
          containerPort: {{ .Values.lldap.database.ports.http.targetPort }}
        env:
        - name: POSTGRES_USER
          value: "{{ tpl .Values.lldap.database.credentials.username . }}"
        - name: POSTGRES_PASSWORD
          value: "{{ tpl .Values.lldap.database.credentials.password . }}"
        - name: POSTGRES_DB
          value: "{{ tpl .Values.lldap.database.name . }}"
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
          subPath: {{ tpl .Values.lldap.database.label . }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ tpl .Values.lldap.storage.pvc . }}
