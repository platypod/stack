{{- if .Values.jellyswarrm.enable }}

# No Authelia middleware — matches the bypass behavior the host-native
# Jellyfin route had before jellyswarrm took over this hostname. Jellyswarrm
# proxies through to Jellyfin's own auth; adding Authelia here would prompt
# users with a login they didn't have before ("no impact on the users").
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: {{ .Values.k8s.names.ingresses.prefix }}{{ .Values.jellyswarrm.label }}{{ .Values.k8s.names.ingresses.suffix }}

spec:
  entryPoints:
  - {{ .Values.traefik.ports.https.name }}

  routes:
  - kind: Rule
    match: Host(`{{ tpl .Values.jellyswarrm.host . }}`)
    services:
    - kind: Service
      name: {{ .Values.k8s.names.services.prefix }}{{ .Values.jellyswarrm.label }}{{ .Values.k8s.names.services.suffix }}
      port: {{ .Values.jellyswarrm.ports.http.targetPort }}

  {{- if or .Values.traefik.tls.selfSigned .Values.traefik.tls.wildcard }}
  tls:
    store:
      name: default
  {{- else }}
  tls:
    certResolver: {{ .Values.traefik.resolverName }}
  {{- end }}

{{- end }}
