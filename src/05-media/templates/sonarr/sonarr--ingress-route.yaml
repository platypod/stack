apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: {{ .Values.sonarr.names.ingress }}
  labels:
    chartVersion: {{ .Chart.Version }}
    env: {{ .Values.project.env }}

spec:
  entryPoints:
  - {{ .Values.traefik.ports.https.name }}

  routes:
  - kind: Rule
    match: Host(`{{ .Values.sonarr.host }}`)
    middlewares:
    - name: {{ .Values.authelia.names.middleware }}
      namespace: {{ .Values.k8s.namespace }}
    services:
    - kind: Service
      name: {{ .Values.sonarr.names.service }}
      port: {{ .Values.sonarr.ports.http.targetPort }}

  tls:
    certResolver: {{ .Values.traefik.resolverName }}
