pokeclicker:
  enable: true
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.pokeclicker.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: ghcr.io/platypod/pokeclicker:v0.10.25
  label: pokeclicker
  ports:
    http:
      name: http
      targetPort: 3000
  replicasNb: 1
  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      memory: 1Gi
