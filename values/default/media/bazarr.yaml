bazarr:
  enable: true
  apiKey: "55555555555555555555555555555555"
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.bazarr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: linuxserver/bazarr:latest
  label: bazarr
  ports:
    http:
      name: bazarr-http
      targetPort: 6767
  pvc:
    # config/SQLite → dedicated local volume (NFS can't host SQLite WAL).
    app: "{{ .Values.storage.defaultVolumes.config }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
