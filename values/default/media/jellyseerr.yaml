jellyseerr:
  apiKey: MTczNjUwNTY0MTMwNmRmY2EzNWZhLWNjNzYtNDA1ZC05MDE4LTVkYTc1NWNjN2E0Yg==
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.jellyseerr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: ghcr.io/seerr-team/seerr:v3.1.0
  label: jellyseerr
  logLevel: DEBUG
  database:
    type: postgres
    host: "{{ .Values.k8s.names.services.prefix }}{{ .Values.database.label }}{{ .Values.k8s.names.services.suffix }}"
    port: "{{ .Values.database.ports.http.targetPort }}"
    username: "{{ .Values.database.credentials.username }}"
    password: "{{ .Values.database.credentials.password }}"
    name: "{{ .Values.database.schemas.jellyseerr.main }}"
    logQueries: false
  ports:
    http:
      name: jellyseerr
      targetPort: 5055
  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
