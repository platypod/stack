{{- if .Values.finance.enable }}
apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.k8s.names.services.prefix }}{{ tpl .Values.finance.database.label . }}{{ .Values.k8s.names.services.suffix }}

spec:
  selector:
    app: {{ .Values.k8s.names.pods.prefix }}{{ tpl .Values.finance.database.label . }}{{ .Values.k8s.names.pods.suffix }}
  ports:
  - name: {{ .Values.finance.database.ports.http.name }}
    port: {{ .Values.finance.database.ports.http.targetPort }}
    targetPort: {{ .Values.finance.database.ports.http.targetPort }}
{{- end }}
