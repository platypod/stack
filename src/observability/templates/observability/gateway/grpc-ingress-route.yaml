{{- /*
  OTLP/gRPC ingress for the collector gateway. Terminates TLS at Traefik and
  forwards h2c (cleartext HTTP/2) to the gateway's gRPC receiver on port 4317.
  Guarded by the Basic-auth Authelia endpoint so non-interactive clients (Claude
  Code telemetry) authenticate with Authorization: Basic against LLDAP — no
  session cookie, no Authelia bypass.
*/ -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: {{ .Values.k8s.names.ingresses.prefix }}{{ tpl .Values.observability.otelCollector.gateway.label . }}-grpc{{ .Values.k8s.names.ingresses.suffix }}
  labels:
    chartVersion: {{ .Chart.Version }}
    env: {{ .Values.project.env }}

spec:
  entryPoints:
  - {{ .Values.traefik.ports.https.name }}

  routes:
  - kind: Rule
    match: Host(`{{ tpl .Values.observability.otelCollector.gateway.grpcHost . }}`)
    middlewares:
    - name: {{ .Values.k8s.names.middlewares.prefix }}{{ .Values.authelia.label }}-basic{{ .Values.k8s.names.middlewares.suffix }}
      namespace: {{ .Values.k8s.namespace }}
    services:
    - kind: Service
      name: {{ .Values.k8s.names.services.prefix }}{{ tpl .Values.observability.otelCollector.gateway.label . }}{{ .Values.k8s.names.services.suffix }}
      port: {{ .Values.observability.otelCollector.gateway.ports.grpc.targetPort }}
      # The collector's gRPC receiver speaks cleartext HTTP/2.
      scheme: h2c

  {{- if or .Values.traefik.tls.selfSigned .Values.traefik.tls.wildcard }}
  tls:
    store:
      name: default
  {{- else }}
  tls:
    certResolver: {{ .Values.traefik.resolverName }}
  {{- end }}
