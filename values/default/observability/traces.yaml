observability:
  traces:
    label: tempo
    # Pinned to the 2.x line: Tempo 3.0 is an architectural rework (compactor/
    # ingester blocks removed, Kafka-backed metrics-generator) requiring a real
    # config migration — not a drop-in bump. Revisit deliberately.
    image: grafana/tempo:2.10.6
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.traces.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
    ports:
      grpc:
        name: grpc
        targetPort: 9095
      http:
        name: http
        targetPort: 80
    logging:
      level: info
