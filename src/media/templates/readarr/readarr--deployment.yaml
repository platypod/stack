{{- $pod := print .Values.k8s.names.pods.prefix .Values.readarr.label .Values.k8s.names.pods.suffix }}
{{- $configMap := "config-map" }}
{{- $appVolume := "app-volume" }}
{{- $mediaVolume := "media-volume" }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.readarr.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      initContainers:
      # Seed config.xml into the writable /config volume on first run only.
      # Bookshelf/Readarr rewrites config.xml on startup (DeleteOldValues), which
      # fails if config.xml is a read-only ConfigMap subPath mount. Copying it
      # into the persistent volume (and only when absent) makes it writable while
      # still letting the ConfigMap provide the initial values.
      - name: init-config
        image: busybox
        command:
        - sh
        - -c
        - |
          # Seed when missing OR empty (-s: exists and size > 0), so a stale
          # zero-byte config.xml from a prior run gets repaired. A populated
          # config.xml that Bookshelf has since rewritten is left untouched.
          if [ ! -s /config/config.xml ]; then
            cp /seed/config.xml /config/config.xml
            chown {{ .Values.media.system.userId }}:{{ .Values.media.system.groupId }} /config/config.xml
          fi
        volumeMounts:
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: readarr/config
        - mountPath: /seed
          name: {{ $configMap }}
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.readarr.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.readarr.image }}
        resources:
          {{- toYaml .Values.readarr.resources | nindent 10 }}
        ports:
        - name: {{ .Values.readarr.ports.http.name }}
          containerPort: {{ .Values.readarr.ports.http.targetPort }}
        env:
        - name: PUID
          value: "{{ .Values.media.system.userId }}"
        - name: PGID
          value: "{{ .Values.media.system.groupId }}"
        - name: UMASK
          value: "{{ .Values.media.system.umask }}"
        volumeMounts:
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: readarr/config
        - mountPath: {{ .Values.media.system.data.path }}
          name: {{ $mediaVolume }}
      volumes:
      - name: {{ $mediaVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.readarr.pvc.media . }}
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.readarr.pvc.app . }}
      - name: {{ $configMap }}
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.readarr.label }}{{ .Values.k8s.names.configMaps.suffix }}
