{{- if and .Values.finance.enable .Values.finance.grafana.enable }}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ tpl .Values.finance.grafana.label . }}{{ .Values.k8s.names.configMaps.suffix }}

data:
  grafana.ini: |
    ; Dedicated finance Grafana. Secrets (OIDC client, DB password) come from the
    ; environment, never from this file.
    [analytics]
    reporting_enabled = false
    check_for_updates = false
    check_for_plugin_updates = false

    [auth]
    disable_login_form = true
    [auth.anonymous]
    enabled = false
    [auth.generic_oauth]
    enabled = true
    name = Authelia
    api_url = https://{{ tpl .Values.authelia.host . }}/api/oidc/userinfo
    auth_url = https://{{ tpl .Values.authelia.host . }}/api/oidc/authorization
    token_url = https://{{ tpl .Values.authelia.host . }}/api/oidc/token
    ; Authelia pins client_secret_basic for this client.
    auth_style = InHeader
    scopes = openid profile email groups
    empty_scopes = false
    use_pkce = false
    groups_attribute_path = groups
    login_attribute_path = preferred_username
    name_attribute_path = name
    ; STRICT: a user whose groups map to no role is refused, even if they got past the
    ; forward-auth layer. Only `admins` (full control) and `finance_user` (read-only) get in.
    role_attribute_path = contains(groups, 'admins') && 'GrafanaAdmin' || contains(groups, 'finance_user') && 'Viewer'
    role_attribute_strict = true
    allow_assign_grafana_admin = true
    tls_skip_verify_insecure = {{ .Values.traefik.tls.selfSigned }}

    [log]
    mode = console
    [log.console]
    level = info
    format = json

    [security]
    disable_initial_admin_creation = true
    cookie_secure = true
    cookie_samesite = lax

    [server]
    http_port = {{ .Values.finance.grafana.ports.http.targetPort }}
    enable_gzip = true
    root_url = https://{{ tpl .Values.finance.grafana.host . }}

    [users]
    allow_sign_up = false
    auto_assign_org_role = Viewer
    default_theme = system

    [dashboards]
    ; Provisioned dashboards only; nobody edits them in the UI and changes are not persisted.
    min_refresh_interval = 30s

  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Finance
      uid: finance
      type: grafana-postgresql-datasource
      access: proxy
      url: {{ .Values.k8s.names.services.prefix }}{{ tpl .Values.finance.database.label . }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.finance.database.ports.http.targetPort }}
      user: {{ .Values.finance.database.credentials.grafana.username }}
      editable: false
      isDefault: true
      jsonData:
        database: {{ .Values.finance.database.name }}
        sslmode: disable
        postgresVersion: 1700
      secureJsonData:
        password: $__env{FINANCE_GRAFANA_DB_PASSWORD}

  dashboards-providers.yaml: |
    apiVersion: 1
    providers:
    - name: finance
      orgId: 1
      folder: Finance
      type: file
      allowUiUpdates: false
      options:
        path: /var/lib/grafana/dashboards/finance
{{- end }}
