# Phase 9 — image update automation. See stack/docs/flux-migration.md for
# the full design/rationale. prd now runs its own separate instance of this
# too (clusters/prd/image-automation.yaml) — mediarvester only so far, with
# a final-releases-only ImagePolicy. This file stays local's: everything
# here tracks ahead, including prereleases, via the extra
# `mediarvester-local` ImagePolicy/ImageUpdateAutomation pair below.
#
# Separate GitRepository with its OWN read-write deploy key
# (image-automation-deploy-key Make target) — deliberately not reusing
# flux-system's primary sync GitRepository/key, which stays read-only.
# ImageUpdateAutomation pushes through whichever GitRepository it targets,
# so this is the one and only write path this migration has ever needed.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: stack-image-automation
  namespace: flux-system
spec:
  interval: 5m0s
  ref:
    branch: main
  secretRef:
    name: stack-image-automation-deploy-key
  url: ssh://git@github.com/platypod/stack
---
# All 5 GHCR images are public — no imagePullSecret needed, confirmed via an
# anonymous ghcr.io token exchange before writing this.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cyber-chef
  namespace: flux-system
spec:
  image: ghcr.io/platypod/cyber-chef
  interval: 1h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: mediarvester
  namespace: flux-system
spec:
  image: ghcr.io/platypod/mediarvester
  interval: 1h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: pokeclicker
  namespace: flux-system
spec:
  image: ghcr.io/platypod/pokeclicker
  interval: 1h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: unbegotten
  namespace: flux-system
spec:
  image: ghcr.io/platypod/unbegotten
  interval: 1h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: transmission-exporter
  namespace: flux-system
spec:
  image: ghcr.io/platypod/transmission-exporter
  interval: 1h0m0s
---
# filterTags strips the "v" prefix before semver-parsing — cyber-chef,
# mediarvester, pokeclicker, unbegotten all tag vX.Y.Z. :latest and any
# non-semver tag never match the pattern, so the policy silently never
# selects them — no separate exclusion needed.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cyber-chef
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: cyber-chef
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mediarvester
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: mediarvester
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: pokeclicker
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: pokeclicker
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: unbegotten
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: unbegotten
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
# No filterTags — transmission-exporter's tags are bare X.Y.Z (no "v"
# prefix, confirmed via `git tag -l` in that repo), already valid semver as-is.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: transmission-exporter
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: transmission-exporter
  policy:
    semver:
      range: ">=0.0.0"
---
# Local-only, mediarvester-specific: same ImageRepository as the plain
# `mediarvester` policy above, but this range ends in "-0" — the
# Masterminds/Flux idiom for "also match prereleases" (a range with no
# prerelease component silently never matches a `-dev.N` tag, which is why
# the plain policy above never picks one up). Feeds
# clusters/local/apps-overlay/media-image.yaml's own marker, distinct from
# apps/base/values/media.yaml's (prod-authoritative) one, so local can move
# ahead to a prerelease while prod stays on the last final release. See
# clusters/prd/image-automation.yaml for the prod side.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mediarvester-local
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: mediarvester
  policy:
    semver:
      range: ">=0.0.0-0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
# Pushes straight to main (no separate branch) — local already tracks main
# continuously, and prd's tag gate is the real review point, unaffected by
# anything landing here. Scoped to apps/base/values/ only.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: stack-image-automation
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@platypod.ovh
        name: fluxcdbot
      # The `Updated` template field this used to reference was removed by
      # Flux (v1 API) — `Changed` replaces it, but its exact struct shape
      # wasn't worth guessing twice after getting `Updated` wrong the first
      # time (this field errored the whole automation run, no commit at
      # all, until fixed). The diff itself already shows exactly what
      # changed; a static message is simpler and can't go stale again the
      # same way.
      messageTemplate: "chore: automated image update"
    push:
      branch: main
  update:
    path: ./apps/base/values
    strategy: Setters
---
# Second, separate ImageUpdateAutomation — deliberately NOT a change to the
# one above. That one's update.path (./apps/base/values) has to keep
# covering cyber-chef/pokeclicker/unbegotten/transmission-exporter; pointing
# it at the new overlay instead (rather than adding this second object)
# would silently stop auto-updating those 4. This one only ever touches
# apps/local-overlay/media-image.yaml, so it can never race with prod's own
# automation writing into apps/base/values/media.yaml — the two
# update.paths don't overlap.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: mediarvester-local
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: stack-image-automation
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@platypod.ovh
        name: fluxcdbot
      messageTemplate: "chore: automated local mediarvester image update"
    push:
      branch: main
  update:
    path: ./apps/local-overlay
    strategy: Setters
