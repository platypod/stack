jellyfin:
  inCluster: true # run the in-cluster Jellyfin pod; false = proxy to an external instance (see proxy.enable)
  apiKey: "" # set per-env after first deploy (generate in Jellyfin admin → API Keys)
  credentials: # admin account created by the jellyfin setup Job; consumed by jellyseerr setup too
    username: admin
    password: password
  baseUrl: "" # URL base path if Jellyfin is served under a subpath (usually empty)
  image: jellyfin/jellyfin:10.11.11
  replicasNb: 1
  ports:
    http:
      name: jellyfin
      targetPort: 8096
  proxy:
    enable: false # set true to proxy to an out-of-cluster Jellyfin instead
    host: host.docker.internal
    port: 8096
  pvc:
    config: "{{ .Values.storage.defaultVolumes.apps }}"
    # Read-only NFS media mount, same share as the *arr stack and jellyfin-k8s.
    media: "{{ .Values.storage.defaultVolumes.media }}"
  # Libraries seeded via POST /Library/VirtualFolders by jellyfin-plugins-setup.
  #
  # These are the libraries that ACTUALLY exist on prod's host-native Jellyfin
  # (mini4), so the seeding job matches every one by name and does nothing.
  # That is the point: the job matches on NAME ONLY, so a name here that does
  # not exist on the server gets created — the previous placeholder list would
  # have created a "TV Shows" library pointing at /media/tv, a path that does
  # not exist on mini4, on the next helm upgrade.
  #
  # `path` is resolved by JELLYFIN, not by this cluster: prod's Jellyfin runs
  # on the mini4 host (see jellyfin.host below) and mounts the Synology share
  # at /Users/pittinic/synology, which is why these are host paths and not the
  # /media container paths the rest of this file uses.
  libraries:
    - name: Movies
      collectionType: movies
      path: /Users/pittinic/synology/movies
    - name: Series
      collectionType: tvshows
      path: /Users/pittinic/synology/series
    - name: Anime
      collectionType: tvshows
      path: /Users/pittinic/synology/anime
    # mediarvester's output, split so each half gets the collection type it
    # needs — see mediarvester's services/library_layout.py. A tvshows library
    # turns a loose creator video into a bogus one-episode show, so standalone
    # content has to live in a separate movies library.
    - name: Replays - Series
      collectionType: tvshows
      path: /Users/pittinic/synology/replays/series
    - name: Replays - Singles
      collectionType: movies
      path: /Users/pittinic/synology/replays/singles
  # LDAP Authentication plugin (jellyfin/jellyfin-plugin-ldapauth, official
  # repo, guid 958aad66-3784-4d2a-b89a-a7b6fab6e25c) — installed and
  # configured by jellyfin-plugins-setup. See docs/media/jellyfin-ldap.md.
  ldap:
    enable: true
    # Bind account: must match the jellyfin-ldap seed account in
    # apps/base/values/security.yaml (member of lldap_strict_readonly: read-all, no write).
    bindUser: jellyfin-ldap
    # Placeholder — must match the jellyfin-ldap seed user's password in
    # apps/base/values/security.yaml. Real value comes from platypod-sops'
    # clusters/<env>/secrets.enc.yaml (encrypted, not in this repo).
    bindPassword: verySecretMuchSecureNeverGonnaBeGuessedJellyfinLdapPassword
    # LLDAP groups whose members may log into Jellyfin at all (OR'd into one
    # LDAP filter by jellyfin-plugins-setup) — granular + category composite +
    # the global superuser, per apps/base/values/security.yaml's accessGroups.
    # Includes the *_admin groups too: LdapSearchFilter gates login itself, so
    # someone who is ONLY jellyfin_admin/media_admin (not also the _user
    # equivalent) would otherwise be rejected before LdapAdminFilter is ever
    # checked — confirmed by testing (qa-jellyfin-admin couldn't log in until
    # this was added). Admin tier must always imply login access.
    userGroup: [jellyfin_user, jellyfin_admin, media_user, media_admin, admins]
    # LLDAP groups auto-promoted to Jellyfin Administrator on login (OR'd, same
    # as above). Must remain a subset of userGroup so every admin can also log in.
    adminGroup: [jellyfin_admin, media_admin, admins]
    # Pinned plugin version — verify targetAbi compatibility with the pinned
    # jellyfin.image and check github.com/jellyfin/jellyfin-plugin-ldapauth
    # issue #224 (admin-sync instability) before bumping.
    pluginVersion: "23.0.0.0"
    pluginChecksum: "e67eda7dd1b91a71315bd6620c8b03f1"
  # Moonbase plugin (Moonfin-Client/Plugin) — backend for the Moonfin client
  # apps. Not in Jellyfin's default repo; jellyfin-plugins-setup registers
  # its manifest before installing.
  moonfin:
    enable: true
    repositoryUrl: "https://raw.githubusercontent.com/Moonfin-Client/Plugin/refs/heads/master/manifest.json"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
