{{- if .Values.jellyfin.enabled }}

{{- $pod := print .Values.k8s.names.pods.prefix .Values.jellyfin.label .Values.k8s.names.pods.suffix }}
{{- $appVolume := "app-volume" }}
{{- $configMap := "config-map" }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.jellyfin.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      initContainers:
      # Seed system.xml from ConfigMap into the PVC on first start.
      # ConfigMap mounts are read-only; Jellyfin needs to write to system.xml, so
      # we copy the template to the PVC once and let Jellyfin own it afterwards.
      - name: seed-config
        image: busybox:1
        command:
        - sh
        - -c
        - |
          DEST=/config/config/system.xml
          mkdir -p /config/config
          if [ ! -f "$DEST" ]; then
            echo "Seeding system.xml from ConfigMap..."
            cp /seed/settings.json "$DEST"
          else
            echo "system.xml already exists, skipping seed."
          fi
        volumeMounts:
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: jellyfin
        - mountPath: /seed
          name: {{ $configMap }}
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.jellyfin.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.jellyfin.image }}
        resources:
          {{- toYaml .Values.jellyfin.resources | nindent 10 }}
        ports:
        - name: {{ .Values.jellyfin.ports.http.name }}
          containerPort: {{ .Values.jellyfin.ports.http.targetPort }}
        volumeMounts:
        # /config is Jellyfin's default config directory (JELLYFIN_ConfigDir)
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: jellyfin
      volumes:
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.jellyfin.pvc . }}
      - name: {{ $configMap }}
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.jellyfin.label }}{{ .Values.k8s.names.configMaps.suffix }}

{{- end }}
