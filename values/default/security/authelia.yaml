authelia:
  label: authelia
  database:
    type: postgres
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.authelia.label }}-db{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
    name: "{{ .Values.authelia.label }}"
    logQueries: false
    credentials:
      username: admin
      # Internal-only Postgres sidecar, not network-exposed — placeholder,
      # real value comes from values/<env>/values.yaml (gitignored).
      password: verySecretMuchSecureNeverGonnaBeGuessedAutheliaDbPassword
    # Distinct from authelia.storage.pvc (used by redis) so the two can be
    # repointed independently — on prod this goes to a dedicated local volume,
    # redis stays on the shared apps volume.
    pvc: "{{ .Values.storage.defaultVolumes.apps }}"
    image: postgres:17
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    label: "{{ .Values.authelia.label }}-db"
    ports:
      http:
        name: pgsql
        targetPort: 5432
    replicasNb: 1
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.authelia.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: authelia/authelia:4.39.20
  log:
    level: info
    format: text
  oidc:
    # Placeholder — real value comes from values/<env>/values.yaml (gitignored)
    # or the SOPS-encrypted secrets repo. Guarded at render time in
    # src/security/templates/authelia/authelia--config-map.yaml. Now that
    # hmac_secret is actually wired in (c125189), this is a live secret —
    # signs opaque OAuth2 tokens (auth codes, access/refresh tokens).
    hmac_secret: verySecretMuchSecureNeverGonnaBeGuessedHmacSecret
    jwks:
      caName: authelia-jwks
      commonName: authelia-jwks
  ports:
    http:
      name: authelia
      targetPort: 9091
    metrics:
      name: auth-metrics
      targetPort: 9959
  replicasNb: 1
  rules:
    # OTLP/gRPC telemetry ingress: any member of the otel_writer group, via
    # Authorization: Basic (1FA). The dedicated forward-auth-basic endpoint makes
    # Basic auth usable here without changing any browser-facing service. The
    # tenant-guard shim (next middleware) then enforces that each writer may only
    # write its own Loki tenant. See docs/observability/dashboard-multitenancy.md.
    - policy: one_factor
      subject:
      - "group:otel_writer"
      domain:
      - "{{ tpl .Values.observability.otelCollector.gateway.grpcHost . }}"

    - policy: bypass
      domain:
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.bazarr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.flaresolverr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.radarr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.prowlarr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.readarr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.sonarr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.reclaimerr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      networks:
      - "{{ .Values.k8s.clusterCIDR }}"

    # PWA manifest is fetched as a credentialed CORS request; if Authelia answers
    # with a 302 to its own (cross-origin) login, the browser blocks it on CORS.
    # Bypassing the manifest path lets it be served same-origin (it's harmless).
    - policy: bypass
      domain:
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.kavita.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      resources:
      - '^/site\.webmanifest$'

    - policy: one_factor
      domain:
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.homepage.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.pokeclicker.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.unbegotten.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"

    # Per-tool rules for everything gated by access-groups.yaml (media/download/
    # dev membership, per-tool roles) are generated in
    # authelia--config-map.yaml — see security.toolSubjects/toolHosts in
    # src/security/templates/_helpers.tpl. Nothing hand-written here anymore.

    - policy: bypass
      domain:
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.authelia.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.lldap.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.itTools.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.cyberChef.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      # Proxy mode is called by CLI/agent traffic (Authorization carries the
      # upstream Anthropic/OpenAI key), not a browser session — forward-auth's
      # login redirect would break it. Same bypass rationale as IT-Tools/CyberChef.
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.headroom.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      # OPDS clients (e.g. CrossInk on an e-reader) can't follow forward-auth's
      # browser login redirect — same rationale as Jellyfin. Komga has its own
      # login/API-key auth, so this doesn't drop authentication, just moves it.
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.komga.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.jellyfin.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.jellyswarrm.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.jellyseerr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.traefik.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.otelCollector.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      - "{{ .Values.k8s.names.urls.prefix }}{{ .Values.vaultwarden.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  redis:
    image: redis:7-alpine
    label: "{{ .Values.authelia.label }}-redis"
    ports:
      http:
        name: redis
        targetPort: 6379
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  secrets:
    encryptionKey: verySecretMuchSecureNeverGonnaBeGuessedWoah
    jwt: verySecretMuchSecureNeverGonnaBeGuessedWoooow
    session: verySecretMuchSecureNeverGonnaBeGuessedWoowee
  storage:
    pvc: "{{ .Values.storage.defaultVolumes.apps }}"

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi
