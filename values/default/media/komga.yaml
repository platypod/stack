komga:
  enable: true
  # OIDC login via Authelia. Empty clientId disables the integration (the
  # Authelia client block and Komga's oauth2 config are both gated on it).
  # Set real values per-env; hash with: authelia crypto hash generate pbkdf2
  oidc:
    clientId: ""
    clientSecret:
      plain: ""
      hashed: ""
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.komga.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: gotson/komga:1.25.0
  label: komga
  # First-boot admin, claimed by the komga-setup Job (POST /api/v1/claim) if the
  # server isn't already claimed. If Komga was already claimed by hand (e.g. from
  # before this Job existed), set these to match the REAL existing admin login —
  # the Job authenticates every run with HTTP Basic using this email/password, so
  # a mismatch means it can't create/inspect libraries (it logs a warning and
  # exits 0 rather than crash-looping on a bad password).
  credentials:
    email: ""
    password: ""
  # Libraries the komga-setup Job ensures exist (create-if-missing by name, never
  # overwrites — same philosophy as Kavita: library tweaks made from the admin UI
  # afterward are left alone). See komga--setup-job.yaml for the rest of each
  # library's scan settings.
  convertToCbz: true
  libraries:
  - name: bd
    root: "{{ .Values.media.system.data.path }}/manga/bd"
  - name: manga
    root: "{{ .Values.media.system.data.path }}/manga/mangas"
  ports:
    http:
      name: komga-http
      targetPort: 25600
  pvc:
    # config/SQLite → dedicated local volume (NFS can't host SQLite WAL).
    app: "{{ .Values.storage.defaultVolumes.config }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  # OpenJDK's container-aware default is MaxRAMPercentage=25 — on the original
  # 1Gi limit that capped the actual heap at 256Mi, far too small to rasterize
  # pages from large scanned-PDF comics (some of these BD are 300-400MB+),
  # causing OutOfMemoryError on read (see komga--deployment.yaml). A first fix
  # (2Gi limit, MaxRAMPercentage=75 -> ~1.5Gi heap) survived a synthetic
  # single-page-at-a-time test but still got container-level OOMKilled (exit
  # 137, the kernel killing the whole cgroup, not a JVM heap error) under a
  # real "read incognito" session — PDF rendering also uses substantial
  # off-heap/native memory (image decode buffers, metaspace, code cache) that
  # doesn't count as heap but does count against the container limit, and 25%
  # (500Mi) of headroom for that wasn't enough. Now: 3Gi limit, same ~1.5Gi
  # heap (MaxRAMPercentage=50) but 1.5Gi of off-heap headroom instead of 500Mi.
  # Requests stay put — mini4-w1 is already at ~92% memory *requests*, so
  # growing that would risk scheduling; limits are elastic/bursty and this
  # node already runs well over 100% limit-overcommit.
  resources:
    requests:
      cpu: 100m
      # JVM app — leaner requests starve it at startup.
      memory: 512Mi
    limits:
      memory: 3Gi
