{{- if .Values.valheim.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.valheim.label .Values.k8s.names.pods.suffix }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      # Must tolerate the primary-node taint: when pinned there via
      # externalIP/nodeSelector (prod, no MetalLB) it has nowhere else to run.
      # Harmless on dev, where there is no taint to match.
      tolerations:
      - key: platypod.io/reserved
        operator: Equal
        value: primary
        effect: NoSchedule
      priorityClassName: platypod-gaming
      {{- with .Values.valheim.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: {{ .Values.k8s.names.initContainers.prefix }}valheim-data-dir{{ .Values.k8s.names.initContainers.suffix }}
        image: busybox:1.37.0
        command: ["sh", "-c", "mkdir -p /config && chown 1000:1000 /config"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: valheim
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.valheim.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.valheim.image }}
        resources:
          {{- toYaml .Values.valheim.resources | nindent 10 }}
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: SERVER_PORT
          value: {{ .Values.valheim.ports.game.targetPort | quote }}
        - name: SERVER_NAME
          value: {{ .Values.valheim.server.name | quote }}
        - name: WORLD_NAME
          value: {{ .Values.valheim.server.worldName | quote }}
        - name: SERVER_PASS
          value: {{ .Values.valheim.server.password | quote }}
        - name: SERVER_PUBLIC
          value: {{ .Values.valheim.server.public | quote }}
        {{- range $key, $value := .Values.valheim.server.extraEnv }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        ports:
        - name: {{ .Values.valheim.ports.game.name }}
          containerPort: {{ .Values.valheim.ports.game.targetPort }}
          protocol: UDP
        - name: {{ .Values.valheim.ports.query.name }}
          containerPort: {{ .Values.valheim.ports.query.targetPort }}
          protocol: UDP
        - name: {{ .Values.valheim.ports.crossplay.name }}
          containerPort: {{ .Values.valheim.ports.crossplay.targetPort }}
          protocol: UDP
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: valheim
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ tpl .Values.valheim.pvc . }}
{{- end }}
