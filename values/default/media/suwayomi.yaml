suwayomi:
  # Suwayomi-Server (Tachidesk) — *arr-style manga downloader. Downloads into the
  # media share's `manga` folder, which Kavita serves as a library. No native
  # auth/OIDC (AUTH_MODE=none) — sits behind Authelia forwardauth like the *arrs.
  enable: true
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.suwayomi.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: ghcr.io/suwayomi/suwayomi-server:v2.2.2100
  label: suwayomi
  # Media subpath where Suwayomi writes downloads and Kavita reads its manga
  # library — the "link" between the two.
  mangaSubPath: manga
  # Extension source repositories, seeded into Suwayomi by the suwayomi-setup Job
  # (Suwayomi ships none since the original Tachiyomi repo was taken down). The
  # WebUI equivalent is Settings → Browse → Extension Repositories.
  extensionRepos:
  - https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json
  ports:
    http:
      name: suwayomi-http
      targetPort: 4567
  pvc:
    app: "{{ .Values.storage.defaultVolumes.apps }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
