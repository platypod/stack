# persistence has no implementation-tier ConfigMap (values/default/ has no
# persistence.yaml — its only default file, storage.yaml, is pure substrate).
# releaseName matches the existing Helmfile release exactly, so helm-controller
# adopts it in place instead of reinstalling (rehearses gotcha 4 on local,
# ahead of needing it for real on prd in Phase 7).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: persistence
  namespace: local-platypod
spec:
  interval: 10m0s
  releaseName: local--platypod--persistence
  targetNamespace: local-platypod
  # This module's PVCs use WaitForFirstConsumer binding (local-storage
  # StorageClass) and are provisioned ahead of the pods that will actually
  # consume them (media/games modules, ported later in Phase 4) — they're
  # *supposed* to sit Pending until then. Helm's default --wait behavior
  # (which Flux enables unless told otherwise) blocks the whole release on
  # every PVC reaching Bound, which never happens here yet. Helmfile's
  # `sync` never waited either — this matches that, not a Flux-only need.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: ./src/persistence
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: platypod-substrate
      valuesKey: substrate.yaml
    - kind: ConfigMap
      name: platypod-registry
      valuesKey: registry.yaml
    - kind: Secret
      name: platypod-secrets
      valuesKey: platypod-secrets.yaml
