komga:
  # OIDC login via Authelia. Empty clientId disables the integration (the
  # Authelia client block and Komga's oauth2 config are both gated on it).
  # Set real values per-env; hash with: authelia crypto hash generate pbkdf2
  oidc:
    clientId: ""
    clientSecret:
      plain: ""
      hashed: ""
  image: gotson/komga:1.25.0
  # First-boot admin, claimed by the komga-setup Job (POST /api/v1/claim) if the
  # server isn't already claimed. If Komga was already claimed by hand (e.g. from
  # before this Job existed), set these to match the REAL existing admin login —
  # the Job authenticates every run with HTTP Basic using this email/password, so
  # a mismatch means it can't create/inspect libraries (it logs a warning and
  # exits 0 rather than crash-looping on a bad password).
  credentials:
    email: ""
    password: ""
  # Libraries the komga-setup Job ensures exist (create-if-missing by name, never
  # overwrites — same philosophy as Kavita: library tweaks made from the admin UI
  # afterward are left alone). See komga--setup-job.yaml for the rest of each
  # library's scan settings.
  convertToCbz: true
  # `bds` and `mangas` are TOP-LEVEL media folders, siblings of each other and of
  # books/anime/movies/series. Neither is nested under the other, and neither is
  # inside a service's app data: until 2026-09-17 both lived under `manga/`,
  # which was really Suwayomi's download root, so BD sat inside the manga
  # downloader's working directory and got `chown -R`'d to uid 1000 on every
  # Suwayomi restart -- which is what made the tree unmanageable from the laptop
  # over NFS (no idmap; the laptop uid matches neither owner nor group).
  # See docs/media/comics-layout-migration.md.
  libraries:
    - name: bds
      root: "{{ .Values.media.system.data.path }}/bds"
    - name: mangas
      root: "{{ .Values.media.system.data.path }}/mangas"
  ports:
    http:
      name: komga-http
      targetPort: 25600
  pvc:
    # config/SQLite → dedicated local volume (NFS can't host SQLite WAL).
    app: "{{ .Values.storage.defaultVolumes.config }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  # OpenJDK's container-aware default is MaxRAMPercentage=25 — on the original
  # 1Gi limit that capped the actual heap at 256Mi, far too small to rasterize
  # pages from large scanned-PDF comics (some of these BD are 300-400MB+),
  # causing OutOfMemoryError on read (see komga--deployment.yaml). A first fix
  # (2Gi limit, MaxRAMPercentage=75 -> ~1.5Gi heap) survived a synthetic
  # single-page-at-a-time test but still got container-level OOMKilled (exit
  # 137, the kernel killing the whole cgroup, not a JVM heap error) under a
  # real "read incognito" session — PDF rendering also uses substantial
  # off-heap/native memory (image decode buffers, metaspace, code cache) that
  # doesn't count as heap but does count against the container limit, and 25%
  # (500Mi) of headroom for that wasn't enough. Now: 3Gi limit, same ~1.5Gi
  # heap (MaxRAMPercentage=50) but 1.5Gi of off-heap headroom instead of 500Mi.
  # Requests stay put — mini4-w1 is already at ~92% memory *requests*, so
  # growing that would risk scheduling; limits are elastic/bursty and this
  # node already runs well over 100% limit-overcommit.
  resources:
    requests:
      cpu: 100m
      # JVM app — leaner requests starve it at startup.
      memory: 512Mi
    limits:
      memory: 3Gi
kavita:
  image: jvmilazz0/kavita:0.9.0.2
  # First-boot admin auto-created by the kavita-setup Job (Kavita has no fixed
  # admin name — the first registered user is admin).
  credentials:
    username: admin
    password: kavita-admin
    email: nico.pittion@gmail.com
  # OIDC via Authelia. Kavita stores OIDC in its DB (not env), so the setup Job
  # pushes it through the settings API. Empty clientId disables the whole thing
  # (Authelia client + setup-Job OIDC step are both gated on it). Callback is the
  # ASP.NET default /signin-oidc.
  oidc:
    clientId: ""
    clientSecret:
      plain: ""
      hashed: ""
  ports:
    http:
      name: kavita-http
      targetPort: 5000
  pvc:
    # config/SQLite → dedicated local volume (NFS can't host SQLite WAL).
    app: "{{ .Values.storage.defaultVolumes.config }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
audiobookshelf:
  image: ghcr.io/advplyr/audiobookshelf:2.35.1
  # First-boot admin, created by the audiobookshelf-setup Job via POST /init
  # (Audiobookshelf's root user is fixed at first-init, unlike Kavita's "first
  # registered user"). Local login is a break-glass fallback behind Authelia
  # forward-auth — OIDC (below) is the intended path once configured.
  credentials:
    username: pittinic
    password: 6WHXS1jvoHQdxNc7o3sqhIDF
  # OIDC via Authelia, pushed by the setup Job through the authenticated
  # PATCH /api/auth-settings API (reverse-engineered from the app's own source —
  # there's no public docs for it). Empty clientId disables both the Authelia
  # client block below and the OIDC step in the setup Job.
  oidc:
    clientId: ""
    clientSecret:
      plain: ""
      hashed: ""
  ports:
    http:
      name: abs-http
      targetPort: 80
  pvc:
    # config/SQLite → dedicated local volume (NFS can't host SQLite WAL).
    app: "{{ .Values.storage.defaultVolumes.config }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
suwayomi:
  # Suwayomi-Server (Tachidesk) — manga downloader. Downloads into the media
  # share's `manga` folder, which Komga serves as a library (NOT Kavita — Kavita
  # is disabled, see docs/media/kavita.md). No native auth/OIDC (AUTH_MODE=none)
  # — sits behind Authelia forwardauth like the *arrs.
  # v2.3.2243 (2026-07-13, "Fix 4 for v2.3.2223") — latest stable; index digest
  # sha256:e59f212ccf91b26de8676a063a2db90256c148c6261535c7c477d47a43d9751b,
  # linux/arm64 present. Entrypoint/Cmd/User are unchanged from v2.2.2100
  # (`tini -- /home/suwayomi/startup_script.sh`, uid 1000, default umask 0022),
  # so the umask wrapper in suwayomi--deployment.yaml still applies as-is.
  #
  # Two upgrade notes from the v2.3.2223 release:
  # - H2 database engine was upgraded, and it downloads migration tooling on
  #   first boot (needs egress). Treat the H2 migration as ONE-WAY: take a copy
  #   of apps/suwayomi/database.mv.db before rolling back to a 2.2.x pin.
  # - Upstream warns Extension Repos may be lost, because v1.6 replaces the
  #   Extension Repo system with Mihon's Extension Store. Covered here: the
  #   suwayomi-setup Job is a post-upgrade hook that declaratively re-sets
  #   extensionRepos below on every deploy.
  image: ghcr.io/suwayomi/suwayomi-server:v2.3.2243
  # Media subpath holding the manga library — the SAME top-level `mangas` folder
  # Komga serves (komga.libraries above), not a folder of Suwayomi's own.
  #
  # Unlike the *arrs there is no import/move step: Suwayomi is downloader AND
  # library manager, and it hard-codes its layout as
  # <downloadsPath>/mangas/<source>/<series>/<chapter>. So rather than hand it a
  # download root on the share, the deployment mounts this subpath at
  # <downloadsPath>/mangas and leaves <downloadsPath> itself on the app volume:
  # Suwayomi's own scratch (thumbnails/, ~1MB) stays off the media share, and the
  # only NFS path it can reach is the library folder. See
  # suwayomi--deployment.yaml.
  mangaSubPath: mangas
  # Extension source repositories, seeded into Suwayomi by the suwayomi-setup Job
  # (Suwayomi ships none since the original Tachiyomi repo was taken down). The
  # WebUI equivalent is Settings → Browse → Extension Repositories.
  extensionRepos:
    - https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json
    # comix.to source (N3uralCreativity). Third-party, outside keiyoushi, and
    # flagged nsfw:1 in its index -- Suwayomi's WebUI hides nsfw sources behind
    # a client-side toggle (there is no server-side nsfw setting in v2.2.2100),
    # so it must also be enabled per-browser under the WebUI settings.
    - https://raw.githubusercontent.com/n3uralcreativity/comix-downloader/repo/index.min.json
  ports:
    http:
      name: suwayomi-http
      targetPort: 4567
  pvc:
    app: "{{ .Values.storage.defaultVolumes.apps }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    # Suwayomi spins up an embedded headless Chromium (JCEF/KCEF) per manga
    # update for JS-heavy sources; 768Mi left it pinned at its cgroup ceiling
    # (20 restarts/32d in prod, exit 134). Bumped to 1.25Gi.
    limits:
      memory: 1280Mi
comixDownloader:
  # comix.to downloader (https://github.com/Yui007/comix-downloader), wrapped by
  # platypod/comix-downloader. Overlaps with suwayomi above, which covers many
  # sources unattended -- this one exists only for comix.to, which suwayomi's
  # extension repos do not carry.
  #
  # NOT an unattended service, unlike the rest of this module. comix.to gates
  # every title page behind an interactive WAF puzzle ("drag to rotate the
  # circle until the picture lines up") that no headless bypass clears, and the
  # resulting `waf_pass` cookie lasts only ~1h. So the pod ships a Qt GUI on a
  # virtual X display exported over noVNC: you open it, solve the puzzle by
  # hand, queue a batch that fits inside the hour, and close it.
  image: ghcr.io/platypod/comix-downloader:v0.1.0 # {"$imagepolicy": "flux-system:comix-downloader"}
  ports:
    http:
      # noVNC/websockify, not the app -- the app is a native Qt binary with no
      # HTTP listener of its own. Kept short on purpose: container port names
      # are IANA_SVC_NAME, capped at 15 chars, so "comix-downloader-http" (21)
      # is rejected by the API server even though Helm renders it fine.
      name: comix-http
      targetPort: 9000
  display:
    # Matches the Qt window's own 1100x750 plus room for the scraping Chromium
    # to sit over it while you solve the puzzle.
    geometry: 1400x950x24
  # x11vnc password. Empty here on purpose -- set per-env in platypod-sops
  # (clusters/<env>/secrets.enc.yaml), same as the komga/kavita credentials.
  # Authelia gates the IngressRoute; this is the second layer for anything that
  # can reach the Service directly inside the cluster.
  vncPassword: ""
  # Chromium's default 64MB /dev/shm crashes renderers partway through
  # image-heavy chapters; pod equivalent of compose's shm_size.
  shmSize: 2Gi
  storage:
    mediaPvc: "{{ .Values.storage.defaultVolumes.media }}"
    appsPvc: "{{ .Values.storage.defaultVolumes.apps }}"
    # Komga's `mangas` library root (see komga.libraries above), so finished
    # chapters are picked up by the next scan with no move step. That is the same
    # folder Suwayomi downloads into; both are meant to write group-writable
    # (this pod via its UMASK env, Suwayomi via its umask wrapper) under the
    # folder's setgid bit, so neither can lock the other — or the laptop — out of
    # what it creates. Untested in practice: this service is enable:false in both
    # envs (see registry.yaml), so verify the mode of what it writes if it is
    # ever turned back on.
    librarySubPath: mangas
  # Seeded into config.json by the init container on FIRST BOOT ONLY; changes
  # made from the GUI afterwards are never overwritten.
  defaultSettings:
    output_format: pdf
    # false: PDF only. true also retains every raw .webp page, roughly doubling
    # the footprint of an already 3GB+ series.
    keep_images: false
    enable_logs: true
    # 1x4, walked down from the upstream 5x6 default. At 5x6 a 150-chapter batch
    # spawned 22 Chromium processes, wedged on a lapsed WAF token and made no
    # progress for ~10min. 2x4 ran ~4.4x faster (2.9 MB/s vs 0.67 MB/s) but its
    # fan-out still tripped a Cloudflare rate rule: the page loads, then flips
    # to "Sorry, you have been blocked" seconds later as the workers burst.
    # 1 chapter at a time is the least bursty shape the app can take.
    max_chapter_workers: 1
    # 2, down from 4: with 1 chapter worker the fan-out is entirely this number,
    # so 1x2 is 2 concurrent fetches against the upstream default's 30.
    max_image_workers: 2
    retry_count: 3
    retry_delay: 2.0
    chapters_display_limit: 0
    download_path: "{{ .Values.media.system.data.path }}/{{ .Values.comixDownloader.storage.librarySubPath }}"
    # false: the scraping Chromium must be VISIBLE on the X display, otherwise
    # the WAF puzzle cannot be solved and every fetch dies after 60s with
    # "Comix page did not become ready".
    headless: false
  # 0 on purpose. This is an on-demand service and local-w1 has ~900Mi of
  # schedulable memory left across 21 pods -- not enough for a Qt GUI + Xvfb +
  # a Chromium tree that measured ~3.5Gi resident under load. At replicas 1 the
  # pod sits Pending forever, which keeps the media HelmRelease un-ready and
  # blocks `files` behind its dependsOn.
  #
  # Scale up by hand when you want it (and have freed memory):
  #   kubectl scale deploy/comix-downloader -n local-platypod --replicas=1
  replicasNb: 0
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      # Qt GUI + Xvfb + a Chromium tree. Measured ~3.5Gi resident at 5x6
      # workers; 4Gi leaves headroom at the 2x4 defaults above.
      memory: 4Gi
mediarvester:
  image: ghcr.io/platypod/mediarvester:v1.10.1 # {"$imagepolicy": "flux-system:mediarvester"}
  ports:
    http:
      name: http
      targetPort: 8080
  database:
    # SQLAlchemy async connection string to the shared media PostgreSQL.
    url: "postgresql+asyncpg://{{ .Values.database.serviceCredentials.mediarvester.username }}:{{ .Values.database.serviceCredentials.mediarvester.password }}@{{ .Values.k8s.names.services.prefix }}{{ .Values.database.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.database.ports.http.targetPort }}/{{ .Values.database.schemas.mediarvester.main }}"
  auth:
    # Authelia forwards the authenticated user via this header (see authResponseHeaders).
    header: Remote-User
    defaultUser: anonymous
  downloadConcurrency: 2
  logLevel: INFO
  # 000, not media.system.umask (002): the replays share is historically
  # world-writable (2777 dirs, 666 files) — it's touched by the mac client over
  # NFS, Synology's own indexer, and this pod, none of which share a common
  # uid/gid. Group-write alone (002) would only help clients whose gid matches
  # ours; world-write sidesteps the mismatch entirely.
  umask: "000"
  storage:
    mediaPvc: "{{ .Values.storage.defaultVolumes.media }}"
    # Legitimate, intentional value -- mediarvester downloads replays from
    # media platforms and, unlike the rest of the *arr stack, does its own
    # pick/rename into the library path rather than handing that off to a
    # separate tool. NOT a stray/copy-paste value (was wrongly suspected and
    # briefly renamed to "downloads/mediarvester" -- reverted). The real bug
    # was that this subPath had never been chowned for mediarvester's uid/gid
    # -- see the init-permissions container above, which now covers it.
    mediaSubPath: replays
    appsPvc: "{{ .Values.storage.defaultVolumes.apps }}"
    cookiesSubPath: mediarvester/cookies
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      # Was 1Gi, then 2Gi (2026-08-20 incident, see below) -- bumped again to
      # 3Gi on 2026-09-01 after the pod OOMKilled at ~3.4 days uptime while
      # investigating a missed-download report. MALLOC_ARENA_MAX=2 was meant
      # to address the underlying climb but was never proven (see the
      # incident doc); this is still headroom, not a fix. Request raised to
      # 1Gi to match the observed post-restart baseline more closely.
      # docs/incidents/2026-08-20-youtube-403-and-oom.md.
      memory: 3Gi
  potProvider:
    # Sidecar for yt-dlp's PO Token requirement -- see bgutil-ytdlp-pot-provider
    # in requirements.txt for why. The plugin auto-discovers it at the default
    # http://127.0.0.1:4416 (shared network namespace, same pod) with zero
    # extractor-args config needed. Node flavor: no runtime writes, so it needs
    # nothing mounted -- only the container-level securityContext override,
    # since the image's own baked-in `node` user (uid/gid 1000) doesn't match
    # mediarvester's pod-level runAsUser (needed for its own NFS access).
    # 1.3.2 (2026-08-21) mints WebPO tokens from the homepage challenge + ytcfg,
    # fixing the 403s YouTube's "bind GVS PO Token to video ID" A/B test caused
    # on adaptive/DASH formats under 1.3.1 -- confirmed empirically. See
    # ../../../mediarvester/docs/incidents/2026-08-20-youtube-403-and-oom.md.
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2-node
    port: 4416
    userId: 1000
    groupId: 1000
    resources:
      requests:
        cpu: 10m
        # Was 64Mi/128Mi -- Mimir showed working-set memory riding at
        # 100-128Mi (essentially pinned at the limit) for the entire
        # ~3.75-day lifetime of a real pod, with 4 OOM restarts over that
        # window (2026-08-27). Steady climb-then-kill, not a crash loop --
        # doubled both to give real headroom, same ratio as the main
        # container's own earlier OOM fix above. Bumped again 2026-09-01:
        # observed at 184Mi (72% of the 256Mi limit) within minutes of a
        # fresh restart, so the same climb-then-pin pattern was still live.
        memory: 192Mi
      limits:
        memory: 512Mi
# squat/generic-device-plugin: exposes an arbitrary host device path as a
# schedulable Kubernetes resource. Chosen over AMD's own ROCm k8s-device-plugin
# because ROCm targets Instinct-class compute cards and doesn't recognize
# consumer iGPUs like the Radeon 780M — this plugin doesn't care, it just
# bind-mounts whatever device file you point it at, which is all a VAAPI
# transcode workload needs.
gpuDevicePlugin:
  # Own privileged namespace, distinct from observability's — see namespace.yaml.
  namespace: "{{ .Values.k8s.namespace }}--privileged-gpu"
  image: squat/generic-device-plugin:2cc50b0@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576
  # Resulting schedulable resource name is "<resourceDomain>/<resourceLabel>".
  # devic.es is the plugin's own default domain (not something we chose).
  resourceDomain: devic.es
  resourceLabel: gpu-render
  device:
    # renderD128 is the Radeon 780M's VAAPI render node on chuwi-cp1 (confirmed
    # via `talosctl ls /dev/dri` per infra/docs/baremetal-cp-migration.md).
    path: /dev/dri/renderD128
    # Advertise 2 schedulable claims of this SAME device file, not because a
    # single Tdarr pod ever holds more than one (its multiple concurrent GPU
    # workers all share one mounted device fine — VAAPI tolerates concurrent
    # sessions) — this is purely so a rolling update can schedule the new pod
    # while the old one still holds its claim. With count=1, a replicas=1
    # Deployment update deadlocks: RollingUpdate needs the new pod Ready
    # before killing the old one, but the new pod can't schedule at all
    # ("Insufficient devic.es/gpu-render") while the old one still holds the
    # only unit. Verified live (2026-08-03).
    count: 2
  nodeSelector:
    node.platypod/platform: baremetal
  resources:
    requests:
      cpu: 50m
      memory: 10Mi
    limits:
      cpu: 50m
      memory: 20Mi
tdarr:
  image:
    server: ghcr.io/haveagitgat/tdarr:2.85.01
    node: ghcr.io/haveagitgat/tdarr_node:2.85.01
  node:
    name: tdarr-node-k8s
    # Requests the gpu-device-plugin resource (chuwi-cp1's Radeon 780M VAAPI
    # render node) and tells the Tdarr node to run N concurrent GPU workers so
    # the hardwareType=vaapi flow step actually engages hardware instead of
    # silently falling back to CPU. See tdarr--deployment.yaml. The k8s
    # resource request stays at 1 unit regardless of this count — VAAPI on
    # this iGPU tolerates multiple concurrent encode sessions against the
    # same /dev/dri/renderD128 fine; this is a Tdarr-side worker-pool size,
    # not a device-exclusivity limit.
    gpuEnable: true
    gpuWorkers: 2
  setup:
    # Seeds one flow + one library through Tdarr's REST API (idempotent).
    # Use this to codify "watch this folder and normalize to this format".
    enable: true
    scanAfterSetup: true
    updateExistingFlow: true
    flow:
      id: replays-normalize-h264-vaapi-test
      name: Replays Normalize (H264 VAAPI test)
      # FFmpeg Command Builder chain (not a classic plugin): hardware-encodes to
      # H264/MP4/AAC via the chuwi-cp1 Radeon 780M (VAAPI), the widest-compatibility
      # target. The render device (/dev/dri/renderD128) is mounted into the pod
      # via the gpu-device-plugin resource request in the Deployment.
      #
      # NOT using ffmpegCommandSetVideoEncoder's hardwareType=vaapi here: verified
      # live (2026-08-02) that Tdarr_Plugins' own encoder capability table lists
      # hevc_vaapi/av1_vaapi but never registers h264_vaapi at all — it throws
      # "Could not find encoder h264 for hardware vaapi" unconditionally, even
      # though ffmpeg itself supports h264_vaapi fine (confirmed manually against
      # this exact device). Upstream gap, not a config error. Driving VAAPI
      # directly via Custom Arguments sidesteps that table entirely.
      #
      # Deliberately NOT passing -hwaccel_output_format vaapi on the input side:
      # that forces hardware *decode* straight to a GPU surface, which the
      # `format=nv12,hwupload` filter then can't accept (hwupload expects a
      # software frame to push onto the GPU, not one already there) — verified
      # live, fails with "Impossible to convert between the formats supported by
      # the filter 'graph -1 input from stream 0:0' and the filter
      # 'auto_scale_0'". Software-decode + hardware-encode-only (this config)
      # is the well-known-correct VAAPI recipe and was verified working against
      # a real source file (produced a valid h264_vaapi/aac/mp4 output).
      plugins:
        - id: start
          pluginName: ffmpegCommandStart
        - id: hwaccel
          pluginName: ffmpegCommandCustomArguments
          inputs:
            inputArguments: "-hwaccel vaapi -hwaccel_device /dev/dri/renderD128"
            # +faststart moves the moov atom to the front of the file. Without
            # it (ffmpeg's default), moov lands at the very end — verified
            # live (2026-08-03) on a finished output: player has to seek to
            # the tail of an 800MB+ file before it can start, and over an NFS
            # mount that shows up as exactly the "smoother codec, but pauses
            # to load mid-playback" symptom reported.
            outputArguments: "-vf format=nv12,hwupload -c:v h264_vaapi -qp 23 -c:a aac -movflags +faststart"
        - id: container
          pluginName: ffmpegCommandSetContainer
          inputs:
            container: mp4
            forceConform: "true"
        - id: execute
          pluginName: ffmpegCommandExecute
        # Verified live (2026-08-03): the "Failed to move file" seen earlier
        # was plain EACCES — the "-h264" duplicate folder was still owned
        # pittinic:staff from being created on the host, not writable by
        # Tdarr's runtime PUID/PGID (media.system.userId/groupId). Not a race,
        # not an upstream bug. Fixed by chowning the duplicate folder to
        # Tdarr's runtime user; replaceOriginalFile (the standard, built-in
        # terminal step) works fine once the directory is actually writable.
        # Safe here specifically because the library folder (below) points
        # only at the duplicated "-h264" copy, never the real source.
        - id: replace
          pluginName: replaceOriginalFile
    library:
      id: replays-mrderiv-kcd2-h264-test
      name: Replays - MrDeriv - KCD2 (H264 test copy)
      # Points at the duplicated folder only, never the source — the flow ends
      # in replaceOriginalFile, which is safe here precisely because this
      # folder is a disposable copy, not "Kingdom Come Deliverance 2 - Le RPG
      # de l'Été" itself.
      folder: "{{ .Values.media.system.data.path }}/replays/MrDeriv/Kingdom Come Deliverance 2 - Le RPG de l'Été-h264"
      cache: "{{ .Values.media.system.data.path }}/ongoing/tdarr"
      output: "."
      container: ".mp4"
      # Restricted to webm (the only real source format here) rather than the
      # usual broad default list. Verified live (2026-08-03): with mp4 also in
      # the filter, replaceOriginalFile's own output lands in this same
      # watched folder, folder-watching rediscovers it as "new" on the next
      # rescan, and the flow reprocesses its own already-converted file — a
      # wasteful second pass that also corrupted the filename down to just
      # "<N>.mp4" along the way. Excluding mp4 from the scan entirely closes
      # off that whole class of reprocessing loop.
      containerFilter: "webm"
      folderWatching: true
      useFsEvents: false
  ports:
    ui:
      name: tdarr-ui
      targetPort: 8265
    server:
      name: tdarr-server
      targetPort: 8266
  pvc:
    # Tdarr server state uses a local sqlite db -> dedicated local config volume.
    app: "{{ .Values.storage.defaultVolumes.config }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  resources:
    server:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    node:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
reclaimerr:
  # OIDC login via Authelia. Empty clientId disables the integration entirely
  # (Authelia client block and app-side config are both gated on it).
  # Set real values per-env; hash: authelia crypto hash generate pbkdf2
  oidc:
    clientId: ""
    clientSecret:
      plain: ""
      hashed: ""
  # email set on the admin account by the setup Job; MUST match the Authelia
  # user's email — reclaimerr links OIDC logins strictly by email (no auto-create).
  adminEmail: ""
  image: ghcr.io/jessielw/reclaimerr:0.3.4
  credentials:
    # Admin account auto-created on first boot by the reclaimerr-setup Job.
    # reclaimerr fixes the username to "admin"; only the password is ours.
    # Override per-env. Min 3 / max 64 chars.
    password: password
  # Connections auto-wired by the setup Job via POST /api/settings/save/service
  # (idempotent upsert; reclaimerr runs a live connection test before saving).
  # reclaimerr supports radarr, sonarr, jellyfin, emby, plex, seerr, tautulli —
  # NOTE: NOT readarr. baseUrl/apiKey are tpl'd, so they can reference other svcs.
  services:
    - serviceType: radarr
      baseUrl: "http://{{ .Values.k8s.names.services.prefix }}{{ .Values.radarr.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.radarr.ports.http.targetPort }}"
      apiKey: "{{ .Values.radarr.apiKey }}"
    - serviceType: sonarr
      baseUrl: "http://{{ .Values.k8s.names.services.prefix }}{{ .Values.sonarr.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.sonarr.ports.http.targetPort }}"
      apiKey: "{{ .Values.sonarr.apiKey }}"
    - serviceType: seerr
      baseUrl: "http://{{ .Values.k8s.names.services.prefix }}{{ .Values.jellyseerr.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.jellyseerr.ports.http.targetPort }}"
      apiKey: "{{ .Values.jellyseerr.apiKey }}"
    - serviceType: jellyfin
      baseUrl: "http://{{ .Values.k8s.names.services.prefix }}{{ .Values.jellyfin.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.jellyfin.ports.http.targetPort }}"
      apiKey: "{{ .Values.jellyfin.apiKey }}"
      # Media servers (jellyfin/emby/plex) need exactly one "main" — the watch-state
      # source reclaimerr reclaims against.
      isMain: true
  ports:
    http:
      name: http
      targetPort: 8000
  pvc:
    app: "{{ .Values.storage.defaultVolumes.apps }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 50m
      memory: 448Mi
    limits:
      # 256Mi was too tight: the IMDb/AniList ratings refresh loads ~1.7M rows
      # into SQLite and was OOMKilling the pod every ~2h. 512Mi held but observed
      # usage sits at ~84% of it — bumped further for margin.
      memory: 640Mi
