rommapp:
  credentials:
    username: rommappUser
    password: rommappPassword
  database:
    credentials:
      username: "{{ .Values.rommapp.credentials.username }}"
      password: "{{ .Values.rommapp.credentials.password }}"
      rootPassword: "{{ .Values.rommapp.credentials.password }}Root"
    image: mariadb:11
    label: rommapp-db
    name: rommapp
    ports:
      http:
        name: rommapp-db
        targetPort: 3306
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.rommapp.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  igdb:
    clientId:  # https://docs.romm.app/latest/Getting-Started/Generate-API-Keys/#igdb
    clientSecret:  # https://docs.romm.app/latest/Getting-Started/Generate-API-Keys/#igdb
  image: rommapp/romm:4.0-slim
  label: rommapp
  mobyGamesApiKey: # https://docs.romm.app/latest/Getting-Started/Generate-API-Keys/#mobygames
  ports:
    http:
      name: rommapp-http
      targetPort: 8080
  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  replicasNb: 1
  retroachievementsApiKey: # https://api-docs.retroachievements.org/#api-access
  screenscraper:
    username: # https://docs.romm.app/latest/Getting-Started/Generate-API-Keys/#screenscraper
    password: # https://docs.romm.app/latest/Getting-Started/Generate-API-Keys/#screenscraper
  secretKey: a9c0a3a3128b411afdd67f3616f3be159eda33d709f7cdb3ca00c66c72adb3c6
  steamGridDbApiKey: # https://docs.romm.app/latest/Getting-Started/Generate-API-Keys/#steamgriddb
