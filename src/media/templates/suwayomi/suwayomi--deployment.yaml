{{- if .Values.suwayomi.enable }}
{{- $appVolume := "app-volume" }}
{{- $mediaVolume := "media-volume" }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.suwayomi.label .Values.k8s.names.pods.suffix }}
{{- $dataDir := "/home/suwayomi/.local/share/Tachidesk" }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.suwayomi.replicasNb }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      # Runs as the image's native uid 1000 (no runAsUser): Suwayomi is not a
      # linuxserver image and has no PUID/PGID, and its JCEF/Chromium cache dirs
      # under /home/suwayomi are mode 0700 owned by that uid, so a custom uid
      # loses the embedded browser the JS-heavy sources need. (The bundled JAR
      # itself is 0777 and would run under any uid — an older comment here
      # claiming 0750 was wrong for this image.)
      #
      # Its identity therefore does NOT match the media user, and over NFS it
      # matches the laptop even less. What makes the library manageable by all
      # three is mode, not ownership: the library folder is setgid to
      # media.system.groupId and Suwayomi runs with media.system.umask, so every
      # directory and file it creates comes out group-owned by that gid and
      # group-writable — the same convention as every other folder on the share.
      # NEVER fsGroup on the NFS PVCs (recursive chown of the whole 18TB share)
      # — see CLAUDE.md.
      initContainers:
      # The app-volume data dir is root-owned on first mount — chown it to
      # suwayomi's uid, never the whole volume.
      #
      # The media library folder is deliberately NOT chowned. It is shared with
      # comix-downloader and managed by hand from the laptop, so a recursive
      # chown here would take it over on every pod start — which is exactly what
      # used to happen, and why 116GB of BD parked under this path ended up
      # 1000:1000 and unmanageable (see docs/media/comics-layout-migration.md).
      # Only the mountpoint's own mode is asserted, non-recursively: 2777 so any
      # uid can write, +setgid so everything created beneath inherits
      # media.system.groupId and stays group-writable for the other writers.
      - name: init-permissions
        image: busybox:1.37.0
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -c
        - |
          mkdir -p /data/suwayomi/downloads
          chown -R 1000:1000 /data/suwayomi
          mkdir -p /library
          chgrp {{ .Values.media.system.groupId }} /library || true
          chmod 2777 /library
        volumeMounts:
        - name: {{ $appVolume }}
          mountPath: /data
        - name: {{ $mediaVolume }}
          mountPath: /library
          subPath: {{ .Values.suwayomi.mangaSubPath }}
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.suwayomi.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.suwayomi.image }}
        # Upstream entrypoint is `tini -- /home/suwayomi/startup_script.sh`, run
        # under the image's default umask 0022 — which is what made every new
        # series directory 0755 and locked the laptop (and comix-downloader) out
        # of anything Suwayomi created. Re-exec it under media.system.umask so
        # new content is group-writable like the rest of the share. tini is kept
        # as PID 1: Suwayomi forks a headless Chromium per update and needs the
        # zombie reaping.
        command:
        - /usr/bin/tini
        - --
        - sh
        - -c
        # printf: media.system.umask is 002 in values, which YAML loads as the
        # integer 2 — harmless to `umask` (it reads octal) but unreadable in a
        # rendered manifest, so pad it back to 3 digits.
        - "umask {{ printf "%03d" (int .Values.media.system.umask) }} && exec /home/suwayomi/startup_script.sh"
        resources:
          {{- toYaml .Values.suwayomi.resources | nindent 10 }}
        ports:
        - name: {{ .Values.suwayomi.ports.http.name }}
          containerPort: {{ .Values.suwayomi.ports.http.targetPort }}
        env:
        - name: BIND_PORT
          value: "{{ .Values.suwayomi.ports.http.targetPort }}"
        # No native auth — Authelia forwardauth gates the ingress.
        - name: AUTH_MODE
          value: "none"
        # CBZ so Kavita reads the downloaded chapters as a comic library.
        - name: DOWNLOAD_AS_CBZ
          value: "true"
        # Reuse the shared Flaresolverr (media module) to bypass Cloudflare.
        - name: FLARESOLVERR_ENABLED
          value: "true"
        - name: FLARESOLVERR_URL
          value: "http://{{ .Values.k8s.names.services.prefix }}{{ .Values.flaresolverr.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.flaresolverr.ports.http.targetPort }}"
        volumeMounts:
        - mountPath: {{ $dataDir }}
          name: {{ $appVolume }}
          subPath: suwayomi
        # Suwayomi hard-codes <downloadsPath>/mangas/<source>/<series>/<chapter>
        # and puts its own thumbnails/ next to that `mangas`. Mount ONLY the
        # `mangas` level from the media share, so <downloadsPath> itself stays on
        # the app volume: Suwayomi's scratch never lands on the share, the share
        # never has a folder that is really Suwayomi's app data, and the library
        # folder is a plain top-level `mangas` that Komga reads directly.
        # Mounts are applied shortest-path-first, so this nests inside the
        # $dataDir mount above.
        - mountPath: {{ $dataDir }}/downloads/mangas
          name: {{ $mediaVolume }}
          subPath: {{ .Values.suwayomi.mangaSubPath }}
      volumes:
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.suwayomi.pvc.app . }}
      - name: {{ $mediaVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.suwayomi.pvc.media . }}
{{- end }}
