{{- if and .Values.finance.enable .Values.finance.grafana.enable }}
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ tpl .Values.finance.grafana.label . }}-dashboards{{ .Values.k8s.names.configMaps.suffix }}

data:
  {{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
