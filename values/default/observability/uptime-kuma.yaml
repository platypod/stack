uptimeKuma:
  enable: true
  label: uptime-kuma
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.uptimeKuma.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  # Pinned to the 1.23.x stable line. 2.x is a beta that dropped the Socket.io
  # API the seed Job (uptime-kuma-api) relies on — see docs/services.md.
  image: louislam/uptime-kuma:1.23.17
  ports:
    http:
      name: uk-http
      targetPort: 3001
  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # First-boot admin, created by the seed Job. Override per env if desired.
  credentials:
    username: admin
    password: uptime-kuma-admin
  # Monitors seeded by the post-install/upgrade Job. Each is an in-cluster HTTP
  # check against the service's ClusterIP (bypasses Authelia, so we see the real
  # app health, not a 302 to the login page). Idempotent: matched by name.
  # `url` is tpl'd. Disabled services should be removed/commented here.
  monitors:
    - { name: "Homepage",     url: "http://homepage:3000" }
    - { name: "Dashy",        url: "http://dashy:8080" }
    - { name: "Traefik",      url: "http://traefik-dashboard:9999" }
    - { name: "Authelia",     url: "http://authelia:9091" }
    - { name: "LLDAP",        url: "http://lldap:17170" }
    - { name: "AdGuard",      url: "http://adguard:80" }
    - { name: "Grafana",      url: "http://grafana:3000" }
    - { name: "Mimir",        url: "http://mimir:8080/ready" }
    - { name: "Loki",         url: "http://loki:3100/ready" }
    - { name: "Tempo",        url: "http://tempo:80/ready" }
    - { name: "BookStack",    url: "http://bookstack:80" }
    - { name: "Wiki.js",      url: "http://wikijs:3000" }
    - { name: "Outline",      url: "http://outline:3000" }
    - { name: "Vaultwarden",  url: "http://vaultwarden:80/alive" }
    - { name: "IT-Tools",     url: "http://it-tools:80" }
    - { name: "CyberChef",    url: "http://cyber-chef:80" }
    - { name: "whoami",       url: "http://whoami:80" }
    - { name: "Jellyfin",     url: "http://jellyfin:8096/health" }
    - { name: "Jellyseerr",   url: "http://jellyseerr:5055" }
    - { name: "Radarr",       url: "http://radarr:7878" }
    - { name: "Sonarr",       url: "http://sonarr:8989" }
    - { name: "Readarr",      url: "http://readarr:8787" }
    - { name: "Prowlarr",     url: "http://prowlarr:9696" }
    - { name: "Bazarr",       url: "http://bazarr:6767" }
    - { name: "Mediarvester", url: "http://mediarvester:8080" }
    - { name: "Reclaimerr",   url: "http://reclaimerr:8000" }
    - { name: "Kavita",       url: "http://kavita:5000" }
    - { name: "Suwayomi",     url: "http://suwayomi:4567" }
    - { name: "Flaresolverr", url: "http://flaresolverr:8191" }
    - { name: "Transmission", url: "http://transmission:9091" }
    - { name: "RomM",         url: "http://rommapp:8080" }
    - { name: "PokeClicker",  url: "http://pokeclicker:3000" }
