deluge:
  host: ${k8s.names.urls.prefix}${deluge.label}${k8s.names.urls.suffix}.${traefik.domain}
  image: lscr.io/linuxserver/deluge:latest
  label: deluge
  logLevel: info
  credentials:
    username: admin
    password: deluge
  download:
    torrents: ${media.system.downloads.torrents}/${deluge.label}
    ongoing: ${media.system.downloads.ongoing}/${deluge.label}
    finished: ${media.system.downloads.finished}
  ports:
    http:
      name: deluge-webui
      targetPort: 8112
    tcp:
      name: incoming-tcp
      port: 6881
      targetPort: 6881
      protocol: TCP
    udp:
      name: incoming-udp
      port: 6881
      targetPort: 6881
      protocol: UDP
  replicasNb: 1
  storage:
    pvc:
      app: ${storage.defaultVolumes.apps}
      media: ${storage.defaultVolumes.media}
