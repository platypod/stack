# Prod-only — local uses hostPath storage, not NFS (stack/docs/conventions.md).
# This is the only thing that installs the driver: the imperative
# `make install-csi` target was retired in Phase 8, and re-running one by hand
# would fight this release for ownership (stack/docs/flux-migration.md gotcha
# 14). The Makefile keeps CSI_DRIVER_NFS_VERSION as a documentation-only
# mirror of the version below — bump both together, but nothing reads it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.2"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  targetNamespace: kube-system
