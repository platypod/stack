apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.dashboard.label }}{{ .Values.k8s.names.configMaps.suffix }}
data:
  grafana.ini: |
    ;https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/

    [analytics]
    reporting_enabled = false

    [auth]
    disable_login_form = true
    [auth.generic_oauth]
    api_url = https://{{ tpl .Values.authelia.host . }}/api/oidc/userinfo
    auth_url = https://{{ tpl .Values.authelia.host . }}/api/oidc/authorization
    client_id = {{ .Values.observability.dashboard.oidc.clientId }}
    client_secret = {{ .Values.observability.dashboard.oidc.clientSecret.plain }}
    empty_scopes = false
    enabled = true
    groups_attribute_path = groups
    login_attribute_path = preferred_username
    name_attribute_path = name
    ; GrafanaAdmin = full server admin (manage orgs, all users, server settings)
    ; and implies org Admin. Requires allow_assign_grafana_admin = true below.
    role_attribute_path = contains(groups, 'admins') && 'GrafanaAdmin' || contains(groups, 'dev') && 'Editor' || 'Viewer'
    allow_assign_grafana_admin = true
    scopes = openid profile email groups
    token_url = https://{{ tpl .Values.authelia.host . }}/api/oidc/token
    use_pkce = false
    ; dev uses a self-signed (mkcert) wildcard cert; skip verification on the
    ; OAuth back-channel only when selfSigned is set. Prod (real ACME cert) → false.
    tls_skip_verify_insecure = {{ .Values.traefik.tls.selfSigned }}

    [log]
    mode = console
    [log.console]
    level = {{ .Values.observability.dashboard.logging.level }}
    format = {{ .Values.observability.dashboard.logging.format }}

    [dataproxy]
    ; Send X-Grafana-User on datasource requests so the scope shim can resolve
    ; the user's LLDAP groups and scope the query. See
    ; docs/observability/dashboard-multitenancy.md.
    send_user_header = true

    [security]
    disable_initial_admin_creation = true

    [server]
    http_port = {{ .Values.observability.dashboard.ports.http.targetPort }}
    enable_gzip = true
    root_url = https://{{ tpl .Values.observability.dashboard.host . }}

    [smtp]
    enabled = true

    [users]
    allow_sign_up = true
    auto_assign_org_role = Admin
    auto_login = true
    default_language = detect
    default_theme = system

  dashboards-providers.yaml: |
    apiVersion: 1
    providers:
    - name: 'media'
      orgId: 1
      folder: 'Media'
      type: file
      options:
        path: /var/lib/grafana/dashboards/media
    - name: 'Platform'
      orgId: 1
      folder: 'Platform'
      type: file
      options:
        path: /var/lib/grafana/dashboards/platform
    - name: 'Claude'
      orgId: 1
      folder: 'Claude'
      type: file
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards/claude

  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Loki
      uid: logs
      type: loki
      access: proxy
      # Routed through the logs scope shim (→ Loki), which injects the per-user
      # X-Scope-OrgID tenant. Not Loki directly (auth_enabled requires a tenant).
      url: http://{{ range $.Values.observability.scopeShim.instances }}{{ if eq .name "logs" }}{{ $.Values.k8s.names.services.prefix }}{{ .label }}{{ $.Values.k8s.names.services.suffix }}{{ end }}{{ end }}:{{ $.Values.observability.scopeShim.ports.http.targetPort }}
      editable: false
      jsonData:
        httpHeaderName1: '{{ .Values.observability.scopeShim.secretHeader }}'
      secureJsonData:
        httpHeaderValue1: '{{ .Values.observability.scopeShim.secret }}'

    - name: Tempo
      uid: traces
      type: tempo
      access: proxy
      url: http://{{ .Values.k8s.names.services.prefix }}{{ .Values.observability.traces.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.traces.ports.http.targetPort }}
      editable: false

    - name: Mimir
      # uid stays "metrics" — every provisioned dashboard references it.
      uid: metrics
      type: prometheus
      access: proxy
      {{- if .Values.observability.scopeShim.scopeMetrics }}
      # Routed through the scope shim (→ prom-label-proxy → Mimir/prometheus), NOT
      # Mimir directly, so every query is per-user scoped on the `owner` label. The
      # shim reads X-Grafana-User (dataproxy.send_user_header) + the shared secret.
      url: http://{{ range $.Values.observability.scopeShim.instances }}{{ if eq .name "metrics" }}{{ $.Values.k8s.names.services.prefix }}{{ .label }}{{ $.Values.k8s.names.services.suffix }}{{ end }}{{ end }}:{{ $.Values.observability.scopeShim.ports.http.targetPort }}
      isDefault: true
      editable: false
      jsonData:
        # Shared-secret header so the shim trusts this datasource's X-Grafana-User.
        httpHeaderName1: '{{ .Values.observability.scopeShim.secretHeader }}'
      secureJsonData:
        httpHeaderValue1: '{{ .Values.observability.scopeShim.secret }}'
      {{- else }}
      # scopeMetrics=false: query Mimir directly — no per-user metric scoping. Used
      # where all Grafana users are admins and/or to keep pre-`owner` history
      # visible. Logs stay tenant-isolated regardless. See dashboard-multitenancy.md.
      url: http://{{ $.Values.k8s.names.services.prefix }}{{ $.Values.observability.metrics.label }}{{ $.Values.k8s.names.services.suffix }}:{{ $.Values.observability.metrics.ports.http.targetPort }}/prometheus
      isDefault: true
      editable: false
      {{- end }}

