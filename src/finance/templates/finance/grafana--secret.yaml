{{- if and .Values.finance.enable .Values.finance.grafana.enable }}
{{- $g := .Values.finance.grafana }}
{{- if not $g.oidc.clientId }}
{{- fail "finance.grafana.enable is true but finance.grafana.oidc.clientId is empty - set the OIDC client (and its hash, for Authelia) in platypod-sops" }}
{{- end }}
apiVersion: v1
kind: Secret

metadata:
  name: {{ .Values.k8s.names.services.prefix }}{{ tpl $g.label . }}{{ .Values.k8s.names.services.suffix }}-env

stringData:
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ $g.oidc.clientId }}"
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ $g.oidc.clientSecret.plain }}"
  FINANCE_GRAFANA_DB_PASSWORD: "{{ .Values.finance.database.credentials.grafana.password }}"
{{- end }}
