# Mirrors clusters/local/secrets.yaml — separate GitRepository (private,
# its own read-only deploy key) decrypting clusters/prd/secrets.enc.yaml
# via the in-cluster sops-age Secret. See stack/docs/flux-migration.md
# Phase 7 (and the two-repo SOPS design for why this is a second source).
#
# ref: branch `main`, matching clusters/prd/flux-system/gotk-sync.yaml's stack
# GitRepository. Both repos use the same split now: local tracks `dev`, prod
# tracks `main`, and merging dev -> main is the promotion. This replaced the
# old semver tag gate (">=1.0.0"), which had fallen out of step with the stack
# repo's own ref -- stack moved to a branch in 91cf21d while this stayed
# tag-gated -- and was a standing source of confusion.
#
# The switch was verified a no-op at the time: ">=1.0.0" resolves to the
# HIGHEST matching tag, which was v1.0.1 == main == fd98a01, byte-identical
# over clusters/prd/. Worth re-checking the same way if this is ever changed
# again -- `git diff v<highest>..main -- clusters/prd/` -- because a semver ref
# silently sits on the newest tag, not the oldest, which is easy to misread.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platypod-sops
  namespace: flux-system
spec:
  interval: 5m0s
  ref:
    branch: main
  secretRef:
    name: platypod-sops-deploy-key
  url: ssh://git@github.com/platypod/platypod-sops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/prd
  prune: true
  sourceRef:
    kind: GitRepository
    name: platypod-sops
  decryption:
    provider: sops
    secretRef:
      name: sops-age
