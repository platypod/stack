{{- /*
  Dedicated LOCAL (non-NFS) volume for dedicated game servers (Palworld,
  Valheim, Satisfactory, Terraria, Minecraft, …).

  These servers are already pinned to a single node via nodeSelector, so NFS's
  cross-node portability buys nothing — and every game image re-validates its
  full install (checksums, ownership fixes) on each container start, which is
  catastrophically slow over NFS (2026-08-02: a Palworld restart took ~4h
  instead of its normal ~15min, traced to NFS read/write latency). Node-local
  storage removes that bottleneck entirely.

  Same shape as local-config/config-volume.yaml (hostPath+DirectoryOrCreate,
  pinned via nodeAffinity, COEXISTS with storage.nfs). See
  local-storage-class.yaml for the shared StorageClass both reference.

  No backup CronJob (unlike localConfig) — deferred, see stack/docs/TODO.md.
*/ -}}
{{- if .Values.storage.localGames.enable }}
{{- $c := .Values.storage.localGames }}
apiVersion: v1
kind: PersistentVolume

metadata:
  name: {{ .Values.k8s.names.persistentVolumes.prefix }}{{ $c.name }}{{ .Values.k8s.names.persistentVolumes.suffix }}
  labels:
    {{- toYaml $c.labels | nindent 4 }}
spec:
  capacity:
    storage: {{ $c.capacityStorage }}
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  # hostPath (not `local:`) with DirectoryOrCreate so the node directory is
  # auto-created on first mount — local PVs require the path to pre-exist, and
  # the namespace's baseline PodSecurity forbids a hostPath pod to mkdir it.
  # Pods consume this via the PVC, so PSA never sees a hostPath in the pod spec.
  # nodeAffinity still pins it to the local-storage node.
  hostPath:
    path: {{ $c.rootPath }}{{ $c.name }}/
    type: DirectoryOrCreate
  nodeAffinity:
    {{- tpl (toYaml $c.nodeAffinity) $ | nindent 4 }}

---

apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: {{ .Values.k8s.names.persistentVolumeClaims.prefix }}{{ $c.name }}{{ .Values.k8s.names.persistentVolumeClaims.suffix }}
spec:
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: {{ $c.capacityStorage }}
  selector:
    matchLabels:
      {{- toYaml $c.labels | nindent 6 }}
{{- end }}
