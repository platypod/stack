observability:
  logs:
    label: loki
    # Loki tenant for logs that don't set X-Scope-OrgID (native Claude telemetry,
    # future k8s pod logs). Admins federate it (scopeShim.sharedTenants).
    defaultTenant: "_shared"
    image: grafana/loki:3.7.2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.logs.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
    ports:
      grpc:
        name: grpc
        targetPort: 9096
      http:
        name: http
        targetPort: 3100
    logging:
      level: info
