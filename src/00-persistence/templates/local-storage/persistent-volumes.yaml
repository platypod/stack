{{- if .Values.storage.localStorage.isEnabled }}

{{- if .Values.storage.nfs.isEnabled }}
{{- fail "Both storage.localStorage and storage.nfs are enabled. Please choose one."}}
{{- end}}

{{- range $volume := .Values.storage.localStorage }}

{{- $capacityStorage := "" }}
{{- if hasKey $volume "capacityStorage" }}
{{- $capacityStorage = $volume.capacityStorage }}
{{- else }}
{{- $capacityStorage = $.Values.storage.nfs.default.capacityStorage }}
{{- end }}

{{- $reclaimPolicy := "" }}
{{- if hasKey $volume "reclaimPolicy" }}
{{- $reclaimPolicy = $volume.reclaimPolicy }}
{{- else }}
{{- $reclaimPolicy = $.Values.storage.nfs.default.reclaimPolicy }}
{{- end }}

{{- $rootPath := "" }}
{{- if hasKey $volume "rootPath" }}
{{- $rootPath = $volume.rootPath }}
{{- else }}
{{- $rootPath = $.Values.storage.nfs.default.rootPath }}
{{- end }}

{{- $nodeAffinity := "" }}
{{- if hasKey $volume "nodeAffinity" }}
{{- $nodeAffinity = $volume.nodeAffinity }}
{{- else }}
{{- $nodeAffinity = $.Values.storage.nfs.default.nodeAffinity }}
{{- end }}

apiVersion: v1
kind: PersistentVolume

metadata:
  name: {{ $.Values.k8s.names.persistentVolumes.prefix }}{{ $volume.name }}{{ $.Values.k8s.names.persistentVolumes.suffix }}
  labels:
    {{- toYaml $volume.labels | nindent 4}}
spec:
  capacity:
    storage: {{ $capacityStorage }}
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: {{ $reclaimPolicy }}
  storageClassName: local-storage
  local:
    path: {{ $rootPath }}{{ $volume.name }}/
  nodeAffinity:
    {{- toYaml $volume.nodeAffinity | nindent 4}}

---

{{ end }}
{{ end }}
