traefik:
  domain: example.com
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.traefik.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image:
    registry: docker.io/
    namespace: ""
    repository: traefik
    tag: v3.7.5
  label: traefik
  dashboardLabel: traefik-dashboard
  logging:
    format: json
    level: ERROR
  ports:
    dashboard:
      # name has to be traefik, see https://doc.traefik.io/traefik/operations/api/#insecure
      name: traefik
      port: 9999
      targetPort: 9999
    http:
      name: http
      port: 80
      targetPort: 80
      nodePort: 30680
    https:
      name: https
      port: 443
      targetPort: 443
      nodePort: 30679
    # TCP entrypoint (not HTTP) for LDAPS — TLS-terminated at Traefik, plaintext
    # forwarded to the backend Service inside the cluster. Currently only used
    # to front LLDAP for clients outside the cluster (see lldap.ldaps.enable).
    ldaps:
      name: ldaps
      port: 636
      targetPort: 636
      nodePort: 30678
  replicasNb: 1
  # Address this Service answers on from the LAN. When set, the Service becomes
  # ClusterIP with spec.externalIPs: kube-proxy accepts traffic for that address
  # on the node and DNATs it to the pod, so the router can forward straight to
  # the node IP with no LoadBalancer and no MetalLB.
  #
  # externalIPs rather than hostNetwork/hostPort deliberately: PodSecurity
  # "baseline" (Talos' default for non-system namespaces) forbids host
  # namespaces and host ports, and prd-platypod stays at baseline — see the
  # observability nodes-collectors namespace for the precedent.
  #
  # Required when the LAN-facing node is a control plane: Kubernetes labels those
  # node.kubernetes.io/exclude-from-external-load-balancers, MetalLB honours it
  # and refuses to announce, and Talos re-applies the label from a NodeLabelSpec
  # after every reboot. See infra/docs/baremetal-cp-migration.md.
  #
  # Also used as AdGuard's "*.<domain>" rewrite target, so internal clients do
  # not hairpin through the router.
  externalIP: ""
  loadBalancerIP: ""   # MetalLB path only; ignored when externalIP is set.
  # Pin the pod to specific node(s). Required with externalIP: only the node
  # holding the endpoint answers for that address, and it must be the node the
  # router forwards to. Also required on the LoadBalancer path, where
  # externalTrafficPolicy=Local means MetalLB announces from the pod's own node.
  # Empty = no constraint (dev, single node).
  nodeSelector: {}
  resolverName: letsencrypt
  tls:
    selfSigned: false
    wildcard: false
    secretName: ""
  storage:
    pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  # CPU: request only (no limit) — avoids throttling. Memory: request≈limit.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
