# Mirrors clusters/local/secrets.yaml — separate GitRepository (private,
# its own read-only deploy key) decrypting clusters/prd/secrets.enc.yaml
# via the in-cluster sops-age Secret. See stack/docs/flux-migration.md
# Phase 7 (and the two-repo SOPS design for why this is a second source).
#
# ref: STILL the old semver tag gate, deliberately -- this is the one piece
# of the 2026-09-01 dev/main split left unfinished. Everything else (stack on
# both clusters, platypod-sops on local) moved to the dev/main model; see
# docs/branching.md's "Remaining step".
#
# Flipping this to `branch: main` is a one-line change, but it is NOT the
# no-op it looks like: prod is pinned at tag v1.0.0 while sops main has moved
# on, so the flip would apply every intervening prod secret change at once --
# including "Enable shelfmark, retire readarr" (fd98a01), 53 lines of
# clusters/prd/secrets.enc.yaml -- into the shared `platypod-secrets` that
# many releases consume, under a Kustomization with prune: true. Prod already
# runs shelfmark (the stack half reached it via main), so only the secrets
# half is outstanding. Flip it deliberately, when that change is finished and
# you want it live -- not as part of a refactor.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platypod-sops
  namespace: flux-system
spec:
  interval: 5m0s
  ref:
    semver: ">=1.0.0"
  secretRef:
    name: platypod-sops-deploy-key
  url: ssh://git@github.com/platypod/platypod-sops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/prd
  prune: true
  sourceRef:
    kind: GitRepository
    name: platypod-sops
  decryption:
    provider: sops
    secretRef:
      name: sops-age
