jellyfin:
  enable: true          # whether Jellyfin exists at all (homepage tile, ingress route, metrics)
  inCluster: true       # run the in-cluster Jellyfin pod; false = proxy to an external instance (see proxy.enable)
  apiKey: ""            # set per-env after first deploy (generate in Jellyfin admin → API Keys)
  baseUrl: ""           # URL base path if Jellyfin is served under a subpath (usually empty)
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.jellyfin.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: jellyfin/jellyfin:latest
  label: jellyfin
  replicasNb: 1
  ports:
    http:
      name: jellyfin
      targetPort: 8096
  proxy:
    enable: false         # set true to proxy to an out-of-cluster Jellyfin instead
    host: host.docker.internal
    port: 8096
  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
