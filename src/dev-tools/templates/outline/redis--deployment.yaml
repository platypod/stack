{{- if .Values.outline.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix (tpl .Values.outline.redis.label .) .Values.k8s.names.pods.suffix }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.outline.redis.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ tpl .Values.outline.redis.label . }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.outline.redis.image }}
        resources:
          {{- toYaml .Values.outline.redis.resources | nindent 10 }}
        ports:
        - name: {{ .Values.outline.redis.ports.http.name }}
          containerPort: {{ .Values.outline.redis.ports.http.targetPort }}
{{- end }}
