# Second GitRepository source (private, separate read-only deploy key —
# see stack/docs/flux-migration.md's two-repo SOPS design). Decrypts
# clusters/local/secrets.enc.yaml via the in-cluster `sops-age` Secret
# (flux-system/sops-age, holding the same age key backed up on the NFS
# share) and wraps it into a real Secret via that repo's own
# clusters/local/kustomization.yaml secretGenerator.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platypod-sops
  namespace: flux-system
spec:
  interval: 5m0s
  ref:
    branch: dev
  secretRef:
    name: platypod-sops-deploy-key
  url: ssh://git@github.com/platypod/platypod-sops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: platypod-sops
  decryption:
    provider: sops
    secretRef:
      name: sops-age
