# Phase 9 — image update automation. See stack/docs/flux-migration.md for
# the full design/rationale. prd now runs its own separate instance of this
# too (clusters/prd/image-automation.yaml), one ImageRepository/ImagePolicy
# per image, final-releases-only. This file stays local's: everything here
# tracks ahead, including prereleases, via the 5 extra `<image>-local`
# ImagePolicy objects below feeding the single `apps-local-overlay`
# ImageUpdateAutomation (all 5 images generalized from the mediarvester-only
# pattern proven first).
#
# Separate GitRepository with its OWN read-write deploy key
# (image-automation-deploy-key Make target) — deliberately not reusing
# flux-system's primary sync GitRepository/key, which stays read-only.
# ImageUpdateAutomation pushes through whichever GitRepository it targets,
# so this is the one and only write path this migration has ever needed.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: stack-image-automation
  namespace: flux-system
spec:
  interval: 5m0s
  ref:
    branch: main
  secretRef:
    name: stack-image-automation-deploy-key
  url: ssh://git@github.com/platypod/stack
---
# All 5 GHCR images are public — no imagePullSecret needed, confirmed via an
# anonymous ghcr.io token exchange before writing this.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cyber-chef
  namespace: flux-system
spec:
  image: ghcr.io/platypod/cyber-chef
  interval: 1h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: mediarvester
  namespace: flux-system
spec:
  image: ghcr.io/platypod/mediarvester
  interval: 1h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: pokeclicker
  namespace: flux-system
spec:
  image: ghcr.io/platypod/pokeclicker
  interval: 1h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: unbegotten
  namespace: flux-system
spec:
  image: ghcr.io/platypod/unbegotten
  interval: 1h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: transmission-exporter
  namespace: flux-system
spec:
  image: ghcr.io/platypod/transmission-exporter
  interval: 1h0m0s
---
# filterTags strips the "v" prefix before semver-parsing — cyber-chef,
# mediarvester, pokeclicker, unbegotten all tag vX.Y.Z. :latest and any
# non-semver tag never match the pattern, so the policy silently never
# selects them — no separate exclusion needed.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cyber-chef
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: cyber-chef
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mediarvester
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: mediarvester
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: pokeclicker
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: pokeclicker
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: unbegotten
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: unbegotten
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
# No filterTags — transmission-exporter's tags are bare X.Y.Z (no "v"
# prefix, confirmed via `git tag -l` in that repo), already valid semver as-is.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: transmission-exporter
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: transmission-exporter
  policy:
    semver:
      range: ">=0.0.0"
---
# The 5 "-local" policies below all reuse the SAME ImageRepository objects
# above — only the range differs, ending in "-0" (Masterminds/Flux idiom
# for "also match prereleases": a range with no prerelease component
# silently never matches a `-dev.N` tag, which is why the plain policies
# above never pick one up). Each feeds its own marker under
# apps/local-overlay/, distinct from apps/base/values/*.yaml's
# (prod-authoritative) ones, so local can move ahead to a prerelease while
# prod stays on the last final release. See clusters/prd/image-automation.yaml
# for the prod side (one plain, final-only ImagePolicy per image, no "-local"
# counterpart needed there).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mediarvester-local
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: mediarvester
  policy:
    semver:
      range: ">=0.0.0-0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cyber-chef-local
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: cyber-chef
  policy:
    semver:
      range: ">=0.0.0-0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: pokeclicker-local
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: pokeclicker
  policy:
    semver:
      range: ">=0.0.0-0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: unbegotten-local
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: unbegotten
  policy:
    semver:
      range: ">=0.0.0-0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: transmission-exporter-local
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: transmission-exporter
  policy:
    semver:
      range: ">=0.0.0-0"
---
# Pushes straight to main (no separate branch) — local already tracks main
# continuously, and prd's tag gate is the real review point, unaffected by
# anything landing here. Scoped to apps/base/values/ only.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: stack-image-automation
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@platypod.ovh
        name: fluxcdbot
      # The `Updated` template field this used to reference was removed by
      # Flux (v1 API) — `Changed` replaces it, but its exact struct shape
      # wasn't worth guessing twice after getting `Updated` wrong the first
      # time (this field errored the whole automation run, no commit at
      # all, until fixed). The diff itself already shows exactly what
      # changed; a static message is simpler and can't go stale again the
      # same way.
      messageTemplate: "chore: automated image update"
    push:
      branch: main
  update:
    path: ./apps/base/values
    strategy: Setters
---
# Second, separate ImageUpdateAutomation — deliberately NOT a change to the
# one above. That one's update.path (./apps/base/values) has to keep
# covering the prod-authoritative pins; pointing it at the new overlay
# instead (rather than adding this second object) would silently stop
# auto-updating those. This one covers ALL FIVE images' local-only override
# markers under apps/local-overlay/ (one file per module: media-image.yaml,
# games-image.yaml, dev-tools-image.yaml, files-image.yaml) — Setters
# strategy scans the whole directory, so adding a new marker file there
# needs no change to this object, only a new ImagePolicy above + a new
# override file + patch. Can never race with prod's own automation writing
# into apps/base/values/*.yaml — the two update.paths don't overlap.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: apps-local-overlay
  namespace: flux-system
spec:
  interval: 30m0s
  sourceRef:
    kind: GitRepository
    name: stack-image-automation
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: flux@platypod.ovh
        name: fluxcdbot
      messageTemplate: "chore: automated local image update"
    push:
      branch: main
  update:
    path: ./apps/local-overlay
    strategy: Setters
