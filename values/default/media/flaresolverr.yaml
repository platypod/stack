flaresolverr:
  enable: true
  captchaSolver: none
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.flaresolverr.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: flaresolverr/flaresolverr:latest
  label: flaresolverr
  log:
    level: info
    html: false
  ports:
    http:
      name: flaresolvr-http
      targetPort: 8191
  prometheus:
    enable: false
    path: /metrics
    port: 8192
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
