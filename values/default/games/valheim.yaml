valheim:
  enable: false
  # Address this Service answers on from the LAN when there's no MetalLB (see
  # traefik.externalIP for the mechanism). UDP 2456-2458 don't collide with
  # Traefik (80/443), AdGuard (53), or Palworld (8211/27015).
  externalIP: ""
  loadBalancerIP: ""  # MetalLB path only (dev); ignored when externalIP is set.
  # Pin to the node that owns externalIP. Required in prod.
  nodeSelector: {}
  label: valheim
  image: lloesche/valheim-server:sha-732221f4d5b5
  # The server listens on 3 consecutive UDP ports starting at SERVER_PORT:
  # game, query, and (only used when CROSSPLAY=true) the crossplay backend.
  # All three are always published — harmless if crossplay stays off.
  ports:
    game:
      name: game
      port: 2456
      targetPort: 2456
    query:
      name: query
      port: 2457
      targetPort: 2457
    crossplay:
      name: crossplay
      port: 2458
      targetPort: 2458
  server:
    name: "Platypod Valheim"
    worldName: Dedicated
    password: changeme
    public: false
    # Passthrough for any other lloesche/valheim-server env var, e.g.:
    #   extraEnv:
    #     CROSSPLAY: "true"
    #     BEPINEX: "true"
    extraEnv: {}
  pvc: "{{ .Values.storage.defaultVolumes.games }}"
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      memory: 8Gi   # min 4GB / recommended 8GB per upstream docs
