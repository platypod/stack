            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 10,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "datasource": "$promDS",
          "description": "",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-GrYlRd"
              },
              "custom": {
                "axisPlacement": "auto",
                "fillOpacity": 70,
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineWidth": 0,
                "spanNulls": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green" },
                  { "color": "red", "value": 80 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 348,
          "options": {
            "alignValue": "left",
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "mergeValues": true,
            "rowHeight": 0.9,
            "showValue": "auto",
            "tooltip": {
              "hideZeros": false,
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "12.0.1",
          "targets": [
            {
              "datasource": "$promDS",
              "editorMode": "code",
              "expr": "sum by (user_name, item_index_clean, item_type) (label_replace(label_join(label_join(jellyfin_is_paused, \"item_index\", \"\", \"season_index\", \"episode_index\"), \"full_name\", \" - \", \"series_name\", \"item_index\", \"item_name\"), \"item_index_clean\", \"$1\", \"full_name\", \"^[- ]*(.*?)[- ]*$\"))",
              "instant": false,
              "legendFormat": "__auto",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Jellyfin",
          "transformations": [
            { "id": "seriesToRows", "options": {} },
            {
              "id": "extractFields",
              "options": {
                "keepTime": false,
                "replace": false,
                "source": "Metric"
              }
            },
            {
              "id": "filterByValue",
              "options": {
                "filters": [
                  {
                    "config": { "id": "isNotNull", "options": {} },
                    "fieldName": "user_name"
                  }
                ],
                "match": "any",
                "type": "include"
              }
            },
            {
              "id": "calculateField",
              "options": {
                "alias": "Item",
                "mode": "reduceRow",
                "reduce": {
                  "include": [ "item_index_clean" ],
                  "reducer": "firstNotNull"
                }
              }
            },
            {
              "id": "calculateField",
              "options": {
                "alias": "Name",
                "mode": "reduceRow",
                "reduce": {
                  "include": [ "user_name" ],
                  "reducer": "firstNotNull"
                }
              }
            },
            {
              "id": "calculateField",
              "options": {
                "alias": "Temp",
                "mode": "reduceRow",
                "reduce": {
                  "include": [ "Item" ],
                  "reducer": "firstNotNull"
                },
                "replaceFields": false
              }
            },
            {
              "id": "filterByValue",
              "options": {
                "filters": [
                  {
                    "config": {
                      "id": "regex",
                      "options": { "value": "(Movie|Episode)" }
                    },
                    "fieldName": "item_type"
                  }
                ],
                "match": "any",
                "type": "include"
              }
            },
            {
              "id": "filterByValue",
              "options": {
                "filters": [
                  {
                    "config": { "id": "notEqual", "options": { "value": 1 } },
                    "fieldName": "Value"
                  }
                ],
                "match": "any",
                "type": "include"
              }
            },
            {
              "id": "partitionByValues",
              "options": { "fields": [ "Name" ] }
            },
            {
              "id": "filterFieldsByName",
              "options": { "include": { "pattern": "Temp|Time (.*)" } }
            },
            {
              "id": "renameByRegex",
              "options": { "regex": "Temp (.*)", "renamePattern": "$1" }
            }
          ],
          "type": "state-timeline"
        }
      ],
      "preload": false,
      "refresh": "5s",
      "schemaVersion": 41,
      "tags": [],
      "templating": {
        "list": [
          {
            "allowCustomValue": false,
            "current": {
              "text": [ "VictoriaMetrics" ],
              "value": [ "VictoriaMetrics" ]
            },
            "includeAll": true,
            "label": "Datasource",
            "multi": true,
            "name": "promDS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Jellyfin Dashboard (Platypod)",
      "uid": "6b42aad1-fdaa-4e0f-8595-eacbbefd8058",
      "version": 7
    }

  media-dashboards-providers.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: 'Media'
      type: file
      options:
        path: /var/lib/grafana/dashboards/media

