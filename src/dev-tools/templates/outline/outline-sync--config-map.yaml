{{- /*
  One-way git -> Outline mirror (see docs/dev-tools/outline.md and the
  decision record in docs/decisions.md). The CronJob clones the configured
  public repos, then this script pushes their markdown into read-only
  Outline collections via the API, as a nested tree mirroring the repo's
  directory structure. Git is the source of truth: documents are
  created/updated/deleted to match the repo exactly; human edits belong in
  git, never in the mirror.
*/ -}}
{{- if and .Values.outline.enable .Values.outline.sync.enable }}
apiVersion: v1
kind: ConfigMap

metadata:
  name: outline-sync

data:
  repos.json: {{ .Values.outline.sync.repos | toJson | quote }}
  sync.py: |-
    """One-way git -> Outline mirror. Stdlib only; config via env + repos.json.

    For each configured repo (already cloned under REPOS_DIR by the init
    container): ensure a collection exists (created read-only), then make its
    documents match the repo's markdown as a nested tree -- one document per
    directory (a directory's own README.md becomes that document's body) and
    one child document per file. Documents are keyed by their full title
    path from the collection root, so a rename is a delete+create. A repo
    with `rooted: true` nests everything under a top-level document named
    after the repo, letting several repos share one collection; the sync
    then only manages documents under that root.

    Images: markdown-syntax images (`![alt](path)`) whose path is relative
    and resolves to a file in the clone are uploaded as Outline attachments
    and the reference rewritten to the attachment URL; absolute-URL images
    pass through (title strings are stripped either way -- Outline's
    importer drops titled images). HTML `<img>` tags are not handled.
    Change detection hashes SYNC_VERSION plus the raw body plus the bytes of
    every resolved image, so an image edit re-publishes its documents;
    uploads only happen for documents actually being (re)written, keeping
    the no-op run free. SYNC_VERSION exists because the hash is otherwise a
    pure function of the source file -- bump it whenever node_text's output
    shape changes (banner, TOC, anchor rewriting, ...), or already-synced
    docs keep reading "unchanged" against their stored sync:<hash> and never
    pick up the new rendering. Replaced uploads are orphaned, not deleted --
    accepted cost.

    Each file document opens with a banner linking back to its source on
    GitHub, ending in a `sync:<hash>` token -- Outline normalizes stored
    markdown, so the hash (which survives normalization) is what detects
    change. Dot-directories and CLAUDE.md files (agent instructions, not
    human docs) are skipped.

    Table of contents & in-page anchors: source markdown is written and
    linked as it renders on GitHub, where a heading's anchor is its
    lower-kebab-cased text. Outline computes anchors differently (its
    `headingToSlug` prefixes with `h-` and uses the `slugify` package's
    rules) -- so a same-document link like `#mark-now-see-later` that works
    on GitHub 404s inside Outline. Each file document's headings are parsed
    and run through both slug algorithms; any `(#github-slug)` link in the
    body is rewritten to Outline's real `(#h-outline-slug)`, and a
    **Contents** block linking every heading (via the same real anchors) is
    prepended. Cross-document links are unaffected -- both slug schemes only
    ever apply within one document, so multi-doc links are left alone (they
    already don't resolve inside Outline; the banner's GitHub link is the
    escape hatch).
    """
    import hashlib
    import json
    import mimetypes
    import os
    import posixpath
    import re
    import sys
    import time
    import unicodedata
    import urllib.error
    import urllib.request

    OUTLINE_URL = os.environ["OUTLINE_URL"].rstrip("/")
    TOKEN = os.environ["OUTLINE_API_TOKEN"]
    REPOS_DIR = os.environ.get("REPOS_DIR", "/work")
    PAGE = 100
    RETRIES_429 = 30
    IMG_RE = re.compile(r'!\[([^\]]*)\]\(\s*([^)\s]+)(?:\s+"[^"]*")?\s*\)')
    # Mixed into every marker so a rendering-logic change (not just a source
    # file change) forces a full resync -- the marker is otherwise a pure
    # function of the source file's bytes, and a script change alone leaves
    # every existing doc's stored sync:<hash> untouched, so it reads as
    # "unchanged" and never gets re-rendered. Bump on any change to
    # node_text's output shape (banner, TOC, anchor rewriting, ...).
    SYNC_VERSION = "2"


    def http(url, data, headers):
        """POST with 429 wait-and-retry; returns the raw response body."""
        req = urllib.request.Request(url, data=data, headers=headers)
        for attempt in range(RETRIES_429):
            try:
                with urllib.request.urlopen(req) as resp:
                    return resp.read()
            except urllib.error.HTTPError as err:
                if err.code == 429 and attempt < RETRIES_429 - 1:
                    # Retry-After can be fractional (e.g. "57.807").
                    wait = float(err.headers.get("Retry-After") or 65) + 1
                    print("rate limited on %s; waiting %.0fs" % (url, wait),
                          flush=True)
                    time.sleep(wait)
                    continue
                body = err.read().decode(errors="replace")
                sys.exit("%s -> HTTP %d: %s" % (url, err.code, body[:500]))


    def api(endpoint, payload):
        out = http(OUTLINE_URL + "/api/" + endpoint,
                   json.dumps(payload).encode(),
                   {"Authorization": "Bearer " + TOKEN,
                    "Content-Type": "application/json"})
        return json.loads(out)


    def paginate(endpoint, payload):
        offset = 0
        while True:
            page = api(endpoint, dict(payload, offset=offset, limit=PAGE))
            data = page["data"]
            for item in data:
                yield item
            if len(data) < PAGE:
                return
            offset += PAGE


    def collection_id(name):
        for coll in paginate("collections.list", {}):
            if coll["name"] == name:
                return coll["id"]
        made = api("collections.create", {
            "name": name,
            "permission": "read",
            "description": "Read-only git mirror -- edit in git, not here.",
        })
        print("created collection %r" % name, flush=True)
        return made["data"]["id"]


    def upload_image(rel_path, data):
        """Upload one image as an Outline attachment; return its URL."""
        name = os.path.basename(rel_path)
        ctype = mimetypes.guess_type(name)[0] or "application/octet-stream"
        made = api("attachments.create", {
            "name": name, "contentType": ctype, "size": len(data),
            "preset": "documentAttachment",
        })["data"]
        boundary = "outline-sync-" + hashlib.sha256(data).hexdigest()[:24]
        parts = []
        for key, value in (made.get("form") or {}).items():
            parts.append(("--%s\r\nContent-Disposition: form-data; "
                          'name="%s"\r\n\r\n%s\r\n' % (boundary, key, value))
                         .encode())
        parts.append(("--%s\r\nContent-Disposition: form-data; name=\"file\"; "
                      'filename="%s"\r\nContent-Type: %s\r\n\r\n'
                      % (boundary, name, ctype)).encode())
        body = b"".join(parts) + data + ("\r\n--%s--\r\n" % boundary).encode()
        upload_url = made["uploadUrl"]
        if upload_url.startswith("/"):
            upload_url = OUTLINE_URL + upload_url
        http(upload_url, body,
             {"Authorization": "Bearer " + TOKEN,
              "Content-Type": "multipart/form-data; boundary=" + boundary})
        print("uploaded image %s (%d bytes)" % (rel_path, len(data)),
              flush=True)
        return made["attachment"]["url"]


    def resolve_image(root, md_rel, target):
        """Repo-relative path of a relative image target, or None."""
        if re.match(r"^[a-z][a-z0-9+.-]*:", target) or target.startswith(
                ("/", "#")):
            return None
        cand = os.path.normpath(
            os.path.join(os.path.dirname(md_rel), target))
        if cand.startswith(".."):
            return None
        full = os.path.join(root, cand)
        return cand.replace(os.sep, "/") if os.path.isfile(full) else None


    def keep(name):
        return not name.startswith(".") and name != "CLAUDE.md"


    def repo_files(root, paths):
        """Repo-relative posix paths of the markdown files to mirror."""
        found = []
        for path in paths:
            full = os.path.normpath(os.path.join(root, path))
            if os.path.isfile(full):
                found.append(os.path.relpath(full, root).replace(os.sep, "/"))
            elif os.path.isdir(full):
                for base, dirs, names in os.walk(full):
                    dirs[:] = sorted(d for d in dirs if keep(d))
                    for name in sorted(names):
                        if name.endswith(".md") and keep(name):
                            rel = os.path.relpath(os.path.join(base, name), root)
                            found.append(rel.replace(os.sep, "/"))
        return sorted(set(found))


    def build_desired(repo, root):
        """Title-path tuple -> {kind: dir|file, src: repo-relative path|None}.

        Two passes so collisions resolve deterministically: directories are
        laid down first, then files -- a `<name>.md` next to a `<name>/`
        directory maps to the same title path, and the directory wins (its
        README, if any, is the page); the shadowed file is skipped loudly.
        """
        prefix = (repo["name"],) if repo.get("rooted") else ()
        files = repo_files(root, repo["paths"])
        nodes = {}
        if prefix:
            nodes[prefix] = {"kind": "dir", "src": None}
        for rel in files:
            segs = rel.split("/")
            for depth in range(1, len(segs)):
                nodes.setdefault(prefix + tuple(segs[:depth]),
                                 {"kind": "dir", "src": None})
        for rel in files:
            segs = rel.split("/")
            base = segs[-1]
            if base == "README.md" and (prefix or len(segs) > 1):
                nodes[prefix + tuple(segs[:-1])]["src"] = rel
                continue
            title = base[:-3] if base.endswith(".md") else base
            key = prefix + tuple(segs[:-1]) + (title,)
            if key in nodes:
                print("%s: NOT mirrored -- %s shadowed by %s at the same "
                      "title path" % (repo["name"], rel,
                                      "directory " + "/".join(key[len(prefix):])
                                      if nodes[key]["kind"] == "dir"
                                      else "another file"), flush=True)
                continue
            nodes[key] = {"kind": "file", "src": rel}
        return nodes


    def web_url(url):
        """Browser URL for a clone URL (private repos clone over SSH)."""
        if url.startswith("git@github.com:"):
            url = "https://github.com/" + url[len("git@github.com:"):]
        return url.removesuffix(".git")


    def read_body(root, rel):
        with open(os.path.join(root, rel), encoding="utf-8",
                  errors="replace") as handle:
            return handle.read()


    # -- heading anchors: GitHub's scheme (what the source markdown links
    # against) vs. Outline's scheme (what actually resolves once imported).
    # See headingToSlug / the slug package: charmap a few symbols (this
    # *does* fold accents, e.g. "ö" -> "o"), drop the rest of the
    # punctuation set, collapse whitespace to '-', lowercase, prefix 'h-'.
    # github-slugger only strips punctuation/symbols -- it leaves non-ASCII
    # *letters* like "ö" untouched -- then lowercases and swaps spaces for
    # '-' (no collapsing).
    OUTLINE_CHARMAP = {"$": "dollar", "%": "percent", "&": "and",
                        "<": "less", ">": "greater", "|": "or",
                        "¢": "cent", "£": "pound", "¥": "yen", "€": "euro",
                        "©": "(c)", "®": "(r)", "™": "tm"}
    OUTLINE_REMOVE_RE = re.compile(r"""[!"#$%&'.()*+,/:;<=>?@\[\]\\^_`{|}~]""")
    ATX_RE = re.compile(r"^(#{1,6})\s+(.*?)\s*#*\s*$")
    FENCE_RE = re.compile(r"^\s*(```|~~~)")
    MD_LINK_RE = re.compile(r"\[([^\]]*)\]\([^)]*\)")
    INLINE_CODE_RE = re.compile(r"`([^`]*)`")
    BOLD_RE = re.compile(r"\*\*([^*]+)\*\*|__([^_]+)__")
    ITALIC_RE = re.compile(r"\*([^*]+)\*|_([^_]+)_")
    HTML_TAG_RE = re.compile(r"<[^>]+>")
    SAME_DOC_ANCHOR_RE = re.compile(r"(?<=\]\(#)[^)\s]+(?=\))")


    def fold_diacritics(text):
        decomposed = unicodedata.normalize("NFKD", text)
        return "".join(ch for ch in decomposed if not unicodedata.combining(ch))


    def plain_heading_text(raw):
        """Approximate a heading's rendered plain text -- links, code spans,
        emphasis and raw HTML stripped -- the input both slug algorithms
        actually operate on."""
        text = MD_LINK_RE.sub(r"\1", raw)
        text = INLINE_CODE_RE.sub(r"\1", text)
        text = BOLD_RE.sub(lambda m: m.group(1) or m.group(2), text)
        text = ITALIC_RE.sub(lambda m: m.group(1) or m.group(2), text)
        text = HTML_TAG_RE.sub("", text)
        return re.sub(r"\s+", " ", text).strip()


    def outline_slug(text):
        mapped = "".join(OUTLINE_CHARMAP.get(ch, ch)
                         for ch in fold_diacritics(text))
        mapped = mapped.replace("-", " ")
        slug = OUTLINE_REMOVE_RE.sub("", mapped).strip()
        return "h-" + re.sub(r"\s+", "-", slug).lower()


    def github_slug(text):
        slug = text.lower()
        slug = "".join(ch for ch in slug if ch.isalnum() or ch in " _-")
        return slug.replace(" ", "-")


    def parse_headings(body):
        """[(level, raw text, plain text)] for each ATX heading, skipping
        fenced code blocks."""
        headings = []
        in_fence = False
        for line in body.splitlines():
            if FENCE_RE.match(line):
                in_fence = not in_fence
                continue
            if in_fence:
                continue
            match = ATX_RE.match(line)
            if match and match.group(2).strip():
                raw = match.group(2).strip()
                headings.append((len(match.group(1)), raw, plain_heading_text(raw)))
        return headings


    def heading_anchors(body):
        """Headings annotated with both slug schemes, deduplicated the same
        way the respective tools dedupe repeated heading text."""
        outline_seen, github_seen = {}, {}
        entries = []
        for level, raw, plain in parse_headings(body):
            o_base, g_base = outline_slug(plain), github_slug(plain)
            o_n, g_n = outline_seen.get(o_base, 0), github_seen.get(g_base, 0)
            entries.append({
                "level": level, "plain": plain,
                "outline_id": o_base if o_n == 0 else "%s-%d" % (o_base, o_n),
                "github_id": g_base if g_n == 0 else "%s-%d" % (g_base, g_n),
            })
            outline_seen[o_base] = o_n + 1
            github_seen[g_base] = g_n + 1
        return entries


    def rewrite_same_doc_anchors(body, entries):
        """Point (#github-style-anchor) links at Outline's real heading id."""
        link_map = {e["github_id"]: e["outline_id"] for e in entries}
        return SAME_DOC_ANCHOR_RE.sub(lambda m: link_map.get(m.group(0), m.group(0)),
                                      body)


    def build_toc(entries):
        """A '**Contents**' block linking every heading via its real Outline
        anchor -- skipped for docs with fewer than two sections, and skipping
        a leading H1 that just restates the document's own title."""
        if entries and entries[0]["level"] == 1:
            entries = entries[1:]
        if len(entries) < 2:
            return ""
        min_level = min(e["level"] for e in entries)
        lines = ["**Contents**", ""]
        for e in entries:
            indent = "  " * (e["level"] - min_level)
            lines.append("%s- [%s](#%s)" % (indent, e["plain"], e["outline_id"]))
        return "\n".join(lines) + "\n\n"


    def node_marker(repo, root, node):
        """Cheap change marker: raw body + resolved image bytes. No uploads."""
        rel = node["src"]
        if rel is None:
            return "sync:dir"
        body = read_body(root, rel)
        digest = hashlib.sha256(SYNC_VERSION.encode())
        digest.update(body.encode())
        for match in IMG_RE.finditer(body):
            img = resolve_image(root, rel, match.group(2))
            if img:
                with open(os.path.join(root, img), "rb") as handle:
                    digest.update(handle.read())
        return "sync:" + digest.hexdigest()[:12]


    def node_text(repo, root, key, node, marker):
        """Final document text. Uploads referenced images -- only call for
        documents that are actually about to be created or updated."""
        base_url = web_url(repo["url"])
        rel = node["src"]
        if rel is None:
            dir_rel = "/".join(key[1:] if repo.get("rooted") else key)
            tree = base_url + "/tree/" + repo["branch"]
            tree += "/" + dir_rel if dir_rel else ""
            label = posixpath.join(repo["name"], dir_rel) if dir_rel else repo["name"]
            return ("> Directory [`%s`](%s) -- mirrored read-only; edit in "
                    "git. `%s`" % (label, tree, marker))
        body = read_body(root, rel)

        def replace(match):
            alt, target = match.group(1), match.group(2)
            img = resolve_image(root, rel, target)
            if img is None:
                return "![%s](%s)" % (alt, target)
            with open(os.path.join(root, img), "rb") as handle:
                return "![%s](%s)" % (alt, upload_image(img, handle.read()))

        body = IMG_RE.sub(replace, body)
        anchors = heading_anchors(body)
        body = rewrite_same_doc_anchors(body, anchors)
        toc = build_toc(anchors)
        blob = "%s/blob/%s/%s" % (base_url, repo["branch"], rel)
        return ("> Mirrored from [`%s`](%s) -- read-only; edit in git. "
                "`%s`\n\n%s%s"
                % (posixpath.join(repo["name"], rel), blob, marker, toc, body))


    def existing_by_path(coll):
        """{title-path tuple: doc} plus duplicate (path, doc) pairs to delete."""
        docs = list(paginate("documents.list", {"collectionId": coll}))
        by_id = {doc["id"]: doc for doc in docs}
        cache = {}

        def path_of(doc):
            if doc["id"] not in cache:
                parent = by_id.get(doc.get("parentDocumentId") or "")
                base = path_of(parent) if parent else ()
                cache[doc["id"]] = base + (doc["title"],)
            return cache[doc["id"]]

        paths, dupes = {}, []
        for doc in docs:
            key = path_of(doc)
            if paths.setdefault(key, doc) is not doc:
                dupes.append((key, doc))
        return paths, dupes


    def sync_repo(repo):
        root = os.path.join(REPOS_DIR, repo["name"])
        if not os.path.isdir(root):
            if repo.get("private"):
                # Private repos aren't cloned when no deploy key is
                # configured; their mirror is simply absent, not an error.
                print("%s: skipped (private, no deploy key)" % repo["name"],
                      flush=True)
                return
            sys.exit("clone missing for repo %r" % repo["name"])
        coll = collection_id(repo["collection"])
        paths, dupes = existing_by_path(coll)
        prefix = (repo["name"],) if repo.get("rooted") else ()
        existing = {key: doc for key, doc in paths.items()
                    if key[:len(prefix)] == prefix}
        desired = build_desired(repo, root)
        ids = {}
        created = updated = unchanged = deleted = 0
        for key in sorted(desired,
                          key=lambda k: (len(k), tuple(s.lower() for s in k))):
            node = desired[key]
            marker = node_marker(repo, root, node)
            doc = existing.pop(key, None)
            if doc is not None and marker in (doc.get("text") or ""):
                ids[key] = doc["id"]
                unchanged += 1
                continue
            text = node_text(repo, root, key, node, marker)
            if doc is None:
                payload = {"title": key[-1], "text": text,
                           "collectionId": coll, "publish": True}
                parent = ids.get(key[:-1])
                if parent:
                    payload["parentDocumentId"] = parent
                ids[key] = api("documents.create", payload)["data"]["id"]
                created += 1
            else:
                ids[key] = doc["id"]
                api("documents.update", {"id": doc["id"], "text": text})
                updated += 1
        # Deepest first, so nothing is deleted twice via parent cascade.
        stale = sorted(existing, key=len, reverse=True)
        for key in stale:
            api("documents.delete", {"id": existing[key]["id"]})
            deleted += 1
        for key, doc in dupes:
            if key[:len(prefix)] == prefix:
                api("documents.delete", {"id": doc["id"]})
                deleted += 1
        print("%s: %d nodes -- %d created, %d updated, %d unchanged, %d deleted"
              % (repo["name"], len(desired), created, updated, unchanged,
                 deleted), flush=True)


    def main():
        with open(os.environ.get("REPOS_JSON", "/sync/repos.json")) as handle:
            repos = json.load(handle)
        for repo in repos:
            sync_repo(repo)


    if __name__ == "__main__":
        main()
{{- end }}
