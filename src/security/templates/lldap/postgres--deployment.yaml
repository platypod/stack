{{- $pod := print .Values.k8s.names.pods.prefix (tpl .Values.lldap.database.label $) .Values.k8s.names.pods.suffix }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.lldap.database.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      # Must tolerate the primary-node taint: this workload is pinned there
      # (local config volume / externalIP nodeSelector / auth co-location) and
      # has nowhere else to run. Without the toleration it is evicted with no
      # valid node and sits Pending.
      tolerations:
      - key: platypod.io/reserved
        operator: Equal
        value: primary
        effect: NoSchedule
      priorityClassName: platypod-critical
      # Prefer the primary node, where Traefik is pinned by its externalIP
      # nodeSelector. Traefik calls Authelia on EVERY authenticated request via
      # forwardAuth, so splitting them puts the hottest path in the stack across
      # a node boundary — LAN to vmnet — for no benefit. Preferred, not
      # required: if primary is full these must still schedule somewhere.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: platypod.io/node-class
                operator: In
                values: ["primary"]
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ tpl .Values.lldap.database.label . }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.lldap.database.image }}
        resources:
          {{- toYaml .Values.lldap.database.resources | nindent 10 }}
        ports:
        - name: {{ .Values.lldap.database.ports.http.name }}
          containerPort: {{ .Values.lldap.database.ports.http.targetPort }}
        env:
        - name: POSTGRES_USER
          value: "{{ tpl .Values.lldap.database.credentials.username . }}"
        - name: POSTGRES_PASSWORD
          value: "{{ tpl .Values.lldap.database.credentials.password . }}"
        - name: POSTGRES_DB
          value: "{{ tpl .Values.lldap.database.name . }}"
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
          subPath: {{ tpl .Values.lldap.database.label . }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ tpl .Values.lldap.storage.pvc . }}
