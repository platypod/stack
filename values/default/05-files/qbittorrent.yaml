qbittorrent:
  host: ${k8s.names.urls.prefix}${qbittorrent.label}${k8s.names.urls.suffix}.${traefik.domain}
  image: linuxserver/qbittorrent:latest
  label: qbittorrent
  credentials:
    username: qbittorrentUser
    password: qbittorrentPassword
  download:
    torrents: ${media.system.downloads.torrents}/${qbittorrent.label}
    ongoing: ${media.system.downloads.ongoing}/${qbittorrent.label}
    finished: ${media.system.downloads.finished}
  ports:
    http:
      name: webui
      targetPort: 8080
    tcp:
      name: incoming-tcp
      port: 6882
      targetPort: 6882
      protocol: TCP
    udp:
      name: incoming-udp
      port: 6882
      targetPort: 6882
      protocol: UDP
  replicasNb: 1
  storage:
    pvc:
      app: ${storage.defaultVolumes.apps}
      media: ${storage.defaultVolumes.media}
