apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.k8s.names.services.prefix }}{{ .Values.observability.tenantGuard.label }}{{ .Values.k8s.names.services.suffix }}
spec:
  ports:
  - protocol: TCP
    name: {{ .Values.observability.tenantGuard.ports.http.name }}
    port: {{ .Values.observability.tenantGuard.ports.http.targetPort }}
    targetPort: {{ .Values.observability.tenantGuard.ports.http.targetPort }}
  selector:
    app: {{ .Values.k8s.names.pods.prefix }}{{ .Values.observability.tenantGuard.label }}{{ .Values.k8s.names.pods.suffix }}
