{{- if .Values.bookstack.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.bookstack.label .Values.k8s.names.pods.suffix }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.bookstack.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      {{- if .Values.traefik.loadBalancerIP }}
      # Resolve the Authelia hostname to the Traefik LoadBalancer internally so
      # BookStack's OIDC discovery/back-channel routes through Traefik (which
      # injects the X-Forwarded-* headers Authelia needs to build the correct
      # issuer). Without this the external domain is NXDOMAIN in-cluster.
      hostAliases:
      - ip: {{ .Values.traefik.loadBalancerIP }}
        hostnames:
        - {{ tpl .Values.authelia.host . }}
      {{- end }}
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.bookstack.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.bookstack.image }}
        resources:
          {{- toYaml .Values.bookstack.resources | nindent 10 }}
        ports:
        - name: {{ .Values.bookstack.ports.http.name }}
          containerPort: {{ .Values.bookstack.ports.http.targetPort }}
        env:
        - name: PUID
          value: "{{ .Values.bookstack.system.userId }}"
        - name: PGID
          value: "{{ .Values.bookstack.system.groupId }}"
        - name: APP_DEBUG
          value: "{{ .Values.bookstack.appDebug }}"
        - name: APP_URL
          value: "https://{{ tpl .Values.bookstack.host . }}"
        - name: APP_KEY
          value: "{{ .Values.bookstack.appKey }}"
        - name: DB_HOST
          value: "{{ .Values.k8s.names.services.prefix }}{{ tpl .Values.bookstack.database.label . }}{{ .Values.k8s.names.services.suffix }}"
        - name: DB_PORT
          value: "{{ .Values.bookstack.database.ports.http.targetPort }}"
        - name: DB_USERNAME
          value: "{{ tpl .Values.bookstack.database.credentials.username . }}"
        - name: DB_PASSWORD
          value: "{{ tpl .Values.bookstack.database.credentials.password . }}"
        - name: DB_DATABASE
          value: "{{ tpl .Values.bookstack.database.name . }}"
        # OIDC configuration
        - name: AUTH_METHOD
          value: oidc
        - name: OIDC_NAME
          value: Authelia
        - name: OIDC_DISPLAY_NAME_CLAIMS
          value: name
        - name: OIDC_CLIENT_ID
          value: "{{ .Values.bookstack.oidc.clientId }}"
        - name: OIDC_CLIENT_SECRET
          value: "{{ .Values.bookstack.oidc.clientSecret.plain }}"
        - name: OIDC_ISSUER
          value: "https://{{ tpl .Values.authelia.host . }}"
        - name: OIDC_ISSUER_DISCOVER
          value: "true"
        # OIDC group -> BookStack role sync. Authelia injects `groups` into the
        # id_token (claims_policy 'platypod'); BookStack matches group names
        # against role names (case-insensitive). The built-in Admin role is
        # renamed to "admins" (by the bookstack-role-seed hook Job) so the
        # `admins` group grants admin.
        - name: OIDC_ADDITIONAL_SCOPES
          value: "groups"
        - name: OIDC_USER_TO_GROUPS
          value: "true"
        - name: OIDC_GROUPS_CLAIM
          value: "groups"
        - name: OIDC_REMOVE_FROM_GROUPS
          value: "true"
        volumeMounts:
        - mountPath: /app/config
          name: {{ tpl .Values.bookstack.storage.pvc . }}
          subPath: bookstack/config
        {{- if .Values.traefik.tls.selfSigned }}
        # Dev-only: trust the mkcert CA so OIDC TLS verification succeeds.
        - mountPath: /usr/local/share/ca-certificates/mkcert-root.crt
          name: mkcert-ca
          subPath: rootCA.pem
        - mountPath: /custom-cont-init.d/10-mkcert-ca.sh
          name: ca-init
          subPath: 10-mkcert-ca.sh
        {{- end }}
      volumes:
      - name: {{ tpl .Values.bookstack.storage.pvc . }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.bookstack.storage.pvc . }}
      {{- if .Values.traefik.tls.selfSigned }}
      - name: mkcert-ca
        configMap:
          name: mkcert-ca
      - name: ca-init
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.bookstack.label }}-ca-init{{ .Values.k8s.names.configMaps.suffix }}
          defaultMode: 0755
      {{- end }}
{{- end }}
