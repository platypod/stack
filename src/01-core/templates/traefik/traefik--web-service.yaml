apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.traefik.names.services.web }}

spec:
  ports:
    - protocol: TCP
      port: {{ .Values.traefik.ports.https.port }}
      targetPort: {{ .Values.traefik.ports.https.targetPort }}
      name: {{ .Values.traefik.ports.https.name }}
  selector:
    app: {{ .Values.traefik.names.pod }}
  type: LoadBalancer
