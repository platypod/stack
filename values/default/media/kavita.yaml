kavita:
  # Disabled: Kavita (.NET 9) SIGILLs (exit 132) intermittently on the Apple
  # Virtualization / Talos ARM guest — no container-level workaround eliminated
  # it (W^X, HWIntrinsic, ReadyToRun, OpenSSL armcap all only reduced frequency).
  # The .NET-6 *arrs and JVM Komga are unaffected. Reverted to Komga. Kept
  # configured (OIDC, local config volume) to revisit after a version bump or a
  # vfkit CPU-feature fix.
  enable: false
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.kavita.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: jvmilazz0/kavita:0.9.0.2
  label: kavita
  # First-boot admin auto-created by the kavita-setup Job (Kavita has no fixed
  # admin name — the first registered user is admin).
  credentials:
    username: admin
    password: kavita-admin
    email: nico.pittion@gmail.com
  # OIDC via Authelia. Kavita stores OIDC in its DB (not env), so the setup Job
  # pushes it through the settings API. Empty clientId disables the whole thing
  # (Authelia client + setup-Job OIDC step are both gated on it). Callback is the
  # ASP.NET default /signin-oidc.
  oidc:
    clientId: ""
    clientSecret:
      plain: ""
      hashed: ""
  ports:
    http:
      name: kavita-http
      targetPort: 5000
  pvc:
    # config/SQLite → dedicated local volume (NFS can't host SQLite WAL).
    app: "{{ .Values.storage.defaultVolumes.config }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
