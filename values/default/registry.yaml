# palworld/valheim/terraria/satisfactory: LAN game servers reached via
# externalIP/ports, not Traefik host routing — no `host` field to register.
palworld:
  enable: false
  label: palworld

valheim:
  enable: false
  label: valheim

terraria:
  enable: false
  label: terraria

satisfactory:
  enable: false
  label: satisfactory

# observability's sub-services share one top-level key; only the ones with
# their own `host` (genuinely routed identity) or the module's own `enable`
# gate are registered here. otelCollector/prometheusJsonExporter/
# prometheusSnmpExporter/scopeShim/tenantGuard/labelProxy have no host of
# their own (internal-only) and stay entirely in observability.yaml.
observability:
  # Gates the observability stack's homepage tile (Grafana). The module itself is
  # deployed/withheld via the helmfile selector; set false where it isn't running.
  enable: true
  dashboard:
    label: grafana
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.dashboard.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  logs:
    label: loki
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.logs.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  metrics:
    label: mimir
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.metrics.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  traces:
    label: tempo
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.traces.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  profiles:
    label: pyroscope
    host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.profiles.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"

