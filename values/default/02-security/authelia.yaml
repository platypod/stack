authelia:
  label: authelia
  database:
    type: postgres
    host: ${k8s.names.urls.prefix}${authelia.database.label}${k8s.names.urls.suffix}.${traefik.domain}
    name: ${authelia.label}
    logQueries: false
    credentials:
      username: ${authelia.label}User
      password: ${authelia.label}Password
    image: postgres:17
    label: ${authelia.label}-db
    ports:
      http:
        name: pgsql
        targetPort: 5432
    replicasNb: 1
  host: ${k8s.names.urls.prefix}${authelia.label}${k8s.names.urls.suffix}.${traefik.domain}
  image: authelia/authelia:4
  log:
    level: info
    format: text
  oidc:
    hmac_secret: yI4VysTXqctmqEzUGWuxCwh4WfDr90WBY5PTVj9Gsd9jHPZ9iRHtpyVGiMHr88GY
    jwks:
      caName: authelia-jwks
      commonName: authelia-jwks
  ports:
    http:
      name: authelia
      targetPort: 9091
    metrics:
      name: auth-metrics
      targetPort: 9959
  replicasNb: 1
  rules:
    - policy: bypass
      domain:
      - ${bazarr.host}
      - ${flaresolverr.host}
      - ${radarr.host}
      - ${prowlarr.host}
      - ${readarr.host}
      - ${sonarr.host}
      networks:
      - ${k8s.clusterCIDR}

    - policy: one_factor
      domain:
      - ${homepage.host}

    - subject:
      - group:media
      policy: one_factor
      domain:
      - ${bazarr.host}
      - ${flaresolverr.host}
      - ${radarr.host}
      - ${prowlarr.host}
      - ${rommapp.host}
      - ${readarr.host}
      - ${sonarr.host}

    - subject:
      - group:download
      policy: one_factor
      domain:
      - ${deluge.host}
      - ${qbittorrent.host}
      - ${transmission.host}

    - subject:
      - group:dev
      policy: one_factor
      domain:
      - ${adguard.host}
      - ${adguard.adminHost}
      - ${authelia.database.host}
      - ${bookstack.database.host}
      - ${bookstack.host}
      - ${dbeaver.host}
      - ${database.host}
      - ${observability.dashboard.host}
      - ${observability.logs.host}
      - ${observability.metrics.host}
      - ${observability.traces.host}
      - ${whoami.host}

    - policy: bypass
      domain:
      - ${authelia.host}
      - ${itTools.host}
      - ${jellyfin.host}
      - ${jellyseerr.host}
      - ${traefik.host}
      - ${observability.opentelemetryCollector.gateway.host}
