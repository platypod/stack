{{- if .Values.comixDownloader.enable }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: {{ .Values.k8s.names.ingresses.prefix }}{{ .Values.comixDownloader.label }}{{ .Values.k8s.names.ingresses.suffix }}

spec:
  entryPoints:
  - {{ .Values.traefik.ports.https.name }}

  routes:
  - kind: Rule
    match: Host(`{{ tpl .Values.comixDownloader.host . }}`)
    # Authelia forward-auth is NOT optional here, unlike flaresolverr's
    # cluster-CIDR bypass: this route is a full remote desktop session driving
    # a root Chromium. VNC_PASSWORD is the second layer, for anything that can
    # reach the Service directly inside the cluster.
    middlewares:
    - name: {{ .Values.k8s.names.middlewares.prefix }}{{ .Values.authelia.label }}{{ .Values.k8s.names.middlewares.suffix }}
      namespace: {{ .Values.k8s.namespace }}
    services:
    - kind: Service
      name: {{ .Values.k8s.names.services.prefix }}{{ .Values.comixDownloader.label }}{{ .Values.k8s.names.services.suffix }}
      port: {{ .Values.comixDownloader.ports.http.targetPort }}

  {{- if or .Values.traefik.tls.selfSigned .Values.traefik.tls.wildcard }}
  tls:
    store:
      name: default
  {{- else }}
  tls:
    certResolver: {{ .Values.traefik.resolverName }}
  {{- end }}
{{- end }}
