storage:
  defaultVolumes:
    apps: ${k8s.names.persistentVolumeClaims.prefix}apps${k8s.names.persistentVolumeClaims.suffix}
    media: ${k8s.names.persistentVolumeClaims.prefix}media${k8s.names.persistentVolumeClaims.suffix}

  localStorage:
    isEnabled: true
    default:
      rootPath: ./volumes/
      node: exampleNode
      capacityStorage: 1Gi
      nodeAffinity:
        required:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [ "${storage.localStorage.default.node}" ]
    volumes:
    - name: ${storage.defaultVolumes.media}
      labels: [ {"volumeSelector": "media"} ]
    - name: ${storage.defaultVolumes.apps}
      labels: [ {"volumeSelector": "apps"} ]

  nfs:
    isEnabled: false
    default:
      server: server
      share: share
      reclaimPolicy: Retain
      capacityStorage: 1Gi
    volumes:
    - name: ${storage.defaultVolumes.media}
      share: media
      capacityStorage: 10Gi
    - name: ${storage.defaultVolumes.apps}
      share: apps
