apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.opentelemetryCollector.gateway.label }}{{ .Values.k8s.names.configMaps.suffix }}
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.observability.opentelemetryCollector.gateway.ports.grpc.targetPort }}
          http:
            endpoint: 0.0.0.0:{{ .Values.observability.opentelemetryCollector.gateway.ports.http.targetPort }}
      {{- if .Values.observability.receivers.k8sCluster.enable }}
      k8s_cluster:
        auth_type: serviceAccount
        node_conditions_to_report:
        - Ready
        - MemoryPressure
        allocatable_types_to_report:
        - cpu
        - memory
      {{- end }}
      {{- if .Values.observability.receivers.prometheus.enable }}
      prometheus:
        config:
          scrape_configs:
          {{ .Values.observability.receivers.prometheus.jellyfin.scrape_config | toYaml | nindent 10 }}
      {{- end }}
      {{- if .Values.observability.receivers.snmp.enable }}
      snmp:
        collection_interval: 60s
        timeout: 3s
        endpoint: {{ .Values.observability.snmp.url }}
        version: v3
        security_level: auth_priv
        user: {{ .Values.observability.snmp.credentials.username }}
        auth_type: SHA
        auth_password: {{ .Values.observability.snmp.credentials.password }}
        privacy_type: AES
        privacy_password: {{ .Values.observability.snmp.credentials.password }}
        metrics: {{ .Values.observability.receivers.snmp.metrics | toYaml | nindent 10 }}
      {{- end }}

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 2048
      memory_limiter:
        check_interval: 1s
        limit_mib: 4000
        spike_limit_mib: 800
      attributes/otlp:
        actions:
        - key: gateway-receiver
          value: otlp
          action: insert
      attributes/prometheus:
        actions:
        - key: gateway-receiver
          value: prometheus
          action: insert
      attributes/k8s_cluster:
        actions:
        - key: gateway-receiver
          value: k8s_cluster
          action: insert
      attributes/snmp:
        actions:
        - key: gateway-receiver
          value: snmp
          action: insert

    exporters:
      debug/verbose:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200
      debug/noop:
        verbosity: normal
        sampling_initial: 0
        sampling_thereafter: 0
      otlphttp/victoriametrics:
        compression: gzip
        encoding: proto
        metrics_endpoint: http://{{ .Values.k8s.names.services.prefix }}{{ .Values.observability.metrics.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.metrics.ports.http.targetPort }}/opentelemetry/v1/metrics
        tls:
          insecure: true
      loki:
        endpoint: http://{{ .Values.k8s.names.services.prefix }}{{ .Values.observability.logs.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.logs.ports.http.targetPort }}/loki/api/v1/push
        tls:
          insecure: true
      otlphttp/tempo:
        compression: gzip
        encoding: proto
        traces_endpoint: http://{{ .Values.k8s.names.services.prefix }}{{ .Values.observability.traces.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.traces.ports.http.targetPort }}/v1/traces
        tls:
          insecure: true

    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch, memory_limiter]
          exporters: [loki]

        metrics/otlp:
          receivers: [otlp]
          processors: [attributes/otlp, batch, memory_limiter]
          exporters: [otlphttp/victoriametrics]
        {{- if .Values.observability.receivers.prometheus.enable }}
        metrics/prometheus:
          receivers: [prometheus]
          processors: [attributes/prometheus, batch, memory_limiter]
          exporters: [otlphttp/victoriametrics]
        {{- end }}
        {{- if .Values.observability.receivers.k8sCluster.enable }}
        metrics/k8s_cluster:
          receivers: [k8s_cluster]
          processors: [attributes/k8s_cluster, batch, memory_limiter]
          exporters: [otlphttp/victoriametrics]
        {{- end }}
        {{- if .Values.observability.receivers.snmp.enable }}
        metrics/snmp:
          receivers: [snmp]
          processors: [attributes/snmp, batch, memory_limiter]
          exporters: [otlphttp/victoriametrics]
        {{- end }}

        traces:
          receivers: [otlp]
          processors: [batch, memory_limiter]
          exporters: [otlphttp/tempo]
