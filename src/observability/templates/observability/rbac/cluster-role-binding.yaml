apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.k8s.names.clusterRoleBindings.prefix }}{{ .Values.observability.otelCollector.label }}{{ .Values.k8s.names.clusterRoleBindings.suffix }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.k8s.names.clusterRoles.prefix }}{{ .Values.observability.otelCollector.label }}{{ .Values.k8s.names.clusterRoles.suffix }}
  apiGroup: rbac.authorization.k8s.io
subjects:
  # Gateway collector SA (main platypod namespace)
  - kind: ServiceAccount
    name: {{ .Values.k8s.names.serviceAccounts.prefix }}{{ .Values.observability.otelCollector.label }}{{ .Values.k8s.names.serviceAccounts.suffix }}
    namespace: {{ .Values.k8s.namespace }}
  # Node collectors SA (dedicated privileged namespace)
  - kind: ServiceAccount
    name: {{ .Values.k8s.names.serviceAccounts.prefix }}{{ tpl .Values.observability.otelCollector.collectors.label . }}{{ .Values.k8s.names.serviceAccounts.suffix }}
    namespace: {{ tpl .Values.observability.otelCollector.collectors.namespace . }}
