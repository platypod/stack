apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: security
  namespace: local-platypod
spec:
  interval: 10m0s
  releaseName: local--platypod--security
  targetNamespace: local-platypod
  dependsOn:
    - name: core
  chart:
    spec:
      chart: ./src/security
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: platypod-substrate
      valuesKey: substrate.yaml
    - kind: ConfigMap
      name: platypod-registry
      valuesKey: registry.yaml
    - kind: ConfigMap
      name: platypod-security
      valuesKey: security.yaml
    - kind: Secret
      name: platypod-secrets
      valuesKey: platypod-secrets.yaml
