apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.readarr.names.pod }}
  labels:
    app: {{ .Values.readarr.names.pod }}

spec:
  replicas: {{ .Values.readarr.replicasNb }}
  selector:
    matchLabels:
      app: {{ .Values.readarr.names.pod }}
  template:
    metadata:
      labels:
        app: {{ .Values.readarr.names.pod }}
    spec:
      containers:
      - name: {{ .Values.readarr.names.container }}
        image: {{ .Values.readarr.image }}
        ports:
        - name: {{ .Values.readarr.ports.http.name }}
          containerPort: {{ .Values.readarr.ports.http.targetPort }}
        env:
        - name: PUID
          value: "{{ .Values.media.system.userId }}"
        - name: PGID
          value: "{{ .Values.media.system.groupId }}"
        - name: UMASK
          value: "{{ .Values.media.system.umask }}"
        volumeMounts:
        - mountPath: /config
          name: {{ .Values.media.storage.pv }}
          subPath: apps/readarr/config
        - mountPath: /config/config.xml
          name: {{ .Values.readarr.names.configMap }}
          subPath: config.xml
        - mountPath: {{ .Values.media.system.data.path }}
          name: {{ .Values.media.storage.pv }}
          subPath: media/data
      volumes:
      - name: {{ .Values.media.storage.pv }}
        persistentVolumeClaim:
          claimName: {{ .Values.media.storage.pvc }}
      - name: {{ .Values.readarr.names.configMap }}
        configMap:
          name: {{ .Values.readarr.names.configMap }}
