whoami:
  enable: true
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.whoami.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: traefik/whoami:v1.12.0
  label: whoami
  ports:
    http:
      name: whoami-http
      targetPort: 80
  replicasNb: 2
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi
