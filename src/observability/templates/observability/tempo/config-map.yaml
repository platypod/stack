apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.observability.traces.label }}{{ .Values.k8s.names.configMaps.suffix }}
data:
  tempo.yaml: |
    stream_over_http_enabled: true

    server:
      grpc_listen_port: {{ .Values.observability.traces.ports.grpc.targetPort }}
      http_listen_port: {{ .Values.observability.traces.ports.http.targetPort }}
      log_level: {{ .Values.observability.traces.logging.level }}

    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: "0.0.0.0:{{ .Values.observability.traces.ports.otlpHttp.targetPort }}"

    query_frontend:
      search:
        duration_slo: 5s
        throughput_bytes_slo: 1.073741824e+09
        metadata_slo:
            duration_slo: 5s
            throughput_bytes_slo: 1.073741824e+09
      trace_by_id:
        duration_slo: 5s

    compactor:
      compaction:
        block_retention: {{ .Values.observability.retention }}

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: k8s
      storage:
        path: /var/tempo/generator/wal
        remote_write:
        # Mimir's Prometheus-remote-write-compatible endpoint is /api/v1/push, not
        # /api/v1/write -- the latter 404s (no such route). Tempo pushes directly,
        # bypassing the OTel gateway's headers_setter that injects X-Scope-OrgID
        # for everything else (Mimir has multitenancy_enabled: true), so it needs
        # its own header -- "anonymous" to match the default tenant used
        # everywhere else that doesn't claim one. See docs/observability/tempo.md.
        - url: http://{{ .Values.k8s.names.services.prefix }}{{ .Values.observability.metrics.label }}{{ .Values.k8s.names.services.suffix }}:{{ .Values.observability.metrics.ports.http.targetPort }}/api/v1/push
          headers:
            X-Scope-OrgID: anonymous
          send_exemplars: true
      traces_storage:
        path: /var/tempo/generator/traces

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

    overrides:
      defaults:
        metrics_generator:
          # local-blocks (TraceQL metrics) dropped: it's the memory-heaviest of the
          # three processors -- keeps recent trace data resident for ad-hoc
          # aggregation -- and isn't needed for the RED/service-graph metrics this
          # deployment actually uses. See docs/observability/tempo.md.
          processors: [service-graphs, span-metrics]
          generate_native_histograms: both
