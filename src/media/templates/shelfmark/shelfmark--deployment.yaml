{{- if .Values.shelfmark.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.shelfmark.label .Values.k8s.names.pods.suffix }}
{{- $appVolume := "app-volume" }}
{{- $mediaVolume := "media-volume" }}

{{- /*
  Remote path mappings: each download client's own container sees the shared
  media PVC at .Values.media.system.data.path via a subPath-scoped mount
  (subPath: downloads/<label> — see e.g. transmission--deployment.yaml), so it
  reports completed-file paths like "/data/finished/...". Shelfmark mounts the
  *whole* share unscoped at the same path, so "/data/finished/..." there is a
  different, nonexistent location — found live as a stuck "Path ... is not
  accessible from Shelfmark's container" import error. Map each enabled
  client's reported root back to where the file really is from Shelfmark's
  point of view: <data.path>/downloads/<label>.
*/ -}}
{{- $mappings := list }}
{{- if .Values.transmission.enable }}
{{- $mappings = append $mappings (dict "host" "transmission" "remotePath" .Values.media.system.data.path "localPath" (printf "%s/downloads/%s" .Values.media.system.data.path .Values.transmission.label)) }}
{{- end }}
{{- if .Values.qbittorrent.enable }}
{{- $mappings = append $mappings (dict "host" "qbittorrent" "remotePath" .Values.media.system.data.path "localPath" (printf "%s/downloads/%s" .Values.media.system.data.path .Values.qbittorrent.label)) }}
{{- end }}
{{- if .Values.deluge.enable }}
{{- $mappings = append $mappings (dict "host" "deluge" "remotePath" .Values.media.system.data.path "localPath" (printf "%s/downloads/%s" .Values.media.system.data.path .Values.deluge.label)) }}
{{- end }}
{{- if .Values.sabnzbd.enable }}
{{- $mappings = append $mappings (dict "host" "sabnzbd" "remotePath" .Values.media.system.data.path "localPath" (printf "%s/downloads/%s" .Values.media.system.data.path .Values.sabnzbd.label)) }}
{{- end }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.shelfmark.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      initContainers:
      # Audiobooks get their own destination (see media.yaml comment); create
      # it up front the same way readarr/transmission seed their own dirs —
      # a fresh PVC has no /audiobooks and downloads would otherwise fail.
      - name: init-audiobook-dir
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - |
          mkdir -p "{{ tpl .Values.shelfmark.organize.audiobooks.destination . }}"
          chown {{ .Values.media.system.userId }}:{{ .Values.media.system.groupId }} \
            "{{ tpl .Values.shelfmark.organize.audiobooks.destination . }}"
          # 2775: group-writable + setgid, matching the rest of the media
          # share (e.g. media/books) — plain chown alone left it
          # owner-only-writable, which blocked direct access from outside
          # the pod (found live, fixed by hand, then here for good).
          chmod 2775 "{{ tpl .Values.shelfmark.organize.audiobooks.destination . }}"
        volumeMounts:
        - mountPath: {{ .Values.media.system.data.path }}
          name: {{ $mediaVolume }}
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.shelfmark.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.shelfmark.image }}
        resources:
          {{- toYaml .Values.shelfmark.resources | nindent 10 }}
        ports:
        - name: {{ .Values.shelfmark.ports.http.name }}
          containerPort: {{ .Values.shelfmark.ports.http.targetPort }}
        {{- include "media.netProbes" .Values.shelfmark.ports.http.targetPort | nindent 8 }}
        env:
        - name: PUID
          value: "{{ .Values.media.system.userId }}"
        - name: PGID
          value: "{{ .Values.media.system.groupId }}"
        - name: FLASK_PORT
          value: "{{ .Values.shelfmark.ports.http.targetPort }}"
        # Everything below is env-driven config, so the first-run onboarding
        # wizard has nothing left to do — skip it (shelfmark/core/onboarding.py:
        # `if not ONBOARDING: return True` treats setup as already complete).
        - name: ONBOARDING
          value: "false"
        - name: HARDCOVER_ENABLED
          value: "{{ .Values.shelfmark.hardcover.enabled }}"
        - name: HARDCOVER_API_KEY
          value: "{{ .Values.shelfmark.hardcover.apiKey }}"
        # Free public API, no key needed. The frontend can fall back to this
        # provider (e.g. no explicit selection stored yet) even though
        # Hardcover is the primary source — without it, that fallback path
        # 400s with "openlibrary is not enabled" (seen live on prod's search).
        - name: OPENLIBRARY_ENABLED
          value: "{{ .Values.shelfmark.openLibrary.enabled }}"
        # Anna's Archive / Libgen / Z-Library — no account needed, works
        # independently of Prowlarr/torrent-tracker availability (Prowlarr's
        # book-relevant indexer can be rate-limited/down — see arr-stack.md).
        - name: DIRECT_DOWNLOAD_ENABLED
          value: "{{ .Values.shelfmark.directDownload.enabled }}"
        - name: AA_MIRROR_URLS
          value: "{{ join "," .Values.shelfmark.directDownload.mirrors }}"
        # Organize into Author/Series/... folders instead of dumping flat —
        # found live: default "rename" mode left every download as a single
        # loose file (or, for one audiobook, 28 untitled loose chapter files)
        # straight in the destination root.
        - name: FILE_ORGANIZATION
          value: "organize"
        - name: TEMPLATE_ORGANIZE
          value: "{{ .Values.shelfmark.organize.books.template }}"
        - name: DESTINATION_AUDIOBOOK
          value: "{{ tpl .Values.shelfmark.organize.audiobooks.destination . }}"
        - name: FILE_ORGANIZATION_AUDIOBOOK
          value: "organize"
        - name: TEMPLATE_AUDIOBOOK_ORGANIZE
          value: "{{ .Values.shelfmark.organize.audiobooks.template }}"
        # Default is true, but our destination *is* the audiobookshelf library
        # folder itself (not a staging/ingest dir) — Shelfmark's own field
        # description warns against hardlinking in that case.
        - name: HARDLINK_TORRENTS_AUDIOBOOK
          value: "false"
        {{- if .Values.prowlarr.enable }}
        - name: PROWLARR_ENABLED
          value: "true"
        - name: PROWLARR_URL
          value: "http://{{ .Values.prowlarr.label }}:{{ .Values.prowlarr.ports.http.targetPort }}"
        - name: PROWLARR_API_KEY
          value: "{{ .Values.prowlarr.apiKey }}"
        {{- end }}
        - name: PROWLARR_TORRENT_CLIENT
          value: {{ if .Values.transmission.enable }}"transmission"{{ else if .Values.qbittorrent.enable }}"qbittorrent"{{ else if .Values.deluge.enable }}"deluge"{{ else }}""{{ end }}
        {{- if .Values.transmission.enable }}
        - name: TRANSMISSION_URL
          value: "http://{{ .Values.transmission.label }}:{{ .Values.transmission.ports.http.targetPort }}"
        - name: TRANSMISSION_USERNAME
          value: "{{ .Values.transmission.credentials.username }}"
        - name: TRANSMISSION_PASSWORD
          value: "{{ .Values.transmission.credentials.password }}"
        - name: TRANSMISSION_DOWNLOAD_DIR
          value: "{{ tpl .Values.transmission.download.finished . }}"
        {{- end }}
        {{- if .Values.qbittorrent.enable }}
        - name: QBITTORRENT_URL
          value: "http://{{ .Values.qbittorrent.label }}:{{ .Values.qbittorrent.ports.http.targetPort }}"
        - name: QBITTORRENT_USERNAME
          value: "{{ .Values.qbittorrent.credentials.username }}"
        - name: QBITTORRENT_PASSWORD
          value: "{{ .Values.qbittorrent.credentials.password }}"
        - name: QBITTORRENT_DOWNLOAD_DIR
          value: "{{ tpl .Values.qbittorrent.download.finished . }}"
        {{- end }}
        {{- if .Values.deluge.enable }}
        - name: DELUGE_HOST
          value: "{{ .Values.deluge.label }}"
        - name: DELUGE_PORT
          value: "{{ .Values.deluge.ports.http.targetPort }}"
        - name: DELUGE_PASSWORD
          value: "{{ .Values.deluge.credentials.password }}"
        - name: DELUGE_DOWNLOAD_DIR
          value: "{{ tpl .Values.deluge.download.finished . }}"
        {{- end }}
        # Usenet: Prowlarr searches althub.co.za (a Newznab indexer wired into
        # Prowlarr itself, not here — see prowlarr.indexers.althub in
        # media.yaml and stack/docs/TODO.md) and hands NZB results to SABnzbd
        # to actually download.
        {{- if .Values.sabnzbd.enable }}
        - name: PROWLARR_USENET_CLIENT
          value: "sabnzbd"
        - name: SABNZBD_URL
          value: "http://{{ .Values.sabnzbd.label }}:{{ .Values.sabnzbd.ports.http.targetPort }}"
        - name: SABNZBD_API_KEY
          value: "{{ .Values.sabnzbd.apiKey }}"
        {{- end }}
        {{- if $mappings }}
        - name: PROWLARR_REMOTE_PATH_MAPPINGS
          value: '{{ $mappings | toJson }}'
        {{- end }}
        volumeMounts:
        - mountPath: /config
          name: {{ $appVolume }}
          subPath: shelfmark/config
        - mountPath: /books
          name: {{ $mediaVolume }}
          subPath: books
        - mountPath: {{ .Values.media.system.data.path }}
          name: {{ $mediaVolume }}
      volumes:
      - name: {{ $mediaVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.shelfmark.pvc.media . }}
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.shelfmark.pvc.app . }}
{{- end }}
