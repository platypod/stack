terraria:
  enable: false
  # Address this Service answers on from the LAN when there's no MetalLB (see
  # traefik.externalIP for the mechanism). UDP 7777 doesn't collide with
  # Traefik (80/443), AdGuard (53), Palworld (8211/27015), or Valheim
  # (2456-2458).
  externalIP: ""
  loadBalancerIP: ""  # MetalLB path only (dev); ignored when externalIP is set.
  # Pin to the node that owns externalIP. Required in prod.
  nodeSelector: {}
  label: terraria
  image: brammys/terraria:1.4.5.6
  port: 7777
  server:
    worldName: Dedicated
    # 1=small, 2=medium, 3=large — only used the first time a world with this
    # name is generated; ignored once the .wld file already exists.
    autocreate: 3
    password: changeme
    maxPlayers: 8
    motd: "Platypod Terraria"
    # Passthrough for any other brammys/terraria TERRARIA_* env var, e.g.:
    #   extraEnv:
    #     TERRARIA_SEED: "for the worthy"
    #     TERRARIA_NOUPNP: "1"
    extraEnv: {}
  pvc: "{{ .Values.storage.defaultVolumes.games }}"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi   # upstream: ~1-1.5Gi covers small/medium worlds, <=8 players
