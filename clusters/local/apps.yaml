# Builds apps/base/'s substrate/registry/per-module ConfigMaps and (once
# added, module by module — see stack/docs/flux-migration.md Phase 4) the 8
# HelmReleases. Depends on infra-crds so Traefik's CRDs exist before any
# chart that defines an IngressRoute tries to render one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-crds
