{{- if .Values.sabnzbd.enable }}
{{- /*
  SABnzbd first-boot / every-deploy wiring Job.

  Hook-weight 40 (> jellyfin 10, jellyseerr 20, reclaimerr 30) — runs last, and
  the `files` release itself now `needs:` the `media` release (see
  helmfile.yaml.gotmpl) so Sonarr/Radarr/Readarr/Prowlarr Services already
  exist by the time this Job starts. `helm upgrade` isn't run with `--wait`,
  so those pods may still be starting — every step below polls until ready
  rather than assuming so.

  Flow (idempotent — safe on every deploy, mirrors reclaimerr-setup):
    1. Wait for SABnzbd's API (note: SABnzbd's API root is /api, not /sabnzbd/api).
    2. Create SABnzbd categories for sonarr/radarr/readarr — a download client
       referencing a category SABnzbd doesn't have yet gets a 400.
    3. For each of Sonarr/Radarr/Readarr: upsert a "SABnzbd" Download Client
       via the app's Servarr API, using the live /downloadclient/schema
       template so we only set the fields we know about
       (host/port/apiKey/category) and leave everything else at the app's own
       defaults. Note: Sonarr/Radarr are on API v3, Readarr is still v1 — each
       app in ARR_APPS_JSON carries its own apiVersion.
    4. Upsert a remote path mapping (host=sabnzbd) on each *arr. SABnzbd's own
       /data is subPath-scoped to its media PVC slice (downloads/sabnzbd), but
       the *arrs mount the whole share unscoped at /data — without this, every
       completed grab sits forever as "no files eligible for import" (the
       Servarr download-client path SABnzbd reports doesn't exist inside the
       *arr's own container). Found live via a real stuck Radarr import.
    5. Upsert Prowlarr "Applications" entries for Sonarr/Radarr/Readarr, so
       indexers added to Prowlarr auto-sync to all three (no manual "sync to
       app" step).
    6. If .Values.prowlarr.indexers.althub.apiKey is set: upsert althub as a
       generic Newznab indexer in Prowlarr.
    7. If .Values.sabnzbd.provider.host is set: upsert the Usenet block-account
       NNTP server into SABnzbd itself via its own config API. Skipped until a
       provider is chosen — see stack/docs/TODO.md.

  Every step is best-effort with retries; failures are logged, not fatal, so a
  slow-starting app doesn't fail the release — the next deploy re-runs and
  heals it.

  ARR_APPS_JSON is gated per-app on its own .enable (same fix as
  torrent-clients--setup-job.yaml), and the whole Prowlarr/indexer section is
  skipped when .Values.prowlarr.enable is false — otherwise wait_for() polls
  a Service that doesn't exist for the full 90x10s per disabled app. Caught
  on local (2026-08-24 Flux Phase 4 rebuild): Sonarr/Radarr/Readarr/Prowlarr
  are all enable:false there (undersized node), and this Job hung regardless.
*/ -}}
{{- $sabSvc      := print .Values.k8s.names.services.prefix .Values.sabnzbd.label .Values.k8s.names.services.suffix }}
{{- $sonarrSvc   := print .Values.k8s.names.services.prefix .Values.sonarr.label .Values.k8s.names.services.suffix }}
{{- $radarrSvc   := print .Values.k8s.names.services.prefix .Values.radarr.label .Values.k8s.names.services.suffix }}
{{- $readarrSvc  := print .Values.k8s.names.services.prefix .Values.readarr.label .Values.k8s.names.services.suffix }}
{{- $prowlarrSvc := print .Values.k8s.names.services.prefix .Values.prowlarr.label .Values.k8s.names.services.suffix }}
apiVersion: batch/v1
kind: Job

metadata:
  name: sabnzbd-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "40"
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: sabnzbd-setup
        image: python:3-alpine
        env:
        - name: SABNZBD_URL
          value: "http://{{ $sabSvc }}:{{ .Values.sabnzbd.ports.http.targetPort }}"
        - name: SABNZBD_API_KEY
          value: "{{ .Values.sabnzbd.apiKey }}"
        - name: PROWLARR_URL
          value: "http://{{ $prowlarrSvc }}:{{ .Values.prowlarr.ports.http.targetPort }}"
        - name: PROWLARR_API_KEY
          value: "{{ .Values.prowlarr.apiKey }}"
        - name: ALTHUB_BASE_URL
          value: "{{ .Values.prowlarr.indexers.althub.baseUrl }}"
        - name: ALTHUB_API_KEY
          value: "{{ .Values.prowlarr.indexers.althub.apiKey }}"
        - name: PROVIDER_HOST
          value: "{{ .Values.sabnzbd.provider.host }}"
        - name: PROVIDER_PORT
          value: "{{ .Values.sabnzbd.provider.port }}"
        - name: PROVIDER_SSL
          value: "{{ .Values.sabnzbd.provider.ssl }}"
        - name: PROVIDER_USERNAME
          value: "{{ .Values.sabnzbd.provider.username }}"
        - name: PROVIDER_PASSWORD
          value: "{{ .Values.sabnzbd.provider.password }}"
        - name: PROVIDER_CONNECTIONS
          value: "{{ .Values.sabnzbd.provider.connections }}"
        - name: ARR_APPS_JSON
          value: |-
            [
            {{- $apps := list }}
            {{- if .Values.sonarr.enable }}
              {{- $apps = append $apps (dict "name" "Sonarr" "baseUrl" (print "http://" $sonarrSvc ":" .Values.sonarr.ports.http.targetPort) "apiKey" .Values.sonarr.apiKey "category" "sonarr" "categoryField" "tvCategory" "apiVersion" "v3") }}
            {{- end }}
            {{- if .Values.radarr.enable }}
              {{- $apps = append $apps (dict "name" "Radarr" "baseUrl" (print "http://" $radarrSvc ":" .Values.radarr.ports.http.targetPort) "apiKey" .Values.radarr.apiKey "category" "radarr" "categoryField" "movieCategory" "apiVersion" "v3") }}
            {{- end }}
            {{- if .Values.readarr.enable }}
              {{- $apps = append $apps (dict "name" "Readarr" "baseUrl" (print "http://" $readarrSvc ":" .Values.readarr.ports.http.targetPort) "apiKey" .Values.readarr.apiKey "category" "readarr" "categoryField" "musicCategory" "apiVersion" "v1") }}
            {{- end }}
            {{- range $i, $a := $apps }}
              {{- if $i }},{{ end }}
              {{ $a | toJson }}
            {{- end }}
            ]
        - name: PROWLARR_ENABLED
          value: "{{ .Values.prowlarr.enable }}"
        command:
        - python3
        - -u
        - -c
        - |
          import json, os, time, urllib.request, urllib.error, urllib.parse

          SABNZBD_URL   = os.environ["SABNZBD_URL"]
          SABNZBD_KEY   = os.environ["SABNZBD_API_KEY"]
          PROWLARR_URL  = os.environ["PROWLARR_URL"]
          PROWLARR_KEY  = os.environ["PROWLARR_API_KEY"]
          ALTHUB_URL    = os.environ.get("ALTHUB_BASE_URL", "").strip()
          ALTHUB_KEY    = os.environ.get("ALTHUB_API_KEY", "").strip()
          PROVIDER_HOST = os.environ.get("PROVIDER_HOST", "").strip()
          ARR_APPS      = json.loads(os.environ["ARR_APPS_JSON"])
          PROWLARR_ENABLED = os.environ.get("PROWLARR_ENABLED", "").strip().lower() == "true"

          def call(method, url, body=None, headers=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method,
                                            headers={"Content-Type": "application/json", **(headers or {})})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = r.read()
                      return r.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try:
                      return e.code, json.loads(raw)
                  except Exception:
                      return e.code, raw.decode(errors="replace")
              except Exception as e:
                  return None, str(e)

          def wait_for(name, url, headers=None):
              for i in range(90):
                  s, b = call("GET", url, headers=headers)
                  if s == 200:
                      print(f"{name} is up.")
                      return True
                  print(f"  [{i}] {name} not ready yet ({s}: {str(b)[:120]})")
                  time.sleep(10)
              print(f"WARN: {name} never became ready — skipping dependent steps.")
              return False

          def arr_headers(api_key):
              return {"X-Api-Key": api_key}

          def ok(status):
              # Prowlarr's Applications endpoint returns 202 (async test) on
              # success, not 200/201 — treat any 2xx as success, and guard
              # against `call()`'s None status on a transport-level exception.
              return status is not None and 200 <= status < 300

          def ensure_sabnzbd_category(name):
              # SABnzbd 400s a download client whose category isn't defined yet.
              # set_config upserts by `name` — safe to call every run.
              params = {
                  "mode": "set_config", "section": "categories", "name": name,
                  "dir": name, "pp": "3", "priority": "0",
                  "apikey": SABNZBD_KEY, "output": "json",
              }
              url = f"{SABNZBD_URL}/api?{urllib.parse.urlencode(params)}"
              s, b = call("GET", url)
              print(f"  SABnzbd category '{name}' upsert -> {s}" if s == 200
                    else f"  WARN: SABnzbd category '{name}' upsert failed [{s}]: {str(b)[:160]}")

          def upsert_download_client(app):
              base, key, ver = app["baseUrl"], app["apiKey"], app["apiVersion"]
              if not wait_for(app["name"], f"{base}/api/{ver}/system/status", arr_headers(key)):
                  return
              s, schema = call("GET", f"{base}/api/{ver}/downloadclient/schema", headers=arr_headers(key))
              if s != 200:
                  print(f"  WARN: {app['name']}: could not fetch downloadclient schema ({s})")
                  return
              tmpl = next((c for c in schema if c.get("implementation") == "Sabnzbd"), None)
              if not tmpl:
                  print(f"  WARN: {app['name']}: no Sabnzbd implementation in schema")
                  return
              payload = dict(tmpl)
              payload["name"] = "SABnzbd"
              payload["enable"] = True
              url = urllib.parse.urlparse(SABNZBD_URL)
              field_values = {
                  "host": url.hostname, "port": url.port,
                  "apiKey": SABNZBD_KEY, "useSsl": False, "urlBase": "",
                  app["categoryField"]: app["category"],
              }
              for f in payload.get("fields", []):
                  if f["name"] in field_values:
                      f["value"] = field_values[f["name"]]

              s, existing = call("GET", f"{base}/api/{ver}/downloadclient", headers=arr_headers(key))
              match = next((c for c in existing if c.get("name") == "SABnzbd"), None) if s == 200 else None
              if match:
                  payload["id"] = match["id"]
                  s, b = call("PUT", f"{base}/api/{ver}/downloadclient/{match['id']}", payload, arr_headers(key))
              else:
                  s, b = call("POST", f"{base}/api/{ver}/downloadclient", payload, arr_headers(key))
              print(f"  {app['name']}: download client upsert -> {s}" if ok(s)
                    else f"  WARN: {app['name']}: download client upsert failed [{s}]: {str(b)[:160]}")

          def upsert_remote_path_mapping(app, host, remote_path, local_path):
              # SABnzbd's own /data is subPath-scoped to its media PVC slice
              # (downloads/sabnzbd), but Sonarr/Radarr/Readarr mount the whole
              # media share unscoped at /data. So the path SABnzbd reports for
              # a finished download (e.g. /data/finished/radarr/Movie/x.mkv)
              # doesn't exist inside the *arr's own container — it's really at
              # /data/downloads/sabnzbd/finished/radarr/Movie/x.mkv from the
              # *arr's point of view. Without this mapping every completed
              # SABnzbd grab sits forever as "no files eligible for import".
              base, key, ver = app["baseUrl"], app["apiKey"], app["apiVersion"]
              payload = {"host": host, "remotePath": remote_path, "localPath": local_path}
              s, existing = call("GET", f"{base}/api/{ver}/remotepathmapping", headers=arr_headers(key))
              match = next((m for m in existing if m.get("host") == host), None) if s == 200 else None
              if match:
                  payload["id"] = match["id"]
                  s, b = call("PUT", f"{base}/api/{ver}/remotepathmapping/{match['id']}", payload, arr_headers(key))
              else:
                  s, b = call("POST", f"{base}/api/{ver}/remotepathmapping", payload, arr_headers(key))
              print(f"  {app['name']}: remote path mapping ({host}) upsert -> {s}" if ok(s)
                    else f"  WARN: {app['name']}: remote path mapping ({host}) upsert failed [{s}]: {str(b)[:160]}")

          def upsert_prowlarr_app(app):
              s, schema = call("GET", f"{PROWLARR_URL}/api/v1/applications/schema", headers=arr_headers(PROWLARR_KEY))
              if s != 200:
                  print(f"  WARN: could not fetch applications schema ({s})")
                  return
              tmpl = next((a for a in schema if a.get("implementation") == app["name"]), None)
              if not tmpl:
                  print(f"  WARN: no {app['name']} implementation in applications schema")
                  return
              payload = dict(tmpl)
              payload["name"] = app["name"]
              payload["syncLevel"] = "fullSync"
              field_values = {
                  "prowlarrUrl": PROWLARR_URL, "baseUrl": app["baseUrl"], "apiKey": app["apiKey"],
              }
              for f in payload.get("fields", []):
                  if f["name"] in field_values:
                      f["value"] = field_values[f["name"]]

              s, existing = call("GET", f"{PROWLARR_URL}/api/v1/applications", headers=arr_headers(PROWLARR_KEY))
              match = next((a for a in existing if a.get("name") == app["name"]), None) if s == 200 else None
              if match:
                  payload["id"] = match["id"]
                  s, b = call("PUT", f"{PROWLARR_URL}/api/v1/applications/{match['id']}", payload, arr_headers(PROWLARR_KEY))
              else:
                  s, b = call("POST", f"{PROWLARR_URL}/api/v1/applications", payload, arr_headers(PROWLARR_KEY))
              print(f"  Prowlarr app {app['name']} upsert -> {s}" if ok(s)
                    else f"  WARN: Prowlarr app {app['name']} upsert failed [{s}]: {str(b)[:160]}")

          def upsert_althub_indexer():
              if not ALTHUB_KEY:
                  print("No althub API key configured (prowlarr.indexers.althub.apiKey) — skipping indexer wiring.")
                  return
              s, schema = call("GET", f"{PROWLARR_URL}/api/v1/indexer/schema", headers=arr_headers(PROWLARR_KEY))
              if s != 200:
                  print(f"  WARN: could not fetch indexer schema ({s})")
                  return
              tmpl = next((i for i in schema if i.get("name") == "Generic Newznab"), None)
              if not tmpl:
                  print("  WARN: no generic Newznab indexer in schema")
                  return
              # appProfileId is a required top-level field (not in `fields`) —
              # Prowlarr rejects 0/unset. Use whatever App Sync Profile already
              # exists (Prowlarr ships one, "Standard", on first install).
              s, profiles = call("GET", f"{PROWLARR_URL}/api/v1/appprofile", headers=arr_headers(PROWLARR_KEY))
              if s != 200 or not profiles:
                  print(f"  WARN: could not fetch an App Sync Profile ({s}) — skipping indexer wiring.")
                  return
              payload = dict(tmpl)
              payload["name"] = "althub"
              payload["enable"] = True
              payload["appProfileId"] = profiles[0]["id"]
              field_values = {"baseUrl": ALTHUB_URL, "apiKey": ALTHUB_KEY}
              for f in payload.get("fields", []):
                  if f["name"] in field_values:
                      f["value"] = field_values[f["name"]]

              # Route through FlareSolverr (already registered as an indexer
              # proxy — see flaresolverr--deployment.yaml) by tag, same as
              # Prowlarr's own UI does it. Without this, althub.co.za's
              # Cloudflare WAF outright blocks real search requests (403
              # "error code: 1010", a bot-fingerprint block, not a soft rate
              # limit) even though a plain connection test can still pass —
              # found live 2026-09-02 chasing a "why does this keep failing"
              # report. Looked up by label, not hardcoded id: ids are
              # per-install, and this indexer's own tags would otherwise
              # silently revert to none on every redeploy.
              s, tags = call("GET", f"{PROWLARR_URL}/api/v1/tag", headers=arr_headers(PROWLARR_KEY))
              flaresolverr_tag = next((t["id"] for t in tags if t.get("label") == "flaresolverr"), None) if s == 200 else None
              if flaresolverr_tag is not None:
                  payload["tags"] = [flaresolverr_tag]
              else:
                  print(f"  WARN: no 'flaresolverr' tag found in Prowlarr ({s}) — althub will bypass it")

              # forceSave: a normal save re-validates the connection first,
              # and that validation is exactly the request Cloudflare blocks
              # — without this, an upsert during one of althub's frequent
              # bad spells fails outright and this Job never applies the fix
              # (tag, apiKey, or otherwise) until a lucky redeploy.
              s, existing = call("GET", f"{PROWLARR_URL}/api/v1/indexer", headers=arr_headers(PROWLARR_KEY))
              match = next((i for i in existing if i.get("name") == "althub"), None) if s == 200 else None
              if match:
                  payload["id"] = match["id"]
                  s, b = call("PUT", f"{PROWLARR_URL}/api/v1/indexer/{match['id']}?forceSave=true", payload, arr_headers(PROWLARR_KEY))
              else:
                  s, b = call("POST", f"{PROWLARR_URL}/api/v1/indexer?forceSave=true", payload, arr_headers(PROWLARR_KEY))
              print(f"althub indexer upsert -> {s}" if ok(s)
                    else f"WARN: althub indexer upsert failed [{s}]: {str(b)[:160]}")

          def upsert_provider_server():
              if not PROVIDER_HOST:
                  print("No Usenet provider configured (sabnzbd.provider.host) — skipping server wiring.")
                  return
              params = {
                  "mode": "set_config", "section": "servers", "keyword": "provider",
                  "name": "provider", "displayname": "provider",
                  "host": PROVIDER_HOST, "port": os.environ.get("PROVIDER_PORT", "563"),
                  "ssl": "1" if os.environ.get("PROVIDER_SSL", "true").lower() == "true" else "0",
                  "username": os.environ.get("PROVIDER_USERNAME", ""),
                  "password": os.environ.get("PROVIDER_PASSWORD", ""),
                  "connections": os.environ.get("PROVIDER_CONNECTIONS", "20"),
                  "enable": "1", "apikey": SABNZBD_KEY, "output": "json",
              }
              url = f"{SABNZBD_URL}/api?{urllib.parse.urlencode(params)}"
              s, b = call("GET", url)
              print(f"Usenet provider server upsert -> {s}" if s == 200
                    else f"WARN: provider server upsert failed [{s}]: {str(b)[:160]}")

          # 1. wait for SABnzbd
          sab_ready = wait_for(
              "SABnzbd",
              f"{SABNZBD_URL}/api?mode=version&apikey={SABNZBD_KEY}&output=json")
          if not sab_ready:
              raise SystemExit(0)  # heal on next deploy, don't fail the release

          # 2. SABnzbd categories (must exist before the *arrs can reference them)
          for app in ARR_APPS:
              try:
                  ensure_sabnzbd_category(app["category"])
              except Exception as e:
                  print(f"  WARN: category '{app['category']}' raised: {e}")

          # 3. download clients
          for app in ARR_APPS:
              for attempt in range(3):
                  try:
                      upsert_download_client(app)
                      break
                  except Exception as e:
                      print(f"  [{app['name']}] attempt {attempt+1} raised: {e}")
                      time.sleep(10)

          # 4. remote path mapping — without this, every completed SABnzbd
          # grab is stuck "no files eligible for import" (see above).
          for app in ARR_APPS:
              try:
                  upsert_remote_path_mapping(app, "sabnzbd", "/data/", "/data/downloads/sabnzbd/")
              except Exception as e:
                  print(f"  [{app['name']}] remote path mapping raised: {e}")

          # 5. Prowlarr <-> *arr app sync
          if not PROWLARR_ENABLED:
              print("Prowlarr not enabled — skipping Prowlarr/indexer wiring.")
          elif wait_for("Prowlarr", f"{PROWLARR_URL}/api/v1/system/status", arr_headers(PROWLARR_KEY)):
              for app in ARR_APPS:
                  for attempt in range(3):
                      try:
                          upsert_prowlarr_app(app)
                          break
                      except Exception as e:
                          print(f"  [{app['name']}] Prowlarr app attempt {attempt+1} raised: {e}")
                          time.sleep(10)

              # 6. althub indexer
              try:
                  upsert_althub_indexer()
              except Exception as e:
                  print(f"WARN: althub indexer wiring raised: {e}")

          # 7. Usenet block-account server (no-op until a provider is chosen)
          try:
              upsert_provider_server()
          except Exception as e:
              print(f"WARN: provider server wiring raised: {e}")

          print("sabnzbd-setup complete.")
          # exit 0 regardless of partial failures — logged above, next deploy heals it.
{{- end }}
