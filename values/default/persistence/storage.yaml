storage:
  defaultVolumes:
    apps: apps
    media: media
    # PVC name for SQLite app config dirs. Defaults to the apps volume (fine on
    # dev, where everything is already local). On prod it is overridden to the
    # dedicated local `config` volume below (NFS can't host SQLite WAL).
    config: apps
    # PVC name for dedicated game servers. Defaults to the apps volume (fine on
    # dev). On prod it is overridden to the dedicated local `games` volume
    # below — game images re-validate their whole install on every restart,
    # which is too slow over NFS. See storage.localGames.
    games: apps

  # Dedicated LOCAL (non-NFS) volume for SQLite app config dirs. Coexists with
  # storage.nfs (unlike storage.localStorage). Enabled on prod only.
  localConfig:
    enable: false
    rootPath: /var/local/platypod/volumes/
    capacityStorage: 5Gi
    name: config
    labels:
      volumeSelector: config
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - key: platypod.io/local-storage
            operator: In
            values: ["true"]
    # Nightly backup of the local config volume to the NFS apps share (durability:
    # the live SQLite is local/fast, the backup lands on the backed-up Synology).
    backup:
      enable: true
      schedule: "0 3 * * *"
      retentionDays: 14
      image: busybox:1.37.0

  # Dedicated LOCAL (non-NFS) volume for dedicated game servers. Coexists with
  # storage.nfs, same shape as storage.localConfig. Enabled on prod only.
  # No backup block yet — deferred, see stack/docs/TODO.md.
  localGames:
    enable: false
    rootPath: /var/local/platypod/volumes/
    capacityStorage: 100Gi
    name: games
    labels:
      volumeSelector: games
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - key: platypod.io/local-storage
            operator: In
            values: ["true"]

  # Dedicated LOCAL (non-NFS) volumes for Postgres/MySQL data dirs. Same
  # rationale as storage.localConfig (NFS fsync latency), one PV/PVC per
  # listed volume. Each is pinned to a SPECIFIC node via `node:` (hostname),
  # not just the shared platypod.io/local-storage marker label — once more
  # than one node carries that label, a PV whose nodeAffinity only checks the
  # marker would let a hostPath volume's consuming pod reschedule onto a node
  # where the actual directory doesn't exist, silently starting from empty
  # data. Enabled on prod only.
  localDb:
    enable: false
    rootPath: /var/local/platypod/volumes/
    capacityStorage: 2Gi
    labels:
      volumeSelector: db
    # Nightly backup to the NFS apps share, same durability rationale as
    # storage.localConfig.backup.
    backup:
      enable: true
      schedule: "15 3 * * *"
      retentionDays: 14
      image: busybox:1.37.0
    volumes: []
    # Example (set per-environment):
    # - name: authelia-db
    #   node: chuwi-cp1
    # - name: lldap-db
    #   node: chuwi-cp1
    #   capacityStorage: 1Gi   # optional per-volume override

  localStorage:
    enable: true
    default:
      rootPath: /var/local/platypod/volumes/
      capacityStorage: 1Gi
      nodeAffinity:
        required:
          nodeSelectorTerms:
          - matchExpressions:
            - key: platypod.io/local-storage
              operator: In
              values: ["true"]
    volumes:
    - name: media
      labels:
        volumeSelector: media
    - name: apps
      labels:
        volumeSelector: apps

  nfs:
    enable: false
    default:
      server: server
      share: share
      reclaimPolicy: Retain
      capacityStorage: 1Gi
    volumes:
    - name: media
      share: media
      capacityStorage: 10Gi
    - name: apps
      share: apps
