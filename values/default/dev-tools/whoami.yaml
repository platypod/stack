whoami:
  host: ${k8s.names.urls.prefix}${whoami.label}${k8s.names.urls.suffix}.${traefik.domain}
  image: traefik/whoami
  label: whoami
  names:
    container: ${k8s.names.containers.prefix}${whoami.label}${k8s.names.containers.suffix}
    ingress: ${k8s.names.ingresses.prefix}${whoami.label}${k8s.names.ingresses.suffix}
    pod: ${k8s.names.pods.prefix}${whoami.label}${k8s.names.pods.suffix}
    service: ${k8s.names.services.prefix}${whoami.label}${k8s.names.services.suffix}
  ports:
    http:
      name: whoami-http
      targetPort: 80
  replicasNb: 2
