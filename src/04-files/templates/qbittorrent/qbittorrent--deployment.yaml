apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.qbittorrent.names.pod }}
  labels:
    app: {{ .Values.qbittorrent.names.pod }}

spec:
  replicas: {{ .Values.qbittorrent.replicasNb }}
  selector:
    matchLabels:
      app: {{ .Values.qbittorrent.names.pod }}
  template:
    metadata:
      labels:
        app: {{ .Values.qbittorrent.names.pod }}
    spec:
      containers:
      - name: {{ .Values.qbittorrent.names.container }}
        image: {{ .Values.qbittorrent.image }}
        ports:
        - name: {{ .Values.qbittorrent.ports.http.name }}
          containerPort: {{ .Values.qbittorrent.ports.http.targetPort }}
        - name: {{ .Values.qbittorrent.ports.tcp.name }}
          containerPort: {{ .Values.qbittorrent.ports.tcp.targetPort }}
        - name: {{ .Values.qbittorrent.ports.udp.name }}
          containerPort: {{ .Values.qbittorrent.ports.udp.targetPort }}
          protocol: UDP
        env:
        - name: PUID
          value: "{{ .Values.media.system.userId }}"
        - name: PGID
          value: "{{ .Values.media.system.groupId }}"
        - name: UMASK
          value: "{{ .Values.media.system.umask }}"
        - name: WEBUI_PORT
          value: "{{ .Values.qbittorrent.ports.http.targetPort }}"
        - name: TORRENTING_PORT
          value: "{{ .Values.qbittorrent.ports.tcp.targetPort }}"
        volumeMounts:
        - mountPath: /config/qBittorrent
          name: {{ .Values.media.storage.pv }}
          subPath: apps/qbittorrent/config
        - mountPath: {{ .Values.media.system.data.path }}
          name: {{ .Values.media.storage.pv }}
          subPath: files/media/data
      initContainers:
      - name: {{ .Values.qbittorrent.names.initContainer }}
        image: python:3-slim
        command: ['sh', '-c', 'cp -f /qBittorrent.conf /config/qBittorrent/ && python /update_password.py']
        volumeMounts:
        - mountPath: /update_password.py
          name: {{ .Values.qbittorrent.names.configMap }}
          subPath: update_password.py
        - mountPath: /qBittorrent.conf
          name: {{ .Values.qbittorrent.names.configMap }}
          subPath: qBittorrent.conf
        - mountPath: /config/qBittorrent
          name: {{ .Values.media.storage.pv }}
          subPath: apps/qbittorrent/config
      volumes:
      - name: {{ .Values.media.storage.pv }}
        persistentVolumeClaim:
          claimName: {{ .Values.media.storage.pvc }}
      - name: {{ .Values.qbittorrent.names.configMap }}
        configMap:
          name: {{ .Values.qbittorrent.names.configMap }}
