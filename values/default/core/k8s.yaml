k8s:
  namespace: ${project.env}--${project.name}
  names:
    containers:
      prefix: ""
      suffix: "--container"
    ingresses:
      prefix: ""
      suffix: "--ingress"
    initContainers:
      prefix: ""
      suffix: "--init-container"
    namespaces:
      prefix: "${project.env}--${project.name}--"
      suffix: "--namespace"
    persistentVolumeClaims:
      prefix: ""
      suffix: "--pvc"
    pods:
      prefix: ""
      suffix: "--pod"
    roles:
      prefix: ""
      suffix: "--role"
    roleBindings:
      prefix: ""
      suffix: "--role-binding"
    secrets:
      prefix: ""
      suffix: "--secret"
    services:
      prefix: ""
      suffix: "--service"
    serviceAccounts:
      prefix: ""
      suffix: "--service-account"
    urls:
      prefix: ""
      suffix: ""
    volumes:
      configMaps:
        prefix: ""
        suffix: "--config-map-volume"
      emptyDirs:
        prefix: ""
        suffix: "--empty-dir-volume"
      localStorages:
        prefix: ""
        suffix: "--local-storage-volume"