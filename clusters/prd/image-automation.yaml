# NOTE (dev/main split): this automation checks out and pushes to `dev`, NOT
# `main`. Prod deploys from `main`, so a bump staged here reaches prod only
# when dev is merged into main. Leaving it on `main` would auto-deploy every
# image release straight to prod and defeat the promotion gate entirely.
# See docs/branching.md.
#
# Prod's own image update automation, all 5 images — mirrors
# clusters/local/image-automation.yaml's ImageRepository set, but final
# releases only (no "-0" prerelease opt-in on any ImagePolicy range below),
# and writes straight into apps/base/values/*.yaml (the SAME files local's
# own plain ImagePolicy/markers there already target, and local's
# ImageUpdateAutomation for ./apps/base/values also already covers) — no
# conflict, because both clusters computing the same final-release value
# converge on an identical write; the two only diverge once local layers
# its own apps/local-overlay override on top for its own deployment, which
# prod never reads. See apps/local-overlay/kustomization.yaml and
# clusters/local/image-automation.yaml's `<image>-local` objects for the
# local side of this split.
#
# Started mediarvester-only, generalized to all 5 once that path was
# verified live end-to-end (2026-08-27): update.path below
# (./apps/base/values) covers every image's marker now, matching local's
# own ImageUpdateAutomation's scope for that same directory. Confirmed
# empirically during the mediarvester-only period that a Setters run
# silently skips (doesn't fail on) a marker whose ImagePolicy isn't
# resolvable in-cluster — this ImageUpdateAutomation reported
# "repository up-to-date" the whole time only mediarvester's ImagePolicy
# existed here, never an error for the other 4.
#
# Needs its own read-write deploy key, same Make target used for local:
# `make image-automation-deploy-key ENV=prd` (already run once; idempotent).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: stack-image-automation
  namespace: flux-system
spec:
  interval: 5m0s
  ref:
    branch: dev
  secretRef:
    name: stack-image-automation-deploy-key
  url: ssh://git@github.com/platypod/stack
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cyber-chef
  namespace: flux-system
spec:
  image: ghcr.io/platypod/cyber-chef
  interval: 5m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: mediarvester
  namespace: flux-system
spec:
  image: ghcr.io/platypod/mediarvester
  interval: 5m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: pokeclicker
  namespace: flux-system
spec:
  image: ghcr.io/platypod/pokeclicker
  interval: 5m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: unbegotten
  namespace: flux-system
spec:
  image: ghcr.io/platypod/unbegotten
  interval: 5m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: transmission-exporter
  namespace: flux-system
spec:
  image: ghcr.io/platypod/transmission-exporter
  interval: 5m0s
---
# No "-0" suffix on any range below — a plain semver range never matches a
# prerelease version (Masterminds/Flux semantics), so this naturally
# excludes any `-dev.N`-suffixed tag. Final releases only, by construction.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cyber-chef
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: cyber-chef
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mediarvester
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: mediarvester
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: pokeclicker
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: pokeclicker
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: unbegotten
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: unbegotten
  policy:
    semver:
      range: ">=0.0.0"
  filterTags:
    pattern: '^v(?P<version>.*)$'
    extract: '$version'
---
# No filterTags — transmission-exporter's tags are bare X.Y.Z (no "v"
# prefix), already valid semver as-is.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: transmission-exporter
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: transmission-exporter
  policy:
    semver:
      range: ">=0.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m0s
  sourceRef:
    kind: GitRepository
    name: stack-image-automation
  git:
    checkout:
      ref:
        branch: dev
    commit:
      author:
        email: flux@platypod.ovh
        name: fluxcdbot
      messageTemplate: "chore: automated image update"
    push:
      branch: dev
  update:
    path: ./apps/base/values
    strategy: Setters
