{{- $configMapVolume := "config-map" }}
{{- $emptyDirVolume := "empty-dir-volume" }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.homepage.label .Values.k8s.names.pods.suffix }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      automountServiceAccountToken: true
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.homepage.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.homepage.image.registry }}{{ .Values.homepage.image.namespace }}{{ .Values.homepage.image.repository }}:{{ .Values.homepage.image.tag }}
        ports:
        - name: {{ .Values.homepage.ports.http.name }}
          containerPort: {{ .Values.homepage.ports.http.targetPort }}
          protocol: TCP
        volumeMounts:
        - mountPath: /app/config/custom.js
          name: {{ $configMapVolume }}
          subPath: custom.js
        - mountPath: /app/config/custom.css
          name: {{ $configMapVolume }}
          subPath: custom.css
        - mountPath: /app/config/bookmarks.yaml
          name: {{ $configMapVolume }}
          subPath: bookmarks.yaml
        - mountPath: /app/config/docker.yaml
          name: {{ $configMapVolume }}
          subPath: docker.yaml
        - mountPath: /app/config/kubernetes.yaml
          name: {{ $configMapVolume }}
          subPath: kubernetes.yaml
        - mountPath: /app/config/services.yaml
          name: {{ $configMapVolume }}
          subPath: services.yaml
        - mountPath: /app/config/settings.yaml
          name: {{ $configMapVolume }}
          subPath: settings.yaml
        - mountPath: /app/config/widgets.yaml
          name: {{ $configMapVolume }}
          subPath: widgets.yaml
        - mountPath: /app/config/logs
          name: {{ $emptyDirVolume }}
      enableServiceLinks: true
      serviceAccountName: {{ .Values.k8s.names.serviceAccounts.prefix }}{{ .Values.homepage.label }}{{ .Values.k8s.names.serviceAccounts.suffix }}
      volumes:
      - name: {{ $configMapVolume }}
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.homepage.label }}{{ .Values.k8s.names.configMaps.suffix }}
      - name: {{ $emptyDirVolume }}
        emptyDir: {}
