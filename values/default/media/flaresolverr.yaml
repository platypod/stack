flaresolverr:
  captchaSolver: none
  host: ${k8s.names.urls.prefix}${flaresolverr.label}${k8s.names.urls.suffix}.${traefik.domain}
  image: flaresolverr/flaresolverr:latest
  label: flaresolverr
  log:
    level: info
    html: false
  names:
    container: ${k8s.names.containers.prefix}${flaresolverr.label}${k8s.names.containers.suffix}
    ingress: ${k8s.names.ingresses.prefix}${flaresolverr.label}${k8s.names.ingresses.suffix}
    pod: ${k8s.names.pods.prefix}${flaresolverr.label}${k8s.names.pods.suffix}
    service: ${k8s.names.services.prefix}${flaresolverr.label}${k8s.names.services.suffix}
  ports:
    http:
      name: flaresolvr-http
      targetPort: 8191
  prometheus:
    enabled: false
    path: /metrics
    port: 8192
  replicasNb: 1
