observability:
  otelCollector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    label: opentelemetry-collector
    logging:
      # Was left on debug from earlier troubleshooting — every collector,
      # gateway included, dumps a full datapoint/transform trace per metric at
      # this level. Under a large backfill it's enough log I/O to make the
      # gateway miss its own export deadlines back to clients. Every other
      # observability component here already defaults to info.
      level: info
      format: json
    gateway:
      host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.otelCollector.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      # Dedicated host for the OTLP/gRPC ingress (h2c → port 4317), guarded by the
      # Basic-auth Authelia endpoint. Used by non-interactive clients (e.g. Claude
      # Code telemetry) that send Authorization: Basic, not a session cookie.
      grpcHost: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.observability.otelCollector.label }}-grpc{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
      label: "{{ .Values.observability.otelCollector.label }}-gateway"
      # Bumped from 256Mi/512Mi: the gateway was OOMKilling repeatedly (~5x/24h)
      # under normal load (jellyfin/k8s_cluster/traefik/authelia/fx scrapes +
      # AI metrics/logs/traces all funnel through this one pod), losing
      # in-flight metric exports while already-flushed logs survived. See
      # memory_limiter sizing in gateway/config-map.yaml — its thresholds must
      # stay comfortably under these.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      ports:
        grpc:
          name: otel-grpc
          targetPort: 4317
        http:
          name: otel-http
          targetPort: 4318
    collectors:
      label: "{{ .Values.observability.otelCollector.label }}-collector"
      # Node-level collectors mount the host root (hostPath /) and run as root to
      # read host metrics, which requires `privileged` PodSecurity. To avoid
      # relaxing PodSecurity for the whole platypod namespace (which runs many
      # internet-facing apps that process untrusted content), they live in their
      # own dedicated namespace labelled enforce=privileged. See the Namespace
      # manifest in templates/observability/nodes-collectors/namespace.yaml.
      namespace: "{{ .Values.k8s.namespace }}--privileged"
      resources:
        requests:
          cpu: 200m
          memory: 400Mi
        limits:
          cpu: 1
          memory: 1Gi
      ports:
        grpc:
          name: otel-grpc
          targetPort: 4317
        http:
          name: otel-http
          targetPort: 4318
    receivers:
      jellyfinCustom:
        enable: true
        logLevel: info
      jellyfinNative:
        enable: false
      synologySnmp:
        enable: false
        url: udp://XXX.XXX.XXX.XXX:161
        credentials:
          username: <username>
          password: <password>
        logLevel: info
