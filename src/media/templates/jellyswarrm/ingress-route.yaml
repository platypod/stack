{{- if .Values.jellyswarrm.enable }}

# No Authelia middleware — jellyswarrm does its own auth (JELLYSWARRM_USERNAME/
# PASSWORD), same "own auth, bypass ingress" pattern as Jellyfin/Jellyseerr
# (see stack/docs/services.md). It no longer sits in front of jellyfin.<domain>
# (see jellyswarrm in apps/base/values/media.yaml for why), so this is now purely
# an admin/benchmark route — access is via this dedicated hostname only.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: {{ .Values.k8s.names.ingresses.prefix }}{{ .Values.jellyswarrm.label }}{{ .Values.k8s.names.ingresses.suffix }}

spec:
  entryPoints:
  - {{ .Values.traefik.ports.https.name }}

  routes:
  - kind: Rule
    match: Host(`{{ tpl .Values.jellyswarrm.host . }}`)
    services:
    - kind: Service
      name: {{ .Values.k8s.names.services.prefix }}{{ .Values.jellyswarrm.label }}{{ .Values.k8s.names.services.suffix }}
      port: {{ .Values.jellyswarrm.ports.http.targetPort }}

  {{- if or .Values.traefik.tls.selfSigned .Values.traefik.tls.wildcard }}
  tls:
    store:
      name: default
  {{- else }}
  tls:
    certResolver: {{ .Values.traefik.resolverName }}
  {{- end }}

{{- end }}
