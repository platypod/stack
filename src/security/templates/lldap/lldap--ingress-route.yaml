apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: {{ .Values.k8s.names.ingresses.prefix }}{{ .Values.lldap.label }}{{ .Values.k8s.names.ingresses.suffix }}

spec:
  entryPoints:
  - {{ .Values.traefik.ports.https.name }}

  routes:
  - kind: Rule
    match: Host(`{{ tpl .Values.lldap.host . }}`)
    # LLDAP has its own login form — bypass Authelia to avoid chicken-and-egg
    # (Authelia itself uses LLDAP as its auth backend).
    services:
    - kind: Service
      name: {{ .Values.k8s.names.services.prefix }}{{ .Values.lldap.label }}{{ .Values.k8s.names.services.suffix }}
      port: {{ .Values.lldap.ports.http.targetPort }}

  {{- if .Values.traefik.tls.selfSigned }}
  tls:
    store:
      name: default
  {{- else }}
  tls:
    certResolver: {{ .Values.traefik.resolverName }}
  {{- end }}
