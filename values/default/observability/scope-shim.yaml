observability:
  # ForwardAuth policy decision point for per-user dashboard data isolation.
  # Reads X-Grafana-User, looks the user's groups up in LLDAP, and returns the
  # scope headers Traefik copies onto the datasource request:
  #   X-Owner       → prom-label-proxy matcher for Mimir (label isolation)
  #   X-Scope-OrgID → Loki tenant (tenant isolation)
  # See docs/observability/dashboard-multitenancy.md.
  scopeShim:
    # One shim Deployment per backend (same script, different upstream): metrics
    # → prom-label-proxy, logs → Loki. Each is a ClusterIP reverse-proxy.
    instances:
      - name: metrics
        label: grafana-scope-shim
        upstreamLabel: prom-label-proxy
        upstreamPort: 8081
      - name: logs
        label: grafana-scope-shim-logs
        upstreamLabel: loki
        upstreamPort: 3100
    # Route the Grafana METRICS datasource through the shim (per-user `owner`
    # scoping). Set false to query Mimir directly — e.g. on a cluster where all
    # Grafana users are admins, or to keep pre-`owner` history visible. Logs are
    # tenant-isolated either way.
    scopeMetrics: true
    # Shared script ConfigMap name (both instances mount the same shim.py).
    scriptConfigMap: grafana-scope-shim
    # Pure-stdlib Python: the logic is ConfigMap-mounted, no custom image build.
    image: python:3-alpine
    lldap:
      # Must match the grafana-authz seed account in security/lldap.yaml
      # (member of lldap_strict_readonly: read-all, no write).
      user: grafana-authz
      password: grafana-authz-secret
    # Shared secret Grafana sends as a custom datasource header; the shim rejects
    # requests without it. CNI-independent lockdown (flannel doesn't enforce
    # NetworkPolicy). Override per-env if desired.
    secret: "scope-shim-shared-secret"
    secretHeader: "X-Shim-Auth"
    # Admin-granting groups are generated (observability.grafanaAdminGroups in
    # src/observability/templates/_helpers.tpl) off
    # values/default/security/access-groups.yaml — no adminGroup value needed here.
    # Header Grafana sends when [dataproxy] send_user_header = true.
    userHeader: X-Grafana-User
    # Owner label value stamped on all non-personal (shared/infra) metrics, so
    # every series carries an `owner` and prom-label-proxy never needs an
    # empty-matching regex (which it rejects). Non-admins match own + this.
    sharedOwner: "_shared"
    # Loki tenant naming: per-user transcripts live in "<prefix><user>".
    tenantPrefix: "claude-"
    # Non-per-user Loki tenants admins should also see (pipe-joined into the
    # federated read alongside every claude-<user>). Pipe-separated if several.
    # "_shared" is the gateway's default tenant for untagged logs (native Claude
    # telemetry, future k8s pod logs).
    sharedTenants: "_shared"
    # Cache TTL (seconds) for per-user group lookups and the user list.
    cacheTtlSeconds: 30
    ports:
      http:
        name: http
        targetPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

  # Ingest-side ForwardAuth: enforces that an authenticated writer may only claim
  # its own Loki tenant (x-scope-orgid == claude-<slug(Remote-User)>). Chained
  # after authelia-basic on the OTLP/gRPC ingress. See dashboard-multitenancy.md.
  tenantGuard:
    label: tenant-guard
    image: python:3-alpine
    tenantPrefix: "claude-"   # must match the shipper's tenant + scopeShim
    # Fixed Mimir theme-tenants any authenticated writer may claim (not a
    # per-user privacy boundary — see mimir/config-map.yaml). Pipe-separated.
    staticTenants: "ai"
    ports:
      http:
        name: http
        targetPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

  # prom-label-proxy: rewrites every PromQL/label query to inject the `owner`
  # matcher supplied (as a regex) by the scope shim via the X-Owner header.
  # Fronts Mimir so the Grafana metrics datasource is per-user scoped.
  labelProxy:
    label: prom-label-proxy
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.13.0
    enforceLabel: owner
    headerName: X-Owner
    ports:
      http:
        name: http
        targetPort: 8081
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
