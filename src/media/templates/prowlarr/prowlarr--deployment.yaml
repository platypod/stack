{{- if .Values.prowlarr.enable }}
{{- $pod := print .Values.k8s.names.pods.prefix .Values.prowlarr.label .Values.k8s.names.pods.suffix }}
{{- $configMap := "config-map" }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: {{ .Values.prowlarr.replicasNb }}
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ .Values.prowlarr.label }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.prowlarr.image }}
        resources:
          {{- toYaml .Values.prowlarr.resources | nindent 10 }}
        ports:
        - name: {{ .Values.prowlarr.ports.http.name }}
          containerPort: {{ .Values.prowlarr.ports.http.targetPort }}
        env:
        - name: PUID
          value: "{{ .Values.media.system.userId }}"
        - name: PGID
          value: "{{ .Values.media.system.groupId }}"
        - name: UMASK
          value: "{{ .Values.media.system.umask }}"
        volumeMounts:
        - mountPath: /config/config.xml
          name: {{ $configMap }}
          subPath: config.xml
      volumes:
      - name: {{ $configMap }}
        configMap:
          name: {{ .Values.k8s.names.configMaps.prefix }}{{ .Values.prowlarr.label }}{{ .Values.k8s.names.configMaps.suffix }}
  
{{- end }}
