{{- if .Values.lldap.ldaps.enable }}
{{- /*
  LDAPS for clients outside the cluster (prod's host-native Jellyfin — see
  docs/media/jellyfin-ldap.md). Traefik terminates TLS on its "ldaps" TCP
  entrypoint (traefik.ports.ldaps, see apps/base/values/substrate.yaml) using
  the same trusted wildcard cert as every other host, then forwards PLAINTEXT
  to this Service inside the cluster — LLDAP itself needs no TLS config.

  HostSNI(`*`) rather than a specific hostname: the ldaps entrypoint carries
  no other traffic, so any SNI (or none) on that port is unambiguously LLDAP.
*/ -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP

metadata:
  name: {{ .Values.k8s.names.ingresses.prefix }}{{ .Values.lldap.label }}-ldaps{{ .Values.k8s.names.ingresses.suffix }}

spec:
  entryPoints:
  - {{ .Values.traefik.ports.ldaps.name }}

  routes:
  - match: HostSNI(`*`)
    services:
    - name: {{ .Values.k8s.names.services.prefix }}{{ .Values.lldap.label }}{{ .Values.k8s.names.services.suffix }}
      port: {{ .Values.lldap.ports.ldap.targetPort }}

  tls:
    store:
      name: default

{{- end }}
