apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.bookstack.names.pod }}
  labels:
    app: {{ .Values.bookstack.names.pod }}

spec:
  replicas: {{ .Values.bookstack.replicasNb }}
  selector:
    matchLabels:
      app: {{ .Values.bookstack.names.pod }}
  template:
    metadata:
      labels:
        app: {{ .Values.bookstack.names.pod }}
    spec:
      containers:
      - name: {{ .Values.bookstack.names.container }}
        image: {{ .Values.bookstack.image }}
        ports:
        - name: {{ .Values.bookstack.ports.http.name }}
          containerPort: {{ .Values.bookstack.ports.http.targetPort }}
        env:
        - name: PUID
          value: "{{ .Values.bookstack.system.userId }}"
        - name: PGID
          value: "{{ .Values.bookstack.system.groupId }}"
        - name: APP_DEBUG
          value: "{{ .Values.bookstack.appDebug }}"
        - name: APP_URL
          value: "https://{{ .Values.bookstack.host }}"
        - name: APP_KEY
          value: "{{ .Values.bookstack.appKey }}"
        - name: DB_HOST
          value: "{{ .Values.bookstack.database.names.service }}"
        - name: DB_PORT
          value: "{{ .Values.bookstack.database.ports.http.targetPort }}"
        - name: DB_USERNAME
          value: "{{ .Values.bookstack.database.credentials.username }}"
        - name: DB_PASSWORD
          value: "{{ .Values.bookstack.database.credentials.password }}"
        - name: DB_DATABASE
          value: "{{ .Values.bookstack.database.name }}"
        volumeMounts:
        - mountPath: /app/config
          name: {{ .Values.bookstack.storage.pv }}
          subPath: apps/bookstack/config
      volumes:
      - name: {{ .Values.bookstack.storage.pv }}
        persistentVolumeClaim:
          claimName: {{ .Values.bookstack.storage.pvc }}
