dbeaver:
  enable: true
  credentials:
    username: dbeaverAdmin
    password: dbeaverPassword
  database:
    driver: PostgreSQL
    url: "jdbc:postgresql://{{ .Values.k8s.names.services.prefix }}{{ .Values.database.label }}{{ .Values.k8s.names.services.suffix }}/{{ .Values.database.schemas.cloudBeaver.main }}"
    schema: "{{ .Values.database.schemas.cloudBeaver.main }}"
    credentials:
      username: "{{ .Values.database.serviceCredentials.cloudBeaver.username }}"
      password: "{{ .Values.database.serviceCredentials.cloudBeaver.password }}"
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.dbeaver.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image: dbeaver/cloudbeaver:latest
  label: dbeaver
  ports:
    http:
      name: dbeaver-http
      targetPort: 8978
  pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
