# Implementation tier — files module. Registry fields (enable/label/host)
# for these services live in values/default/registry.yaml instead.

deluge:
  image: lscr.io/linuxserver/deluge:2.2.0-ls381
  logLevel: info
  credentials:
    username: admin
    password: password
  download:
    torrents: "{{ .Values.media.system.data.path }}/torrents/{{ .Values.deluge.label }}"
    ongoing: "{{ .Values.media.system.data.path }}/ongoing/{{ .Values.deluge.label }}"
    finished: "{{ .Values.media.system.data.path }}/finished"
  ports:
    http:
      name: deluge-webui
      targetPort: 8112
    tcp:
      name: incoming-tcp
      port: 6881
      targetPort: 6881
      protocol: TCP
    udp:
      name: incoming-udp
      port: 6881
      targetPort: 6881
      protocol: UDP
  replicasNb: 0
  storage:
    pvc:
      app: "{{ .Values.storage.defaultVolumes.apps }}"
      media: "{{ .Values.storage.defaultVolumes.media }}"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

qbittorrent:
  image: linuxserver/qbittorrent:5.2.3_v2.0.13-ls469
  credentials:
    username: admin
    password: password
  download:
    torrents: "{{ .Values.media.system.data.path }}/torrents/{{ .Values.qbittorrent.label }}"
    ongoing: "{{ .Values.media.system.data.path }}/ongoing/{{ .Values.qbittorrent.label }}"
    finished: "{{ .Values.media.system.data.path }}/finished"
  ports:
    http:
      name: webui
      targetPort: 8080
    tcp:
      name: incoming-tcp
      port: 6882
      targetPort: 6882
      protocol: TCP
    udp:
      name: incoming-udp
      port: 6882
      targetPort: 6882
      protocol: UDP
  replicasNb: 1
  storage:
    pvc:
      app: "{{ .Values.storage.defaultVolumes.apps }}"
      media: "{{ .Values.storage.defaultVolumes.media }}"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

sabnzbd:
  apiKey: "66666666666666666666666666666666"
  image: linuxserver/sabnzbd:5.0.4-ls264
  credentials:
    username: admin
    password: password
  download:
    ongoing: "{{ .Values.media.system.data.path }}/ongoing"
    finished: "{{ .Values.media.system.data.path }}/finished"
  ports:
    http:
      name: webui
      targetPort: 8080
  pvc:
    # config/SQLite history db → dedicated local volume (NFS can't host SQLite WAL).
    app: "{{ .Values.storage.defaultVolumes.config }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  # Article-cache ceiling. SABnzbd sizes this from *host* RAM on first start and
  # ignores the cgroup limit, so on a ~10 GB node it picks 1G and gets OOMKilled
  # inside a smaller container. Pin it well under `resources.limits.memory` to
  # leave room for the Python runtime, the assembler and post-processing.
  cacheLimit: 256M
  # Usenet block-account (NNTP) server — SABnzbd needs one to actually fetch
  # articles; althub.co.za is an indexer only, not a server provider. Left
  # empty until a provider is chosen; the setup Job skips server wiring while
  # host is blank. See stack/docs/TODO.md.
  provider:
    host: ""
    port: 563
    ssl: true
    username: ""
    password: ""
    connections: 20
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

transmission:
  image: lscr.io/linuxserver/transmission:4.1.3-r0-ls356
  credentials:
    username: admin
    password: password
  download:
    torrents: "{{ .Values.media.system.data.path }}/torrents"
    ongoing: "{{ .Values.media.system.data.path }}/ongoing"
    finished: "{{ .Values.media.system.data.path }}/finished"
  exporter:
    label: "{{ .Values.transmission.label }}-exporter"
    image: ghcr.io/platypod/transmission-exporter:0.3.0 # {"$imagepolicy": "flux-system:transmission-exporter"}
    ports:
      http:
        name: http
        nodePort: 31416
        targetPort: 9092
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  ports:
    http:
      name: webui
      nodePort: 31415
      targetPort: 9091
    peer:
      name: peer-listening
      nameUdp: peer-udp
      nodePort: 31413
      nodePortUdp: 31414
      targetPort: 51413
  pvc:
    app: "{{ .Values.storage.defaultVolumes.apps }}"
    media: "{{ .Values.storage.defaultVolumes.media }}"
  replicasNb: 1
  resources:
    requests:
      cpu: 100m
      # Wanted 512Mi (usage regularly hits ~2x the old 256Mi request), but
      # mini4-w1 was ~7Mi short of that on 2026-07-15 — capped at 480Mi to
      # fit. Revisit once the node has more headroom.
      memory: 480Mi
    limits:
      # 256Mi OOMKilled the daemon once the torrent list grew (resume/verification
      # state is held in memory). Raised to give headroom for a large/active set.
      memory: 768Mi
