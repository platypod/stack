{{- $pod := print .Values.k8s.names.pods.prefix (tpl .Values.authelia.redis.label .) .Values.k8s.names.pods.suffix }}
{{- $appVolume := "app-volume" }}

# Session store for Authelia. Without it sessions live in Authelia's memory
# and EVERY pod restart (deploys, node blips, the lldap startup-check crash
# loop) logs every user out — "remember me" included. AOF persistence on the
# apps PVC means sessions even survive a redis restart.
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $pod }}
  labels:
    app: {{ $pod }}

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $pod }}
  template:
    metadata:
      labels:
        app: {{ $pod }}
    spec:
      containers:
      - name: {{ .Values.k8s.names.containers.prefix }}{{ tpl .Values.authelia.redis.label . }}{{ .Values.k8s.names.containers.suffix }}
        image: {{ .Values.authelia.redis.image }}
        args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
        resources:
          {{- toYaml .Values.authelia.redis.resources | nindent 10 }}
        ports:
        - name: {{ .Values.authelia.redis.ports.http.name }}
          containerPort: {{ .Values.authelia.redis.ports.http.targetPort }}
        volumeMounts:
        - mountPath: /data
          name: {{ $appVolume }}
          subPath: authelia-redis
      volumes:
      - name: {{ $appVolume }}
        persistentVolumeClaim:
          claimName: {{ tpl .Values.authelia.storage.pvc . }}
