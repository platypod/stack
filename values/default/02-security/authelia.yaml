authelia:
  label: authelia
  database:
    type: postgres
    host: ${k8s.names.urls.prefix}${authelia.database.label}${k8s.names.urls.suffix}.${traefik.domain}
    name: ${authelia.label}
    logQueries: false
    credentials:
      username: ${authelia.label}User
      password: ${authelia.label}Password
    image: postgres:17
    label: ${authelia.label}-db
    names:
      configMap: ${k8s.names.volumes.configMaps.prefix}${authelia.database.label}${k8s.names.volumes.configMaps.suffix}
      container: ${k8s.names.containers.prefix}${authelia.database.label}${k8s.names.containers.suffix}
      ingress: ${k8s.names.ingresses.prefix}${authelia.database.label}${k8s.names.ingresses.suffix}
      pod: ${k8s.names.pods.prefix}${authelia.database.label}${k8s.names.pods.suffix}
      service: ${k8s.names.services.prefix}${authelia.database.label}${k8s.names.services.suffix}
    ports:
      http:
        name: pgsql
        targetPort: 5432
    replicasNb: 1
  host: ${k8s.names.urls.prefix}${authelia.label}${k8s.names.urls.suffix}.${traefik.domain}
  image: authelia/authelia:4
  log:
    level: info
    format: text
  names:
    configMap: ${k8s.names.volumes.configMaps.prefix}${authelia.label}${k8s.names.volumes.configMaps.suffix}
    container: ${k8s.names.containers.prefix}${authelia.label}${k8s.names.containers.suffix}
    initContainer: ${k8s.names.containers.prefix}${authelia.label}-init${k8s.names.containers.suffix}
    ingress: ${k8s.names.ingresses.prefix}${authelia.label}${k8s.names.ingresses.suffix}
    middleware: authelia-forwardauth
    pod: ${k8s.names.pods.prefix}${authelia.label}${k8s.names.pods.suffix}
    service: ${k8s.names.services.prefix}${authelia.label}${k8s.names.services.suffix}
  ports:
    http:
      name: authelia
      targetPort: 9091
    metrics:
      name: auth-metrics
      targetPort: 9959
  replicasNb: 1
  rules:
    - domain:
      - ${flaresolverr.host}
      - ${radarr.host}
      - ${prowlarr.host}
      - ${readarr.host}
      - ${sonarr.host}
      policy: one_factor
      subject:
      - group:admins
    - domain:
      - ${homepage.host}
      - ${deluge.host}
      - ${qbittorrent.host}
      - ${transmission.host}
      - ${bookstack.host}
      policy: one_factor
      subject:
      - group:users
    - domain:
        - ${traefik.host}
        - ${authelia.host}
        - ${whoami.host}
        - ${jellyfin.host}
        - ${jellyseerr.host}
      policy: bypass
  secrets:
    encryptionKey: verySecretMuchSecureNeverGonnaBeGuessedWoah
    jwt: verySecretMuchSecureNeverGonnaBeGuessedWoooow
    session: verySecretMuchSecureNeverGonnaBeGuessedWoowee
  users:
    admin:
      displayname: platypodAdmin
      password: $argon2id$v=19$m=65536,t=3,p=4$J68VFWtr+FIvEAAnNIQ5UQ$uOiTdWOk6Yqb3DEfxjmdE8touRoY9fYn+DJZwtG2z34  #platypod-password
      email: pl@ty.pod
      groups:
        - admins
        - media
    guest:
      displayname: platypodGuest
      password: $argon2id$v=19$m=65536,t=3,p=4$UvLUwVCQPhcDCMrT++Htpg$6eZG6L2rwpunVuFEdlLe8Mc+r6b9Q//Np5mGoTw61aQ  # guest-password
      email: gues@ty.pod
      groups: []
