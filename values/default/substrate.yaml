# Substrate tier — foundational config with no cross-refs (project/priority)
# or self-refs only (k8s/traefik/acme/storage), fed to every release. See
# stack/docs/flux-migration.md for the tier design.

project:
  env: default
  name: platypod
  timezone: Europe/Paris

k8s:
  clusterCIDR: 192.168.194.128/25
  namespace: default-platypod
  names:
    clusterRoles:
      prefix: ""
      suffix: ""
    clusterRoleBindings:
      prefix: ""
      suffix: ""
    configMaps:
      prefix: ""
      suffix: ""
    containers:
      prefix: ""
      suffix: ""
    daemonSets:
      prefix: ""
      suffix: ""
    emptyDirs:
      prefix: ""
      suffix: ""
    ingresses:
      prefix: ""
      suffix: ""
    initContainers:
      prefix: ""
      suffix: ""
    middlewares:
      prefix: ""
      suffix: ""
    namespaces:
      prefix: ""
      suffix: ""
    persistentVolumeClaims:
      prefix: ""
      suffix: ""
    persistentVolumes:
      prefix: ""
      suffix: ""
    pods:
      prefix: ""
      suffix: ""
    roles:
      prefix: ""
      suffix: ""
    roleBindings:
      prefix: ""
      suffix: ""
    secrets:
      prefix: ""
      suffix: ""
    services:
      prefix: ""
      suffix: ""
    serviceAccounts:
      prefix: ""
      suffix: ""
    urls:
      prefix: ""
      suffix: ""
      # Non-default external port that must appear in generated URLs (e.g.
      # `:8443` for a WAN-reachable dev machine behind a non-443 forward).
      # Empty for prod/local. Threaded through Authelia's OIDC redirect URIs
      # and wikijs's — see stack/docs/flux-migration.md.
      port: ""

# Scheduling priorities. See src/core/templates/priority/priority-classes.yaml
# for the reasoning; the short version is that placement rules keep workloads
# off the primary node, and these decide what happens when one gets there anyway
# and a game server needs the capacity.
#
# Values are spaced widely so classes can be inserted later without renumbering.
# They sit far below system-cluster-critical (2000000000) on purpose — nothing
# here should ever outrank the control plane.
priorityClasses:
  enable: true
  classes:
    - name: platypod-critical
      value: 1000000
      description: >-
        Ingress and auth path (Traefik, AdGuard, Authelia, LLDAP). If these are
        down nothing is reachable, including the thing the reserve exists for.
    - name: platypod-gaming
      value: 900000
      preemptionPolicy: PreemptLowerPriority
      description: >-
        Game servers. Preempts so a session can always start, which is the
        entire purpose of keeping headroom on the primary node.
    - name: platypod-standard
      value: 500000
      globalDefault: true
      description: >-
        Default for everything unlabelled. Media apps, files, dev-tools.
    - name: platypod-bulk
      value: 100000
      description: >-
        Observability and batch. First to be preempted — losing a scrape or a
        compaction for a few minutes is survivable, and these are the biggest
        consumers after the media apps.

traefik:
  domain: example.com
  host: "{{ .Values.k8s.names.urls.prefix }}{{ .Values.traefik.label }}{{ .Values.k8s.names.urls.suffix }}.{{ .Values.traefik.domain }}"
  image:
    registry: docker.io/
    namespace: ""
    repository: traefik
    tag: v3.7.5
  label: traefik
  dashboardLabel: traefik-dashboard
  logging:
    format: json
    level: ERROR
  ports:
    dashboard:
      # name has to be traefik, see https://doc.traefik.io/traefik/operations/api/#insecure
      name: traefik
      port: 9999
      targetPort: 9999
    http:
      name: http
      port: 80
      targetPort: 80
      nodePort: 30680
    https:
      name: https
      port: 443
      targetPort: 443
      nodePort: 30679
    # TCP entrypoint (not HTTP) for LDAPS — TLS-terminated at Traefik, plaintext
    # forwarded to the backend Service inside the cluster. Currently only used
    # to front LLDAP for clients outside the cluster (see lldap.ldaps.enable).
    ldaps:
      name: ldaps
      port: 636
      targetPort: 636
      nodePort: 30678
  replicasNb: 1
  # Address this Service answers on from the LAN. When set, the Service becomes
  # ClusterIP with spec.externalIPs: kube-proxy accepts traffic for that address
  # on the node and DNATs it to the pod, so the router can forward straight to
  # the node IP with no LoadBalancer and no MetalLB.
  #
  # externalIPs rather than hostNetwork/hostPort deliberately: PodSecurity
  # "baseline" (Talos' default for non-system namespaces) forbids host
  # namespaces and host ports, and prd-platypod stays at baseline — see the
  # observability nodes-collectors namespace for the precedent.
  #
  # Required when the LAN-facing node is a control plane: Kubernetes labels those
  # node.kubernetes.io/exclude-from-external-load-balancers, MetalLB honours it
  # and refuses to announce, and Talos re-applies the label from a NodeLabelSpec
  # after every reboot. See infra/docs/baremetal-cp-migration.md.
  #
  # Also used as AdGuard's "*.<domain>" rewrite target, so internal clients do
  # not hairpin through the router.
  externalIP: ""
  loadBalancerIP: ""   # MetalLB path only; ignored when externalIP is set.
  # Pin the pod to specific node(s). Required with externalIP: only the node
  # holding the endpoint answers for that address, and it must be the node the
  # router forwards to. Also required on the LoadBalancer path, where
  # externalTrafficPolicy=Local means MetalLB announces from the pod's own node.
  # Empty = no constraint (dev, single node).
  nodeSelector: {}
  resolverName: letsencrypt
  tls:
    selfSigned: false
    wildcard: false
    secretName: ""
  storage:
    pvc: "{{ .Values.storage.defaultVolumes.apps }}"
  # CPU: request only (no limit) — avoids throttling. Memory: request≈limit.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

acme:
  # Master gate. When false, Traefik never loads the ACME resolver (acme.json is
  # left mode 660 → "resolver skipped" → self-signed/default cert, ZERO Let's
  # Encrypt traffic). Only set true once inbound reachability for the chosen
  # challenge is wired, ideally after a staging test. This prevents the resolver
  # from silently activating and hammering LE (see the 2026-06-09 rate-limit incident).
  enable: false
  email: acme@mail.com
  endpoint: https://acme-staging-v02.api.letsencrypt.org/directory
  # ACME storage file (under /etc/traefik/acme/). Use a separate file for staging
  # so a staging run never clobbers the production account/certs in acme.json.
  storage: acme.json
  challenge:
    dns:
      enable: false
      provider: ""
      env:
      - name: OVH_ENDPOINT
        value: ""
      - name: OVH_APPLICATION_KEY
        value: ""
      - name: OVH_APPLICATION_SECRET
        value: ""
      - name: OVH_CONSUMER_KEY
        value: ""
      - name: OVH_CLIENT_ID
        value: ""
      - name: OVH_CLIENT_SECRET
        value: ""
    tls:
      enable: true
    http:
      enable: false

storage:
  defaultVolumes:
    apps: apps
    media: media
    # PVC name for SQLite app config dirs. Defaults to the apps volume (fine on
    # dev, where everything is already local). On prod it is overridden to the
    # dedicated local `config` volume below (NFS can't host SQLite WAL).
    config: apps
    # PVC name for dedicated game servers. Defaults to the apps volume (fine on
    # dev). On prod it is overridden to the dedicated local `games` volume
    # below — game images re-validate their whole install on every restart,
    # which is too slow over NFS. See storage.localGames.
    games: apps

  # Dedicated LOCAL (non-NFS) volume for SQLite app config dirs. Coexists with
  # storage.nfs (unlike storage.localStorage). Enabled on prod only.
  localConfig:
    enable: false
    rootPath: /var/local/platypod/volumes/
    capacityStorage: 5Gi
    name: config
    labels:
      volumeSelector: config
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - key: platypod.io/local-storage
            operator: In
            values: ["true"]
    # Nightly backup of the local config volume to the NFS apps share (durability:
    # the live SQLite is local/fast, the backup lands on the backed-up Synology).
    backup:
      enable: true
      schedule: "0 3 * * *"
      retentionDays: 14
      image: busybox:1.37.0

  # Dedicated LOCAL (non-NFS) volume for dedicated game servers. Coexists with
  # storage.nfs, same shape as storage.localConfig. Enabled on prod only.
  # No backup block yet — deferred, see stack/docs/TODO.md.
  localGames:
    enable: false
    rootPath: /var/local/platypod/volumes/
    capacityStorage: 100Gi
    name: games
    labels:
      volumeSelector: games
    nodeAffinity:
      required:
        nodeSelectorTerms:
        - matchExpressions:
          - key: platypod.io/local-storage
            operator: In
            values: ["true"]

  # Dedicated LOCAL (non-NFS) volumes for Postgres/MySQL data dirs. Same
  # rationale as storage.localConfig (NFS fsync latency), one PV/PVC per
  # listed volume. Each is pinned to a SPECIFIC node via `node:` (hostname),
  # not just the shared platypod.io/local-storage marker label — once more
  # than one node carries that label, a PV whose nodeAffinity only checks the
  # marker would let a hostPath volume's consuming pod reschedule onto a node
  # where the actual directory doesn't exist, silently starting from empty
  # data. Enabled on prod only.
  localDb:
    enable: false
    rootPath: /var/local/platypod/volumes/
    capacityStorage: 2Gi
    labels:
      volumeSelector: db
    # Nightly backup to the NFS apps share, same durability rationale as
    # storage.localConfig.backup.
    backup:
      enable: true
      schedule: "15 3 * * *"
      retentionDays: 14
      image: busybox:1.37.0
    volumes: []
    # Example (set per-environment):
    # - name: authelia-db
    #   node: chuwi-cp1
    # - name: lldap-db
    #   node: chuwi-cp1
    #   capacityStorage: 1Gi   # optional per-volume override

  localStorage:
    enable: true
    default:
      rootPath: /var/local/platypod/volumes/
      capacityStorage: 1Gi
      nodeAffinity:
        required:
          nodeSelectorTerms:
          - matchExpressions:
            - key: platypod.io/local-storage
              operator: In
              values: ["true"]
    volumes:
    - name: media
      labels:
        volumeSelector: media
    - name: apps
      labels:
        volumeSelector: apps

  nfs:
    enable: false
    default:
      server: server
      share: share
      reclaimPolicy: Retain
      capacityStorage: 1Gi
    volumes:
    - name: media
      share: media
      capacityStorage: 10Gi
    - name: apps
      share: apps
